## この資料で分かること

:::summary
- 『横断の構造』の枠の見出しにあった「事業」「プロダクト」の札がなくなる理由。
- 残る入れ子（親）の決め方が、どんな置き方のリポジトリでも同じに働くこと。
- 一覧の API と契約の文書で変わる所。
:::

## 背景と目的

0.9.5 では、親のチェックアウトから子のチェックアウトまでの途中のディレクトリの名前を「段の札」として見出しに出し、`businesses` を「事業」、`products` を「プロダクト」、`services` を「サービス」に読み替えていました。
この読み替えは、ある利用者のたまたまの置き方（会社 → 事業 → プロダクト）を前提にした決まりです。SpecDock はほかの置き方でも使うので、名前に意味を持たせる決まりをなくし、普遍的な入れ子だけを残します。

## 変わる所

| 所 | 前 | 後 |
| --- | --- | --- |
| `GET /api/v1/repositories` | 各リポジトリに `parent` と `tier` | `parent` だけ |
| 横断の構造の枠の見出し | 名前と札（`sd-badge`） | 名前とリンクだけ |
| `docs/reference_cli.md` | `tier` と読み替えの表 | `parent` の決め方だけ |

入れ子の親は今と同じです。登録された main のチェックアウトの道を部分で比べ、子を中に持ついちばん近い出すリポジトリが親になります。名前は読みません。

## 確認方法

```sh
uv run pytest tests/unit/application/test_dashboard_nesting.py tests/unit/presentation/test_dashboard_allgraph_screen.py
```
