## この資料で分かること

:::summary
- 既定値のある項目（手順の `status` など）の打ち間違いが、1件の分かりやすい誤りになること。
- `CUE_INVALID` の直し方（`hint`）が日本語になること。
- light でテストのない Issue に、警告 `SPEC_NO_TESTS` が出ること。
- `scope render --design-system inline` で、どの PC でも崩れない HTML を作れること。
:::

## 背景と目的

iss-00487 で初めて CUE の仕様で Issue を回したとき、`status: "doin"` の打ち間違いに、既定値 `todo` との衝突と、許す値の外という2件の誤りが出て、1件目が紛らわしかった。ほかにも、`hint` の言語の混在、雛形の `status` の位置、light のテストの欠け、描いた HTML の持ち運びの5点が提案された。

## 変わること

| 対象 | 前 | 後 |
|---|---|---|
| 既定値のある列挙の誤り | 2件（衝突と範囲外） | 範囲外の1件。衝突の行は `details.cue_related` に残る |
| `CUE_INVALID` の `hint` | 英語 | 日本語 |
| Issue の雛形の手順の例 | 複数行 | 1手順1行、`title`、`realizes`、`status` の順 |
| light でテストがない Issue | 何も出ない | 警告 `SPEC_NO_TESTS`（検査は成功） |
| `scope render` | `file:` の道筋だけ | `--design-system inline` で埋め込みも選べる（既定は今のまま） |

## 確かめ方

`spec-dock scope check <ID>` で誤りと警告を見る。`spec-dock scope render <ID> --design-system inline > page.html` の `page.html` を、別の場所に写して開く。
