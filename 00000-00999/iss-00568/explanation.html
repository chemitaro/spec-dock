## この資料で分かること

:::summary
- 警告が誤って出た理由は、判定が `snapshot.fetched_at` だけだったこと。
- 直し方は、probe の確かめた時刻も含めた「最後に確かめた時刻」で判定すること。
- probe が失敗し続けているときは、今までどおり古くなる。
:::

## 背景と目的

定期の同期は、まず probe で GitHub に変化があるかを調べ、なければスナップショットを取り直しません。そのため構造が変わらない間は `fetched_at` が古いままになり、30分で警告が出ていました。

## 仕組み

`structure_confirmed_at` が、`fetched_at` と probe の `checked_at`（`last_error` がないときだけ）の新しいほうを返します。画面の帯、警告、API、`dashboard summary` はこの時刻を使います。

## 失敗時の動き

probe.json がない、壊れている、エラーが記録されている、時刻が未来のときは、`fetched_at` だけで判定します。

## 確認方法

`uv run pytest tests/unit/domain/test_dashboard_snapshot.py` ほか、`make lint` と全体のテストを通します。
