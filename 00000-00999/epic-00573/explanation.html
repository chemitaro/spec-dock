## この資料で分かること

:::summary
- 5つの状態の色と形と、作業中の「区切りの輪」の読み方
- 構造の図で、Initiative の並び方と、線のための隙間が変わったこと
- どの版から、どのリポジトリに入ったか
:::

## 状態の色と形

| 状態 | 色と形 |
|---|---|
| 着手できる | 深い青の再生の丸 |
| 作業中 | 鮮やかな緑の区切りの輪 |
| 止められている | 黄色の一時停止の丸（前は赤） |
| 不明 | 紫の「?」の丸（前は黄） |
| 終わった | 灰色のチェック |

期限切れや PR の失敗など、状態でない赤は変わりません。

## 作業中の区切りの輪

- Issue は、`plan.cue` の手順の数で輪を区切り、終わった手順の分を太い緑で塗ります。Epic と Initiative は、配下の Issue の終わった割合です。
- 最後に動いてから30分以内なら、次の区切りがゆっくり点滅します。30分を超えると点滅をやめ、「N分動きなし」と添えます。
- 一覧の画面と、OS で視差効果を減らしているときは動きません。
- サーバーは `plan.cue` を読んだ結果を、ファイルの時刻と大きさで覚えるので、5秒ごとの更新で読み直しません。読めないときは輪の外枠だけを示します。

## 構造の図の並べ方

- 最上位の Initiative は、全体を画面に収めたときにいちばん大きく見える行の幅で並べます。広い画面では2つ以上が横に並びます。窓の大きさが変わり終わったときだけ並べ直します。
- 線のための列や行の間の隙間は、そこを通る線の本数に見合う幅に収まります。前は、別々の通り道の線を1つのまとまりとして広げたり、線の多い箱が縦に伸びたりして、極端に広い隙間ができていました。
- 線は、両端を含む枠の外へ遠回りしません。

## 版と配布

0.9.0（2026-11-06）で、spec-dock、company-os、input-devices、housing-lifecycle、taikyohiyou_project、generic-mona、tenting-cradle の7つに入りました。変更点の正本は `spec-dock/docs/migration.md` の「0.9.0 への更新」です。
