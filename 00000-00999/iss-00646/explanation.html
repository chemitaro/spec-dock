title: 指揮の線の動きを軽くする
lead: 構造の図と『横断の構造』の黄色い指揮の線は、点の流れと波紋をブラウザーが毎コマ描き直していたため、画面が重くなっていました。動きを合成の仕組みだけで行う形に変え、図を動かす間や画面の外では止めます。

## この資料で分かること

:::summary
- 重さの原因は、指揮の線のアニメーションでした（動きを止めると、重さがほぼ0になる）。
- 点の流れは、点を 2px ずつずらした止めた絵4枚を、0.05秒ごとに切り替えて見せます。切り替えはブラウザーの合成の仕組み（GPU 側）だけで動き、ページの描き直しを起こしません。
- 波紋は、HTML の輪の拡大と透明度で動かし、これも合成の仕組みだけで動きます。
- 線ごとに小さな SVG に分け、図を動かす間（と、その後0.3秒）・画面の外・ページが裏のときは、その場で止めます。
:::

## 背景と目的

本人から「構造の図と横断の構造がもっさりする」と指摘がありました。統括が headless Chrome で測ると、10秒あたりの主スレッドの仕事が、横断の構造で 0.54秒、単体の構造の図で 0.32秒あり、動きを減らす設定にすると 0.02秒・0.01秒に下がりました。指揮の線は、世界と同じ大きさの1枚の SVG の上で、点の位置（`stroke-dashoffset`）を毎コマ動かしていて、そのたびにスタイルの計算・描画・レイヤーの組み立てが起きていました。

目標は、同じ測りで今の5分の1以下（横断 0.11秒、単体 0.07秒以下）です。

## 試したことと選んだ方式

| 方式 | 横断 | 単体 |
|---|---|---|
| 今 | 0.53秒 | 0.33秒 |
| CSS に `steps()` を足すだけ | 0.29秒 | ― |
| JS で 10コマ/秒に動かし、線ごとの SVG に分ける | ― | 0.15〜0.18秒 |
| 止めた絵4枚を合成の仕組みで切り替え、波紋は HTML の輪（選んだ方式） | 0.044秒 | 0.015秒 |

Chrome は `steps()` のアニメーションでも毎コマ描き直すので、コマの数を減らすだけでは足りません。合成の仕組みで動く性質（`opacity` と `transform`）だけを使えば、ページの描き直しは起きません。

## 点の流れの仕組み

点の線は、8px ごとに丸い点が並ぶ点線です。点の線を 0・2・4・6px ずらした4枚の絵を重ね、0.05秒ごとに1枚だけを見せると、点が 0.05秒ごとに 2px（40px/秒）進んで見えます。向きは今と同じく親から子です。

```plantuml id=phases
@startuml
title 4枚の絵の切り替え（0.2秒で1周）
robust "見える絵" as P
@0
P is "ずらし0"
@50
P is "ずらし2"
@100
P is "ずらし4"
@150
P is "ずらし6"
@200
P is "ずらし0"
@enduml
```

今は「どの線も端から端まで2.5秒」で、点の速さが線の長さによって 112〜205px/秒と違いました。コマを減らすとこの速さでは点が止まって見えたり逆に見えたりするため、統括の決定で、どの線も 40px/秒の一様な速さにします（「指令が流れている」感じを保つ速さ）。

## 止めるとき

- 図を動かす（ドラッグ・ホイール・2本指・拡大縮小・収める）たびに、図の領域に「止める印」を付け、最後の動きから0.3秒で外します。
- 画面の外にある絵と波紋は、IntersectionObserver で見つけて止めます。
- ページが裏になったら止め、表に戻ったら動かします。

どれも「その場で止める」ので、再開しても点や波紋が跳びません。動きを減らす設定の人には、今と同じく止まった点線と、止まった輪を1つ見せます。

## 変えないもの

線の道とつなぎ方、色、太さ、波紋の大きさと時間、同じ箱のアーチ、帯、指揮の選びの目立たせ方は変えません。線と印のずれ（0.4px 以下）と、依存の線の検査の違反0も保ちます。

## 確認方法

試しのサーバーを開き、構造の図か『横断の構造』で点が親から子へ流れ、図をドラッグすると止まり、離して0.3秒で動き出すことを見ます。ブラウザーの開発者ツールで次を呼ぶと、動きの数えが分かります。

```js
specdockCmdAudit().motion
```
