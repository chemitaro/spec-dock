## この資料で分かること

:::summary
- 時間を見るテストは、壁時計ではなく CPU 時間の最小で測るので、PC が忙しくても落ちない。
- ダッシュボードの 4 つの見た目（アイコン、空の札、文書の目次、狭い幅の図の枠）を直した。
- 文書の目次の背景は、手元の Chrome では再現できなかったので、背景を列の全体に敷く上書きを足した。
:::

## 背景と目的

CI では通るのに、手元の負荷の高い PC では main でも落ちるテストが 2 つあった。壁時計の 1000ms の上限と、timeout 0.1 秒（Git の事前確認も含めて数える）が原因である。性能の退行を見張る意味は残したまま、負荷の影響だけを除く。あわせて、統括がブラウザーで見つけた細かい見た目の不具合を直す。

## 直したこと

| 項目 | 直し方 |
|---|---|
| グラフの 250 Scope の時間 | node の CPU 時間（user+system）の、3 回のうちの最小。上限 1000ms は据え置き |
| bootstrap の timeout | 0.1 秒を 1.0 秒に、hook の待ちを 2 秒に |
| `/favicon.ico` の 404 | 印の SVG を配り、ページの `<link rel="icon">` で指す |
| Scope が 0 件の札 | 「Scope はまだありません」と出す |
| 文書の目次の背景 | 文書の HTML に上書きの規則を足し、背景と縁を列の全体に敷く |
| 390px の帯の下の枠の線 | 図の領域を帯の下から始め、帯の背景で隠す |

## 確認方法

```sh
make lint
uv run pytest
```

負荷の下では、`yes > /dev/null` を CPU の数の 4 倍走らせて 2 つのテストを実行し、終わったら必ず止める。前後の写しは `report.md` にある。
