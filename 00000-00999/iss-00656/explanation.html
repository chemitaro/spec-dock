title: Scope の欄の見出しを詰める

## この資料で分かること

:::summary
- 今の欄の見出しでは、「作業中」が2回、今の Scope の ID が2〜3回、選んだタブの名前がタブの下でもう1回出ていました。
- 新しい見出しは、1行目に祖先のパンくずと今の ID・番号・種類、右に状態の札・エージェントの印・Orca で開く・閉じる、2行目に題名（2行で切る）です。
- 状態の帯は、理由が状態の名前のほかに何かを足すとき（待っている相手、PR、動きなしなど）だけ、1行で出します。
- 説明資料の上の「説明資料」の帯をなくし、新しいタブで開く印はタブの行の右端に移します。
:::

## 背景と目的

本人から「PC のブラウザーで Issue を選ぶと、右の欄の上の部分に同じ情報が何度も出て場所を取る。大事なのはタブとその中身」と指摘がありました。スマートフォンの下からの欄の全体の段では、見出しを1行に詰める工夫がすでにあります。PC も同じ考え（省く・1つにまとめる）にそろえます。

## 前と後の見出し

| 行 | 前 | 後 |
|---|---|---|
| 1 | 状態の札・マージの札・エージェントの印・Open・閉じる | 祖先のパンくず › 今の ID #番号・種類 ／ 状態の札・エージェントの印・Open・閉じる |
| 2 | ID の札・#番号・種類 | 題名（2行で切る） |
| 3 | 題名 | 帯（足す情報があるときだけ、1行） |
| 4 | 状態の帯（いつも） | タブ ＋ 右端に新しいタブで開く印 |
| 5 | 動きなし | ― |
| 6 | パンくず（最後に今の ID） | ― |
| 7 | タブ | ― |
| 8 | 「□ 説明資料」の帯 | ― |

## 帯を出すかどうか

理由の文（構造の API の `reason`）は、作業中・終わった・着手できるのときは状態の名前と同じか言い換えで、何も足しません。そのときは帯を出しません。止められている（`#12 を待つ`）、配下が作業中、PR をマージできる・直す必要がある、構造が分からない、のときは帯に理由を出します。30分を超えて動きのない作業中の Scope は、帯に「N分動きなし」を出します。マージの札は帯の理由と同じことを言うので、帯の先頭の印（マージできるは緑のチェック、直す必要ありは赤の稲妻）にまとめます。

## 省いた情報の辿り方

- 状態の名前：1行目の札（読み上げの名前も）。
- 理由：帯（足すときだけ）と、詳しい画面の見出し。
- 祖先の題名：パンくずのボタンの title。
- 長い題名：題名の title。

## 確認方法

試しのサーバーで構造の図を開き、作業中の Issue を選んで、見出しの高さ（欄の上端からタブの行まで）を直す前と比べます。数と写しは report.md にあります。

```sh
uv run pytest tests/unit/infra/test_dashboard_panel_logic_js.py tests/unit/infra/test_dashboard_orca_views_js.py
```
