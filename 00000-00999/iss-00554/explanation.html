---
title: ダッシュボードに人のタスクを表示する（iss-00554）
lead: 人のタスク（エージェントが人に頼むことと、人が自分で登録すること）を、ダッシュボードで全リポジトリまとめて見られるようにし、構造の図やボードに「人が止めている」ことを印で示す Issue です。
category: 説明資料
audience: 本日チームに加わった新メンバー

## この資料で分かること

:::summary
- 人のタスクの画面が3つ（全リポジトリ、リポジトリごと、1件）増えること。
- 構造の図・ボード・Scope の詳しい画面・横断の概況に、人のタスクの印と数が出ること。
- 画面は見るだけで、登録や完了は CLI（`spec-dock todo`）で行うこと。
:::

## 背景と目的

人のタスクは、#549 と #550 で、各リポジトリのカタログの `todos/` に置かれ、CLI で登録・一覧・完了できるようになりました。ただし、CLI だけでは「いま、どの Scope が人の返事を待って止まっているか」が一目では分かりません。この Issue は、ダッシュボードにその表示を足します（親の epic-00547 の R-12、R-13）。

## 全体の構成

サーバーは、表示しているリポジトリのカタログの `todos/` を読み（書かない）、#550 と同じ関数で一覧の JSON（`specdock.todo-list/v1`）を作ります。`todos/` の時刻が変わったときだけ読み直し、`revision` に時刻を入れるので、CLI で登録したタスクは5秒ごとの更新で画面に出ます。

```plantuml id=overview
@startuml
title 人のタスクの表示
top to bottom direction
actor "人・エージェント" as User
component "spec-dock todo（CLI）" as Cli
database "カタログの todos/" as Todos
component "ダッシュボードのサーバー" as Server
component "画面（人のタスク、構造の図、ボード、詳しい画面、概況）" as Screens
User -> Cli : 登録・完了
Cli -> Todos : 書く
Server -> Todos : 読むだけ
Server --> Screens : API（/api/v1/todos など）
Screens --> User : 見る
@enduml
```

- **人のタスクの画面**：`/todos`（全リポジトリ）、`/r/<repo>/todos`、`/r/<repo>/todos/<ID>`。並びは、期限切れ、期限の近いもの、止めているもの、あとで。期限切れは赤い色、記号、「期限切れ（n時間超過）」の言葉で目立たせます。
- **印**：Issue の箱とカードには「人 n」（そのタスクが止めている数）。Epic と Initiative には、配下を含めた数を「配下も」と添えて出します。
- **詳しい画面**：「人のタスク」のタブに、止めているもの、配下を止めているもの、関係するものを並べます。
- **横断の概況**：札に、開いている数と期限切れの数を出します。

## 失敗したとき

カタログが読めないリポジトリは、そのリポジトリの分だけ「読めない」と示し、ほかは今までどおり描きます。構造の図やボードも、人のタスクが読めなくても描けます。

## 確認方法

```sh
spec-dock todo add --title "見本のタスク" --blocks iss-00554 --due 1h
spec-dock dashboard list   # 表示中のリポジトリとサーバーの URL を確かめる
```

ブラウザーでダッシュボードを開き、上の帯の「人のタスク」を開いて、構造の図の iss-00554 の箱に「人 1」の印が出ることを確かめます。
