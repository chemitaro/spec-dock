## この資料で分かること

:::summary
- 0.6.0 から、定期の同期は `spec-dock/dashboard.md` と4つの `.puml` を書かなくなります。代わりに HTML のダッシュボード（`dashboard serve`）と `dashboard summary` を使います。
- 変わる契約は3つです：`canonical status` の `dashboard` の項目が消える、`canonical remove` が5つのファイルを消さない、`canonical sync` の `dashboards_written` が常に0になる。
- 利用者のリポジトリに残った5つのファイルは、SpecDock は消しません。`.gitignore` から外れて `git status` に出るので、利用者が消してかまいません。
:::

## 背景と目的

iss-00438 は、定期の同期の最後の手順で、main のチェックアウトの `spec-dock/` に5つのファイルを書くようにしました。epic-00427 の段階1（0.6.0）で、全リポジトリを見られる HTML のダッシュボードと、エージェント向けの要約 `dashboard summary` が出ます。古いファイルは二重の表示になるので、生成のコードごと撤去します（Epic の R-23、D-10）。

## 全体の構成

```plantuml id=overview
@startuml
title 撤去の前と後（定期の同期の手順7）
top to bottom direction
rectangle "canonical sync（手順7）" as Sync
database "構造のスナップショット" as Snap
rectangle "5つのファイル\n（撤去）" as Files #line.dashed
rectangle "HTML のダッシュボード\n／dashboard summary" as Html
Sync --> Snap : ensure_fresh（残る）
Sync ..> Files : 書かなくなる
Snap --> Html : 読む
@enduml
```

| 部分 | 撤去の後 |
|---|---|
| 同期の手順7 | 構造のスナップショットの更新だけ。`dashboards_written` は互換のため残して常に0 |
| `canonical status` | 11項目（`dashboard` なし）。`CANONICAL_DASHBOARD_*` の警告なし |
| `canonical remove` | 5つのファイルに触れない |
| `state.json` | `dashboard` の欄を書かない。古い欄は読むときに無視 |
| 配布する `.gitignore` | 5つの名前を外す |

## 確認方法

```sh
uv run pytest tests/cli_runtime/test_issue533_dashboard_removal.py
spec-dock canonical status --json   # data に dashboard がない
```
