## この資料で分かること

:::summary
- 線は、リポジトリの構造の図（iss-00616）と同じ部品で、親の印から子の印へ引きます。リポジトリの枠をまたいでも1枚の層に描きます。
- 箱を持たない親は、そのリポジトリの枠の見出しのすぐ下の『帯』に並びます。どの枠にも出ていない worktree は、全体のいちばん上の『ほかの場所』に並びます。
- 『これから』で見せる Scope がないリポジトリでも、帯に指揮している親がいれば、その枠を見出しと帯だけで出します。
- 両方の画面で、枠の見出しの文字（ID の札・題名・要約の行）を線より上に置き、文字の背に枠と同じ色の下地を敷きます。
:::

## 背景と目的

iss-00616 で、1つのリポジトリの構造の図に指揮の線と帯が出るようになりました。『横断の構造』は、各リポジトリの構造の図を、リポジトリの枠に入れて1つの世界に並べた画面です。統括（main のチェックアウト）と、別のリポジトリの Issue の worktree の作業者のように、指揮の関係はリポジトリをまたぐので、この画面でも線と帯を出します。正本は Epic epic-00615 の R-10・R-11 と D-06 です。

## 全体の構成

```plantuml id=overview
@startuml
title 横断の構造の指揮の線
top to bottom direction
component "orca-web の要約\n(parent, main)" as Sum
component "allgraph/command.js\n対応・居場所・帯の形" as Cross
component "compose.js\n枠の組み立て（帯の高さ・入れ物の枠）" as Comp
component "graph/command.js\n端・曲線・弧（共有）" as Cmd
component "allgraph.js\n層と帯・選び・補い" as View
Sum --> Cross : 組
Cross --> Comp : 帯の形
Comp --> Cross : 枠の矩形
Cross --> Cmd : 世界の座標の配置
Cmd --> View : 線・弧・波紋・帯
@enduml
```

- **対応**：worktree のパスが構造の一覧にあるリポジトリ、なければ同じ project のリポジトリ。どれにも当たらなければ『ほかの場所』です。名前の決まりは使いません。
- **帯の形**：どのリポジトリに帯があるか、その幅、入れ物の枠、『ほかの場所』の有無。形が変わったときだけ、枠の組み立てをやり直します。各リポジトリの配置はやり直しません。
- **補い**：帯の出入りで枠が動くので、画面のいちばん上に見えている枠の中身が画面の上で動かないように、図の位置を補います。

## 見出しの文字と線

線は、枠の上・箱の下の層にあります。今は枠の見出しの文字の上も線が通り、題名が読みにくくなっていました。枠を重なりの順の箱にしないようにし、見出しの行を線の層より上に上げ、文字と札の背にだけ、枠と同じ色の下地を敷きます。線を曲げて避けることはしません。

## 確認方法

```sh
uv run pytest tests/unit/presentation/test_dashboard_allgraph_command.py tests/unit/presentation/test_dashboard_allgraph_compose.py
```
