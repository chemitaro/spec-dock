## この資料で分かること

:::summary
- 5つの状態（着手できる、作業中、止められている、不明、終わった）の新しい色と形。
- 作業中の輪が、計画の手順の数で区切られ、終わった手順だけ緑に塗られる仕組み。
- 「いま動いているか」を、最後に動いてから30分以内かで決め、次の区切りの点滅で示す仕組みと、動かさない所。
- 5秒ごとの自動の更新でも重くならないよう、計画の読み取りを覚えておく工夫。
:::

## 背景と目的

今のダッシュボードは、作業中を暗い青の半円で示すだけで、どこまで進んだか、いま誰かが手を動かしているかが分かりません。また、止められているが赤で、警告のように見えます。利用者は 2026-11-05 に、新しい色と形を見本から選びました（Epic #573 の作業メモ）。

| 状態 | 形 | 色 |
| --- | --- | --- |
| 着手できる | 輪の中の再生の三角（▶） | 深い青 |
| 作業中 | 区切りの輪 | 鮮やかな緑 |
| 止められている | 塗った丸の一時停止（‖） | 黄色 |
| 不明 | 輪の中の「?」 | 紫 |
| 終わった | 塗った丸のチェック | 灰色 |

## 作業中の輪

- Issue の輪は、`plan.cue` の手順（やめた手順を除く）の数で区切られ、終わった手順の数だけ12時から時計回りに緑で塗られます。8手順中4つ終わっていれば、輪の半分が緑です。
- 手順が12を超えると、区切りのない輪に、終わった割合の弧を描きます。手順がない・読めないときは、緑の外枠だけです。
- Epic・Initiative の輪は、配下の Issue の数で区切り、終わった Issue を塗ります。

## いま動いているか

- 最後に動いた時刻は、GitHub の更新や PR の時刻（`active_at`）と、`plan.cue` を最後に書き換えた時刻の新しいほうです。Epic・Initiative は配下も含めます。
- 30分以内なら、次の区切りが約2秒の周期で現れたり消えたりします。30分を超えたら止まり、要点と詳しい画面に「N分動きなし」と書きます。
- 点滅するのは、構造の図の箱、要点、詳しい画面の表紙だけです。概況、ボード、人のタスク、検索では動かしません。動きを減らす設定の端末では、どこでも動きません。

```plantuml id=flow
@startuml
title 作業中の輪ができるまで
start
:構造の API の要求;
:作業中の Issue の plan.cue の時刻と大きさを見る;
if (前と同じ?) then (はい)
  :覚えた手順の数を使う;
else (いいえ)
  :cue で steps を読み、覚える;
endif
:progress を返す;
:画面が、輪の区切りと、30分以内なら点滅を描く;
stop
@enduml
```
