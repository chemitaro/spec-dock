## この資料で分かること

:::summary
- `spec-dock dashboard service install`／`status`／`uninstall` が何を書き、何を消すか。
- 常駐のサーバーが、前面の `dashboard serve` とぶつからずに動く仕組み。
- SpecDock を更新したとき、常駐が新しい版で起動し直す仕組み。
:::

## 背景と目的

SpecDock は「利用者が明示して入れた常駐のほかは、何も自動で動かさない」と約束しています（Epic の言い直した約束3）。ダッシュボードのサーバーは、前面で動かす `dashboard serve` のほかに、ログインのときに自動で起動させたい利用者がいます。そこで、利用者がコマンドを実行したときだけ入り、状態が見え、何も残さずに外せる常駐を作ります。

定期の同期の常駐（`…canonical-sync`）と同じ部品を使いますが、ラベルとファイルは分けます。ダッシュボードの不具合が同期に及ばないようにするためです。

## 全体の構成

```plantuml id=overview
@startuml
title ダッシュボードの常駐
top to bottom direction
actor "利用者" as User
component "spec-dock dashboard service" as Cmd
component "launchd / systemd --user" as Mgr
component "spec-dock dashboard serve --service" as Srv
database "状態の置き場\n(server.lock, server.json, service.log)" as State
User -> Cmd : install / status / uninstall
Cmd -> Mgr : plist・単位を書いて登録・外す
Mgr -> Srv : ログインで起動、落ちたら起動し直す
Srv -> State : ロックを取り、在りかを書く
Cmd -> State : status で在りかを読む
@enduml
```

| コマンド | 働き |
|---|---|
| `dashboard service install [--port N] [--tailscale]` | 常駐の設定のファイルを書き、管理の側に登録する。同じ設定なら何もしない |
| `dashboard service status` | 入っているか、動いているか、URL、版を示す。何も書かない |
| `dashboard service uninstall` | 常駐を止め、設定のファイルと記録を消す |

## 前面の serve との共存

サーバーは `<状態の置き場>/dashboard/server.lock` を持つ1つだけが動きます。常駐のサーバーは、前面の `serve` がロックを持っていれば終わらずに30秒ごとに取り直して待ちます。終わってしまうと、launchd や systemd が起動と終了を繰り返すからです。前面が止まると、常駐が引き継ぎます。

## 版の更新の後の起動し直し

サーバーは60秒ごとに入っている SpecDock の版を読み直します。常駐のサーバーは、版が変わっていれば止まって終了コード75で終わり、管理の側が新しい版で起動し直します。前面の `serve` は終わらず、標準エラーと API（`/api/v1/repositories` の `server.restart_required`）で起動し直しを促します。

## 確認方法

```sh
spec-dock dashboard service install
spec-dock dashboard service status --json
spec-dock dashboard service uninstall
```
