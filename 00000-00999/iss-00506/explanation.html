## この資料で分かること

:::summary
- `scope close`／`scope reopen` が、確認の後に直接の選択を読み直す理由と、止まるときの結果。
- `scope create` が、確認の後・Issue の作成の前・作成の後に `origin` を読み直す場所と、止まるときの結果。
- 守れない残りの短い時間。
:::

## 背景と目的

`scope close @current` は、端末で `Confirm [yes/no]` と尋ねます。答えを待つ間に、別の端末で `work start` が選択を変えることがあります。0.5.0 の処理は、尋ねる前に決めた対象をそのまま閉じていました。`scope create` も、尋ねる前に読んだ `origin` のまま Issue を作り、作った後に `origin` が変わってもカタログに公開していました。撤去の前の従来の処理はどちらも読み直していたので、その水準に戻します（#440 の後続の候補 1〜3）。

## 全体の構成

```plantuml id=overview
@startuml
title scope create の読み直しの場所
start
:origin を読む（session を開く）;
:端末で確認する;
:origin を読み直す（1）;
:ラベルを用意する;
:origin を読み直す（2）;
:Issue を作る（POST）;
:origin を読み直す（3）;
:親に足す;
:origin を読み直す（4）;
:カタログに公開する;
stop
@enduml
```

- （1）（2）で変わっていれば `PRECONDITION_FAILED`（終了コード3）で止まり、Issue を作りません（ラベルを作った後なら partial、終了コード6）。
- （3）（4）で変わっていれば `SCOPE_PUBLICATION_INCOMPLETE`（partial、終了コード6）で止まり、作った Issue の ref を返し、残りの手順を `not_attempted` にします。次の1手は「`origin` を戻してから `scope import github` を実行する」です。
- `scope close`／`reopen` は、端末で確認したときだけ、確認の後に選択を読み直します。変わっていれば `PRECONDITION_FAILED`（終了コード3）で止まり、GitHub に書きません。

## 守れない残り

読み直しと GitHub への書き込みは不可分ではありません。最後の読み直しから要求を送るまでの短い間の変化は守れません。読み直しを書き込みの直前に置いて、その間を縮めています。

## 確認方法

```sh
uv run pytest tests/cli_runtime/test_issue506_reread_after_confirmation.py
```
