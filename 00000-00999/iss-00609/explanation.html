title: SpecDock 0.9.4 のリリース
lead: エージェントのタブの直し（#604・#605）、構造の図の見せる範囲の切り替え（#606）、依存の線の切り替えの廃止（#608）を 0.9.4 としてまとめ、版・移行の手引き・配布資産の更新経路を整える作業の説明です。

## この資料で分かること

:::summary
- 0.9.4 に入る変更は、ダッシュボードの画面の直しです（iss-00602、iss-00603、iss-00607）。コマンドの引数と JSON の契約は変わりません。
- 構造の図の道具の帯は「全体｜いま｜これから」の1つの切り替えと「収める」になり、ブラウザーの保存は `specdock.graph.v3` に移し替えられます。
- この Scope は版の番号と `migration.md` と `static-inventory.json` とテストだけを変え、機能のコードは変えません。マージ、タグ、導入、配布は統括が行います。
:::

## 背景と目的

0.9.3 の後に PR #604、#606、#608、#605 が main に入りました。本人の PC に届けるには版を上げて配る必要があります。0.9.3（iss-00599、PR #600）と同じ形で、版を上げ、移行の手引きを書き、0.9.3 以前の配布資産を持つリポジトリが `installation update` で上がるようにします。

## 変えるもの

- 版：`pyproject.toml`、`uv.lock`、`system/spec-dock-version`（提供側と dogfood の写し）。
- `migration.md`（提供側と dogfood の写しはバイト一致）：「## 0.9.4 への更新」の節。道具の帯の変更、保存のキーと移し替え、エージェントのタブの直しを書きます。
- `static-inventory.json`：`migration.md` と版のファイルの行に今のハッシュを入れ、0.9.3 のバイトを既知の古い版に足します（`reference_cli.md` の行は #604 で済み）。
- テスト：`tests/integration/test_issue609_release_0_9_4.py` と 0.9.3 の旧資産の fixture（3つ）。

## 確認方法

```sh
uv run pytest tests/integration/test_issue609_release_0_9_4.py
make lint
```
