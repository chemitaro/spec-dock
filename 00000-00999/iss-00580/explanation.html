## この資料で分かること

:::summary
- 0.9.0 に入る変更は、状態の色と形（#574）、Initiative の横並び（#575）、構造の図の隙間の直し（#578）、細かい直し（#572）の4つです。
- この Scope は版の番号と `migration.md` と `static-inventory.json` だけを変え、機能のコードは変えません。
- 0.8.0 の節が #568 の意味の変更を「足すものだけ」と書いていた食い違いを、0.9.0 の節で正します。
:::

## 背景と目的

0.8.0 の後に4つの Issue が main に入りました。リリースは手順のある作業なので、0.8.0（#536）と同じ形で、版を上げ、移行の手引きを書き、0.8.0 の配布資産を持つリポジトリが `installation update` で上がるようにします。タグ、導入、配布は、マージの後に統括が行います。

## 変えるもの

- 版：`pyproject.toml`、`uv.lock`、`system/spec-dock-version`（提供側と dogfood の写し）。
- `migration.md`（提供側と dogfood の写しはバイト一致）：「## 0.9.0 への更新」の節。0.8.0 の節の本文は配布済みのバイトのまま残し、訂正は 0.9.0 の節に書きます。
- `static-inventory.json`：`migration.md` と版のファイルの行に今のハッシュを入れ、0.8.0 のバイトを既知の古い版に足します。

## 確認方法

```sh
uv run pytest tests/integration/test_issue580_release_0_9_0.py
make lint
```
