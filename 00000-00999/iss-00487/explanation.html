## この資料で分かること

:::summary
- 何が積み残されていて、何を直すか。
- 葉のコマンドの `--help` に、共通の引数をどう出すか。
:::

## 背景と目的

epic-00425 の I-6（iss-00477）のレビューで、3つの小さな直しが残りました。

1. `issue-plan.md` と `scope-layering.md` が、CUE のガイド `cue.md` にだけリンクし、説明資料のガイド `explanation.md` にリンクしない。
2. `cue.md` の誤りのコードの表が、`canonical.md` の表との和集合でしかテストに縛られていない。
3. `spec-dock scope create issue --help` などの一覧に、`--json`、`--offline`、`--timeout` などの共通の引数が出ない。

この Issue は、spec-dock で初めて CUE の仕様で回す Issue でもあり、書きやすさの記録を `report.md` に残します。

## help の直し方

共通の引数は、argparse に渡す前に取り除かれます。そのため、葉の parser に「common options」の組を、表示だけの項目として足します。解析の経路は変えないので、引数の意味、既定値、位置は変わりません。その葉で受け付けない引数（読むだけの葉の `--yes` など）は出しません。

## 確認方法

```sh
spec-dock scope create issue --help
spec-dock scope check iss-00487
```
