## この資料で分かること

:::summary
- なぜこの Epic があるのか（0.5.0 の撤去で、canonical の処理の弱い所が見えたこと）。
- 9つの子の Issue を、どの順で進めるか。
- 失敗したときに、どう戻すか。
:::

## 背景と目的

SpecDock 0.5.0（epic-00424 の I-13、#440）は、従来モード（宣言の版3、`.meta.json`）を外し、canonical モードだけにしました。そのとき、従来の処理を確かめていたテストを canonical の処理に書き直したところ、canonical の処理が従来より弱い所が8つ見つかりました。たとえば、`worktree remove --unlock` が、許可なしに無視されたファイルを消しうること、`scope close` が端末での確認の後に選択を読み直さないことです。従来のテストは撤去で消えたので、今は誰も守っていません。

この Epic は、それらを直した 0.5.1 を、spec-dock、input-devices、company-os、housing-lifecycle、taikyohiyou_project の5つのリポジトリに配ります。最後に、移行のために残した控えと、版3のまま残した worktree を、利用者が決めたとおりに片付けます。

## 進める順番

```plantuml id=waves
@startuml
title 子の Issue の順番
left to right direction
rectangle "第1波" {
  (#508 unlock の後の判定) as A
  (#509 grill の経路) as B
  (#510 宣言と観測) as C
}
rectangle "第2波" {
  (#506 確認の後の読み直し) as D
  (#507 途中の失敗の報告) as E
  (#520 完了の判定) as I
}
(#511 文書とテスト) as F
(#513 0.5.1 と配布) as G
(#514 控えの片付け) as H
A --> D
A --> E
B --> F
C --> F
D --> F
E --> F
A --> I
I --> F
F --> G
G --> H : 1〜2週間の利用の後
@enduml
```

- **#508 を最初にします**。利用者のファイルを消すおそれがあるからです。
- **#506 と #507** は、GitHub への書き込みと報告の正しさに関わります。直す場所が近いので、並べて進め、ぶつかったら後のほうが main を取り込みます。
- **#520** は、不採用で閉じた子孫が親の完了を止めないように直します。epic-00424 は、これが入った 0.5.1 の後に閉じます。
- **#511** は、ほかの直しが変えた文書も含めて整えるので、最後の直しにします。
- **#513** で 0.5.1 を出し、統括が利用者の環境に入れて、4つのリポジトリに配布の PR を作ります。
- **#514** は、配ってから1〜2週間、問題がないことを確かめてから、一覧を利用者に示し、許可されたものだけを消します。

## 失敗したときの戻し方

| 起きたこと | 戻し方 |
|---|---|
| 直しが、ほかのコマンドを壊した | 配る前なら PR を閉じるか `git revert`。配った後なら、パッケージを 0.5.0 に戻し、配布の PR を `git revert` |
| 一部のリポジトリだけ 0.5.1 になった | 各リポジトリの CI は版のファイルに従うので、残りを配るか、配った分を戻す |
| 控えを消した後に、移行の前に戻す必要が出た | 版のタグ `v0.4.2` の移行の道具と、GitHub の `spec-dock/canonical` の履歴から作り直す |

## 確認方法

```sh
spec-dock scope show epic-00512 --json
spec-dock scope check epic-00512
spec-dock canonical status --json
```
