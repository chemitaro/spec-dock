---
title: 指揮の関係を、構造の図の上に電波のような線で出す
lead: Orca で、どのエージェント（統括・タスク担当）がどの worker を指揮しているかを、SpecDock の構造の図の上に、親の印から子の印への黄色の動く線と『指揮の帯』で出します。この資料は、その仕組みと、4つの Issue の分け方を説明します（2026-11-17 の改訂を含む）。
category: 説明資料

## この資料で分かること

:::summary
- 親子の関係の正本は Orca（`orca worktree ps` の `parentPaneKey`）で、orca-web がそれをエージェントの id に解いて、要約に `parent` として出す。
- 線は、箱や枠ではなく、親のエージェントの**稼働の印**から子のエージェントの印へ結ぶ。印の位置は、DOM ではなく、配置の計算（印の専用の行と並び）で決める。
- 同じ箱（同じ worktree）の中の親子も、箱の外へ少しふくらむ弧で結ぶ。
- 箱を持たない親や子（main のチェックアウトの統括、ほかのリポジトリの統括）は、すべての Initiative の上の『指揮の帯』に並ぶ。
- どこの稼働の印を押しても、横の欄で、押したエージェントのチャットが開く。作業中の Epic・Initiative の枠にも worktree の印が出る。
- 印の並びは、指揮の関係のないエージェントを先（新しい順）、関係を持つエージェントを後ろ（親 → 子 → 孫）にする。
- 作るのは、orca-web の iss-00043、SpecDock の iss-00621（枠の印と押した印）、iss-00616（リポジトリの構造の図）、iss-00617（横断の構造）の4つ。
:::

## 背景と目的

構造の図の箱には、orca-web の稼働の印で「その worktree にいるエージェント」が出ています。けれども、だれがだれを指揮しているかは見えません。統括がタスク担当を起こし、タスク担当が実装担当を起こす、という関係が図の上で見えれば、どの仕事がどの指揮の下で進んでいるかが一目で分かります。

Orca は、worker-start で始めた worker ごとに親を計算しています（親 ＝ 作った人、いなければ Run の統括）。この Epic は、その関係を、orca-web の要約を通して SpecDock の図に出します。handoff（渡すだけのもの）には Orca の記録がないので出しません。

## 全体の構成

```plantuml id=overview
@startuml
title 指揮の関係が図に届くまで
top to bottom direction
component "Orca\n（ps の parentPaneKey）" as Orca
component "orca-web\n要約に parent・startedAt・main\n印の並び（iss-00043）" as Web
component "SpecDock の画面\n枠の印・押した印（iss-00621）" as Open
component "SpecDock の画面\ncommand.js（純粋な計算）" as Calc
component "リポジトリの構造の図\n（iss-00616）" as Graph
component "横断の構造\n（iss-00617）" as All
Orca --> Web : 生きている親子
Web --> Calc : GET /api/worktrees/summary\n（版は変えない）
Web --> Open : buildMarks の並び
Open --> Calc : 描いた並びの記録
Calc --> Graph : 帯・線・波紋
Calc --> All : 枠ごとの帯・またぐ線
@enduml
```

- **つながり**：要約の子の `parent.id` が、同じ要約の別のエージェントを指せば、1組です。親が見えなければ（`parent.id` が null）、線を引きません。推測で結びません。
- **居場所**：その worktree の Scope の箱・枠の中の**そのエージェントの印** → 畳んだ塊 → いちばん近い見える祖先の枠 → 帯、の順に決めます。
- **印から印**：線の本体は枠の上・箱の下の層を通り、箱の中の短い部分（印から箱の縁まで）と波紋だけを箱の上の薄い層に描くので、線が印まで届きます。Epic の worktree の統括が枠の中の Issue を指揮すれば、枠の見出しの印から Issue の箱の印へ短く降ります。
- **同じ箱の弧**：同じ行の2つの印は、印の行に近い縁（Issue の箱は下の縁）の外へ、違う行なら右の縁の外へ、目安 14〜18px ふくらむ弧で結びます。余白に収まらなければ浅くし、それでも無理なら向きを変えます。配置は広げません。
- **帯**：線の端で箱を持たないエージェントだけを、worktree ごとに札（「main のチェックアウト」、ブランチ名、「<project.name> · <branch>」）で並べます。
- **見え方**：黄色（琥珀より明るいレモン寄り）の曲線です。子が動いていれば点が流れ、待っていれば止まった点線、終わっていれば薄い線。親の端には波紋が広がります。動きを減らす設定では止まります。
- **選び**：どこの稼働の印を押しても、そのエージェントの親子の線だけが目立ち、横の欄で、押したエージェントのチャットが開きます（帯のエージェントは、そのエージェントだけの欄）。orca-web の印に id がなくても、描いたときの並びで、押した印とエージェントを結びます。
- **並び**：同じ worktree の印は、指揮の関係のないものを先に新しい順、関係を持つものを後ろに、上流から下流の順に並びます（orca-web の部品が決め、どの画面でも同じ）。

## 進め方

1. 『横断の構造』（epic-00612 の iss-00614）と、印の専用の行（epic-00573 の iss-00620）ができるのを待ちます（本人の順序）。
2. orca-web の iss-00043 と、SpecDock の iss-00621（枠の worktree の印、押した印のエージェントを開く、ボードの札の専用の行）を始めます。iss-00621 は iss-00043 を待たずに作れます。
3. iss-00043 と iss-00621 が入った後に、iss-00616 で、リポジトリの構造の図に、印から印への線・弧・帯を出します。
4. iss-00616 の部品を使って、iss-00617 で『横断の構造』に広げます。見える Scope がないリポジトリでも、指揮している親がいれば、その枠を帯だけで出します（epic-00612 R-06 のただ1つの例外）。

## 確認方法

```sh
spec-dock scope check epic-00615
spec-dock scope render epic-00615 > /tmp/epic-00615.html
spec-dock dependency list
```
