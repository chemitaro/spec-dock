title: 指揮の関係を、構造の図の上に電波のような線で出す
lead: Orca で、どのエージェント（統括・タスク担当）がどの worker を指揮しているかを、SpecDock の構造の図の上に、黄色の動く線と『指揮の帯』で出します。この資料は、その仕組みと、3つの Issue の分け方を説明します。

## この資料で分かること

:::summary
- 親子の関係の正本は Orca（`orca worktree ps` の `parentPaneKey`）で、orca-web がそれをエージェントの id に解いて、要約に `parent` として出す。
- SpecDock は、DOM の位置ではなく、自分の配置の計算（世界の座標）で線の端を決め、枠の上・箱の下の層に、緩い曲線で描く。
- 箱を持たない親や子（main のチェックアウトの統括、ほかのリポジトリの統括）は、すべての Initiative の上の『指揮の帯』に並ぶ。
- 作るのは、orca-web の iss-00043、SpecDock の iss-00616（リポジトリの構造の図）と iss-00617（横断の構造）の3つ。
:::

## 背景と目的

構造の図の箱には、orca-web の稼働の印で「その worktree にいるエージェント」が出ています。けれども、だれがだれを指揮しているかは見えません。統括がタスク担当を起こし、タスク担当が実装担当を起こす、という関係が図の上で見えれば、どの仕事がどの指揮の下で進んでいるかが一目で分かります。

Orca は、worker-start で始めた worker ごとに親を計算しています（親 ＝ 作った人、いなければ Run の統括）。この Epic は、その関係を、orca-web の要約を通して SpecDock の図に出します。handoff（渡すだけのもの）には Orca の記録がないので出しません。

## 全体の構成

```plantuml id=overview
@startuml
title 指揮の関係が図に届くまで
top to bottom direction
component "Orca\n（ps の parentPaneKey）" as Orca
component "orca-web\n要約に parent と main を足す\n（iss-00043）" as Web
component "SpecDock の画面\ncommand.js（純粋な計算）" as Calc
component "リポジトリの構造の図\n（iss-00616）" as Graph
component "横断の構造\n（iss-00617）" as All
Orca --> Web : 生きている親子
Web --> Calc : GET /api/worktrees/summary\n（版は変えない）
Calc --> Graph : 帯・線・波紋
Calc --> All : 枠ごとの帯・またぐ線
@enduml
```

- **つながり**：要約の子の `parent.id` が、同じ要約の別のエージェントを指せば、1組です。親が見えなければ（`parent.id` が null）、線を引きません。推測で結びません。
- **居場所**：その worktree の Scope の箱 → 畳んだ塊 → いちばん近い見える祖先の枠 → 帯、の順に決めます。
- **帯**：線の端で箱を持たないエージェントだけを、worktree ごとに札（「main のチェックアウト」、ブランチ名、「<project.name> · <branch>」）で並べます。
- **見え方**：黄色（琥珀より明るいレモン寄り）の曲線です。子が動いていれば点が流れ、待っていれば止まった点線、終わっていれば薄い線。親の端には波紋が広がります。動きを減らす設定では止まります。
- **選び**：帯のエージェントを押すと、その親子の線だけが目立ち、横の欄でそのエージェントのチャットが開きます。

## 進め方

1. 『横断の構造』（epic-00612 の iss-00614）ができるのを待ちます（本人の順序）。
2. orca-web の iss-00043 と、SpecDock の iss-00616 を始めます。iss-00616 は合成の要約で作り、iss-00043 が入った後に実データで確かめます。
3. iss-00616 の部品を使って、iss-00617 で『横断の構造』に広げます。見える Scope がないリポジトリでも、指揮している親がいれば、その枠を帯だけで出します（epic-00612 R-06 のただ1つの例外）。

## 確認方法

```sh
spec-dock scope check epic-00615
spec-dock scope render epic-00615 > /tmp/epic-00615.html
spec-dock dependency list
```
