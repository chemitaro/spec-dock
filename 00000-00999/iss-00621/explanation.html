## この資料で分かること

:::summary
- Epic・Initiative も worktree を持てます。作業中で branch のある枠の見出しに、Issue の箱と同じ worktree の印（フォルダの形、title にブランチ）を出します。
- 稼働の印（orca-web の部品が描くエージェントの印）を押すと、横の欄のエージェントのタブが、**押したエージェント**を選んで開きます。今までは前の選びか最後に置かれたエージェントでした。
- ボードの札では、稼働の印を PR や人のタスクの印と同じ行に混ぜず、その下の専用の行に置きます。
:::

## 背景と目的

Epic epic-00615 は、Orca のエージェントの指揮の関係を構造の図に線で出します。その前に、印そのものが「どの worktree の、どのエージェントか」をはっきり示し、押せばその人のチャットに行けるようにします。この Issue は線を描きません（iss-00616・iss-00617）。

## 仕組み

1. `paintOrcaMarks` は、印の置き場ごとに、描いたときのエージェントの id の並び（部品の `buildMarks` の順）を覚えます。
2. 印を押すと `markAgentAt` が、押した印の `data-agent-id`（orca-web の iss-00043 の後の部品）か、置き場の中で何番目の印かと覚えた並びから、エージェントの id を求めます。『+N』や結べないときは null です。
3. 画面は Scope を選んだ後に、横の欄の `openAgent(id)` を呼びます。欄はエージェントのタブを開き、その id を選びます。null なら今どおりタブを開くだけです。

```plantuml id=flow
@startuml
title 印を押したとき
actor "利用者" as U
participant "画面（構造の図・ボード・横断・欄の見出し）" as V
participant "markAgentAt" as M
participant "横の欄" as P
U -> V : 稼働の印を押す
V -> V : その Scope を選ぶ
V -> M : 置き場と押した要素
M --> V : エージェントの id（または null）
V -> P : openAgent(id)
P --> U : エージェントのタブで、そのエージェントのチャット
@enduml
```

## 変わらないこと

- 印の並びは orca-web の部品が決めます。SpecDock は並べ替えません。
- 印の上限（ボードと欄の見出しの 4）と『+N』、札の幅、ボードの並び順、箱を押したときの動き。
- orca-web とつながっていない画面の HTML。

## 確かめ方

- node のテスト：`markAgentAt` と並びの記録、欄の `openAgent`、枠と札の HTML、画面の押しの静的な検査。
- 実機：統括が用意する、作業中の Epic の worktree に2人以上のエージェントがいる状態で、1440・390 × 明暗の写しを撮り、2つ目の印を押すとそのエージェントのチャットが開くことを確かめます。
