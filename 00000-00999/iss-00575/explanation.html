## この資料で分かること

:::summary
- 今まで Initiative が縦に積まれていた理由。
- 残りの幅に収まる Initiative を作り直す決まり。
- 幅が変わったときだけ並べ直す理由。
:::

## 背景と目的

Initiative の中の Epic は、画面の幅で折り返して横に並びます（#560）。しかし Initiative 自身は、中の Epic が幅いっぱいに広がるため、縦に積まれていました。画面をコンパクトに使うため、Initiative も収まる分だけ横に並べます。

## 決まり

- Initiative を、まず全体の幅で、左から行に並べます。
- 次の Initiative が行の残りに入らないとき、残りの幅が最小幅（420px）以上なら、その幅で作り直します。収まり、下の行に積むより低くなるときだけ採ります。
- 依存でつながった Initiative の鎖は、今までどおり1行に左から右へ並べ、割りません。
- 採った幅は、見える幅が変わったときだけ決め直します。配線の通路を広げる間は、最初の値のままです。

## 確認方法

```sh
uv run pytest tests/unit/presentation/test_dashboard_graph_js.py
```
