## この資料で分かること

:::summary
- 今まで Initiative が縦に積まれ、全体が小さく縮んでいた理由。
- 全体を画面に収めたときの倍率が最大になる切れ目を選ぶ決まり。
- 縦長の画面では縦積みのままである理由と、大きさが変わり終わってから並べ直す理由。
:::

## 背景と目的

Initiative の中の Epic は、画面の幅で折り返して横に並びます（#560）。しかし Initiative 自身は縦に積まれ、全体表示では画面の中央に細い縦の列ができて小さく縮んでいました。画面をコンパクトに使うため、Initiative を横に並べて全体を大きく見せます。

## 決まり

- 各 Initiative は、自然な幅と高さのまま、活動順に棚に詰めます。依存でつながった Initiative は一つのまとまりで、行の途中では折り返しません。
- 行の切れ目の候補（先頭から k 個を横に並べた幅）をすべて試し、全体を画面に収めたときの倍率 min(1, 見える幅 ÷ 全体の幅, 見える高さ ÷ 全体の高さ) が最大のものを選びます。
- 見える領域が縦長（高さが幅以上）なら、今までどおり縦積みです。
- 見える領域の幅と高さは図の領域の実寸です。大きさが変わり終わってから並べ直し、データの更新、拡大縮小、配線の広げ直しでは動かしません。

## 確認方法

```sh
uv run pytest tests/unit/presentation/test_dashboard_graph_js.py
```
