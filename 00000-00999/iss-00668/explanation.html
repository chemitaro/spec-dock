## この資料で分かること

:::summary
- 帯は「Unscoped」の行になり、先頭にいつも main のチェックアウト（印 `Primary`）が出ます。誰も指揮していなくても、Orca がなくても出ます。
- どの Scope にも紐づかない worktree は印 `Unlinked` で並びます。エージェントのいないものは薄く、2つ以上あれば `+N` に畳まれます。
- 1つの worktree は1つの項目で、そこにいるエージェントの印を全部並べます。多ければ項目の中で折り返します。
- 『これから』では指揮の線を引かず、指揮している項目に子の数を添えます。
:::

## 背景と目的

今の帯には、指揮の線の端になったエージェントの worktree だけが出ます。統括が誰も指揮していないと main のチェックアウトは図から消え、work start していない worktree で作業しているエージェントも見えません。本人のねらいは、(1) 主のワークスペースがいつも図に出続けること、(2) SpecDock を正しく使わずに作業している worktree にすぐ気づけることです。

## 全体の構成

```plantuml id=overview
@startuml
title Unscoped の行ができるまで
top to bottom direction
component "ダッシュボードのサーバー\n(git worktree list を読む)" as Server
component "構造の API\nworktrees.items" as Api
component "orca-web の要約\n(エージェント、任意)" as Orca
component "unscoped.js\n(行の項目の計算)" as Calc
component "構造の図 / 横断の構造\n(Unscoped の行)" as View
Server --> Api
Api --> Calc
Orca --> Calc
Calc --> View
@enduml
```

- サーバーは、今も読んでいる `git worktree list` の結果を、API の `worktrees.items` に出します（bare・prunable・仕様の置き場は除きます）。
- `views/graph/unscoped.js` が、主・紐づかない worktree・線の端・畳みを決めます。両方の画面がこれを呼びます。
- Scope に紐づくかどうかは、今の `matchWorktrees` と同じく、Scope の worktree の記録のパスで決めます。

## 見方ごとの出し方

| 見方 | 出すもの | 指揮の線 |
|---|---|---|
| 全体・いま | Primary、すべての Unlinked（薄い・+N）、線の端 | 今のまま |
| これから | Primary と、子のいるエージェントのいる Unlinked（子の数つき） | 引かない |

## 確認方法

試しのダッシュボード（別のポート、`--tailscale`）で、spec-dock の構造の図と『横断の構造』を開き、Primary・Unlinked・+N・『これから』の数を見ます。`specdockEdgeAudit()` と `specdockCmdAudit()` の違反が0であることも確かめます。
