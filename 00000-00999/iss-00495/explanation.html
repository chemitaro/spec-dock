## この資料で分かること

:::summary
- 何が問題だったか：仕様のツリーの外から仕様を指すリンクは、migrate.py が書き換えません。
- 何をするか：README の「戻し方」と「共通の決まり」に、手で直す手順と3つの注意を書きます。
- 確認方法：テストが README に要る語があることを確かめます。
:::

## 背景と目的

使い捨ての移行の道具 `migrate.py` は、仕様のツリーの中のリンクだけを書き換えます。I-12 の切り替えでは、ツリーの外（`content/`、`docs/` など）から仕様を指すリンクが切れ、手で直しました。道具は 0.5.0 で消えるので、コードは直さず、戻す人が困らないよう README に書きます。

## 書くこと

- 戻し方：`export-legacy` の後も、ツリーの外のリンクは入れ子に戻らないので、切り替え前のコミットの `.meta.json` から対応を作って手で戻します。
- 共通の決まり：Scope が0件の `verify` は exit 2（異常ではない）、書き込みは1時間に500件まで（待つだけで止まっていない）、往復で前から切れたリンクの書き方が変わることがあります。

## 確認方法

```sh
uv run pytest tests/integration/migration/test_migrate_plan.py -k readme
```
