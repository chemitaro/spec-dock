## この資料で分かること

:::summary
- 印が出る場所（構造の図の箱と枠、ボードの札、横の欄の見出し）と、出ないときに場所も空けないこと。
- 印は orca-web の部品が描き、SpecDock は空の置き場を用意して、形が変わったときだけ描き直させること。
- 「Orca で開く」は横の欄の見出しだけに置き、同じ Scope の間は読み込み直さないこと。
- orca-web に届かないとき、埋め込みの画面、スマホの幅での見え方。
:::

## 背景と目的

Orca のエージェントがどの Issue の worktree で動いているかを、ダッシュボードの狭い枠で一目で見たい、という本人の要望に応えます。orca-web が稼働の印の部品と「Orca で開く」のボタンを配っており、SpecDock はそれを埋め込みます。色や言葉を SpecDock の中で作り直さないので、Orca と orca-web と同じ見え方になります。

## 全体の構成

```plantuml id=overview
@startuml
title 印を描く流れ
top to bottom direction
component "orca-web" as OW
component "ctx.orca（iss-00591）\n要約の1つの読みの輪と対応" as ORCA
component "orca_logic.js\n何を描くかの決め方（純粋）" as LOGIC
component "orca_marks.js\n置き場に描く" as MARKS
component "構造の図・ボード・横の欄\n空の置き場を持つ" as VIEWS
OW --> ORCA : 要約（10秒ごと）と部品
ORCA --> VIEWS : 知らせ
VIEWS --> MARKS : 描き直しの後と知らせのとき
MARKS --> LOGIC : 置き場ごとの worktree と比べの鍵
MARKS --> OW : renderAgentMarks（部品）
@enduml
```

- 置き場は `<span class="sd-orca" data-orca-scope="<ID>">` という空の要素で、Scope の ID だけで決まります。要約が変わっても箱や札の HTML は変わりません。
- 描くときは、部品の `buildMarks` が返す印の形を前と比べ、変わったときだけ部品の `renderAgentMarks` で作り直します。作業中の印の回る弧が、描き直しのたびに回り始めに戻らないためです。
- 横の欄の見出しの行は作り直さない骨にし、その中に「Orca で開く」のスクリプトを置きます。Scope、worktree、明暗のどれかが変わったときだけ置き直します。

## 押したとき

印は押せる部品にしません。箱や札の上の印を押すと、今までどおりその箱や札が選ばれて横の欄が開きます。共有のタブに「エージェント」のタブ（iss-00593）があれば、そのタブが開きます。

## 届かないとき・出ないとき

- orca-web が止まっている、許されていない、Orca に届いていない、連携を切っている：印もボタンも出ず、図とボードは今までどおり動きます。
- 埋め込みの画面：印は出ますが、ボタンは出ません（orca-web が埋め込み先を許していないと、壊れた枠になるため）。
- 幅 390px 以下：ボタンは orca-web の部品が自分で隠します。

## 確認方法

```sh
spec-dock scope check iss-00592
uv run pytest tests/unit/infra -k orca
```
