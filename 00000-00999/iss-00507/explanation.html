## この資料で分かること

:::summary
- SpecDock のコマンドは、失敗しても「何が起きたか」を effects の各行（succeeded、unknown、not_attempted など）で返し、利用者とエージェントはそれを見て回復の手を選ぶ。
- 0.5.0 の canonical の処理には、実際には消えた・作ったものを「試みていない」「失敗」と返す場面が3つあった。
- この Issue は、その3つを起きたとおりに返すように直す。`artifact create` の1つは、status と終了コードも変わる（failed・5 から partial・6）。
:::

## 背景と目的

0.5.0 で従来モードを撤去したとき、従来の処理の正しい報告を確かめていたテストも消えた（#440 の report.md の「後続の候補」4、5）。effects が実際より「何もしていない」側に偏ると、利用者は残った記録やディレクトリに気づかず、同じ操作を繰り返したり、控えから戻す必要を見落としたりする。

## 3つの場面

| コマンド | 起きたこと | 0.5.0 の報告 | 直した後 |
|---|---|---|---|
| `scope delete --clear-active` | 直接の選択の記録を消した後、記述子の close が失敗 | `selection.clear not_attempted` | `selection.clear succeeded` |
| `scope delete` | Scope のディレクトリの最初の unlink が効いた後に例外 | `scope.delete not_attempted` | `scope.delete unknown` |
| `artifact create` | `artifacts/` を作った後、公開の前に失敗 | `failed`・終了コード5・effects 空 | `partial`・終了コード6・`artifact.directory unknown` |

どの場面でも、消えたものは控え（`--backup-dir`）に、作ったディレクトリはその場に残る。

## 直し方

```plantuml id=overview
@startuml
title scope delete の選択の解除
participant "scope delete" as D
participant "WorkTargetStore" as S
D -> S : remove_observed()
S --> D : removed
D -> D : selection.clear succeeded を記録（新しい位置）
D -> S : __exit__（close）
S --> D : OSError
D -> D : SCOPE_DELETE_INCOMPLETE（partial）
@enduml
```

- 選択の解除の結果を、記述子を閉じる前に記録する。
- ディレクトリの削除は、`TreeRemovalIncomplete` の `applied`（確かめた削除）だけでなく `attempted`（unlink を呼んだ）も見る。
- `artifact create` は、`artifacts/` の mkdir を試みたかと成功したかを覚えておき、その後の失敗を partial で返す。

## 確認方法

```sh
uv run pytest tests/cli_runtime/test_issue440_g2_scope_delete.py tests/cli_runtime/test_issue440_g3_artifact.py
```
