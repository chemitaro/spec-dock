## この資料で分かること

:::summary
- `spec-dock dashboard serve` が、どの住所に待ち受け、何を配り、何を書かないか。
- 資料（`explanation.html` や HTML の Artifact）のスクリプトを、画面とデータから切り離す見出しの決まり。
- ほかのダッシュボード（company-os）が、`?embed=1` の画面を iframe に入れて postMessage でつながる約束。
- 「見た」の記録と、変化の印の比べる元の保ち方。
- #531・#532 が、骨組みに触らずに画面を足す差し込み口。
:::

## 背景と目的

epic-00427 は、構造のスナップショットとカタログを合わせて見る、見るだけのダッシュボードを作ります。#528 が状態のモデルと要約を作りました。この Issue は、それを配る HTTP のサーバーと、画面の骨組みを作ります。サーバーは標準ライブラリだけで動き、GitHub に問い合わせません。

## 全体の構成

```plantuml id=overview
@startuml
title サーバーの部品
top to bottom direction
actor "ブラウザー\n（PC、iPhone、company-os の iframe）" as B
component "dashboard_server\n（待ち受け、Host の検査、ロック）" as S
component "dashboard_http\n（道筋、見出し、API、資料、見た）" as H
component "dashboard_site\n（一覧、最後に読めたモデル、revision）" as Site
component "dashboard_model / summary\n（#528）" as M
database "状態の置き場\nregistry, snapshot,\ndashboard/*.json" as St
database "カタログ\n（資料）" as C
B --> S : GET / HEAD / POST seen
S --> H : Request
H --> Site
Site --> M
Site --> St : 読む
H --> St : seen.json だけ書く
H --> C : 資料を読む（sandbox）
@enduml
```

## 道筋と見出し

| 道 | 中身 | 枠の決まり |
|---|---|---|
| `/r/<host>/<owner>/<name>/…` | 画面の骨組み | 通常 `frame-ancestors 'self'`、`?embed=1` なら手元と Tailscale の起点も許す |
| `/r/…/files/<ID>/…` | 資料 | いつも `sandbox allow-scripts allow-popups` と埋め込みと同じ許可 |
| `/ds/`、`/vendor/` | デザインシステムと図の部品 | `Access-Control-Allow-Origin: *` |
| `/api/v1/…` | JSON | CORS なし |

資料は固有でない起点で動くので、画面の DOM にも API の JSON にも触れられません。

## 「見た」と変化の印

画面は、ページとして開いたときに最新の `seen_id` を比べる元に覚えてから、1回だけ `POST …/seen` を送ります。その後の自動の更新は `?baseline=<seen_id>` を付けて読むので、開いている間は、開いたときの変化の印が消えません。`seen` の口は、サーバー自身の起点と決まった見出しの要求だけを受けます。

## 画面の差し込み口

`assets/dashboard/views/` の5つのファイル（`graph`、`board`、`timeline`、`scope`、`overview`）が画面です。各ファイルは `export default {id, title, icon, styles, render(root, ctx), dispose}` の形で、骨組みはデータが変わるたびに `render` を呼びます。#531 と #532 は、このファイルを書き換えるだけで画面を足せます。

## 確認方法

一時の状態の置き場でサーバーを立てて開きます（利用者の状態の置き場を使わない）。

```sh
XDG_STATE_HOME=$(mktemp -d) spec-dock dashboard serve --port 0
spec-dock dashboard list
```
