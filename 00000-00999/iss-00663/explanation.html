title: SpecDock 0.9.8 のリリース
lead: 指揮の線の軽さ・ホップの弧・点の組（#649、#658、#660）、帯の印から開くチャットの欄（#659）、矢印キーとマウスのホイールの操作（#661）、Scope の欄の見出し（#662）を 0.9.8 としてまとめ、版・移行の手引き・配布資産の更新経路を整える作業の説明です。

## この資料で分かること

:::summary
- 0.9.8 に入る変更は、ダッシュボードの画面だけです（iss-00646、iss-00648、iss-00657、iss-00650、iss-00655、iss-00656）。コマンドの引数と CLI・ダッシュボードの JSON の契約、画面の道は変わりません。
- 指揮の線が軽くなり（動かす間・画面の外・裏で止まる）、上の縁から出て上の縁へ入るホップの弧と矢じり、間 24px の点の組で向きが分かります。図は矢印キーと `+`・`-`・`0` で動かし、マウスのホイールで拡大・縮小します。Scope の欄の見出しは2行にまとまります。
- この Scope は版の番号と `migration.md` と `static-inventory.json` とテストだけを変え、機能のコードは変えません。マージ、タグ、導入、配布は統括が行います。
:::

## 背景と目的

0.9.7 の後に PR #649、#658、#659、#660、#661、#662 が main に入りました。本人の PC に届けるには版を上げて配る必要があります。0.9.7（iss-00645、PR #647）と同じ形で、版を上げ、移行の手引きを書き、0.9.7 以前の配布資産を持つリポジトリが `installation update` で上がるようにします。

## 変えるもの

- 版：`pyproject.toml`、`uv.lock`、`system/spec-dock-version`（提供側と dogfood の写し）。
- `migration.md`（提供側と dogfood の写しはバイト一致）：「## 0.9.8 への更新」の節。
- `static-inventory.json`：`migration.md` と版のファイルの行に今のハッシュを入れ、0.9.7 のバイトを既知の古い版に足します（`reference_cli.md` は変わりません）。
- テスト：`tests/integration/test_issue663_release_0_9_8.py` と 0.9.7 の旧資産の fixture（2つ）。

## 確認方法

```sh
uv run pytest tests/integration/test_issue663_release_0_9_8.py
make lint
```
