## この資料で分かること

:::summary
- 印は「+N」にまとめず、全員分を出します。入りきらなければ折り返し、構造の図の箱はその分だけ高くなります（幅は変わりません）。
- 箱の高さは、画面が描いた印の行の数を測り、配置の計算（layout.js）に渡して決めます。行の数が変わったときだけ配置し直します。
- エージェントのタブの5点（今の相手の押しで書きかけが消える、欄の足のリンクに選びが付かない、スマホの印の2回目の押し、修飾キーの押しで覚えが変わる、形の違う要約をいなくなったと読む）を直します。
:::

## 背景と目的

本人から「3台稼働していれば3つ表示してほしい」と要望がありました。今は構造の図の箱が2つ、枠の見出しが3つ、ボードの札と横の欄が4つまでで、超えた分は「+N」になります。

エージェントのタブは iss-00593 で作り、iss-00601 で残りの5点を調べました。どれも別の相手に送る道ではありませんが、人が普通にする操作で起きるものがあります。

## 全体の構成

```plantuml id=overview
@startuml
title 印の行と箱の高さ
top to bottom direction
component "orca-web の部品\n（印を描く）" as Marks
component "graph.js\n（描いた印の行を測る）" as Graph
component "layout.js\n（行の数で箱の高さを決める）" as Layout
component "router.js\n（線を引く）" as Router
Graph -> Marks : 全員の数を max に渡す
Marks --> Graph : 折り返した印
Graph -> Layout : orcaRows（Scope ごとの行の数）
Layout -> Router : 伸びた箱の座標
@enduml
```

- 置き場（`.sd-orca`）は行の残りの幅まで縮み、部品の印が置き場の中で折り返します。
- 1行増えるごとに、箱（と枠の見出し）は 18px 高くなります（orca-web の小さい印 16px と行の間 2px）。
- 経過の表記だけが変わる要約では、行の数が同じなので配置し直しません。続けての配置し直しは2回までです。

## 確認方法

```sh
spec-dock scope show iss-602 --json
uv run pytest tests/unit/presentation/test_dashboard_graph_js.py tests/unit/infra/test_dashboard_agents_tab_js.py
```

実機の確かめ（写しと edgeAudit）は report.md に残します。
