## この資料で分かること

:::summary
- 5点はどれも別の相手に送る道ではありませんが、書きかけの本文が消える、スマホで違う画面に飛ぶなど、人が普通にする操作で起きるものがあります。
- 直しはそれぞれ数行で、選びの規則（ほかの相手に自動で移らない、いなくなった相手を開かない）は変えません。
- 依頼にあった「すべての印を出す」は、本人の判断で行いません（印の上限と箱の高さは今のまま）。
:::

## 背景と目的

エージェントのタブ（iss-00593）は、横の欄と詳しい画面で、その Scope の worktree のエージェントを選び、orca-web のチャットを開きます。iss-00593 の最終品質ゲートで記録だけにした5点を、iss-00601 が読み直し、直し方を決めました。

## 5点と直し方

| 点 | 起きること | 直し |
|---|---|---|
| 1 | 覚えから開いた今の相手を帯で押すと、枠が置き直され書きかけが消える | 覚えから開いた相手も `agent` として書く |
| 2 | 欄を開き直すと、足のリンクに選びが付かず、新しいタブで残った1人が開きうる | 足のリンクが同じ Scope の覚え（いなくなっていれば `gone:<id>`）を持つ |
| 3 | スマホで、選んだ箱の印の2回目の押しで詳しい画面に飛ぶ | 印の押しを2回目の押しより先に見る |
| 4 | Cmd などの押しで新しいタブに開いても、元の画面の覚えが変わる | 修飾キーのない主ボタンの押しだけが覚えを変える |
| 5 | `agents` が並びでない要約を「いなくなった」と読む | 形の違いに数え、知らせ orca-shape を出す |

```plantuml id=overview
@startuml
title 選びの流れ（直した後）
top to bottom direction
component "問い合わせか欄の Map の agent" as Asked
component "覚え（同じ Scope の last と gone）" as Mem
component "pickAgent" as Pick
component "keep（agent を書く）" as Keep
component "欄の足のリンク" as Foot
Asked --> Pick : あれば先
Mem --> Pick : なければ last
Pick --> Keep : 覚えから開いた相手も書く
Mem --> Foot : Map になければ lastChoice
@enduml
```

```
