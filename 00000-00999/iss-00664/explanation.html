---
title: 横断の構造の動きのテストが手元で落ちた理由
lead: 横断の構造の指揮の線の「止め」を確かめるテストが、手元の macOS でだけ落ちた理由と、時間に左右されない形への直し方を説明します。
category: 説明資料
audience: 本日チームに加わった新メンバー
status: 確定
---

## この資料で分かること

:::summary
- 落ちたのは画面の不具合ではなく、テストのハーネスが実時間に左右されていたためです。
- 画面が CSS を待つ仕組み（`whenStyled`）の打ち切りが、前の run から持ち越され、次の run の途中で「止め」を付けていました。
- 動きを確かめる run を「CSS が効いた状態」で描くことで、結果が毎回同じになります。
:::

## 背景と目的

横断の構造（`views/allgraph.js`）では、グラフを動かした間と、その後 300ms だけ、指揮の線の動きを止めます（`.gx-view` に is-still を付ける）。iss-00646 のテストは、偽の時計を 400ms 進めた後に止めが外れていることを確かめます。0.9.8 のリリースの確かめで、このテストが手元で 5回中4回落ちました。

## 全体の構成

画面は、CSS が効く（`.gx` が position: absolute）まで、1枚の絵ごとに待ちます。3000ms 待っても効かなければ打ち切り、最初の見え方を置いて `applyT()` を呼びます。`applyT()` は毎回、止めを付けて 300ms の時計を始めます。

```plantuml id=overview
@startuml
title 落ちていた流れ
participant "前の run の描画" as Prev
participant "whenStyled の待ち" as Wait
participant "motion run" as Run
participant "止め（createMotion）" as Still
Prev -> Wait : 描くたびに待ちを残す（偽の DOM では CSS が効かない）
Run -> Run : step 1：偽の時計を 400ms 進める
Wait -> Run : 実時間で 3000ms を過ぎ、打ち切る
Run -> Still : applyT() → moved()：is-still を付ける
Still -> Still : 300ms の時計は偽の時計の上で待ったまま
Run -> Run : shots[1].still が True
@enduml
```

ブラウザーでは CSS がすぐ効くので、待ちは最初の絵で終わり、止めは 300ms 後に外れます。偽の DOM では効かないため、待ちがいつ打ち切られるかが、機械の速さと先の run の長さで決まっていました。

## 直し方

ハーネスに `run.styled`（CSS が効いた状態）を足し、motion と input の run に付けました。兄弟のハーネスと同じ決まりです。最初の見え方は最初の描画で決まり、前の run から残った待ちも、その run の最初の絵で終わります。画面のコードは変えていません。

## 確認方法

```sh
uv run pytest tests/unit/presentation/test_dashboard_allgraph_command_screen.py
```

打ち切りの時間を 0ms にしても 1e9ms にしても通ることで、時間に左右されないことを確かめました。
