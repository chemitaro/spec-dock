## この資料で分かること

:::summary
- 幅 1000 前後では、状態の札と道具の列は1行に入らない（入れるには文字を消すほかない）。
- そのため、決まった形（札を1行目、道具を2行目の右寄せ）にした。
- 横断の構造では、まとめの行を道具の列の下に回し、道具がまとめの行の下に落ちないようにした。
:::

## 背景と目的

上の帯には、左に状態の札（止められている・着手できる・作業中・マージ待ち）、右に道具の列（拡大縮小・収める・入れ子・全体｜いま｜これから）が並びます。
幅 1000 の画面では帯の幅は 976px ですが、札の列は 779px（横断の構造）・748px（構造の図）、道具の列は 428px・519px あり、1行には入りません。

横断の構造では、札の下にまとめの行（iss-00632）が同じ列にあるので、道具の列はまとめの行のさらに下（4行目）に落ちていました。

## 選んだ形

| 幅 | 横断の構造 | 構造の図 |
|---|---|---|
| 1440 | 1行（札・道具）、その下にまとめの行 | 1行 |
| 1280 | 1行、その下にまとめの行 | 2行（札、道具を右寄せ） |
| 1000 | 札、道具を右寄せ、まとめの行の3段 | 2行 |
| 390 | 今のまま（札とまとめの行が上、道具は右下の縦の列） | 今のまま |

1行に入るかどうかは px の境目を決め打ちせず、ブラウザーの折り返しに任せます。

## 仕組み

PC の横断の構造だけ、札とまとめの行を包む列（`.gx-left`）を `display: contents` にし、まとめの行に `order: 1` と `flex-basis: 100%` を付けます。
札・道具・まとめの行が帯の同じ並びの項目になり、札 → 道具 → まとめの行の順に折り返します。スマホの並びは別の規則なので変わりません。

最初の表示と『収める』は、札・道具・まとめの行のうち最も下の下端から 8px 下に図を置くので、行の数が変わってもそのまま追従します。
