title: 人のタスクの管理（epic-00547）
lead: エージェントが人に頼むことと、人が自分で決めたことを、各リポジトリの SpecDock に1か所でまとめ、全リポジトリを集めてダッシュボードで見られるようにします。人の返事待ちで止まっている作業も、構造の図とボードで分かるようにします。

## この資料で分かること

:::summary
- なぜ人のタスクの台帳が要るのか（今の困りごと）。
- どこに置くか（各リポジトリのカタログ）と、GitHub Issue にしない理由。
- 何を記録し、何を記録しないか。
- タスクの形（期限、サブタスク、止めている Scope）と、件数の目安と設定。
- コマンド（`spec-dock todo`）と、ダッシュボードでの見え方。
- 決まったことと、まだ決めていないこと。
:::

## 今の困りごと

- 人への依頼が、会話のログ、Orca の端末、Company OS の受付簿に散らばり、まとまって見えません。受付簿の未回答の問いは11〜13日開いたままになり、2026-10-23 には担当の3分の2が本人待ちで止まっていました。
- worktree に分かれて並行で作業すると、リポジトリの中のファイルの台帳は worktree ごとに分かれ、1つに集まりません。
- 1回の返事で複数の項目を出し、会話で1つずつ片付けると、残りがログに流れて失われます。

## 置き場：各リポジトリのカタログ

- SpecDock のカタログ（`spec-dock/initiatives/`）は、どの worktree からも同じ場所に見え、定期の同期が1〜2分で保存して共有します。人のタスクも、ここに1件1つのファイルで置きます（`todos/` の下）。
- 各リポジトリ（事業、プロダクト）が自分の人のタスクの唯一の正本を持ちます。Company OS に別の台帳を置かず、SpecDock が全リポジトリを集めて1つの画面に出します。二重管理になりません。
- 個人の用事は SpecDock に入れません。個人のタスク管理とつなぐときは、`spec-dock todo list --all-repositories --json` の出力を外の道具が読みます。

### GitHub Issue にしない理由

| 観点 | GitHub Issue（1件ずつ） | カタログのファイル |
|---|---|---|
| 通知 | エージェントはあなたと同じアカウントで書くので、通知が届かない（推測） | 押しての知らせはない（画面で見る） |
| 寿命 | 数分〜数日で閉じる Issue が積み上がり、Scope の一覧が読みにくくなる | Scope と混ざらない |
| オフライン | 登録できない | 手元に書き、つながったら同期する |
| 速さ | GitHub の回数の上限と失敗の扱いが要る | GitHub を使わない |
| 答えの戻り方 | コメントで答えても、止まった担当に届かない | 同じ（答える場所を記録に書く） |

## 何を記録するか

過去の依頼を数えると、AskUserQuestion は344問で、86% が1時間以内に答えられていました。会話で答えが返るものまで記録すると、一覧が埋まって本当に待っているものが見えなくなります。

| 種類 | 例 | 記録するか |
|---|---|---|
| 会話の中の判断 | 複数の質問のインタビュー | しない |
| 会話で終わらない判断・承認 | 受付簿の問い、仕様の承認 | **する**（`decide`） |
| 実機での確かめ | 配布の後の iPhone での確かめ | 数日かかるものは**する**（`check`） |
| 人しかできない操作 | `!` のコマンド、ログイン、秘密情報の設定 | すぐにできないときは**する**（`operate`） |
| 物理・外部の行為 | 発注、撮影、申請 | **する**（`act`） |
| 人が自分で登録するもの | | **する**（`todo`） |
| PR のマージ待ち | | しない（ダッシュボードの既存の表示を使う） |

1回の会話で終わらない複数の項目は、あらかじめ1つの束（`checklist`）とサブタスクにして登録します。答えを受けるたびに閉じ、返事の終わりに残りを示します。

## タスクの形

- **ID**：`t-7k3m` のような短い名前。サブタスクは `t-7k3m.2`。
- **期限**：指定しなければ、登録から4時間後。過ぎたら目立たせます。延期もできます。
- **サブタスク**：1段だけ。親のファイルの中に持ちます。
- **Scope との結び付き**：関係する Scope と、このタスクが終わるまで進めない Scope（止めている Scope）を持てます。止めていることは印で示すだけで、Scope の状態と `work start` は変えません。
- **形式**：データは JSON。型の定義は CUE でも持ち、`todo check` で一度に確かめます。

### 件数の目安と設定

- 開いている親のタスク（エージェントが登録したもの）が20件を超えたら、1つの親のサブタスクが30件を超えたら、警告します。登録は止めません。人が登録したものは数えません。
- 目安の件数と既定の期限は、次の順で上書きできます（後が優先）。

| 段 | 置き場 | 使い方 |
|---|---|---|
| 1. 初めの値 | SpecDock の中 | 何も設定しないとき |
| 2. 利用者の設定 | `~/.config/spec-dock/config.json`（例） | 大抵の設定はここ。全リポジトリに共通 |
| 3. リポジトリの設定 | カタログの `todos/settings.json` | そのリポジトリだけ変えたいとき |

## コマンド

```text
spec-dock todo add / list / show / update / done / snooze / cancel / reopen / check
spec-dock todo list --all-repositories --json   # 全リポジトリを集めた一覧
```

- 書くのはカタログだけで、GitHub には書きません。
- `dashboard summary` に、開いている数、止めている数、期限切れの数が出ます。

## ダッシュボードでの見え方（見るだけ）

- **人のタスクの画面**：全リポジトリをまとめた表示、リポジトリごとの表示、1件の詳しい表示。期限切れ、期限の近いもの、止めているもの、あとで、の順に並べます。
- **構造の図とボード**：人のタスクが止めている箱に「人 2」のような印。Epic と Initiative の枠には、配下を止めているものも合わせた数。
- **詳しい画面**：その Scope を止めている人のタスクの題名と期限。
- **横断の概況**：リポジトリの札に、開いている数と期限切れの数。
- 画面から書くこと（完了、延期、登録）は v1 では作りません。完了は、エージェントにひとこと伝えるか、CLI で行います。

## 決まったこと（2026-11-04）

- 保存先は各リポジトリのカタログ。GitHub Issue は使わない。マージ待ちはタスクにしない。
- 画面は見るだけ。
- 記録するのは、1回の会話で終わらないものだけ。
- 期限の既定は4時間。件数の目安は親20件、サブタスク30件で、警告だけ。設定は利用者とリポジトリの2段。
- 人が止めていることは印だけで示し、Epic と Initiative には配下の分も合わせて出す。
- Company OS の受付簿は、しばらく使って良ければ移す。
- 画面を作る Issue は epic-00427（ダッシュボード）の完了を待つ。CLI と記録の形は先に進められる。

## まだ決めていないこと

- 設計と Issue の分け方（統括がこの後に下書きします）。
- コマンドの名前と欄の細部（設計で柔軟に変えます）。
