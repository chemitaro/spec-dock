## この資料で分かること

:::summary
- リポジトリどうしの入れ子と「事業」「プロダクト」の札を、何から決めるか
- 『横断の構造』の画面に何が、どう並ぶか（既定は『これから』）
- 2つの Issue の分け方と順序
:::

## 背景と目的

『これから』の見せる範囲（iss-00603）で、リポジトリごとに今の仕事とこれからの仕事がコンパクトに見えるようになりました。けれども、見るにはリポジトリを1つずつ開く必要があります。

この Epic は、表示しているすべてのリポジトリを1枚にまとめます。ただ並べるのではなく、会社の入れ子をそのまま表します。company-os の中に事業（businesses）、その中にプロダクト（products）があり、spec-dock や orca-web のような company-os の外のものは外に並びます。

## 入れ子の決め方

設定のファイルは足しません。各リポジトリが登録している main のチェックアウトの場所から決めます。

- あるリポジトリのチェックアウトが、別のリポジトリのチェックアウトの中にあれば、その子です。候補が2つ以上なら、いちばん近い祖先を採ります。
- 親から子への途中のディレクトリの名前が「段の札」になります。`businesses` は事業、`products` はプロダクト、`services` はサービス、知らない名前はそのまま出します。親の直下なら札はありません。
- 決めるのはサーバーです。一覧の API（`GET /api/v1/repositories`）の各リポジトリに、親の鍵（`parent`）と段の札（`tier`）が足されます。入れ子を決めるために、登録のチェックアウトの場所をブラウザーへ新しく渡すことはしません。
- 隠したリポジトリの中のものは、出している祖先の子になり、隠したもののディレクトリの名前は札に出ません。同じリポジトリを2つ登録していてチェックアウトが1つに決まらないものは、最上位に並びます。

```plantuml id=nesting
@startuml
title この PC の登録の入れ子（例）
rectangle "company-os" {
  rectangle "housing-lifecycle［事業］" {
    rectangle "taikyohiyou_project［プロダクト］"
  }
  rectangle "input-devices［事業］" {
    rectangle "generic-mona［プロダクト］"
    rectangle "tenting-cradle［プロダクト］"
    rectangle "yubisaki［プロダクト］"
  }
}
rectangle "spec-dock"
rectangle "orca-web"
@enduml
```

## 『横断の構造』の画面

- 道は `/graph` です。リポジトリを選んでいないときの上の帯が、『横断の概況』『横断の構造』『人のタスク』の3つのタブになります。
- 各リポジトリは1つの「リポジトリの枠」です。見出しにリポジトリの名前と段の札があり、中には、そのリポジトリの構造の図（Initiative・Epic・Issue）が今の部品のまま入ります。子のリポジトリの枠は、親の構造の図の下に並びます。新しい色は使いません。
- 見せる範囲は今の『全体・いま・これから』で、このページの既定は『これから』です。『これから』では、見える Scope のないリポジトリの枠を出しません。ただし、子のリポジトリに見えるものがあれば、親の枠は入れ物として出ます。
- 箱を押すと、今と同じ横の欄が、そのリポジトリの文脈で開きます。『詳しい画面』はそのリポジトリの詳しい画面へ移ります。orca-web の稼働の印も今どおり出ます。依存の線はリポジトリの中だけです。
- 1つのリポジトリが読めないときは、その枠に理由を出し、ほかのリポジトリは描きます。
- 1440・1000 の幅とスマホの 390px で読め、『収める』で全体が1つの画面に収まります。

## Issue の分け方

| Issue | 内容 | 先に要るもの |
|---|---|---|
| iss-00613 | 入れ子と段の札を決める関数と、一覧の API の `parent`・`tier`、契約の文書 | なし |
| iss-00614 | `/graph` の画面（リポジトリの枠の組み立て、見せる範囲、横の欄、稼働の印、収める） | iss-00613、iss-00611（『これから』で中に進める仕事のない親を出さない） |

サーバーの側を先に分けたのは、純粋な計算とテストで先に確かめられ、画面の Issue が決まった形の API の上で作れるからです。

## 確認方法

```sh
spec-dock scope check epic-00612
spec-dock dependency check iss-00614
```

画面ができた後は、ダッシュボードで `/graph` を開き、company-os の枠の中に事業とプロダクトの枠があること、spec-dock と orca-web がその外にあることを見ます。
