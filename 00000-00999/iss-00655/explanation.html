## この資料で分かること

:::summary
- マウスのホイールとトラックパッドを、ブラウザーが渡す wheel の値から見分ける決まり。
- 矢印キー・+・-・0 の動きと、キーを横取りしない場面。
- 両方の画面が1つのモジュール（`views/graph/view_input.js`）を使う理由。
:::

## 背景と目的

今は、マウスのホイールを回すと図が上下に動き、拡大・縮小には Ctrl が要ります。本人は、ホイールは拡大・縮小のほうが直感的で、矢印キーで図を動かしたいと望みました。一方、トラックパッドの2本指でなぞると動かす、ピンチで拡大・縮小、は今のまま残します。

## 見分けの決まり

マウスのホイールとトラックパッドを確かに見分ける Web の標準はありません。そこで、確かな手がかりから順に見ます。

| 順 | 手がかり | 扱い |
|---|---|---|
| 1 | Ctrl か Cmd 付き（ピンチ） | 今と同じ倍率で拡大・縮小 |
| 2 | Shift 付き | 横に動かす |
| 3 | `deltaMode` が行・ページ（Firefox のマウスのホイール） | 拡大・縮小（1刻み 1.15倍） |
| 4 | `deltaX` が 0 で `wheelDeltaY` が 120 の倍数（Chrome・Safari のマウスのホイール） | 拡大・縮小 |
| 5 | それ以外（見分けられない） | 動かす（今の動き） |

4 と 5 は値だけによる弱い判定です。一続きの wheel（前の wheel から 200ms 以内に次が来る）は、その一続きの最初の判定を引き継ぎます。トラックパッドの勢いのあるなぞりの途中で、たまたま 120 の倍数の値が来ても拡大・縮小に切り替わらず、マウスのホイールを速く回す途中でも拡大・縮小が続きます。1〜3 の確かな判定は引き継がず、そこから新しい一続きが始まります。

## キー

| キー | 動き |
|---|---|
| ← → ↑ ↓ | その向きの部分が見えるように 80px（Shift で 320px）動かす。押し続けると続けて動く |
| + （=） | 中央で 1.25倍（拡大のボタンと同じ） |
| - | 中央で 0.8倍（縮小のボタンと同じ） |
| 0 | 全体を収める（収めるボタンと同じ） |

入力欄・ボタン・リンク・チャットの枠、図の面の外（欄・道具の棒）にフォーカスがあるとき、Ctrl・Cmd・Alt 付きのときは、キーを横取りしません。図の面の中の箱にフォーカスがあるときは扱います（箱を押すとフォーカスが移るため）。

## 全体の構成

```plantuml id=overview
@startuml
title 入力の流れ
top to bottom direction
actor "利用者" as User
component "view_input.js\nwheelKind / wheelAction\nkeyAction / ownsKey\nbindViewInput" as VI
component "graph.js / allgraph.js\npan・zoomAt・zoomCenter・fit" as Screen
component "applyT()\n（iss-00646 の止める扱い）" as Apply
User -> VI : ホイール・キー
VI -> Screen : 写した操作
Screen -> Apply : 世界の transform
@enduml
```
