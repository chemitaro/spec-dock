## この資料で分かること

:::summary
- ルートの `.workbench/` の無視が、雛形の README を隠していた理由。
- `spec-dock/.gitignore` に1行足して直す方法と、確かめ方。
:::

## 背景と目的

雛形 `spec-dock/templates/cue/{epic,initiative,issue}/.workbench/README.md` は、`scope create` が写すために配布されます。利用側のルートの `.gitignore` に `.workbench/` があると、Git はそのディレクトリの下へ降りないので、`spec-dock/.gitignore` の `!**/.workbench/README.md` が効かず、`git add -f` が要りました。

## 直し方

`spec-dock/.gitignore` に `!**/.workbench/` を `**/.workbench/*` より前に足します。深い階層の `.gitignore` は浅いものに勝つので、ディレクトリが戻り、`*` で中身を無視して README だけを戻す従来の組が働きます。置き場の名前を変える案は `scope create` の写し方に響き、警告だけの案は原因を直さないので採りません。

## 確認方法

```sh
git check-ignore -v spec-dock/templates/cue/issue/.workbench/README.md
uv run pytest tests/integration/test_issue497_workbench_readme.py
```
