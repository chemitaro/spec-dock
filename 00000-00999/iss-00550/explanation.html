## この資料で分かること

:::summary
- `spec-dock todo list --all-repositories` が、どこから何を読み、どう返すか。
- 1つのリポジトリが読めなくても、ほかのリポジトリの分が返る仕組み。
- `dashboard summary` の `todos` の数の意味と、カタログの選び方。
:::

## 背景と目的

人のタスク（エージェントが人に頼むことと、人が自分で登録すること）は、各リポジトリのカタログの `todos/` に1件1つの JSON で置かれます（前の Issue #549）。リポジトリが5つあれば、置き場も5つです。この Issue は、それをまとめて見られるようにし、外部の道具（個人のタスク管理など）が1回の JSON で全部を読めるようにします。

## 全体の構成

このPCで `canonical link` したカタログは、登録簿（`~/.local/state/spec-dock/canonical-registry.json`）に載ります。集約は、この登録簿の全行のカタログを、その場で読みます。

```plantuml id=overview
@startuml
title 集約の読み方
top to bottom direction
actor "利用者・外部の道具" as User
component "todo list --all-repositories" as List
component "dashboard summary" as Summary
database "登録簿" as Registry
database "カタログ A の todos/" as A
database "カタログ B の todos/" as B
User -> List : 実行する
User -> Summary : 実行する
List -> Registry : 行を読む
List -> A : 読む
List -> B : 読む
Summary -> A : 数える
List --> User : specdock.todo-list/v1
@enduml
```

- 同じリポジトリのクローンが2つ登録されていれば、`main_checkout` の道の順で最初のものを読み、2つ目は `duplicate` と示します。
- カタログが読めないリポジトリは `unreadable` と、次の1手（`canonical link`）を示し、ほかのリポジトリの分は返します。
- ダッシュボードで隠したリポジトリも返し、`hidden: true` を付けます。
- `todo show owner/name/t-xxxx` で、チェックアウトの外から1件を読めます。

## dashboard summary の数

`dashboard summary` の結果に `todos` が足されます。数えるのは親のタスクだけ（サブタスクは数えません）です。

| 項目 | 意味 |
|---|---|
| `open` | 閉じていない（延期中を含む） |
| `blocking` | 閉じていなくて、Scope を止めている |
| `overdue` | 開いていて、期限を過ぎた |

チェックアウトの中で REPOSITORY を省くと、そのチェックアウトのカタログを読みます（登録簿に載っていなくても数が出ます）。人のタスクが読めなくても、要約は成功し、`todos.status` が `unavailable` になります。ダッシュボードのサーバーの summary の API も、同じ選び方と数え方で同じ数を返します。

## 確認方法

```sh
spec-dock todo list --all-repositories --json
spec-dock todo show chemitaro/spec-dock/t-xxxx
spec-dock dashboard summary --json
```
