## この資料で分かること

:::summary
- 構造の図は、API の値を並べて描くだけで、状態や順番の判定はモデル（#528）が決めます。
- 箱と枠の座標は画面の側の純粋な関数（`layout.js`）が計算し、依存の線は試作の ROUTER を移した `router.js` が引きます。
- 線が箱に重ならないことは、同じ関数を node で走らせる検査（`edgeAudit`）で、テストとして確かめます。
:::

## 背景と目的

ホームの構造の図は、Initiative と Epic を枠に、Issue を箱にして、階層と作業の順番の依存を1枚で示します。依存の線が箱に重なったり、同じ通り道で重なったりすると、どれがどれを待つのか読めません。試作 d2 で選んだ線の引き方を、そのまま製品に持ち込み、検査で守ります。

## 全体の構成

```plantuml id=overview
@startuml
title 構造の図の部品
top to bottom direction
component "構造の API\n(dashboard_api.py)" as Api
component "graph.js\n(画面・操作)" as View
component "layout.js\n(座標・依存の組)" as Layout
component "router.js\n(経路・検査)" as Router
component "Scope の API\n(上流・下流)" as ScopeApi
Api --> View : scopes, cleanup
View --> Layout : 表し方の選択
Layout --> Router : 障害物と線
Router --> Layout : 足りない隙間
View --> ScopeApi : 箱を選んだとき
@enduml
```

- `layout.js` は、見せる Scope、段、推奨順から座標を決め、線を引く依存の組を作ります。車線が足りなければ隙間を広げて、最大8回引き直します。
- `router.js` は、直交の格子の上の A* と、車線への寄せで経路を求め、SVG に描きます。
- 時間の軸は、API の種類ごとの週の累計を `series.js` で足し合わせ、図と最近の動きを描きます。

## 確認方法

```sh
spec-dock scope check iss-00532
uv run pytest tests/unit/presentation/test_dashboard_graph_js.py
```
