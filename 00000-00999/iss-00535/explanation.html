## この資料で分かること

:::summary
- 「文書」のタブが、どの文書を、どの道から、どう切り離して描くか。
- CUE の検査の結果と計画の進み具合が、どこから来て、いつ計算し直されるか。
- `cue` がないときや評価が通らないときに、画面がどう振る舞うか。
- 前面の `serve` が古い版のときの知らせ。
:::

## 背景と目的

0.6.0 のダッシュボードの「文書」のタブは、文書があるかどうかだけを示していました。描画の入口（`render_scope`、`spec-dock scope render`）とデザインシステムは既にあるので、サーバーがそれをその場で呼び、詳しい画面の中で読めるようにします（epic-00427 の段階2、R-19・R-25・R-26・F-10）。

## 全体の構成

```plantuml id=overview
@startuml
title 文書の描画の流れ
actor "利用者" as User
component "詳しい画面\n(views/scope.js)" as Screen
component "サーバー\n(dashboard_http.py)" as Http
component "文書の覚え\n(dashboard_documents.py)" as Docs
component "描画の入口\n(render_scope / wrap_page)" as Render
database "カタログ" as Catalog
User -> Screen : 「文書」のタブを開く
Screen -> Http : GET /api/v1/r/…/scopes/<ID>
Http -> Docs : 検査の結果と進み具合
Docs -> Render : ファイルが変わったときだけ cue を動かす
Render -> Catalog : 3つの CUE のファイルを読む
Screen -> Http : 枠 (sandbox) で GET /r/…/scopes/<ID>/doc
Http --> Screen : 切り離した HTML（/ds/ と /vendor/ だけを読む）
@enduml
```

- **CUE の Scope**：`/r/<host>/<owner>/<name>/scopes/<ID>/doc` が、`render_scope` を `design_system_base="/ds/"`、`vendor_base="/vendor/"` で呼んだ HTML を返します。インターネットは要りません。
- **Markdown の文書**：`…/scopes/<ID>/doc/<道>` が、`requirement.md`・`design.md`・`plan.md`・`report.md` と ADR（`artifacts/` と `discussions/` の、名前に `adr-` を含む `.md`）を `wrap_page` に包んで返します。
- **切り離し**：どの文書の応答も資料と同じ `sandbox allow-scripts allow-popups`（`allow-same-origin` なし）を持ち、画面の枠も同じ `sandbox` を付けます。文書のスクリプトは画面と API を読めません。
- **覚え**：検査と描画の結果は、3つの CUE のファイル、説明資料、リポジトリの型の時刻と大きさを鍵に、サーバーのメモリにだけ覚えます。5秒ごとの更新で `cue` を動かし続けません。

## 計画の進み具合

CUE の Scope の評価の `steps` の `status` を数えます。`dropped` は全体から除き、「終わった数／全体」と作業中の手順を、「概要」と「文書」のタブに帯で示します。

## 失敗したとき

`cue` がない、時間切れ、評価の誤りのときは、「文書」のタブに理由と次の1手（`cue` を入れる、`spec-dock scope check <ID>`）を示し、ほかのタブやほかの Scope は今のとおり動きます。

## 起動し直しの知らせ

前面の `spec-dock dashboard serve` は、パッケージが更新されても終わりません。画面は60秒ごとに `/api/v1/repositories` を読み、`server.restart_required` が true なら、上の帯に入っている版と次の1手を示します。

## 確認方法

```sh
spec-dock scope check iss-00535
spec-dock dashboard serve   # 詳しい画面の「文書」のタブを開く
```
