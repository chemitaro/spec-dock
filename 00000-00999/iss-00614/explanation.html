## この資料で分かること

:::summary
- `/graph` の画面に何が、どの順で並ぶか（既定は『これから』）
- リポジトリの枠の組み立てを、DOM のない計算に分けた理由と、後から『指揮の帯』を足せる口
- 構造の図（`/r/…/graph`）の見え方を変えずに部品を共有するやり方
:::

## 背景と目的

一覧の API は、各リポジトリの入れ子の親（`parent`）と段の札（`tier`。事業、プロダクト…）を返すようになりました（iss-00613）。この Issue は、それを使って、すべてのリポジトリの仕事を1枚の図に描きます。company-os の枠の中に事業の枠、その中にプロダクトの枠があり、spec-dock と orca-web は company-os の外に並びます。

## 画面の並び

- 上の帯のタブ（リポジトリを選んでいないとき）：横断の概況、**横断の構造**、人のタスク。
- 道具の帯：拡大・縮小、収める、『全体・いま・これから』、状態で目立たせる札、凡例。範囲の既定は『これから』で、このページだけの覚え（`specdock.allgraph.v1`）に残ります。
- リポジトリの枠：見出し（名前と段の札）、警告の行（読めないときの理由と次の1手）、中の構造の図（今の箱と枠と線のまま）、子のリポジトリの枠の棚。
- 『これから』では、見えるものがないリポジトリの枠は出しません。ただし、見える子のリポジトリがあれば、親は中が空の入れ物として出ます。
- 箱を押すと、構造の図と同じ横の欄が、そのリポジトリの文脈で開きます。『詳しい画面』はそのリポジトリの詳しい画面へ移ります。稼働の印もエージェントの行に今どおり出ます。

## 作りの分け方

```plantuml id=parts
@startuml
title 横断の構造の部品
component "allgraph.js\n（読み込み・更新・描画・選び）" as A
component "allgraph/compose.js\n（枠の組み立て・純粋）" as C
component "graph/layout.js・router.js\n（各リポジトリの配置と線・今のまま）" as L
component "graph/draw.js\n（箱・枠・塊の HTML・graph.js から取り出す）" as D
component "graph.js\n（構造の図・見え方は変えない）" as G
A --> L : リポジトリごとに routeLayout
A --> C : 寸法を渡して枠の座標を得る
A --> D
G --> D
@enduml
```

- 枠の組み立て（`compose.js`）は DOM を測らない計算です。入れ子、出すかどうか、寸法、折り返しを node のテストで確かめます。警告は1件1行の決まった高さで置きます。
- 組み立ての入力に、枠ごとの「帯の高さ」を渡せます。今は 0 で、後の epic-00615 が見出しと中身の間に『指揮の帯』を足すときに使います。
- 箱や枠の HTML は `graph.js` から `draw.js` に取り出し、両方の画面が同じ関数で描きます。取り出す前の `graph.js` が出した HTML の写しと、取り出した後の HTML が同じことをテストで確かめます。

## 確かめ方

- 組み立て、道とタブ、構造の図の HTML の一致、画面の偽の DOM のテスト（`uv run pytest`）。
- この PC の登録の写しで、隔離したサーバーを別のポートで立て、1440・1000・390 × 明・暗 × 3つの範囲を写し、線の検査（`window.specdockEdgeAudit()`）の違反0とブラウザーのエラー0を確かめます。
