title: SpecDock 0.9.7 のリリース
lead: 構造の図と『横断の構造』の Orca の指揮の線と『指揮の帯』（#642、#644）、横断の構造の知らせのまとめ（#639）と帯の並び（#643）、木の表示の線の通り道（#641）を 0.9.7 としてまとめ、版・移行の手引き・配布資産の更新経路を整える作業の説明です。

## この資料で分かること

:::summary
- 0.9.7 に入る変更は、ダッシュボードの画面だけです（iss-00616、iss-00617、iss-00632、iss-00640、iss-00633）。コマンドの引数と CLI・ダッシュボードの JSON の契約、画面の道は変わりません。
- 構造の図と『横断の構造』に、親のエージェントから子のエージェントへの黄色の指揮の線と、箱のない親と子を並べる『指揮の帯』が出ます。orca-web の要約の `parent`（orca-web の iss-00043 以降）が要ります。
- この Scope は版の番号と `migration.md` と `static-inventory.json` とテストだけを変え、機能のコードは変えません。マージ、タグ、導入、配布は統括が行います。
:::

## 背景と目的

0.9.6 の後に PR #639、#641、#642、#643、#644 が main に入りました。本人の PC に届けるには版を上げて配る必要があります。0.9.6（iss-00634、PR #638）と同じ形で、版を上げ、移行の手引きを書き、0.9.6 以前の配布資産を持つリポジトリが `installation update` で上がるようにします。

## 変えるもの

- 版：`pyproject.toml`、`uv.lock`、`system/spec-dock-version`（提供側と dogfood の写し）。
- `migration.md`（提供側と dogfood の写しはバイト一致）：「## 0.9.7 への更新」の節。
- `static-inventory.json`：`migration.md` と版のファイルの行に今のハッシュを入れ、0.9.6 のバイトを既知の古い版に足します（`reference_cli.md` は変わりません）。
- テスト：`tests/integration/test_issue645_release_0_9_7.py` と 0.9.6 の旧資産の fixture（2つ）。

## 確認方法

```sh
uv run pytest tests/integration/test_issue645_release_0_9_7.py
make lint
```
