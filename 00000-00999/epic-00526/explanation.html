## この資料で分かること

:::summary
- エージェントのタブがいつ出て、中に何があるか。
- 送信の守りがどこにあり、SpecDock が何に責任を持つか。
- orca-web に届かないとき、埋め込みの画面、エージェントがいなくなったときの見え方。
:::

## 背景と目的

ダッシュボードの第3段階です。第2段階（epic-00471）で、Scope に対応する worktree のエージェントの稼働の印が出るようになります。この Epic は、その先のチャット（会話の表示と送信）を、SpecDock の画面の中で使えるようにします。

チャットそのものは orca-web が作りました（orca-web の iss-00028）。`/embed/agent?id=…&theme=…` を iframe で置けば、題名、Orca で開く、畳んだ詳細、会話、入力欄と送るボタンが出ます。

## 全体の構成

```plantuml id=overview
@startuml
title エージェントのタブ
top to bottom direction
actor "利用者" as U
rectangle "SpecDock の画面（47800）" {
  component "横の欄・詳しい画面\nエージェントのタブ" as Tab
  component "core/orca.js\n（iss-00591）" as Orca
}
rectangle "orca-web（8791）" {
  component "/embed/agent の iframe\n会話・送信" as Chat
  component "要約・部品" as Sum
}
U --> Tab : エージェントを選ぶ
Tab --> Orca : 対応と状態
Orca --> Sum : GET（読み取りの CORS）
Tab --> Chat : iframe（id と theme だけ）
U --> Chat : 書いて送る
note right of Chat : 送信の守りはすべてここ\n同じオリジン・短期のトークン\n宛先の指紋・sendEnabled
@enduml
```

## タブが出るとき

| 場合 | タブ | 中身 |
|---|---|---|
| orca-web を読めていて、対応した worktree にエージェントがいる | 出る（2番目、数の札つき） | 一覧と、選んだエージェントのチャット。1人ならすぐに開く |
| orca-web を読めていて、エージェントがいない | 出ない | — |
| orca-web に届かない、Orca に届いていない、読み込み中 | worktree のある Scope にだけ出る | 理由の1行 |
| 設定の `orca_web` の節が壊れている | worktree のある Scope にだけ出る | 理由と直すファイル |
| 埋め込みの画面の中 | 上の行と同じ条件で出る | 「埋め込みでは開けない」と、直接開くリンク |
| 選んでいたエージェントがいなくなった（最後の1人でも） | 出たまま | 「このエージェントはいなくなった」と一覧。残った別のエージェントへ自動では移らない |
| 連携を切っている、worktree のない Scope | 出ない | — |

## SpecDock が責任を持つこと

送信の守り（同じオリジン、短期のトークン、宛先の指紋、`sendEnabled`、送る前の記録）は orca-web の中にあります。SpecDock は orca-web の書き込みの口を呼ばず、iframe に本文もトークンも渡しません。

その代わり、**相手を正しく選ぶこと**は SpecDock の責任です。宛先の指紋は、表示した後の宛先の変化を止めますが、SpecDock が最初から別のエージェントを開けば守れないからです。

- Scope を変えたら、前の Scope の iframe を外す。
- 選んだエージェント（1人だけで自動で開いた相手も）が要約から消えたら、iframe を外して知らせる。残った別のエージェントへ自動では移らない。
- 同じ Scope のほかのエージェントが増えたり減ったりしても、選んだ相手の iframe はそのまま残す。
- 一覧と iframe の題名に worktree のブランチを出し、送る前に相手を確かめられるようにする。
- 描き直しでは iframe を読み込み直さない（書きかけの本文を消さない）。

## 分担と順番

- **iss-00593**（strict）：この Epic のすべて。epic-00471 の iss-00591（対応と状態）と、iss-00589（文書のタブを詰める）が終わってから始めます。iss-00592（印と Orca で開く）とは並べて進められます。

## 確認方法

```sh
spec-dock scope check epic-00526
spec-dock scope show iss-00593 --json
```

送信を確かめるときは、iss-00593 を名指すブランチの確かめ専用の worktree に置いた、作業を任せていないエージェントにだけ送ります。常駐の orca-web の `sendEnabled` は統括の了承を得て確かめの間だけ有効にし、確かめた後に戻します。
