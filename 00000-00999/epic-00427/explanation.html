## この資料で分かること

:::summary
- ダッシュボードの3つの段階のうち、この Epic が受け持つ第1段階（SpecDock の資源を見るだけ）の範囲。
- 1つのサーバーが全リポジトリを配る仕組みと、表示を止めて戻す方法、常駐の入れ方。
- company-os に埋め込むための約束（埋め込みの表示、postMessage、在りかの記録）。
- 11の Issue の順番と、それぞれが受け持つもの。
:::

## 背景と目的

構造（階層、依存、状態、題名）の正本は GitHub Issue に、内容（要件、設計、計画、Artifact）の正本はカタログにあります（epic-00424）。人が両方を合わせて見る手段がなく、今のダッシュボード（`dashboard.md` と PlantUML の図）は、スマートフォンでは見にくく、詳しい内容へたどれません。

利用者は複数のリポジトリを同時に開発しています。そこで、利用者ごとに1つのサーバーが、このPCで `canonical link` した全リポジトリのダッシュボードを配り、開発を終えたリポジトリは表示から外せるようにします。

## 3つの段階

| 段階 | 中身 | Epic |
|---|---|---|
| 第1段階 | SpecDock の資源（構造と文書）を見るだけ。Orca を使わない | この Epic（epic-00427） |
| 第2段階 | orca-web から Orca のエージェントの稼働を読んで重ね、「Orca で開く」のボタンを埋め込む | epic-00471 |
| 第3段階 | orca-web のチャット（ログと送信）を埋め込む | epic-00526 |

Orca を外から操作する機能は、独立したサービス orca-web（仮の名前）に作ります。押した端末を見分けるには、ブラウザーから orca-web へ直接届く要求が要るためです。

この Epic の中では、構造の画面を 0.6.0 で、文書の画面を 0.7.0 で出します。

## 全体の構成

```plantuml id=overview
@startuml
title 第1段階の構成
top to bottom direction
actor "利用者（PC、iPhone）" as User
node "company-os のダッシュボード" as Company
node "SpecDock のダッシュボードのサーバー\n（利用者ごとに1つ、47800）" as Server
database "構造のスナップショット\n（リポジトリごと）" as Snapshot
database "カタログ\n（リポジトリごと）" as Catalog
file "登録簿・表示の印・在りかの記録\n（利用者の状態の置き場）" as State
component "定期の同期" as Sync
User --> Server : ブラウザーで開く\n（手元か Tailscale の IP）
User --> Company : 開く
Company --> Server : iframe で埋め込む\n（?embed=1、postMessage）
Server --> Snapshot : 読む
Server --> Catalog : 読む
Server --> State : 読む
Sync --> Snapshot : 書く
Sync --> Catalog : 保存する
@enduml
```

- サーバーは見るだけで、GitHub に問い合わせません。新しさは定期の同期に従います。
- 動かし方は2つです。`spec-dock dashboard serve` は使うときに前面で動かします。`spec-dock dashboard service install` を実行したときだけ、ログインのときに自動で起動する常駐が入ります（言い直した約束3）。
- `spec-dock dashboard hide <リポジトリ>` で表示から外し、`show` で戻します。外しても同期は続きます。

## 画面

- ホームは構造の図です。階層と作業の順番の依存を1枚で示し、入れ子と木を切り替えられます。
- 図では、状態を文字でなくアイコンと図形で示します。
- ほかに、状態のボード（マージ待ちの列、片付けの候補の印）、時間の軸、タブで分けた詳しい画面、全リポジトリの横断の概況（`/`）があります。
- 前回見たときからの変化（状態、新しい Scope、PR）に印を付けます。「見た」は端末に関わらず共通です。
- 状態は、終わった、作業中、止められている、着手できる、不明、の5つです。判定は `dependency check` と同じ関数を使います。
- 道筋は `/r/<host>/<owner>/<name>/scopes/<ID>` の形で、変えない契約です。

## company-os への埋め込み

- どの画面にも `?embed=1` を付けると、SpecDock 自身の題名を消した表示になり、company-os の外枠の中の iframe に入れられます。
- 画面の移動は postMessage（`specdock.embed/v1`）で親に伝わり、親から移動を指示できます。高さは親が決めます。
- 全リポジトリの横断の概況も画面として配るので、company-os は JSON から画面を作り直さずに済みます。
- iframe が使えない場面のために、どの画面も普通のリンクで開けます。
