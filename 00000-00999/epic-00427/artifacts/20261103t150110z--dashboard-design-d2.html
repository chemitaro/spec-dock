<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>案D2 説明資料と同じ顔</title>
<style>
/* ============================================================
   1. トークン — SpecDock 説明資料デザインシステム（ds.css の「D：ビジネス」）をそのまま写す
   ============================================================ */
:root {
  --edge-p2: color-mix(in srgb, var(--ds-accent) 58%, var(--ds-bg));
  --ds-font-sans: "BIZ UDPGothic", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  --ds-font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --ds-topbar-h: 56px;
  --ds-gutter: clamp(16px, 4vw, 48px);
  --ds-wide-max: 1640px;
  --ds-radius-s: 4px;
  --ds-radius: 6px;
  --ds-radius-l: 8px;
  --ds-ease: cubic-bezier(.2, .7, .2, 1);

  --ds-bg: #ffffff;
  --ds-bg-2: #f6f7f9;
  --ds-surface: #ffffff;
  --ds-surface-2: #f4f6f8;
  --ds-surface-3: #e7ebf0;
  --ds-border: #dfe3e9;
  --ds-border-2: #848d9c;
  --ds-text: #1c2230;
  --ds-text-2: #3a4353;
  --ds-muted: #5a6372;
  --ds-faint: #7d8696;
  --ds-accent: #1a56c4;
  --ds-accent-strong: #1546a3;
  --ds-accent-soft: #eef3fd;
  --ds-accent-line: #c6d6f6;
  --ds-on-accent: #ffffff;
  --ds-link: #1a56c4;
  --ds-focus: #1a56c4;
  --ds-highlight: #fff1b8;

  --ds-note: #1a56c4;  --ds-note-bg: #eef3fd;  --ds-note-line: #c6d6f6;  --ds-note-ink: #1546a3;
  --ds-tip: #4a5466;   --ds-tip-bg: #f3f5f8;   --ds-tip-line: #d6dbe3;   --ds-tip-ink: #343c4a;
  --ds-warn: #a87400;  --ds-warn-bg: #fff7e0;  --ds-warn-line: #f0d9a0;  --ds-warn-ink: #7a5300;
  --ds-danger: #c21f4d; --ds-danger-bg: #fdeff3; --ds-danger-line: #f5c8d5; --ds-danger-ink: #a3173f;
  --ds-ok: #0f8466;    --ds-ok-bg: #eaf7f2;    --ds-ok-line: #bfe5d6;    --ds-ok-ink: #0b6650;
  --ds-syn-keyword: #6d28d9;

  --ds-shadow-s: 0 1px 2px rgb(16 24 40 / 5%);
  --ds-shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 8px 24px -14px rgb(16 24 40 / 18%);
  --ds-shadow-l: 0 24px 64px -20px rgb(16 24 40 / 32%);
  --ds-series-1: #2a78d6; --ds-series-3: #1baf7a;
  --ds-chart-grid: #e6e9ee; --ds-chart-axis: #b9c0cb;

  /* ダッシュボードで足すもの（DS の値から作る） */
  --pr-merged: var(--ds-syn-keyword);
  --cmp-bg: #e7ebf0;
}
:root[data-theme="dark"] {
  --ds-bg: #111318;
  --ds-bg-2: #15181e;
  --ds-surface: #171a21;
  --ds-surface-2: #1d212a;
  --ds-surface-3: #272c37;
  --ds-border: #2b313c;
  --ds-border-2: #6f7889;
  --ds-text: #e6e9ef;
  --ds-text-2: #c4cad5;
  --ds-muted: #98a1b2;
  --ds-faint: #7f889a;
  --ds-accent: #7eaaff;
  --ds-accent-strong: #a9c4ff;
  --ds-accent-soft: rgb(126 170 255 / 12%);
  --ds-accent-line: rgb(126 170 255 / 32%);
  --ds-on-accent: #0b0d12;
  --ds-link: #8fb4ff;
  --ds-focus: #8fb4ff;
  --ds-highlight: rgb(250 204 21 / 24%);

  --ds-note: #7eaaff;  --ds-note-bg: rgb(126 170 255 / 10%);  --ds-note-line: rgb(126 170 255 / 28%);  --ds-note-ink: #a9c4ff;
  --ds-tip: #a3acbb;   --ds-tip-bg: rgb(163 172 187 / 9%);    --ds-tip-line: rgb(163 172 187 / 26%);    --ds-tip-ink: #d0d6df;
  --ds-warn: #e0a83a;  --ds-warn-bg: rgb(224 168 58 / 10%);   --ds-warn-line: rgb(224 168 58 / 28%);   --ds-warn-ink: #f5c46b;
  --ds-danger: #ff7a99; --ds-danger-bg: rgb(255 122 153 / 10%); --ds-danger-line: rgb(255 122 153 / 28%); --ds-danger-ink: #ffadc0;
  --ds-ok: #4fd1a5;    --ds-ok-bg: rgb(79 209 165 / 9%);      --ds-ok-line: rgb(79 209 165 / 26%);      --ds-ok-ink: #7ddcbc;
  --ds-syn-keyword: #c4a5ff;

  --ds-shadow-s: 0 1px 2px rgb(0 0 0 / 40%);
  --ds-shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 12px 32px -16px rgb(0 0 0 / 70%);
  --ds-shadow-l: 0 30px 80px -20px rgb(0 0 0 / 80%);
  --ds-series-1: #3987e5; --ds-series-3: #199e70;
  --ds-chart-grid: #252a34; --ds-chart-axis: #4a5262;
  --cmp-bg: #0b0d11;
}

/* 5つの状態 → DS の意味の色の系統 */
[data-st="done"]    { --st: var(--ds-faint);  --st-bg: var(--ds-tip-bg);    --st-line: var(--ds-tip-line);    --st-ink: var(--ds-tip-ink); }
[data-st="doing"]   { --st: var(--ds-accent); --st-bg: var(--ds-accent-soft); --st-line: var(--ds-accent-line); --st-ink: var(--ds-accent-strong); }
[data-st="ready"]   { --st: var(--ds-ok);     --st-bg: var(--ds-ok-bg);     --st-line: var(--ds-ok-line);     --st-ink: var(--ds-ok-ink); }
[data-st="blocked"] { --st: var(--ds-danger); --st-bg: var(--ds-danger-bg); --st-line: var(--ds-danger-line); --st-ink: var(--ds-danger-ink); }
[data-st="unknown"] { --st: var(--ds-warn);   --st-bg: var(--ds-warn-bg);   --st-line: var(--ds-warn-line);   --st-ink: var(--ds-warn-ink); }
[data-st="merge"]   { --st: var(--ds-accent); --st-bg: var(--ds-accent-soft); --st-line: var(--ds-accent-line); --st-ink: var(--ds-accent-strong); }

/* ============================================================
   2. 基本
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--cmp-bg); color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }
body {
  margin: 0; height: 100vh; height: 100dvh; overflow: hidden;
  display: grid; grid-template-rows: auto minmax(0, 1fr);
  background: var(--cmp-bg); color: var(--ds-text);
  font-family: var(--ds-font-sans); font-size: 14px; line-height: 1.6; letter-spacing: .01em;
  -webkit-font-smoothing: antialiased; line-break: strict; overflow-wrap: break-word;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ds-focus); outline-offset: 2px; border-radius: 4px; }
svg.ds-icon { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@keyframes ds-pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- 見比べ用の帯（製品の UI ではない） ---------- */
.cmp {
  display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 4px 12px;
  background: repeating-linear-gradient(135deg, var(--cmp-bg) 0 10px, color-mix(in srgb, var(--cmp-bg) 88%, var(--ds-text)) 10px 11px);
  border-bottom: 1px dashed var(--ds-border-2); font-size: 12px; color: var(--ds-text-2); overflow: hidden;
}
.cmp__name { font-weight: 700; white-space: nowrap; color: var(--ds-text); }
.cmp__name b { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 6px; border-radius: 4px; background: var(--ds-accent); color: var(--ds-on-accent); font-size: 11px; }
.cmp__note { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ds-muted); }
.cmp__ctl { margin-left: auto; display: flex; gap: 8px; flex: none; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--ds-border); border-radius: 6px; background: var(--ds-surface); }
.seg button { border: 0; background: none; padding: 2px 9px; border-radius: 4px; font-size: 12px; font-weight: 650; color: var(--ds-muted); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ds-accent); color: var(--ds-on-accent); }
@media (max-width: 720px) { .cmp__note { display: none; } }

/* ---------- 舞台：PC は全面、スマートフォンは 390px の枠 ---------- */
.stage { min-height: 0; display: grid; }
.device { width: 100%; height: 100%; min-height: 0; }
body[data-device="phone"] .stage { place-items: center; padding: 12px; overflow: auto; }
body[data-device="phone"] .device {
  width: 410px; height: min(864px, calc(100dvh - 34px - 24px));
  border: 10px solid #1c2230; border-radius: 40px; overflow: hidden; box-shadow: var(--ds-shadow-l);
}
.app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ds-bg); container: app / inline-size; }
.app-in { height: 100%; display: grid; grid-template-rows: var(--ds-topbar-h) auto minmax(0, 1fr); }
.app-in > .top { grid-row: 1; } .app-in > .mtabs { grid-row: 2; } .app-in > .main { grid-row: 3; }

/* ============================================================
   3. 上の帯（DS の .ds-topbar）
   ============================================================ */
.top {
  position: relative; z-index: 30; display: flex; align-items: center; gap: 12px; height: var(--ds-topbar-h);
  padding: 0 16px; border-bottom: 1px solid var(--ds-border);
  background: color-mix(in srgb, var(--ds-bg) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.brand__mark { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--ds-accent); color: var(--ds-on-accent); font-size: 12px; font-weight: 700; }
.repo-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--ds-border); border-radius: 8px; background: var(--ds-surface); color: var(--ds-text); font-size: 13px; font-weight: 650; cursor: pointer; max-width: 200px; }
.repo-btn:hover { border-color: var(--ds-border-2); background: var(--ds-surface-2); }
.repo-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.repo-btn .ds-icon { color: var(--ds-muted); font-size: 15px; }
.tabs { display: flex; align-self: stretch; gap: 2px; margin-left: 6px; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 0; background: none; color: var(--ds-muted); font-size: 14.5px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.tab .ds-icon { font-size: 16px; }
.tab:hover { color: var(--ds-text); }
.tab[aria-selected="true"] { color: var(--ds-accent-strong); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 2px; background: var(--ds-accent); }
.top__right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search { position: relative; display: flex; align-items: center; }
.search .ds-icon { position: absolute; left: 9px; color: var(--ds-muted); font-size: 15px; pointer-events: none; }
.search input { width: 220px; height: 32px; padding: 0 10px 0 30px; border: 1px solid var(--ds-border); border-radius: 8px; background: var(--ds-surface-2); color: var(--ds-text); font: inherit; font-size: 13px; }
.search input::placeholder { color: var(--ds-faint); }
.search input:focus { outline: 2px solid var(--ds-focus); outline-offset: 0; background: var(--ds-surface); }
.iconbtn { position: relative; display: inline-grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--ds-text-2); cursor: pointer; font-size: 18px; }
.iconbtn:hover { background: var(--ds-surface-2); color: var(--ds-text); }
.iconbtn .num { position: absolute; top: 2px; right: 0; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--ds-accent); color: var(--ds-on-accent); font-size: 10.5px; font-weight: 700; line-height: 17px; box-shadow: 0 0 0 2px var(--ds-bg); }
.status { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--ds-border); border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--ds-muted); white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ds-ok); }
.status[data-state="stale"]::before { background: var(--ds-warn); }
.mtabs { display: none; }
.msearch { display: none; }

/* ============================================================
   4. 部品（DS の部品を写したもの）
   ============================================================ */
.ds-docid { display: inline-block; font-family: var(--ds-font-mono); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; padding: 1px 7px; border-radius: 4px; color: var(--ds-accent-strong); background: var(--ds-accent-soft); border: 1px solid var(--ds-accent-line); white-space: nowrap; line-height: 1.5; }
.ds-badge { --tone-bg: var(--ds-surface-2); --tone-line: var(--ds-border); --tone-ink: var(--ds-text-2); display: inline-flex; align-items: center; gap: .3em; padding: .1em .6em; border-radius: 4px; border: 1px solid var(--tone-line); background: var(--tone-bg); color: var(--tone-ink); font-size: .75rem; font-weight: 650; line-height: 1.55; white-space: nowrap; }
.ds-badge[data-tone="accent"] { --tone-bg: var(--ds-accent-soft); --tone-line: var(--ds-accent-line); --tone-ink: var(--ds-accent-strong); }
.ds-badge[data-tone="warning"] { --tone-bg: var(--ds-warn-bg); --tone-line: var(--ds-warn-line); --tone-ink: var(--ds-warn-ink); }
.ds-badge[data-tone="danger"] { --tone-bg: var(--ds-danger-bg); --tone-line: var(--ds-danger-line); --tone-ink: var(--ds-danger-ink); }
.ds-badge .ds-icon { font-size: 1.05em; }
.chip { display: inline-flex; align-items: center; gap: .35em; padding: .08em .55em .08em .4em; border-radius: 4px; background: var(--st-bg); color: var(--st-ink); border: 1px solid var(--st-line); font-size: 12.5px; font-weight: 700; line-height: 1.6; white-space: nowrap; }
.chip .st-ico { width: 13px; height: 13px; }
.ds-btn { display: inline-flex; align-items: center; gap: .45em; height: 32px; padding: 0 12px; border: 1px solid var(--ds-border); border-radius: 8px; background: var(--ds-surface); color: var(--ds-text-2); font-size: 13px; font-weight: 600; line-height: 1; cursor: pointer; white-space: nowrap; text-decoration: none; }
.ds-btn:hover { border-color: var(--ds-border-2); color: var(--ds-text); background: var(--ds-surface-2); }
.ds-btn .ds-icon { font-size: 15px; }
.ds-btn.is-primary { background: var(--ds-accent); border-color: var(--ds-accent); color: var(--ds-on-accent); }
.ds-btn.is-primary:hover { background: var(--ds-accent-strong); }
.ds-callout { --tone: var(--ds-note); --tone-bg: var(--ds-note-bg); --tone-line: var(--ds-note-line); --tone-ink: var(--ds-note-ink); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; padding: 12px 16px 13px 12px; border: 1px solid var(--tone-line); border-left: 4px solid var(--tone); border-radius: var(--ds-radius); background: var(--tone-bg); }
.ds-callout[data-tone="warning"] { --tone: var(--ds-warn); --tone-bg: var(--ds-warn-bg); --tone-line: var(--ds-warn-line); --tone-ink: var(--ds-warn-ink); }
.ds-callout[data-tone="tip"] { --tone: var(--ds-tip); --tone-bg: var(--ds-tip-bg); --tone-line: var(--ds-tip-line); --tone-ink: var(--ds-tip-ink); }
.ds-callout__icon { grid-row: span 2; padding-top: .2em; color: var(--tone); font-size: 18px; line-height: 1; }
.ds-callout__title { margin: 0; font-weight: 700; color: var(--tone-ink); font-size: .95em; }
.ds-callout__body { margin: 0; font-size: .92em; color: var(--ds-text); }
.ds-tabs__list { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--ds-border); scrollbar-width: none; }
.ds-tabs__tab { position: relative; flex: none; padding: 9px 14px 10px; border: 0; background: none; color: var(--ds-muted); font-size: 14.5px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.ds-tabs__tab:hover { color: var(--ds-text); }
.ds-tabs__tab[aria-selected="true"] { color: var(--ds-accent-strong); }
.ds-tabs__tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 2px; background: var(--ds-accent); }
.ds-tabs__tab small { margin-left: 4px; color: var(--ds-faint); font-weight: 600; }
.ds-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); gap: 10px; }
.ds-metric { padding: 12px 14px; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l); background: var(--ds-surface); text-align: left; }
.ds-metric__label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; color: var(--ds-muted); }
.ds-metric__value { margin-top: 2px; font-size: 1.7rem; line-height: 1.2; font-weight: 750; letter-spacing: -.01em; color: var(--ds-text); font-variant-numeric: tabular-nums; }
.ds-metric__unit { margin-left: 2px; font-size: .5em; font-weight: 650; color: var(--ds-muted); }
.ds-metric[data-st] { border-top: 3px solid var(--st); }
button.ds-metric { font: inherit; color: inherit; cursor: pointer; }
button.ds-metric:hover { border-color: var(--ds-border-2); }
.ds-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; line-height: 1.6; border: 1px solid var(--ds-border); border-radius: var(--ds-radius); overflow: hidden; }
.ds-table th, .ds-table td { padding: .6em .9em; text-align: left; vertical-align: top; border-bottom: 1px solid var(--ds-border); }
.ds-table th { background: var(--ds-surface-2); color: var(--ds-text); font-size: .9em; font-weight: 700; white-space: nowrap; }
.ds-table tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--ds-surface-2) 55%, transparent); }
.ds-table tbody tr:last-child td { border-bottom: 0; }
h2.sec { display: flex; align-items: center; gap: .6em; margin: 28px 0 12px; padding-bottom: .5em; border-bottom: 1px solid var(--ds-border); font-size: 1.15rem; line-height: 1.45; font-weight: 700; }
h2.sec .n { flex: none; display: inline-grid; place-items: center; min-width: 1.75em; height: 1.75em; padding: 0 .3em; border-radius: 6px; background: var(--ds-accent); color: var(--ds-on-accent); font-size: .78em; font-weight: 700; font-variant-numeric: tabular-nums; }
h2.sec .aside { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--ds-muted); }
a.lnk { color: var(--ds-link); text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: .22em; }
.mono { font-family: var(--ds-font-mono); font-size: .92em; }

/* ============================================================
   5. 状態などの印（ダッシュボードで足す部品）
   ============================================================ */
.st-ico { width: 15px; height: 15px; flex: none; color: var(--st); }
.st-ico .on { stroke: var(--ds-bg); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.as { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 11px; }
.as i { width: 3px; border-radius: 1px; background: var(--ds-surface-3); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ds-border-2) 45%, transparent); }
.as i:nth-child(1) { height: 4px; } .as i:nth-child(2) { height: 6.5px; } .as i:nth-child(3) { height: 9px; } .as i:nth-child(4) { height: 11px; }
.as i.f { background: var(--ds-text-2); box-shadow: none; }
.as[data-lv="4"] i.f { background: var(--ds-danger); }
.pr { display: inline-flex; align-items: center; gap: 3px; }
.pr .ds-icon { font-size: 13px; stroke-width: 2.2; }
.pr[data-pr="open"] .ds-icon { color: var(--ds-ok); }
.pr[data-pr="draft"] .ds-icon { color: var(--ds-muted); stroke-dasharray: 2.4 2.2; }
.pr[data-pr="merged"] .ds-icon { color: var(--pr-merged); }
.pr[data-pr="closed"] .ds-icon { color: var(--ds-danger); }
.ci { display: inline-block; width: 8px; height: 8px; flex: none; }
.ci[data-ci="success"] { border-radius: 50%; background: var(--ds-ok); }
.ci[data-ci="failure"] { border-radius: 1.5px; background: var(--ds-danger); }
.ci[data-ci="running"] { border-radius: 50%; border: 2px solid var(--ds-warn); animation: ds-pulse 1.1s infinite; }
.mg { display: inline-flex; font-size: 12px; }
.mg[data-mg="ok"] { color: var(--ds-ok); }
.mg[data-mg="conflict"] { color: var(--ds-danger); }
.mg .ds-icon { stroke-width: 2.4; }
.wt { display: inline-flex; color: var(--ds-muted); font-size: 13px; }
.stg { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 3px; border-radius: 4px; border: 1.5px solid var(--ds-border-2); color: var(--ds-text-2); font-size: 10.5px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.chg { position: absolute; top: -5px; right: -5px; width: 11px; height: 11px; border-radius: 50%; background: var(--ds-accent); box-shadow: 0 0 0 2.5px var(--ds-bg); }
.cln { display: inline-flex; color: var(--ds-warn); font-size: 14px; }
.sbar { display: inline-flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--ds-surface-3); flex: none; }
.sbar > i { display: block; height: 100%; background: var(--st); }
.sbar > i[data-st="done"] { background: var(--ds-tip); }
.cnts { display: inline-flex; gap: 8px; align-items: center; }
.cnt { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--st-ink); font-variant-numeric: tabular-nums; }
.cnt .st-ico { width: 12px; height: 12px; }
.frac { font-size: 12px; font-weight: 700; color: var(--ds-text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.frac small { font-weight: 600; color: var(--ds-faint); }
.ring { --p: 0; width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--ds-tip) calc(var(--p) * 1%), var(--ds-surface-3) 0); display: grid; place-items: center; flex: none; }
.ring::after { content: attr(data-label); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ds-surface); font-size: 11px; font-weight: 700; color: var(--ds-text-2); font-variant-numeric: tabular-nums; }

/* ============================================================
   6. 構造の図
   ============================================================ */
.main { position: relative; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.main.is-graph { overflow: hidden; }
.gx-view { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background-color: var(--ds-bg-2);
  background-image: radial-gradient(color-mix(in srgb, var(--ds-border-2) 28%, transparent) 1px, transparent 1.2px); background-size: 22px 22px; }
.gx-view.is-drag { cursor: grabbing; }
.gx-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: flex; flex-direction: column; gap: 28px; padding: 64px 24px 24px; width: max-content; }
.gx-edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 5; }
/* 依存の線：水平と垂直の線分、角は小さな R。交差は下の線を背景色で切る */
.gx-edges .e { --ln: var(--ds-border-2); }
.gx-edges .e .ln { fill: none; stroke: var(--ln); stroke-width: 1.6; stroke-linecap: butt; }
.gx-edges .e .ah { fill: var(--ln); stroke: none; }
.gx-edges .e.is-done { --ln: var(--ds-faint); }
.gx-edges .e.is-done .ln { stroke-width: 1.2; stroke-dasharray: 4 3; }
.gx-edges .e.is-p1 { --ln: var(--ds-accent); }
.gx-edges .e.is-p1 .ln { stroke-width: 3; }
.gx-edges .e.is-p2 { --ln: var(--edge-p2); }
.gx-edges .e.is-p2 .ln { stroke-width: 2; }
.gx-edges .e.is-off { opacity: .16; }
.gx-edges.is-hl .e { opacity: .35; }
.gx-edges .cut { fill: var(--ds-bg-2); }
.gx-edges .cut.is-epic { fill: var(--ds-surface); }
.gx-edges .cut.is-ini { fill: color-mix(in srgb, var(--ds-surface) 55%, var(--ds-bg-2)); }
.gx-edges .cut.is-done { fill: var(--ds-surface-2); }

.gx-frame { position: relative; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l); }
.gx-ini { border-top: 4px solid var(--ds-accent); background: color-mix(in srgb, var(--ds-surface) 55%, var(--ds-bg-2)); padding: 12px 16px 16px; }
.gx-epic { background: var(--ds-surface); padding: 9px 12px 12px; box-shadow: var(--ds-shadow-s); }
.gx-epic.is-compact { width: 236px; }
.gx-frame[data-st="done"] { background: var(--ds-surface-2); }
.gx-fh { display: flex; align-items: center; gap: 7px; min-width: 0; cursor: pointer; }
.gx-kicker { font-size: 11.5px; font-weight: 700; color: var(--ds-accent-strong); letter-spacing: .04em; }
.gx-fttl { min-width: 0; font-weight: 700; color: var(--ds-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gx-ini > .gx-fh .gx-fttl { font-size: 16px; max-width: 46ch; }
.gx-epic > .gx-fh .gx-fttl { font-size: 13.5px; max-width: 34ch; }
.gx-epic.is-compact > .gx-fh { align-items: flex-start; }
.gx-epic.is-compact > .gx-fh .gx-fttl { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.45; }
.gx-fm { display: flex; align-items: center; gap: 10px; margin-top: 6px; min-height: 18px; }
.gx-body { margin-top: 12px; }
.gx-wrap { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; max-width: 1240px; }
.gx-cols { display: flex; gap: 44px; align-items: flex-start; }
.gx-col { display: flex; flex-direction: column; gap: 12px; }
.gx-frame.is-sel { box-shadow: 0 0 0 3px var(--ds-accent), 0 0 0 8px color-mix(in srgb, var(--ds-accent) 20%, transparent), var(--ds-shadow-l); }
.gx-frame.is-dim > .gx-fh, .gx-frame.is-dim > .gx-fm { opacity: .3; }

.gx-box {
  position: relative; width: 178px; padding: 7px 10px 8px 11px;
  border: 1px solid var(--ds-border); border-left: 4px solid var(--st); border-radius: var(--ds-radius);
  background: var(--ds-surface); cursor: pointer; box-shadow: var(--ds-shadow-s);
  transition: box-shadow .15s, opacity .2s, transform .15s var(--ds-ease);
}
.gx-box:hover { box-shadow: var(--ds-shadow); }
.gx-box[data-st="doing"] { background: var(--ds-accent-soft); border-color: var(--ds-accent-line); border-left-color: var(--st); }
.gx-box[data-st="blocked"], .card[data-st="blocked"] { border-left-color: transparent; }
.gx-box[data-st="blocked"] { background: var(--ds-surface-2); }
.gx-box[data-st="blocked"]::before, .card[data-st="blocked"]::before { content: ""; position: absolute; left: -4px; top: -1px; bottom: -1px; width: 4px; border-radius: 6px 0 0 6px; background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--st) 80%, transparent) 0 3px, color-mix(in srgb, var(--st) 22%, transparent) 3px 6px); }
.gx-box[data-st="unknown"] { background: var(--ds-warn-bg); border-style: dashed; border-color: var(--ds-warn-line); border-left: 4px solid var(--st); }
.gx-box[data-st="done"] { background: var(--ds-surface-2); }
.gx-box[data-st="done"] .gx-ttl { color: var(--ds-muted); }
.gx-box.is-sel, .gx-box.is-sel:hover { box-shadow: 0 0 0 3px var(--ds-accent), 0 0 0 8px color-mix(in srgb, var(--ds-accent) 20%, transparent), var(--ds-shadow-l); }
.gx-box.is-dim { opacity: .26; }
.gx-box.is-hl { box-shadow: 0 0 0 2px var(--st), var(--ds-shadow); }
/* 選んだ箱の依存の道筋：箱は「選んだもの」だけを縁と影で際立たせる。関係する箱は普段のまま、関係のない箱は淡く。
   上流・下流と、直接・間接は線の太さと濃さで示す。状態の印の目立たせより、選んだときの見え方を先にする */
.gx-world.has-path .gx-box.is-dim, .gx-world.has-path .gx-clean { opacity: 1; }
.gx-world.has-path .gx-frame.is-dim > .gx-fh, .gx-world.has-path .gx-frame.is-dim > .gx-fm { opacity: 1; }
.gx-world.has-path .gx-box.is-hl:not(.is-sel) { box-shadow: var(--ds-shadow-s); }
.gx-world.has-path .gx-box.is-poff, .gx-world.has-path .gx-clean.is-poff { opacity: .3; }
.gx-world.has-path .gx-frame.is-poff > .gx-fh, .gx-world.has-path .gx-frame.is-poff > .gx-fm { opacity: .35; }
.rt { display: none; position: absolute; z-index: 2; top: -9px; left: -9px; height: 18px; padding: 0 6px 0 4px; gap: 3px; align-items: center; border-radius: 999px; background: var(--ds-text); color: var(--ds-bg); font-size: 10.5px; font-weight: 700; line-height: 1; white-space: nowrap; box-shadow: 0 0 0 2px var(--ds-bg); }
.rt .ds-icon { font-size: 12px; }
.rt .ds-icon { stroke-width: 2.4; }
.is-root > .rt { display: inline-flex; }
.gx-frame > .rt { top: -10px; left: -10px; }
.lg-rt { position: static; display: inline-flex; box-shadow: none; }
/* 後に続く数 */
.dn { display: inline-flex; align-items: center; gap: 2px; padding: 0 5px 0 3px; height: 17px; border-radius: 4px; background: var(--ds-surface-2); border: 1px solid var(--ds-border); color: var(--ds-text-2); font-size: 11px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dn .ds-icon { font-size: 12px; stroke-width: 2.2; color: var(--ds-muted); }
.gx-marks .dn { margin-left: auto; }
/* 畳んだ片付けの候補 */
.gx-clean { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 8px; border: 1px dashed var(--ds-warn-line); border-radius: 6px; background: var(--ds-warn-bg); color: var(--ds-warn-ink); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; align-self: flex-start; }
.gx-clean .ds-icon { font-size: 14px; color: var(--ds-warn); }
.gx-clean b { font-size: 13.5px; font-variant-numeric: tabular-nums; }
.gx-clean:hover { border-style: solid; }
.gx-r1 { display: flex; align-items: center; gap: 5px; min-height: 18px; }
.gx-id { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 700; color: var(--ds-text-2); }
.gx-no { font-size: 11px; color: var(--ds-faint); font-variant-numeric: tabular-nums; }
.gx-r1 .stg { margin-left: auto; }
.gx-ttl { margin-top: 3px; font-size: 12.5px; font-weight: 650; line-height: 1.45; color: var(--ds-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: auto-phrase; }
.gx-marks { display: flex; align-items: center; gap: 9px; margin-top: 6px; min-height: 13px; }

.gx-bar { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px; pointer-events: none; }
.gx-bar > * { pointer-events: auto; }
.gx-tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.tool { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--ds-border); border-radius: 8px; background: color-mix(in srgb, var(--ds-surface) 92%, transparent); color: var(--ds-text-2); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgb(16 24 40 / 8%); white-space: nowrap; }
.tool:hover { color: var(--ds-text); border-color: var(--ds-border-2); }
.tool .ds-icon { font-size: 15px; }
.tool[aria-pressed="true"] { background: var(--ds-accent-soft); border-color: var(--ds-accent-line); color: var(--ds-accent-strong); }
.tool.is-icon { width: 32px; padding: 0; justify-content: center; }
.tool-group { display: inline-flex; }
.tool-group .tool { border-radius: 0; margin-left: -1px; }
.tool-group .tool:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.tool-group .tool:last-child { border-radius: 0 8px 8px 0; }
.zoomval { min-width: 46px; justify-content: center; font-variant-numeric: tabular-nums; }

.gx-next { display: flex; gap: 6px; flex-wrap: wrap; }
.nx { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px 0 9px; border: 1px solid var(--st-line); border-left: 4px solid var(--st); border-radius: 6px; background: color-mix(in srgb, var(--ds-surface) 94%, transparent); color: var(--ds-text); font-size: 12.5px; font-weight: 650; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 8px rgb(16 24 40 / 6%); }
.nx b { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--st-ink); }
.nx[aria-pressed="true"] { background: var(--st-bg); box-shadow: 0 0 0 2px var(--st); }
.nx .ds-icon { font-size: 14px; stroke-width: 2.4; }
.nx[data-hl="ok"] .ds-icon { color: var(--ds-ok); }
.nx[data-hl="fix"] .ds-icon { color: var(--ds-danger); }
.nx-grp { display: inline-flex; align-items: center; gap: 4px; padding: 0 3px 0 8px; height: 32px; border: 1px solid var(--ds-accent-line); border-left: 4px solid var(--ds-accent); border-radius: 6px; background: color-mix(in srgb, var(--ds-surface) 94%, transparent); box-shadow: 0 2px 8px rgb(16 24 40 / 6%); }
.nx-grp__lab { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--ds-accent-strong); white-space: nowrap; margin-right: 2px; }
.nx-grp__lab .ds-icon { font-size: 14px; color: var(--ds-ok); stroke-width: 2.2; }
.nx-grp .nx { height: 24px; border: 1px solid var(--ds-border); border-radius: 4px; padding: 0 8px 0 6px; box-shadow: none; font-size: 12px; }
.nx-grp .nx[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ds-accent); background: var(--ds-accent-soft); }

.legend { position: absolute; left: 12px; bottom: 12px; z-index: 10; display: flex; align-items: flex-start; max-width: calc(100% - 24px); border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l); background: color-mix(in srgb, var(--ds-surface) 95%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: var(--ds-shadow); font-size: 12px; }
.legend__head { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border: 0; background: none; font-weight: 700; font-size: 12.5px; color: var(--ds-text); cursor: pointer; text-align: left; white-space: nowrap; }
.legend__head .ds-icon:last-child { color: var(--ds-muted); transition: transform .2s; transform: rotate(90deg); }
.legend[data-open="false"] .legend__head .ds-icon:last-child { transform: rotate(-90deg); }
.legend[data-open="false"] .legend__body { display: none; }
.legend__body { display: flex; flex-wrap: wrap; gap: 4px 0; padding: 6px 12px 7px 0; min-width: 0; }
.lg-grp { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; padding: 0 12px; border-left: 1px solid var(--ds-border); }
.legend h4 { margin: 0; font-size: 11px; font-weight: 700; color: var(--ds-muted); letter-spacing: .04em; white-space: nowrap; }
.legend ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.legend li { display: flex; align-items: center; gap: 5px; min-height: 20px; color: var(--ds-text-2); white-space: nowrap; }
.legend li > :first-child { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 16px; gap: 2px; }
.lg-line { width: 26px; height: 0; border-top: 1.6px solid var(--ds-border-2); position: relative; }
.lg-line.is-done { border-top: 1.2px dashed var(--ds-faint); }
.lg-line.is-p1 { border-top: 3px solid var(--ds-accent); }
.lg-line.is-p2 { border-top: 2px solid var(--edge-p2); }
.lg-line.is-off { border-top-color: var(--ds-border-2); opacity: .3; }
.lg-box { width: 18px; height: 12px; margin: 0 3px; border-radius: 3px; background: var(--ds-surface); border: 1px solid var(--ds-border); }
.lg-box.is-sel { box-shadow: 0 0 0 2px var(--ds-accent), 0 0 0 4px color-mix(in srgb, var(--ds-accent) 20%, transparent); }
.lg-box.is-off { opacity: .35; }
.lg-chg { position: relative; width: 11px; height: 11px; border-radius: 50%; background: var(--ds-accent); }

/* ============================================================
   7. 要点の欄（PC は右、スマートフォンは下から）
   ============================================================ */
.panel { position: absolute; z-index: 25; top: calc(var(--ds-topbar-h) + 10px); right: 10px; bottom: 10px; width: 372px; display: flex; flex-direction: column; border: 1px solid var(--ds-border); border-top: 4px solid var(--st, var(--ds-accent)); border-radius: var(--ds-radius-l); background: var(--ds-surface); box-shadow: var(--ds-shadow-l); transform: translateX(calc(100% + 24px)); transition: transform .26s var(--ds-ease); }
.panel.is-open { transform: none; }
.pn-grab { display: none; }
.pn-head { display: flex; align-items: center; gap: 8px; padding: 12px 10px 0 16px; }
.pn-head .iconbtn { margin-left: auto; width: 32px; height: 32px; font-size: 16px; }
.pn-body { padding: 8px 16px 16px; overflow: auto; flex: 1; }
.pn-kicker { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0; font-size: 12.5px; color: var(--ds-muted); }
.pn-title { margin: 6px 0 0; font-size: 17px; line-height: 1.5; font-weight: 700; word-break: auto-phrase; text-wrap: pretty; }
.pn-why { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0 0; padding: 8px 12px; border-left: 4px solid var(--st); border-radius: 6px; background: var(--st-bg); color: var(--ds-text); font-size: 13px; font-weight: 600; }
.pn-why .st-ico { margin-top: 3px; }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; margin: 12px 0 0; font-size: 12.5px; color: var(--ds-muted); }
.path button { border: 0; background: none; padding: 1px 4px; border-radius: 4px; color: var(--ds-link); cursor: pointer; font-size: 12.5px; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: .2em; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.path .ds-icon { font-size: 12px; color: var(--ds-faint); }
.kv { margin: 14px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; font-size: 13px; line-height: 1.55; padding: 12px 14px; border-radius: var(--ds-radius); background: var(--ds-bg-2); border: 1px solid var(--ds-border); }
.kv dt { color: var(--ds-muted); white-space: nowrap; }
.kv dd { margin: 0; color: var(--ds-text); font-weight: 650; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
.kv dd .mono { font-weight: 600; overflow-wrap: anywhere; }
.pn-stats { margin-top: 14px; }
.pn-stats .sbar { width: 100%; height: 8px; }
.pn-stats ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.pn-stats li { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ds-text-2); }
.pn-stats li b { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ds-text); }
.pn-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--ds-border); }
.pn-foot .is-primary { flex: 1; justify-content: center; }

/* ============================================================
   8. 本文の画面（ボード・時間の軸・詳しい画面・概況）
   ============================================================ */
.page { max-width: var(--ds-wide-max); margin: 0 auto; padding: 20px 24px 64px; }
.page-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 14px; }
.page-head h1 { margin: 0; font-size: 1.35rem; line-height: 1.4; font-weight: 700; }
.page-head p { margin: 0; color: var(--ds-muted); font-size: 13px; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 16px 0 14px; }
.ctl label.tg { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ds-text-2); cursor: pointer; }
.ctl input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--ds-accent); margin: 0; }
.seg2 { display: inline-flex; border: 1px solid var(--ds-border); border-radius: 8px; overflow: hidden; background: var(--ds-surface); }
.seg2 button { border: 0; border-left: 1px solid var(--ds-border); background: none; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ds-muted); cursor: pointer; }
.seg2 button:first-child { border-left: 0; }
.seg2 button[aria-pressed="true"] { background: var(--ds-accent-soft); color: var(--ds-accent-strong); box-shadow: inset 0 -3px 0 var(--ds-accent); }
.board-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: stretch; }
.cleanup { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--ds-warn-line); border-left: 4px solid var(--ds-warn); border-radius: var(--ds-radius); background: var(--ds-warn-bg); color: var(--ds-warn-ink); cursor: pointer; font-size: 13px; font-weight: 700; text-align: left; }
.cleanup b { font-size: 1.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.cleanup .ds-icon { font-size: 20px; }
.cleanup small { display: block; font-weight: 600; color: var(--ds-text-2); font-size: 11.5px; }
.ratio { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l); background: var(--ds-surface); }
.ratio p { margin: 0; font-size: 12.5px; color: var(--ds-muted); font-weight: 650; }
.ratio p b { display: block; font-size: 1.1rem; color: var(--ds-text); }
.cols { display: grid; grid-template-columns: repeat(var(--ncol, 4), minmax(0, 1fr)); gap: 12px; align-items: start; }

function fmtTime(iso) { const d = new Date(iso + (iso.length === 16 ? ":00Z" : "")); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }

function build(name, raw, smp) {
  const M = new Map();
  raw.forEach(r => M.set(r.n, Object.assign({}, r, {
    kids: [], ip: (smp.ip || []).includes(r.n), anom: (smp.anom || {})[r.n] || null,
    pr: (smp.pr || {})[r.n] || null, as: (smp.as || {})[r.n] || "standard", chg: (smp.chg || {})[r.n] || null
  })));
  M.forEach(x => { if (x.p && M.has(x.p)) M.get(x.p).kids.push(x.n); else x.p = null; });
  const get = n => M.get(n);
  const isOpen = n => M.has(n) && !M.get(n).closed;
  M.forEach(x => { x.anc = []; let p = x.p; while (p) { const y = get(p); x.anc.push(y); p = y.p; } });
  const desc = x => x.kids.flatMap(k => [get(k), ...desc(get(k))]);
  M.forEach(x => { x.desc = desc(x); });
  M.forEach(x => {
    x.waits = x.bb.filter(isOpen);
    const doingKids = x.desc.filter(d => d.ip && !d.closed);
    if (x.closed) { x.st = "done"; x.why = x.xa ? `${fmtDay(x.xa)}に終わった` : "終わった"; }
    else if (x.anom) { x.st = "unknown"; x.why = x.anom; }
    else if (x.ip || doingKids.length) {
      x.st = "doing";
      x.why = x.ip ? (x.pr ? `PR #${x.pr.no} が${PRW[x.pr.st]}` : "worktree で作業している（PR はまだない）") : `配下の ${doingKids.length}件が作業中`;
    } else {
      const cl = x.anc.find(a => a.closed);
      const ad = x.anc.find(a => a.bb.some(isOpen));
      if (cl) { x.st = "blocked"; x.why = `親 ${cl.id} が閉じている`; }
      else if (x.waits.length) { x.st = "blocked"; x.why = x.waits.map(n => "#" + n).join("・") + " を待つ"; }
      else if (ad) { x.st = "blocked"; x.why = `上位の ${ad.id} が ${ad.bb.filter(isOpen).map(n => "#" + n).join("・")} を待つ`; }
      else { x.st = "ready"; x.why = "待っているものはない"; }
    }
    // マージ待ち：作業中で、下書きでない PR が開いている。CI の失敗か衝突があれば「直す必要あり」、なければ「マージできる」
    x.merge = x.k === "iss" && x.st === "doing" && x.pr && x.pr.st === "open" ? (x.pr.ci === "failure" || x.pr.mg === "conflict" ? "fix" : "ok") : null;
    if (x.merge === "fix") x.why = `PR #${x.pr.no} を直す必要がある（${[x.pr.ci === "failure" ? "CI が失敗" : "", x.pr.mg === "conflict" ? "衝突" : ""].filter(Boolean).join("・")}）`;
    else if (x.merge === "ok") x.why = `PR #${x.pr.no} をマージできる${x.pr.ci === "running" ? "（CI は実行中）" : ""}`;
    x.branch = x.ip ? `chemitaro/${x.id}` : null;
  });
  // 配下の数（埋め込みで省いた終わったものも足す）
  M.forEach(x => {
    const c = { done: x.om || 0, doing: 0, ready: 0, blocked: 0, unknown: 0 };
    x.desc.forEach(d => c[d.st]++);
    x.cnt = c; x.total = x.desc.length + (x.om || 0);
  });
  // 段（同じ親の中の作業の順番）
  const sib = x => (x.p ? get(x.p).kids : [...M.keys()].filter(n => !get(n).p));
  const memo = new Map(), memoO = new Map();
  const stage = (x, openOnly) => {
    const m = openOnly ? memoO : memo; if (m.has(x.n)) return m.get(x.n);
    m.set(x.n, 1);
    const s = sib(x);
    const deps = x.bb.filter(b => s.includes(b) && M.has(b) && (!openOnly || isOpen(b)));
    const v = 1 + Math.max(0, ...deps.map(b => stage(get(b), openOnly)));
    m.set(x.n, v); return v;
  };
  M.forEach(x => { x.stage = stage(x, false); x.ostage = x.closed ? 1 : stage(x, true); });
  M.forEach(x => {
    const ks = x.kids.map(get).filter(k => !k.closed);
    x.maxO = Math.max(1, ...ks.map(k => k.ostage));
  });
  M.forEach(x => { x.blocking = [...M.values()].filter(y => y.bb.includes(x.n)).map(y => y.n); });
  // まだ終わっていない待ち先（自分と祖先の blocked_by の先で開いているもの）
  M.forEach(x => { x.blk = [...new Set([x, ...x.anc].flatMap(a => a.bb.filter(isOpen)))]; });
  // 後に続く数：x を直接・間接に待っている開いた Scope の数。
  //   y.bb に u があれば y は u を待つ。y の配下も y と一緒に待つ。祖先は子より後に終わるので、祖先を待つものも子を待つ。
  M.forEach(x => {
    if (x.closed) { x.down = 0; return; }
    const seen = new Set(), out = new Set(), q = [];
    const pass = u => { if (u.closed || seen.has(u.n)) return; seen.add(u.n); q.push(u); };
    pass(x); x.anc.forEach(pass);
    while (q.length) {
      const u = q.pop();
      u.blocking.forEach(m => { const y = get(m); [y, ...y.desc].forEach(z => { if (z.closed) return; out.add(z.n); pass(z); z.anc.forEach(pass); }); });
    }
    out.delete(x.n); x.anc.forEach(a => out.delete(a.n));
    x.down = out.size;
  });
  // 片付けの候補
  const cleanup = [];
  M.forEach(x => {
    if (x.closed) return;
    if (x.k !== "iss" && x.total > 0 && x.cnt.done === x.total) cleanup.push({ x, why: `配下の ${x.total}件がすべて終わったのに、開いたまま` });
    const cp = x.p && get(x.p).closed ? get(x.p) : null;
    if (cp) cleanup.push({ x, why: `閉じた親 ${cp.id} の下で開いている` });
  });
  const list = [...M.values()];
  return { name, M, get, list, cleanup, cleanSet: new Set(cleanup.map(c => c.x.n)), changes: list.filter(x => x.chg),
    roots: list.filter(x => !x.p).sort((a, b) => act(b) - act(a)) };
}
/* 推奨順：マージできる → 直す必要あり → 作業中 → 着手できる → 止められている → 不明 → 終わった。
   作業中・着手できる・マージ待ちは「後に続く」数の多い順、同じなら番号の小さい順。
   止められている は、まだ終わっていない待ち先の数が少ない順（同じなら後に続く数の多い順、番号の小さい順）。 */
const CAT = x => (x.merge === "ok" ? 0 : x.merge === "fix" ? 1 : x.st === "doing" ? 2 : x.st === "ready" ? 3 : x.st === "blocked" ? 4 : x.st === "unknown" ? 5 : 6);

  if (ca === 6) return (b.xa || "").localeCompare(a.xa || "") || a.n - b.n;
  return b.down - a.down || a.n - b.n;
}
function act(x) { const oi = x.desc.filter(d => d.k === "iss" && !d.closed).length; return (x.k === "ini" ? 1e6 : 0) + oi * 1000 + x.cnt.doing * 10 + (x.closed ? 0 : 1); }

function synth(name, o) {
  const base = Date.parse("2026-07-06T09:00:00Z");
  const raw = o.nodes.map(([n, k, t, p, c, bb], i) => {
    const ca = new Date(base + i * 6.5 * 864e5).toISOString().slice(0, 16);
    return { n, id: `${KPRE[k]}-${pad(n)}`, k, t, closed: !!c, p: p || null, bb: bb || [], ca, xa: c ? new Date(base + (i * 6.5 + 9) * 864e5).toISOString().slice(0, 16) : null, om: 0 };
  });

}
function weeksFrom(list) {
  const wk = iso => { const d = new Date(iso + ":00Z"); const day = (d.getUTCDay() + 6) % 7; return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day); };
  const cr = list.map(x => wk(x.ca)), cl = list.filter(x => x.xa).map(x => wk(x.xa));
  const out = []; const end = wk("2026-11-03T10:00");
  for (let w = Math.min(...cr); w <= end; w += 7 * 864e5) out.push([new Date(w).toISOString().slice(0, 10), cr.filter(c => c <= w).length, cl.filter(c => c <= w).length]);
  return out;
}

const REPOS = {};
(function init() {
  const sd = build("spec-dock", RAW.nodes, SD_SAMPLE);

  ev.sort((a, b) => (a.t < b.t ? 1 : -1));

/* ------------------------------------------------------------
   時間の軸
   ------------------------------------------------------------ */
function chartSvg(weeks, W) {
  const H = Math.round(Math.min(300, Math.max(200, W * .42))), L = 38, Rr = 70, T = 14, B = 26;
  const iw = W - L - Rr, ih = H - T - B;
  const max = Math.max(...weeks.map(w => w[1])); const step = max > 200 ? 100 : max > 60 ? 20 : max > 20 ? 5 : 2;
  const ymax = Math.ceil(max / step) * step;
  const X = i => L + (weeks.length > 1 ? i / (weeks.length - 1) * iw : 0), Y = v => T + ih - v / ymax * ih;
  let g = "";
  for (let v = 0; v <= ymax; v += step) g += `<line class="grid" x1="${L}" x2="${L + iw}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  let lastM = -1;
  weeks.forEach((w, i) => { const m = +w[0].slice(5, 7); if (m !== lastM) { lastM = m; g += `<line class="axis" x1="${X(i)}" x2="${X(i)}" y1="${T + ih}" y2="${T + ih + 4}"/><text x="${X(i)}" y="${H - 6}" text-anchor="middle">${m}月</text>`; } });
  const line = k => weeks.map((w, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(w[k]).toFixed(1)}`).join("");
  const area = weeks.map((w, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(w[1]).toFixed(1)}`).join("") + weeks.slice().reverse().map((w, j) => `L${X(weeks.length - 1 - j).toFixed(1)} ${Y(w[2]).toFixed(1)}`).join("") + "Z";
  const last = weeks[weeks.length - 1]; const lx = X(weeks.length - 1);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="週ごとの作成と完了の累計。最新の週は作成 ${last[1]}、完了 ${last[2]}">` +
    `<line class="axis" x1="${L}" x2="${L + iw}" y1="${T + ih}" y2="${T + ih}"/>${g}` +
    `<path d="${area}" style="fill:color-mix(in srgb, var(--ds-series-1) 9%, transparent)"/>` +
    `<path d="${line(1)}" style="fill:none;stroke:var(--ds-series-1)" stroke-width="2.2" stroke-linejoin="round"/>` +
    `<path d="${line(2)}" style="fill:none;stroke:var(--ds-series-3)" stroke-width="2.2" stroke-linejoin="round"/>` +
    `<circle cx="${lx}" cy="${Y(last[1])}" r="3.5" style="fill:var(--ds-series-1)"/><circle cx="${lx}" cy="${Y(last[2])}" r="3.5" style="fill:var(--ds-series-3)"/>` +
    `<text class="lbl" x="${lx + 8}" y="${Y(last[1]) + 4}" style="fill:var(--ds-text)">作成 ${last[1]}</text>` +
    `<text class="lbl" x="${lx + 8}" y="${Math.max(Y(last[2]) + 4, Y(last[1]) + 20)}" style="fill:var(--ds-text)">完了 ${last[2]}</text>` +
    `<line id="hair" class="axis" x1="0" x2="0" y1="${T}" y2="${T + ih}" style="opacity:0"/>` +
    `<rect id="hov" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
}
const EVW = { created: ["sparkle", "が作られた"], closed: ["check", "が終わった"], pr_open: ["branch", "の PR が開いた"], pr_merged: ["merge", "の PR がマージされた"] };

function drawChart() {
  const el = $("#chart"); if (!el) return; const wks = R().weeks;

  const svg = el.querySelector("svg"), hov = el.querySelector("#hov"), hair = el.querySelector("#hair"), tip = el.querySelector("#ctip");
  hov.addEventListener("pointermove", e => {
    const b = svg.getBoundingClientRect(); const sc = svg.viewBox.baseVal.width / b.width;
    const x = (e.clientX - b.left) * sc; const L = 38, iw = svg.viewBox.baseVal.width - 38 - 70;
    const i = Math.max(0, Math.min(wks.length - 1, Math.round((x - L) / iw * (wks.length - 1))));
    const X = L + i / (wks.length - 1) * iw; hair.setAttribute("x1", X); hair.setAttribute("x2", X); hair.style.opacity = 1;
    const w = wks[i]; tip.innerHTML = `${+w[0].slice(5, 7)}月${+w[0].slice(8)}日の週<br>作成 ${w[1]}・完了 ${w[2]}・開いている ${w[1] - w[2]}`;
    tip.style.left = X / sc + "px"; tip.style.top = "40px"; tip.style.opacity = 1;

}

function goto(n) {
  closePop(); sheet.classList.remove("is-open");

  if (S.view === "graph") {
    if (!vis(x)) { S.showDone = true; }
    S.sel = n; render(); requestAnimationFrame(() => centerOn(n));
  } else if (S.view === "board") { S.sel = n; renderPanel(); select(n); }

  if (S.view === "graph") {
    $("#world").querySelectorAll(".gx-box").forEach(el => { const x = R().get(+el.dataset.n); el.classList.toggle("is-dim", !(matches(x) && inHl(x))); el.classList.toggle("is-hl", !!S.hl && matches(x) && inHl(x)); });

}

});

/* ============================================================
   ROUTER：依存の線の直交の経路（DOM を知らない、純粋な計算。製品の静的 JS にそのまま移せる形）
   入力 G = { obs:[{x1,y1,x2,y2,p1,p2,key}], frames:[{x1,y1,x2,y2,cls}], edges:[{a,z}], bounds }
     obs   … 線が通ってはいけない矩形（Issue の箱、枠の見出しと要点の行、畳んだまとまり）。p1–p2 は辺の上で線が出入りしてよい範囲
     edges … a の右の辺から出て、z の左の辺へ入る
   手順（libavoid の考え方を小さくしたもの）
     1. 出入りの位置：1つの辺の線を、相手の高さの順に並べて間隔をあけて割り振る
     2. 直交の可視グラフ：障害物を M0 ふくらませた矩形の辺の座標と出入りの高さで疎な格子を作り、矩形の内側を通る点と辺を除く
     3. A*：長さ＋曲がりの罰則＋枠の出入りの罰則＋既に引いた線との共有・交差の罰則。状態は（点、向き）
     4. nudging：同じ向きの線分のうち、範囲が重なり同じ通り道にあるものを束にし、交差が少なくなる順に並べ、
        車線の間隔 S で通り道の中央に並べる。通り道が狭いときは、広げる量と、その両側の障害物を返す
     5. 描画：角を小さな R で丸め、交差は下の線を背景色で切る
   ============================================================ */
const ROUTER = (() => {
  const C = { M0: 4, M: 10, S: 8, PORT: 10, R: 7, AH: 7, BEND: 40, FRAME: 30, SHARE: 0.6, CROSS: 12, MINSEG: 2 };
  const EPS = 0.01;
  const uniq = a => { a.sort((p, q) => p - q); const o = []; for (const v of a) if (!o.length || v - o[o.length - 1] > EPS) o.push(v); return o; };
  const lb = (arr, v) => { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < v - EPS) lo = m + 1; else hi = m; } return lo; };

  /* 1. 出入りの位置 */
  function assignPorts(G) {
    const sides = new Map();
    const add = (k, it) => { if (!sides.has(k)) sides.set(k, []); sides.get(k).push(it); };
    G.edges.forEach(e => { add(e.a + "R", { e, end: 0 }); add(e.z + "L", { e, end: 1 }); });
    const mid = o => (o.p1 + o.p2) / 2;
    sides.forEach((list, key) => {
      const o = G.obs[parseInt(key, 10)];
      const oth = it => G.obs[it.end ? it.e.a : it.e.z];
      list.sort((p, q) => mid(oth(p)) - mid(oth(q)) || oth(p).x1 - oth(q).x1);
      const k = list.length, room = Math.max(0, o.p2 - o.p1), sp = k > 1 ? Math.min(C.PORT, room / (k - 1)) : 0;
      list.forEach((it, i) => { it.e[it.end ? "y2" : "y1"] = mid(o) + (i - (k - 1) / 2) * sp; it.e[it.end ? "k2" : "k1"] = k; });
    });
    // その辺に線が1本だけなら、相手の高さにそろえて小さな段差をなくす
    G.edges.forEach(e => {
      const A = G.obs[e.a], Z = G.obs[e.z];
      if (e.k1 === 1 && e.y2 >= A.p1 && e.y2 <= A.p2) e.y1 = e.y2;
      else if (e.k2 === 1 && e.y1 >= Z.p1 && e.y1 <= Z.p2) e.y2 = e.y1;
    });
  }

  /* 2. 疎な直交の格子（可視グラフ） */
  function buildGrid(G) {
    const B = G.bounds, M0 = C.M0;
    const inf = G.obs.map(o => ({ x1: Math.max(B.x1, o.x1 - M0), y1: Math.max(B.y1, o.y1 - M0), x2: Math.min(B.x2, o.x2 + M0), y2: Math.min(B.y2, o.y2 + M0) }));
    const xs = [B.x1, B.x2], ys = [B.y1, B.y2];
    inf.forEach(q => { xs.push(q.x1, q.x2); ys.push(q.y1, q.y2); });
    G.edges.forEach(e => ys.push(e.y1, e.y2));
    const X = uniq(xs), Y = uniq(ys), nx = X.length, ny = Y.length, N = nx * ny;
    const vb = new Uint8Array(N), hb = new Uint8Array(N), vl = new Uint8Array(N), fid = new Int16Array(N);
    const rx = inf.map(q => [lb(X, q.x1), lb(X, q.x2)]);
    for (let j = 0; j < ny; j++) {
      const y = Y[j], ym = j < ny - 1 ? (y + Y[j + 1]) / 2 : NaN, row = j * nx;
      for (let t = 0; t < inf.length; t++) {
        const q = inf[t], a = rx[t][0], b = rx[t][1];
        if (q.y1 + EPS < y && y < q.y2 - EPS) { for (let i = a + 1; i < b; i++) vb[row + i] = 1; for (let i = a; i < b; i++) hb[row + i] = 1; }
        if (q.y1 < ym && ym < q.y2) for (let i = a + 1; i < b; i++) vl[row + i] = 1;
      }
    }
    // 各点がどの枠の中か（いちばん内側）。枠を出入りする線に罰則を付けるため
    G.frames.map((f, k) => [f, k]).sort((p, q) => (q[0].x2 - q[0].x1) * (q[0].y2 - q[0].y1) - (p[0].x2 - p[0].x1) * (p[0].y2 - p[0].y1)).forEach(([f, k]) => {
      const a = lb(X, f.x1), b = lb(X, f.x2 + 2 * EPS) - 1, c = lb(Y, f.y1), d = lb(Y, f.y2 + 2 * EPS) - 1;
      for (let j = c; j <= d; j++) for (let i = a; i <= b; i++) fid[j * nx + i] = k + 1;
    });
    return { B, X, Y, nx, ny, N, vb, hb, vl, fid, uh: new Uint16Array(N), uv: new Uint16Array(N), ph: new Uint8Array(N), pv: new Uint8Array(N) };
  }

  /* 3. A*（向きを状態に持ち、曲がりに罰則） */
  function heap() {
    let k = [], v = [];
    return {
      get size() { return k.length; },
      push(key, val) { k.push(key); v.push(val); let i = k.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (k[p] <= k[i]) break; [k[p], k[i]] = [k[i], k[p]]; [v[p], v[i]] = [v[i], v[p]]; i = p; } },
      pop() {
        const top = v[0], lk = k.pop(), lv = v.pop();
        if (k.length) { k[0] = lk; v[0] = lv; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < k.length && k[l] < k[m]) m = l; if (r < k.length && k[r] < k[m]) m = r; if (m === i) break; [k[m], k[i]] = [k[i], k[m]]; [v[m], v[i]] = [v[i], v[m]]; i = m; } }
        return top;
      }
    };
  }
  function routeOne(g, G, e) {
    const A = G.obs[e.a], Z = G.obs[e.z], { X, Y, nx, ny } = g;
    const s = lb(Y, e.y1) * nx + lb(X, Math.min(g.B.x2, A.x2 + C.M0));
    const t = lb(Y, e.y2) * nx + lb(X, Math.max(g.B.x1, Z.x1 - C.M0));
    const NS = g.N * 4;
    if (!g.gs) { g.gs = new Float64Array(NS); g.pr = new Int32Array(NS); g.st = new Uint32Array(NS); g.cl = new Uint32Array(NS); g.run = 0; }
    const run = ++g.run, GV = st => (g.st[st] === run ? g.gs[st] : Infinity);
    const tx = X[t % nx], ty = Y[(t / nx) | 0];
    const H = v => Math.abs(X[v % nx] - tx) + Math.abs(Y[(v / nx) | 0] - ty);
    const hp = heap(); const s0 = s * 4;
    g.st[s0] = run; g.gs[s0] = 0; g.pr[s0] = -1; hp.push(H(s), s0);
    let best = -1;
    while (hp.size) {
      const st = hp.pop(); if (g.cl[st] === run) continue; g.cl[st] = run;
      const v = st >> 2, d = st & 3;
      if (v === t) { best = st; break; }
      const i = v % nx, j = (v / nx) | 0, gv = g.gs[st];
      for (let nd = 0; nd < 4; nd++) {
        if (nd === (d ^ 1)) continue;   // 逆戻りはしない（0 東, 1 西, 2 南, 3 北）
        let w, len, li;
        if (nd === 0) { if (i >= nx - 1 || g.hb[v]) continue; w = v + 1; len = X[i + 1] - X[i]; li = v; }
        else if (nd === 1) { if (i === 0 || g.hb[v - 1]) continue; w = v - 1; len = X[i] - X[i - 1]; li = v - 1; }
        else if (nd === 2) { if (j >= ny - 1 || g.vl[v]) continue; w = v + nx; len = Y[j + 1] - Y[j]; li = v; }
        else { if (j === 0 || g.vl[v - nx]) continue; w = v - nx; len = Y[j] - Y[j - 1]; li = v - nx; }
        if (g.vb[w] && w !== t) continue;
        let c = len + (nd !== d ? C.BEND : 0) + (g.fid[v] !== g.fid[w] ? C.FRAME : 0);
        c += C.SHARE * len * (nd < 2 ? g.uh[li] : g.uv[li]);
        if (nd < 2 ? g.pv[w] : g.ph[w]) c += C.CROSS;
        if (w === t) c += nd === 0 ? 0 : nd === 1 ? 1e6 : C.BEND;   // 終点の辺へは東向きに入る
        const ns = w * 4 + nd, ng = gv + c;
        if (ng < GV(ns)) { g.st[ns] = run; g.gs[ns] = ng; g.pr[ns] = st; hp.push(ng + H(w), ns); }
      }
    }
    const P = [{ x: A.x2, y: e.y1 }];
    if (best < 0) {   // 見つからないとき（検査で数える）
      const mx = (A.x2 + Z.x1) / 2; P.push({ x: mx, y: e.y1 }, { x: mx, y: e.y2 }, { x: Z.x1, y: e.y2 });
      return { pts: simplify(P), failed: true };
    }
    const vs = []; for (let st = best; st >= 0; st = g.pr[st]) vs.push(st >> 2);
    vs.reverse();
    for (let q = 0; q < vs.length; q++) {
      const v = vs[q]; P.push({ x: X[v % nx], y: Y[(v / nx) | 0] });
      if (q) { const u = vs[q - 1]; if (Math.abs(u - v) === 1) { g.uh[Math.min(u, v)]++; g.ph[u] = g.ph[v] = 1; } else { g.uv[Math.min(u, v)]++; g.pv[u] = g.pv[v] = 1; } }
    }
    P.push({ x: Z.x1, y: e.y2 });
    return { pts: simplify(P), failed: false };
  }
  function simplify(P) {
    const a = [];
    for (const p of P) { const l = a[a.length - 1]; if (l && Math.abs(l.x - p.x) < EPS && Math.abs(l.y - p.y) < EPS) continue; a.push({ x: p.x, y: p.y }); }
    for (let k = a.length - 2; k >= 1; k--) {
      const p = a[k - 1], q = a[k], r = a[k + 1];
      if ((Math.abs(p.x - q.x) < EPS && Math.abs(q.x - r.x) < EPS) || (Math.abs(p.y - q.y) < EPS && Math.abs(q.y - r.y) < EPS)) a.splice(k, 1);
    }
    return a;
  }

  /* 4. nudging：重なる線分を車線に分ける */
  function segs(routes, V) {
    const out = [], oc = V ? "x" : "y", pc = V ? "y" : "x";
    routes.forEach((rt, ri) => {
      const P = rt.pts, n = P.length;
      for (let k = 0; k < n - 1; k++) {
        const p = P[k], q = P[k + 1], isV = Math.abs(p.x - q.x) < EPS;
        if (isV !== V) continue;
        const pos = p[oc], lowP = p[pc] <= q[pc];
        const nP = k > 0 ? Math.sign(P[k - 1][oc] - pos) : 0, nQ = k + 2 < n ? Math.sign(P[k + 2][oc] - pos) : 0;
        out.push({ ri, k, pos, a: Math.min(p[pc], q[pc]), b: Math.max(p[pc], q[pc]), da: lowP ? nP : nQ, db: lowP ? nQ : nP,
          fars: [k > 0 ? P[k - 1][oc] : null, k + 2 < n ? P[k + 2][oc] : null], movable: k > 0 && k < n - 2 });
      }
    });
    return out;
  }
  function range(sg, G, V) {
    let lo = V ? G.bounds.x1 : G.bounds.y1, hi = V ? G.bounds.x2 : G.bounds.y2, lob = -1, hib = -1;
    G.obs.forEach((o, i) => {
      const q1 = (V ? o.y1 : o.x1) - C.M0, q2 = (V ? o.y2 : o.x2) + C.M0;
      if (!(q1 < sg.b - EPS && q2 > sg.a + EPS)) return;
      const r1 = (V ? o.x1 : o.y1) - C.M0, r2 = (V ? o.x2 : o.y2) + C.M0;
      if (r2 <= sg.pos + EPS) { if (r2 > lo) { lo = r2; lob = i; } }
      else if (r1 >= sg.pos - EPS) { if (r1 < hi) { hi = r1; hib = i; } }
    });
    for (const f of sg.fars) {
      if (f == null) continue;
      if (f < sg.pos - EPS) { if (f + C.MINSEG > lo) { lo = f + C.MINSEG; lob = -2; } }
      else if (f > sg.pos + EPS) { if (f - C.MINSEG < hi) { hi = f - C.MINSEG; hib = -2; } }
    }
    const pad = C.M - C.M0;
    return { lo, hi, lob, hib, dlo: lob === -2 ? lo : Math.min(lo + pad, Math.max(lo, sg.pos)), dhi: hib === -2 ? hi : Math.max(hi - pad, Math.min(hi, sg.pos)), dlo0: lob === -2 ? lo : lo + pad, dhi0: hib === -2 ? hi : hi - pad };
  }
  function crossCount(A, B) {   // A を B の手前（左・上）に置いたときの交差の数
    let c = 0;
    if (A.da > 0 && A.a > B.a + 0.5 && A.a < B.b - 0.5) c++;
    if (A.db > 0 && A.b > B.a + 0.5 && A.b < B.b - 0.5) c++;
    if (B.da < 0 && B.a > A.a + 0.5 && B.a < A.b - 0.5) c++;
    if (B.db < 0 && B.b > A.a + 0.5 && B.b < A.b - 0.5) c++;
    return c;
  }
  function nudgePass(G, routes, V, widen) {
    const L = segs(routes, V), oc = V ? "x" : "y";
    L.forEach(sg => Object.assign(sg, sg.movable ? range(sg, G, V) : { lo: sg.pos, hi: sg.pos, dlo: sg.pos, dhi: sg.pos, dlo0: sg.pos, dhi0: sg.pos, lob: -2, hib: -2 }));
    const conf = (p, q) => p.ri !== q.ri && Math.min(p.b, q.b) - Math.max(p.a, q.a) > -1 && p.lo < q.hi + C.S && q.lo < p.hi + C.S;
    const par = L.map((_, i) => i), find = i => (par[i] === i ? i : (par[i] = find(par[i])));
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) if (conf(L[i], L[j])) par[find(i)] = find(j);
    const groups = new Map(); L.forEach((sg, i) => { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(sg); });
    groups.forEach(gr => {
      if (!gr.some(sg => sg.movable)) return;
      const cmp = (A, B) => {
        if (!A.movable || !B.movable) return A.pos - B.pos || A.ri - B.ri;
        const ab = crossCount(A, B), ba = crossCount(B, A);
        return ab !== ba ? ab - ba : (A.pos - B.pos || A.ri - B.ri);
      };
      // 並びの順：重なる組ごとに「交差の少ないほうの前後」を決め、その前後関係で並べる（閉路は位置の小さいものから切る）
      const m = gr.length, after = gr.map(() => []), indeg = new Array(m).fill(0);
      for (let i = 0; i < m; i++) for (let j = i + 1; j < m; j++) {
        if (!conf(gr[i], gr[j])) continue;
        if (cmp(gr[i], gr[j]) <= 0) { after[i].push(j); indeg[j]++; } else { after[j].push(i); indeg[i]++; }
      }
      const ord = [], used = new Array(m).fill(false), byPos = (i, j) => gr[i].pos - gr[j].pos || gr[i].ri - gr[j].ri;
      while (ord.length < m) {
        let cand = []; for (let i = 0; i < m; i++) if (!used[i] && indeg[i] === 0) cand.push(i);
        if (!cand.length) for (let i = 0; i < m; i++) if (!used[i]) cand.push(i);
        cand.sort(byPos); const i = cand[0]; used[i] = true; ord.push(gr[i]);
        after[i].forEach(j => indeg[j]--);
      }
      // 詰める：手前から、望む範囲の下端と、手前の重なる線分 + S のうち大きいほう
      const x = new Map(); let over = 0;
      ord.forEach((sg, i) => {
        let req = sg.dlo0;
        for (let t = 0; t < i; t++) if (conf(ord[t], sg)) req = Math.max(req, x.get(ord[t]) + C.S);
        if (!sg.movable) { if (req > sg.pos + 0.5) over = Math.max(over, req - sg.pos); x.set(sg, sg.pos); }
        else { x.set(sg, req); over = Math.max(over, req - sg.dhi0); }
      });
      // 中央へ寄せる：余りの半分だけ奥へ動かし、奥から順に間隔と上端を守る
      let slack = Infinity; ord.forEach(sg => { if (sg.movable) slack = Math.min(slack, sg.dhi0 - x.get(sg)); });
      const sh = slack > 0 && isFinite(slack) ? slack / 2 : 0;
      for (let i = ord.length - 1; i >= 0; i--) {
        const sg = ord[i]; if (!sg.movable) continue;
        let v = x.get(sg) + sh; v = Math.min(v, Math.max(sg.dhi0, sg.lo));
        for (let t = i + 1; t < ord.length; t++) if (conf(ord[t], sg)) v = Math.min(v, x.get(ord[t]) - C.S);
        v = Math.max(v, sg.lo); v = Math.min(v, sg.hi);
        x.set(sg, v);
      }
      ord.forEach(sg => { if (!sg.movable) return; const P = routes[sg.ri].pts, v = x.get(sg); P[sg.k][oc] = v; P[sg.k + 1][oc] = v; });
      if (over > 0.5) {
        let ma = null, mb = null;
        ord.forEach(sg => { if (!sg.movable) return; if (sg.lob >= 0 && (!ma || sg.dlo0 > ma.dlo0)) ma = sg; if (sg.hib >= 0 && (!mb || sg.dhi0 < mb.dhi0)) mb = sg; });
        if (ma && mb) widen.push({ axis: V ? "x" : "y", oa: ma.lob, ob: mb.hib, amount: over });
      }
    });
  }
  function route(G) {
    assignPorts(G);
    const g = buildGrid(G);
    const order = G.edges.map((e, i) => i).sort((i, j) => {
      const d = k => { const e = G.edges[k]; return Math.abs(G.obs[e.z].x1 - G.obs[e.a].x2) + Math.abs(e.y2 - e.y1); };
      return d(i) - d(j);
    });
    const routes = new Array(G.edges.length);
    order.forEach(i => { routes[i] = Object.assign(routeOne(g, G, G.edges[i]), { ei: i }); });
    let widen = [];
    for (let round = 0; round < 3; round++) {
      widen = [];
      nudgePass(G, routes, true, widen); routes.forEach(rt => (rt.pts = simplify(rt.pts)));
      nudgePass(G, routes, false, widen); routes.forEach(rt => (rt.pts = simplify(rt.pts)));
    }
    return { routes, widen, grid: { nx: g.nx, ny: g.ny } };
  }

  /* 5. 描画：角を丸め、交差では下の線を背景色で切る */
  const f1 = v => Math.round(v * 10) / 10;
  function pathD(P) {
    const n = P.length, len = k => Math.abs(P[k + 1].x - P[k].x) + Math.abs(P[k + 1].y - P[k].y);
    const room = k => (k === 0 ? len(k) : k === n - 2 ? len(k) - C.AH - 1 : len(k) / 2);
    let d = `M${f1(P[0].x)} ${f1(P[0].y)}`;
    for (let k = 1; k < n - 1; k++) {
      const a = P[k - 1], b = P[k], c = P[k + 1];
      const r = Math.max(0, Math.min(C.R, room(k - 1), room(k)));
      const ux = Math.sign(b.x - a.x), uy = Math.sign(b.y - a.y), vx = Math.sign(c.x - b.x), vy = Math.sign(c.y - b.y);
      d += ` L${f1(b.x - ux * r)} ${f1(b.y - uy * r)}` + (r > 0 ? ` A${f1(r)} ${f1(r)} 0 0 ${ux * vy - uy * vx > 0 ? 1 : 0} ${f1(b.x + vx * r)} ${f1(b.y + vy * r)}` : "");
    }
    const z = P[n - 1]; d += ` L${f1(z.x - C.AH + 1)} ${f1(z.y)}`;
    return d;
  }
  const WID = c => (/is-p1/.test(c) ? 3 : /is-p2/.test(c) ? 2 : /is-done/.test(c) ? 1.2 : 1.6);
  const RANK = c => (/is-p1/.test(c) ? 3 : /is-p2/.test(c) ? 2 : /is-off/.test(c) ? 0 : 1);
  function svg(G, routes, classes) {
    const ord = routes.map((rt, i) => i).sort((i, j) => RANK(classes[i]) - RANK(classes[j]));
    let lines = "", cuts = "", tops = "";
    ord.forEach(i => {
      const P = routes[i].pts, z = P[P.length - 1];
      lines += `<g class="e ${classes[i]}"><path class="ln" d="${pathD(P)}"/><path class="ah" d="M${f1(z.x)} ${f1(z.y)} l${-C.AH} ${-C.AH / 2 - .5} v${C.AH + 1}z"/></g>`;
    });
    // 交差：強調の強いほう、同じなら水平の線を上にする
    const segL = [];
    routes.forEach((rt, i) => { const P = rt.pts; for (let k = 0; k < P.length - 1; k++) { const p = P[k], q = P[k + 1]; segL.push({ i, V: Math.abs(p.x - q.x) < EPS, x1: Math.min(p.x, q.x), x2: Math.max(p.x, q.x), y1: Math.min(p.y, q.y), y2: Math.max(p.y, q.y) }); } });
    const bg = (x, y) => { let best = null; G.frames.forEach(f => { if (x > f.x1 && x < f.x2 && y > f.y1 && y < f.y2 && (!best || (f.x2 - f.x1) * (f.y2 - f.y1) < (best.x2 - best.x1) * (best.y2 - best.y1))) best = f; }); return best ? best.cls : "view"; };
    segL.forEach(h => { if (h.V) return; segL.forEach(v => {
      if (!v.V || v.i === h.i) return;
      const cx = v.x1, cy = h.y1;
      if (!(cx > h.x1 + C.R && cx < h.x2 - C.R && cy > v.y1 + C.R && cy < v.y2 - C.R)) return;
      const hUp = RANK(classes[h.i]) > RANK(classes[v.i]) || (RANK(classes[h.i]) === RANK(classes[v.i]));
      const up = hUp ? h : v, lo = hUp ? v : h, wu = WID(classes[up.i]), wl = WID(classes[lo.i]), gap = 2.5;
      const along = wu / 2 + gap, across = wl / 2 + 1;
      cuts += lo.V ? `<rect class="cut is-${bg(cx, cy)}" x="${f1(cx - across)}" y="${f1(cy - along)}" width="${f1(across * 2)}" height="${f1(along * 2)}"/>`
                   : `<rect class="cut is-${bg(cx, cy)}" x="${f1(cx - along)}" y="${f1(cy - across)}" width="${f1(along * 2)}" height="${f1(across * 2)}"/>`;
      const L2 = along + 1;
      tops += `<g class="e ${classes[up.i]}"><path class="ln" d="${up.V ? `M${f1(cx)} ${f1(cy - L2)}V${f1(cy + L2)}` : `M${f1(cx - L2)} ${f1(cy)}H${f1(cx + L2)}`}" style="stroke-dasharray:none"/></g>`;
    }); });
    return `<g class="lines">${lines}</g><g class="cuts">${cuts}</g><g class="tops">${tops}</g>`;
  }

  /* 機械の検査：(1) 始点・終点以外の箱の矩形（余白 margin）と交わる線分、(2) 自分の始点・終点の箱の内側に入る線分、
     (3) 別の線の、同じ向きで間隔 lane 未満かつ範囲が重なる線分の組、(4) 斜めの線分 */
  function audit(routes, obs, o = {}) {
    const m = o.margin == null ? 3 : o.margin, lane = o.lane == null ? C.S : o.lane;
    const all = []; let diagonal = 0;
    routes.forEach((rt, ri) => { const P = rt.pts; for (let k = 0; k < P.length - 1; k++) {
      const p = P[k], q = P[k + 1], V = Math.abs(p.x - q.x) < EPS, Hh = Math.abs(p.y - q.y) < EPS;
      if (!V && !Hh) diagonal++;
      all.push({ ri, k, V, x1: Math.min(p.x, q.x), x2: Math.max(p.x, q.x), y1: Math.min(p.y, q.y), y2: Math.max(p.y, q.y) });
    } });
    let boxHits = 0, ownHits = 0, overlaps = 0; const list = [];
    all.forEach(s => obs.forEach(b => {
      const own = b.key === routes[s.ri].ka || b.key === routes[s.ri].kz, mm = own ? -0.5 : m;
      if (s.x2 > b.x1 - mm && s.x1 < b.x2 + mm && s.y2 > b.y1 - mm && s.y1 < b.y2 + mm) { if (own) ownHits++; else boxHits++; if (list.length < 20) list.push(`${own ? "own" : "box"} r${s.ri}#${s.k} ${b.key}`); }
    }));
    for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
      const s = all[i], t = all[j]; if (s.ri === t.ri || s.V !== t.V) continue;
      const dist = s.V ? Math.abs(s.x1 - t.x1) : Math.abs(s.y1 - t.y1);
      const ov = s.V ? Math.min(s.y2, t.y2) - Math.max(s.y1, t.y1) : Math.min(s.x2, t.x2) - Math.max(s.x1, t.x1);
      if (dist < lane - 0.5 && ov > 0.5) { overlaps++; if (list.length < 40) list.push(`lane r${s.ri}#${s.k}~r${t.ri}#${t.k} d=${dist.toFixed(1)} ov=${ov.toFixed(1)}`); }
    }
    // (5) 同じ箱の同じ辺で、出入りの位置が間隔 lane 未満の組
    let portShare = 0; const ends = [];
    routes.forEach(rt => { const P = rt.pts; ends.push([rt.ka + "R", P[0].y], [rt.kz + "L", P[P.length - 1].y]); });
    for (let i = 0; i < ends.length; i++) for (let j = i + 1; j < ends.length; j++) if (ends[i][0] === ends[j][0] && Math.abs(ends[i][1] - ends[j][1]) < lane - 0.5) portShare++;
    return { segments: all.length, boxHits, ownHits, overlaps, diagonal, portShare, failed: routes.filter(r => r.failed).length, list };
  }
  return { C, route, svg, audit };
})();

/* 見比べ用の帯 */
function setTheme(t) { document.documentElement.dataset.theme = t; document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeSet === t)); }
function setDevice(d) {
  document.body.dataset.device = d; document.querySelectorAll(".cmp [data-device]").forEach(b => b.setAttribute("aria-pressed", b.dataset.device === d));
  S.fitted = false; S.legend = d !== "phone"; $("#msearch").classList.remove("is-open"); render();
}
document.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => setTheme(b.dataset.themeSet)));
document.querySelectorAll(".cmp [data-device]").forEach(b => b.addEventListener("click", () => setDevice(b.dataset.device)));
let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === "time") drawChart(); }, 120); }).observe(main);

const H = new URLSearchParams(location.hash.slice(1));
setTheme(H.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
if (H.get("device") === "phone") { document.body.dataset.device = "phone"; document.querySelectorAll(".cmp [data-device]").forEach(b => b.setAttribute("aria-pressed", b.dataset.device === "phone")); }
if (H.get("repo") && REPOS[H.get("repo")]) S.repo = H.get("repo");
if (H.get("view")) S.view = H.get("view");
if (H.get("done")) S.showDone = true;
if (H.get("sel")) { S.sel = +H.get("sel"); S.detail = S.sel; }
if (H.get("tab")) S.tab = H.get("tab");
if (app.clientWidth <= 640) S.legend = false;
render();
</script>
