## この資料で分かること

:::summary
- どの Scope の箱に、どのエージェントの印が出るか（Scope と worktree の対応の決まり）。
- orca-web の場所をどう決め、どう変えるか（設定の `orca_web` と、画面の CSP）。
- orca-web に届かないとき、連携を切ったとき、埋め込みの画面の中で、何が出て何が出ないか。
- 2つの子の Issue の分担と順番。
:::

## 背景と目的

ダッシュボードは3つの段階で進めています。第1段階（epic-00427）は SpecDock の資源だけを見せました。この Epic は第2段階で、Orca のエージェントの稼働を重ねます。第3段階（epic-00526）は、横の欄にエージェントのチャットを埋め込みます。

Orca を外から読む機能は、SpecDock の中に作らず、独立したサービス **orca-web** に作りました（Tailscale の中だけ）。orca-web は、worktree ごとのエージェントの要約（`GET /api/worktrees/summary`）、稼働の印の部品（`agent-marks.js`）、「Orca で開く」のボタンの部品（`open-button.js`）を配っています。色は SpecDock のデザインシステムに合わせてあります。

## 全体の構成

```plantuml id=overview
@startuml
title 稼働の印の流れ
top to bottom direction
actor "利用者のブラウザー" as B
node "SpecDock のダッシュボード\n（127.0.0.1 か Tailscale の IP の 47800）" as SD
node "orca-web\n（同じ名前の 8791）" as OW
node "Orca" as O
B --> SD : 画面と構造の API（GET）\nCSP に orca-web のオリジン\nworktree の記録
B --> OW : 要約（GET、読み取りの CORS）\n部品の import
OW --> O : 状態を読む
note right of SD : サーバーは orca-web を読まない
@enduml
```

- **サーバー**：利用者の設定 `config.json` の `orca_web` の節（`enabled`、`port`。既定は有効、8791）を読み、画面を開いた Host の名前とポートから orca-web のオリジンを決めます。そのオリジンだけを画面の CSP に足し、リポジトリの一覧の API で画面に渡します。構造の API は、Scope ごとの worktree の記録（パスとブランチ）と、リポジトリの worktree のパスの一覧を返します。
- **画面**：`core/orca.js` が orca-web の部品を import し、要約を1つの読みの輪（10 秒ごと）で読みます。`core/orca_match.js` が、要約と SpecDock の記録を突き合わせて Scope ごとの worktree を決めます。構造の図、ボード、横の欄は、置き場に orca-web の `renderAgentMarks` で印を描きます。

## Scope と worktree の対応

1. **パスの一致**：要約の worktree の `path` が、Scope の worktree の記録の `path` と一致すれば、その Scope。
2. **同じリポジトリのブランチ名の一致**：パスで対応しなかった worktree は、同じリポジトリ（このリポジトリの worktree とパスが一致した要約の worktree と同じ `project.id`）で、ブランチ名が完全に一致するときだけ対応します。手がかりがなければ対応させません。別のリポジトリに同じブランチ名があるからです（orca-web にも spec-dock にも iss-00014 があります）。

要約の `issue` は使いません。どの Scope にも対応しない worktree は出しません。Epic と Initiative は、自分のブランチの worktree があるときだけ印を持ち、配下を合算しません。

## 失敗したときの動き

| 場合 | 印 | Orca で開く | 図とボード |
|---|---|---|---|
| orca-web に届かない、部品を読めない、形が違う | 出さない | 置かない | 今までどおり動く。10 秒ごとに試し直す |
| orca-web が Orca に届いていない（`connection.state` が connected でない） | 出さない | 置かない | 今までどおり |
| 連携を切った（`enabled: false`）、設定の節が壊れている | 出さない（何も要求しない。CSP も今のまま） | 置かない | 今までどおり |
| SpecDock の worktree の記録を読めない | 出さない（推し量らない） | 置かない | 今までどおり |
| 別の画面に埋め込まれている | 出す | 置かない（埋め込み先のオリジンを orca-web が許さないため） | 今までどおり |

## 分担と順番

- **iss-00591**：設定、CSP、API の worktree の記録、対応と状態の計算、要約の読みの輪。画面に印はまだ描きません。epic-00526 の iss-00593 も、これを使います。
- **iss-00592**（iss-00591 の後）：構造の図、ボード、横の欄の見出しの印と、「Orca で開く」、配る文書。

## 確認方法

```sh
spec-dock scope check epic-00471
spec-dock scope show iss-00591 --json
```

連携を止めるときは、`config.json` に次を書きます（起動し直しは要りません）。

```json
{ "schema": "specdock.config/v1", "orca_web": { "enabled": false } }
```
