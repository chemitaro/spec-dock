title: Antigravity と Gemini のエージェントへの対応
lead: Orca に Antigravity CLI が入り、Gemini などのエージェントも SpecDock の作業者として動くようになりました。この資料では、SpecDock と orca-web のどこを、どの順で直すかが分かります。

## この資料で分かること

:::summary
- エージェントのアイコンと名前は orca-web が決め、SpecDock はそれを読んで出すだけです。
- SpecDock 側の仕事は、Antigravity でのカタログの読み書きの確かめと案内、ダッシュボードの種類の名前の2つです。
- orca-web 側の仕事は、アイコンと名前、送信と質問への回答、モデルと推論の深さの3つです。
:::

## 背景と目的

Orca は Antigravity のエージェントを `antigravity`、Gemini CLI を `gemini` という種類で報告します。今のアイコンの表には Claude と Codex しかなく、それ以外は中立の丸になります。作業用の worktree からカタログに書くための設定の案内も、Codex と Claude Code の分しかありません。

アイコンと名前は、モデルではなく種類（道具）ごとに付けます。Orca が種類だけを報告し、Antigravity の中で動くモデルは印の単位では分からないからです。

## 全体の構成

```plantuml id=overview
@startuml
title 2つのリポジトリの Issue と順序
rectangle "orca-web epic-00065" {
  component "iss-00066 アイコンと名前" as O1
  component "iss-00067 送信と回答のキー（strict）" as O2
  component "iss-00068 モデルと推論の深さ" as O3
}
rectangle "SpecDock epic-00672" {
  component "iss-00673 カタログの権限の確かめと案内" as S1
  component "iss-00674 種類の名前" as S2
}
O1 --> S2 : 名前の表を読む
@enduml
```

orca-web の iss-00066 が名前の表を広げ、SpecDock の iss-00674 がそれを読みます。ほかの Issue は書く範囲が重ならないので、並べて進めます。

## 確認方法

```sh
spec-dock scope show epic-00672 --json
spec-dock canonical status --json
```
