lead: 構造の図の木の表示で、依存の線どうしが車線の間隔より近く重なったまま残る原因と、その直し方を説明します。

## この資料で分かること

:::summary
- 木の表示の『全体』で、線どうしの重なり（検査の overlaps）が残っていた2つの原因。
- 寄せ（nudging）の詰め直しと、落ち着いた巡の判定の直し方。
- 入れ子の表示を変えないことの確かめ方。
:::

## 背景

構造の図は、Scope を箱と枠で並べ、依存の線を直交の折れ線で引きます（`views/graph/layout.js` が配置、`views/graph/router.js` が線の通り道）。
線は箱の右の辺から出て、左の辺に入ります。重なる線分は、寄せで車線（8px おき）に分けます。足りない通り道は、配置の間を広げてやり直します（最大10巡）。

木の表示では、Scope が1列に並び、深さだけ右に字下げされます。同じ Initiative の Epic どうしの線は、どれも Initiative の親の線と Epic の列の間の、縦に長い通り道を通ります。
大きな構造（約300の Scope、約350本の線）では、この通り道に何十本もの長い縦の線分が並びます。

## 原因1：寄せの詰め方の階段

寄せは、重なる線分の組ごとに前後（手前・奥）を決め、手前の線分から車線1つ分ずつ奥に詰めます。
交差の数がどちらでも同じ組も前後を決めるので、範囲が鎖のようにつながると、同時に重なっていない線分まで1本ずつ奥へ押されます。

| 線分 | 範囲（縦） | 重なる相手 | 今の詰め | 直した詰め |
|---|---|---|---|---|
| A | 0〜100 | B | 車線1 | 車線1 |
| B | 50〜150 | A、C | 車線2 | 車線2 |
| C | 120〜200 | B | 車線3（A とは重ならないのに奥へ） | 車線1 |

同時に重なるのは10本ほどでも、通り道（43車線ぶん）からあふれ、広げても次の巡でまた積むので、10巡で落ち着きませんでした。

## 原因2：違反の残る巡を落ち着いたと見なす

広げの要求がない巡は、検査をせずに「違反0」として採っていました。横の寄せの後に縦の線分の近い重なりが残る巡が、それより前の違反0の巡を押しのけることがあります。

## 直し方

- 木の表示で、詰めが範囲からあふれる束だけを、詰め直します。交差の数で前後の決まる組の順は守り（守るとあふれるときは捨てる）、ほかは、重なる線分のどれとも車線1つ分離れた、手前の最初の位置に置きます。良くなるときだけ採ります。
- 落ち着いた巡は、広げの要求がなく、検査の違反も0の巡だけにします。

入れ子の表示の束は詰め直さないので、入れ子の線は変わりません。

## 確認方法

```sh
uv run pytest tests/unit/presentation/test_dashboard_graph_tree_route.py
```

直す前と後の比べ（8つのリポジトリと固定した入力の構造 × 入れ子27・木3）は、report.md に表で残します。
