## この資料で分かること

:::summary
- 出すかどうかを、どのファイルのどの鍵で決めるか。
- 設定の3段と、`dashboard hide` の印が、どう組み合わさるか。
- 設定が壊れたときに、なぜ隠す側に倒すか、どこで理由を見るか。
:::

## 背景と目的

これまでは `dashboard hide`／`show` のコマンドが書く印（`<state_root>/dashboard/repositories.json`）だけで決まっていました。利用者は、何を出しているかを設定のファイルで見て管理したいと望みました（2026-11-04）。#549 で入った設定の3段（初めの値 < 利用者の設定 < リポジトリの設定）に、ダッシュボードの表示を乗せます。

## 設定の書き方

利用者の設定 `$XDG_CONFIG_HOME/spec-dock/config.json`（なければ `~/.config/spec-dock/config.json`）：

```json
{
  "schema": "specdock.config/v1",
  "dashboard": {
    "visible": false,
    "repositories": {"github.com/chemitaro/spec-dock": {"visible": true}}
  }
}
```

リポジトリの設定は、カタログの根（`spec-dock/initiatives/` が指す先）の `dashboard.json`：

```json
{"schema": "specdock.dashboard-settings/v1", "visible": false}
```

## 決まり方

```plantuml id=decide
@startuml
title 1つのリポジトリを出すかどうか
start
:初めの値 visible = true;
:利用者の dashboard.visible があれば上書き;
:利用者の dashboard.repositories[鍵].visible があれば上書き;
:カタログの dashboard.json の visible があれば上書き（最も優先）;
if (どれかの設定が壊れている?) then (はい)
  :設定は「隠す」（source = invalid）;
endif
if (dashboard hide の印がある?) then (はい)
  :隠す;
elseif (設定の値が false?) then (はい)
  :隠す;
else
  :出す;
endif
stop
@enduml
```

- リポジトリの設定がいちばん強く、利用者の `visible: false` も `true` で上書きします（利用者の判断）。
- `dashboard hide` の印は、設定にかかわらず常に隠します。今の印は、そのまま効きます。
- `dashboard show` は印を消すだけです。設定が隠していれば、結果の `hidden` が true のままで、警告 `DASHBOARD_HIDDEN_BY_CONFIG` が直す場所を示します。

## 確認方法

```sh
spec-dock dashboard list          # hidden by=… config=… で理由と出どころが見える
spec-dock dashboard list --json   # mark、config.source、hidden_by、config_problems
```
