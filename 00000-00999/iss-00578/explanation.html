## この資料で分かること

:::summary
- 列の間の幅は、配線（router.js）が「この通り道は狭い」と返した量だけ、配置（layout.js）が広げて決まる。
- 誤りは、狭さの見積もりが、別々の列の間の線分を1つの束にまとめて数えていたことにある。
- 直した後は、1つの通り道に閉じた線分だけで見積もるので、列の間は通る線の本数に見合う幅に収まる。
- 行の間の広い帯は、線の多い箱が入口の格子（16px おき）のために高くなり、行全体を高くしていたことが原因。線の多い入口の辺は 8px おきに置く。
:::

## 背景と目的

退去費用プロジェクトの構造の図（init-02234 → epic-02233）で、Issue の列と列の間が、図の座標で 500 ほど空くことがありました。その間を通る縦の線は 8〜12 本で、車線（8px おき）に並べれば 100 ほどで足ります。この Epic は、1つの Issue から多くの Issue へ、多くの Issue から1つの Issue（最後の品質ゲート）へ線が集まる、線の多い構造です。

## 列の間の幅の決まり方

1. 配置（layout.js）が、段の列を 44 の間をあけて並べる。
2. 配線（router.js）が、線を引き、同じ向きの線分を車線に分ける（寄せ）。車線が通り道に入りきらないときは、「どの障害物の間を、どれだけ広げるか」（widen）を返す。
3. 配置が、その2つの障害物の間の列の間（cc の鍵）を広げ、もう一度並べて引き直す。最大 10 回まで繰り返す。

```plantuml id=loop
@startuml
title 配線と配置の繰り返し
start
repeat
  :layout() が箱と枠を並べる;
  :route() が線を引き、寄せる;
  if (車線が足りない?) then (はい)
    :widen（障害物の組と量）を返す;
    :gapFor() が列の間の鍵に写し、足す;
  else (いいえ)
    stop
  endif
repeat while (10 回まで)
stop
@enduml
```

## 何が誤っていたか

寄せは、重なりうる線分を束にまとめ、束ごとに手前から詰めます。箱の上や下の空いた所を通る線分は、左右に動ける範囲が広いので、いくつもの列の間の線分と重なりえます。そのため、6つの列の間の線分が1つの束（62本）になりました。

束の中の並びの順は、通り道の範囲を見ません。ある列の間（幅 24）の線分が、箱の列の向こう側の通り道に詰められた鎖に押され、「254 足りない」と見積もられました。さらに、広げる組の両側を束の中の別々の通り道から選ぶので、広げても解けず、毎回同じ要求が出て、列の間が足され続けました。

| 例（taikyohiyou、幅 1424） | 直す前 | 直した後 |
|---|---|---|
| 列2と列3の間 | 534（通る線 12） | 82〜90 |
| 繰り返しの回数 | 10（収まらない） | 5 |

## 上下の隙間

格子の行の高さは、その行のいちばん高い箱で決まります（つながりを同じ行にそろえるため）。行の右端の iss-02253 には左の辺に20本の線が入り、入口は 16px おき（出口の格子から 8px ずらした格子）にしか置けないので、箱が 88 から 344 に伸び、行全体が 344 の高さになっていました。その行のほかの箱の下には、iss-02253 へ入る横の線が 16px おきに並ぶ帯ができます。さらに、箱を伸ばす最初の回の、出入りの位置が詰まった配線から見積もった広げも残っていました。

| 例（同じデータ、幅 1440） | 直す前 | 直した後 |
|---|---|---|
| iss-02252 → iss-02251 の帯 | 253（横の線 15） | 80（10） |
| iss-02253 の高さ | 344 | 184 |

## 直し方

- 広げの量を、線分ごとに、その線分の通り道に閉じた線分の鎖だけで数える。広げる組は、その線分自身の両側の障害物にする。
- 押されて自分の範囲を超える線分があれば、押している鎖の中の、奥へ逃げられる線分を奥へ回す。寄せの後に近すぎる2本が残れば、その通り道の不足として広げを求める。
- 入れ子の表し方で、16px おきに入りきらない入口の辺は、8px おきに置く（向かいの箱の出口と同じ高さは避ける）。
- 箱を伸ばす回は、その回の配線から通り道を広げない。

並べ方の決まり（つながりは1行で左から右、途中で折り返さない）は変えていません。

## 確認方法

```sh
uv run pytest tests/unit/presentation/test_dashboard_graph_js.py
```

線の多い合成の構造（epic-02233 と同じ依存の形）で、どの列の間も max(44, 8×本数 + 12) + 24 以下、どの行の帯も max(12, 8×本数 + 12) + 24 以下であることを確かめます。直す前のコードでは、この検査が落ちます。
