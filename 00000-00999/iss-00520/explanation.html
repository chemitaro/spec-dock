## この資料で分かること

:::summary
- 親の Scope を `completed` で閉じるとき、子孫が不採用（not planned）で閉じていても止まらなくなる。
- 開いている子孫、状態が分からない子孫があるときは、今までどおり `DESCENDANT_NOT_COMPLETED` で止まる。
:::

## 背景と目的

epic-00424 を閉じようとしたとき、計画どおり不採用にした子 I-6 のせいで止まりました。不採用はわざとやめた仕事なので、親の完了を止める理由がありません。

## 仕組み

`scope close` と `work finish` の判定を1つの関数にまとめます。子孫の状態が `completed` か `not-planned` なら通し、`open` か `unknown` なら止めます。エラーのコードと終了コードは変わりません。

## 確認方法

`scope close` と `work finish` の両方で、不採用の子孫があるとき閉じられること、開いた子孫があるとき止まることをテストで確かめます。
