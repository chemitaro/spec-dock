## この資料で分かること

:::summary
- 構造の図が、既定で何を出し、何を出さないか。
- 枠と箱が、どの順に並ぶか。
- 前に保存した見せ方の選択が、どう扱われるか。
:::

## 背景と目的

0.6.0 の構造の図は、既定で終わったものを隠し、依存の線は「待っているものだけ」でした。そのため、進行中の Epic の中で終わった Issue が消え、計画がどこまで進んだかが図から読めませんでした。利用者は 2026-11-04 に「進行中の Epic の中の完了した Issue と矢印は残し、もう見る必要のないゴミは消し、最もアクティブな順に並べたい」と決めました。

## 出すものと出さないもの

| Scope | 既定の表示 |
|---|---|
| 開いた Scope | 出す |
| 終わった Scope で、親が開いている | 出す（終わった Epic は中身のない畳んだ枠。完了 n/n を示す） |
| 終わった Scope で、親も終わっている、または親がない | 出さない |
| 終わった Scope で、親が「配下がすべて終わったのに開いたまま」（片付けの候補） | 出さない（親は完了 n/n で残る） |
| 開いた子孫を持つ閉じた親 | 今までどおり残す |

「終わったものも」を入れると、すべてを出します。範囲を1つの Scope に絞ったときは、その子を、絞った Scope が終わっていても出します。

依存の線の既定は「すべての線」になり、図に出ている箱どうしの終わった依存は薄い線で描きます。待っている依存は今のとおり目立たせます。

## 並び

```plantuml id=order
@startuml
title 同じ段の中の上から下の順
start
:開いた枠\n作業中を含む → 着手できるを含む → 止められているだけ\n同じ組は最近動いた順;
:開いた箱\n推奨順（待っている数の多い順）;
:終わったもの（枠と箱）\n最近終わった順;
stop
@enduml
```

依存の左右の段（作業の順番）は今のままです。最近動いた時刻は、構造の API の各 Scope に足した `active_at`（作成、Issue の更新、完了、PR の作成・マージ・閉じの最も新しい時刻）を使います。

## 折り返さない

同じ段の箱が多くても、依存の段が長く続いても、図は折り返さずに右へ広がります。画面は横に動かして（ドラッグ、指）見ます。「全体」のボタンは、どれだけ広い図でも全体を画面に収めます。

## 保存した見せ方

見せ方はブラウザーに保存されます。保存の版を `specdock.graph.v2` に上げ、前の版からは表し方（入れ子・木）、片付けの候補を畳むか、凡例だけを引き継ぎます。「終わったものも」と依存の線は、一度だけ新しい既定に戻ります。

## 確認方法

```sh
spec-dock scope check iss-00556
uv run pytest tests/unit/presentation/test_dashboard_graph_js.py
spec-dock dashboard serve
```
