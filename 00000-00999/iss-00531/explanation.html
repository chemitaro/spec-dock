## この資料で分かること

:::summary
- 状態のボードの列（止められている → 着手できる → 作業中 → マージ待ち →（終わった））と、列の中の推奨順を、画面が判定し直さずにサーバーの `lane`、`merge`、`rank` から作ること。
- Scope の詳しい画面の見出しと5つのタブ（概要、依存、配下、文書、Artifact）と、そのためにサーバーが読むもの（カタログのファイル、`cue`、`git worktree list`）。
- 横断の概況（`/`）の札と、古い・ない・読めない・異常のときの警告の帯。
- 上の帯の検索と、埋め込みが使えないときの逃げ道（新しいタブで開くリンク）。
:::

## 背景と目的

epic-00427 は、見るだけのダッシュボードを作ります。#528 が状態のモデル、#529 がサーバーと画面の骨組みを作りました。この Issue は、利用者が「次に何をするか」を決める画面を足します。構造の図と時間の軸は #532 が並行して作ります。

## ボード

| 列 | 入るもの | 列の中の並び |
|---|---|---|
| 止められている | `lane` が `blocked` | 待ち先の少ない順 |
| 着手できる | `lane` が `ready` | 後に続く数の多い順 |
| 作業中 | `lane` が `doing`（下書きの PR を含む） | 後に続く数の多い順 |
| マージ待ち | `lane` が `awaiting_merge`。`merge` で「マージできる」「直す必要あり」に分ける | マージできるが先 |
| 終わった | 切り替えたときだけ | 新しい順 |

並びはサーバーが付ける `rank`（モデルの推奨順の順位）で決めます。不明は列に入れず、上の注意の帯に出します。片付けの候補は、上の数の帯の印から一覧を開きます。種類、親ごと、終わったものの切り替えは URL の問い合わせ（`kind`、`group`、`done`）に残ります。

## 詳しい画面

見出しに、題名、ID、番号、種類、状態と理由、親の道筋、保証レベル、GitHub の Issue と PR へのリンク、変化の印を出します。タブは URL の `tab` に残ります。

- **依存**：自分で持つ依存と、親から引き継いだ依存を分けて示し、止められているときは大もとの待ち先に印を付けます。
- **配下**：子孫どうしの依存も数えた段（段1 → 段2 → …）に分けます。
- **文書と Artifact**：サーバーがカタログを読みます。カタログがなければ、そのことと `spec-dock canonical link` を示し、ほかのタブは動きます。

## 横断の概況と検索

概況は、リポジトリごとに構造の JSON を読み、マージ待ち・作業中・着手できる Issue の題名を一番大きく出します。古い（30分を超えた）、ない、読めない、異常があるときは、札の上に経過と理由の帯を出します。概況は「見た」を送りません。

検索は上の帯にあり、ID（0埋めなしも）、番号、題名で今のリポジトリの Scope を探して、詳しい画面へ移ります。

## 確認方法

一時の状態の置き場でサーバーを立て、ブラウザーで開きます（利用者の状態の置き場を使わない）。

```sh
XDG_STATE_HOME=$(mktemp -d) spec-dock dashboard serve --port 0
```
