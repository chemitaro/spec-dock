## この資料で分かること

:::summary
- 見本のワークフローは、既定では PR と main への push で動き、ホストの runner の時間に費用がかかります。
- 起動の条件と runner は、リポジトリの決まりに合わせて変えてかまいません。
- push の前の hook で、同じ `spec-dock canonical check --json` を回す形もあります。
:::

## 背景

housing-lifecycle は CI を手動の起動だけにし、taikyohiyou は手元の VM の runner へ振り分けました。見本をそのまま入れると決まりに反するため、手で直しました。

## 変えるもの

- `spec-dock/docs/ci/spec-dock-check.yml` の先頭に注記のコメントを足します。`branches: [main]` の行は変えません。
- `spec-dock/docs/canonical.md` に、費用と合わせ方の節を足します。

## 確認方法

```sh
uv run pytest tests/unit/infra
```
