## この資料で分かること

:::summary
- ダッシュボードが GitHub に問い合わせずに PR の印を描けるのは、定期の同期が PR の状態をスナップショットに書くからです。
- PR を取るのは定期の同期だけで、前回の取得から2分を超えたときに限ります。コマンドは PR を取りません。
- PR の取得が失敗しても、構造の取得は続きます。前回の PR の値は残り、理由が `pull_requests_error` に書かれます。
- 新しい版は版1のファイルも読めます。古い版は版2を「ない」として取り直すので、どちらの版も止まりません。
:::

## 背景と目的

epic-00427 のダッシュボードは、各 Scope のブランチの PR が、下書きか、マージ待ちか、CI が失敗したかを示します（Epic の R-30）。ただし、ダッシュボードとその CLI は GitHub に問い合わせない約束です。そこで、もともと GitHub から構造を取っている定期の同期が、PR の状態もあわせて取り、ユーザーごとの構造のスナップショット（`snapshot.json`）に持ちます。

PR の CI やマージの可否が変わっても、Issue の ETag は変わりません。そのため、構造の取り直し（ETag が変わったときか、30分ごと）とは別に、2分ごとに PR を取ります。

## 全体の構成

```plantuml id=overview
@startuml
title PR の状態の取得
top to bottom direction
component "定期の同期（60秒ごと）" as Sync
component "StructureSnapshotService\nensure_fresh(cycle)" as Service
component "GithubStructureClient\nfetch_pull_requests" as Client
database "snapshot.json（版2）" as Snapshot
component "ダッシュボードのモデル（#528）" as Model
Sync -> Service : リポジトリごと
Service -> Client : 前回から2分を超えたら\nGraphQL を1回
Service -> Snapshot : pull_requests\npull_requests_fetched_at\npull_requests_error
Model -> Snapshot : 読むだけ\npull_requests_by_scope
@enduml
```

| 鍵 | 意味 |
|---|---|
| `pull_requests` | 番号ごとの PR（状態、下書き、ブランチ、マージの可否、CI、時刻、URL） |
| `pull_requests_fetched_at` | 最後に PR を取れた時刻。`null` なら一度も取れていない |
| `pull_requests_error` | 最後の取得の失敗（`code`、`message`、`at`）。成功したら `null` |

読む側は、`pull_requests_fetched_at` が `null` か30分を超えて古いとき、または `pull_requests_error` があるとき、「PR の状態が分からない」と示します。

## 失敗と版の移り

- 届かない、断られた、応答の形が違う、レート制限：構造の結果は書き、PR は前回の値を残し、理由を書きます。レート制限では待ちません。
- 版1のファイル：新しい版は読み、PR を「まだ取っていない」とします。次に書くときに版2になります。
- 古い版の SpecDock：版2を知らない版として「ない」とし、構造を一度取り直して版1で書きます。そのファイルも新しい版は読めます。

## 確認方法

```sh
uv run pytest tests/unit/domain/test_canonical_structure.py tests/unit/infra/test_github_snapshot.py
spec-dock scope check iss-00537
```
