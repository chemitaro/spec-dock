## この資料で分かること

:::summary
- タブが出る条件と、出ないときの理由の示し方。
- 相手（エージェント）をどう選び、なぜ自動で別の相手に移らないのか。
- 送信の守りが orca-web の iframe の中にあり、SpecDock が書き込みに関わらない仕組み。
- 描き直しで iframe を読み込み直さない（書きかけの本文が消えない）工夫。
:::

## 背景と目的

orca-web は、この PC の Orca のエージェントの状態を読み、詳細とチャット（会話の表示と送信）の画面を配る、独立したサービスです。SpecDock のダッシュボードは、Scope に対応する worktree を知っています（iss-00591）。この Issue は、その2つをつなぎ、Scope を見ている場所から、その作業をしているエージェントと話せるようにします。

送った文は取り消せないことがあります。送信の守り（同じオリジン、短期のトークン、宛先の指紋、`sendEnabled`）は orca-web が持ちますが、**どの相手のチャットを開くかは SpecDock が決めます**。そのため、この Issue は「相手を正しく選び、選びが古くならないこと」を中心に作ります（保証レベル strict）。

## 全体の構成

```plantuml id=overview
@startuml
title エージェントのタブの部品
top to bottom direction
component "横の欄 panel.js\n詳しい画面 scope.js" as Screens
component "タブの並び scope_tabs.js\n（2番目に agents）" as Tabs
component "agents_tab.js\n中身・帯・明暗" as Tab
component "agents_logic.js\n出す条件・選び・iframe の道（純粋）" as Logic
component "core/orca.js\n要約の読み・対応（iss-00591）" as Orca
node "orca-web" as Web {
  component "/api/worktrees/summary" as Summary
  component "/embed/agent（iframe）\n会話・送信の守り" as Embed
}
Screens --> Tabs : visibleTabs(env)
Tabs --> Tab : visible / count / render
Tab --> Logic : 決め方を呼ぶ
Tab --> Orca : forScope・status・marks
Orca --> Summary : 10 秒ごとに読む
Screens ..> Embed : iframe を置くだけ\n（送信は iframe の中）
@enduml
```

- `agents_logic.js` は DOM を知らない純粋な関数で、タブを出すか、どの相手を選ぶか、iframe の道を決めます。node のテストで表のように確かめます。
- `agents_tab.js` はタブの中身の HTML と、上の1行の帯（印・種類・ブランチ）を描きます。
- 横の欄と詳しい画面は、要約の知らせ（`ctx.orca.subscribe`）と明暗の変化で描き直します。

## タブが出る条件

| 状態 | タブ | 中身 |
|---|---|---|
| 連携を切っている | 出ない | ― |
| その Scope に worktree の記録がない | 出ない | ― |
| 設定が壊れている | 出る | 理由と `config.json` |
| 読み込み中・届かない・Orca に届いていない | 出る | 理由の1行 |
| 読めていて、エージェントが1人以上 | 出る | 帯と iframe |
| 読めていて0人、でも選びがある | 出る | 「いなくなった」の知らせ |
| 埋め込みの画面 | 上と同じ | 「埋め込みでは開けない」とリンク |

## 相手の選び

- 1人だけなら、押さずにすぐ開き、その相手を「選び」として覚えます。
- 2人以上なら、帯の切り替えで選ぶまで iframe を出しません。
- 選んだ相手が要約から消えたら、iframe を外して「いなくなった」と示します。**残った別の相手が1人でも、自動では開きません**。同じ id が戻っても、人が選び直すまで開きません（戻ったのが同じセッションとは限らないため）。
- いなくなったことは、その Scope の「いなくなった覚え」として画面の中に覚えます。戻る操作、欄から詳しい画面への移り、欄の閉じと開き直しでも、残った1人を自動で開きません。覚えを捨てるのは、人がその Scope で選び直したときと、別の Scope を示したときだけです。
- 選びは、横の欄では欄の中に、詳しい画面では問い合わせの `agent` に持ちます。Scope を変えると、前の Scope の iframe は外れます。

## 描き直しで iframe を残す

タブの中身の HTML は、Scope、選んだ相手（id・種類・ブランチ）、明暗、理由だけで決まる文字列です。ほかの相手が増えても減っても文字列は同じなので、横の欄も詳しい画面も中身を置き換えず、iframe は読み込み直されません（チャットに書きかけた本文が残ります）。帯は中身の中の置き場に後から描きます。明暗を変えたときと、選んだ相手のブランチか種類が変わったときだけ、置き直します。

## 送信と sandbox

SpecDock は iframe を置くだけで、orca-web の書き込みの口を呼ばず、`postMessage` もしません。iframe の `sandbox` は `allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox` です。orca-web の守りは iframe の文書が orca-web のオリジンを持つことを前提にするので `allow-same-origin` が要り、PR と CI のリンクが新しいタブで開くので popups の2つが要ります。フォームと、SpecDock の画面を移す許可は付けません。

## 確認方法

```sh
uv run pytest tests/unit/infra -k "agents or scope_tabs"
spec-dock scope check iss-00593
```

実機の確かめ（試しの orca-web と試しの SpecDock の組、確かめ専用の宛先への送信、写し）は report.md にあります。
