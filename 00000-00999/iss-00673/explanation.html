title: Antigravity で仕様のカタログを読み書きする
lead: 作業用の worktree で動く Antigravity（`agy`）のエージェントが、作業ディレクトリの外にある仕様のカタログを読み書きできるように、`canonical status` が要る設定の1行を示し、配る案内に Antigravity の設定を書く作業の説明です。

## この資料で分かること

:::summary
- `agy` 1.5.12 は、作業ディレクトリの外のファイルを、既定では読み書きしません。linked worktree のカタログ（`<main のチェックアウト>/spec-dock/.canonical`）は外にあるので、設定が要ります。main のチェックアウトでは要りません。
- 要る設定は、ユーザーの設定 `~/.gemini/antigravity-cli/settings.json` の `permissions.allow` に `read_file(<カタログ>)` と `write_file(<カタログ>)` を加える1行です。SpecDock は書き換えず、`canonical status` が1行を示します。
- Antigravity の中は、端末のコマンドに渡る `ANTIGRAVITY_AGENT` で見分けます。ないときは警告を出しません。
:::

## 背景と目的

Orca に Antigravity CLI が入り、Gemini などのモデルのエージェントが SpecDock の作業者として動くようになりました。Claude Code と Codex には、カタログに書くための設定の1行と、その確かめ（`canonical status` の `tools`）がすでにあります。Antigravity にも同じものを用意します（epic-00672）。

## 実物で確かめたこと

一時のリポジトリ（main と linked worktree）で `agy -p` を動かして確かめました（表の全体は report.md）。

- 設定がないと、ファイルの道具は許可を求め、print のモードでは自動で拒まれます。端末も既定で制限され、外への書き込みは `Operation not permitted` です。
- `permissions.allow` の2つの規則で、ファイルの道具も端末も通ります。カタログの親を書いても通ります。
- その回だけなら `agy --add-dir <カタログ>` でも通りますが、SpecDock からは見えません。
- Claude Code の隔離セッションのような、設定を足しても書けない動き方は見つかりませんでした。

## 変えるもの

- `canonical status` の `data.tools.antigravity`：`session`、`needed`、`configured`、`sources`、`file`、`line`。Antigravity の中の linked worktree で設定がないと、警告 `CANONICAL_TOOL_SETTING_MISSING` と1行を示します。
- 配る案内 `docs/canonical.md` のツールの設定の節と、`docs/reference_cli.md` の C45。
- Codex と Claude Code の項目と警告は変えません。

## 確認方法

```sh
spec-dock canonical status --json   # Antigravity の中の linked worktree で tools.antigravity を見る
uv run pytest tests/cli_runtime/test_issue429_canonical_status.py
make lint
```
