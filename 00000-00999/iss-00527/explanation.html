## この資料で分かること

:::summary
- 起点の違う2つの手元のサーバーで、親と子の iframe を再現して確かめる。
- 確かめる項目は、指の操作、`frame-ancestors`、`sandbox` と `/ds/`、postMessage と戻る履歴。
- 結果は report.md に書き、設計（D-08、D-09、D-15）を直す材料にする。製品のコードは出さない。
:::

## 背景と目的

Epic 427 の設計は、埋め込みが動く前提で書かれている。実機のブラウザーで外れると手戻りが大きいので、先に確かめる。iPhone の実機は利用者が開くだけで確かめられるよう、手順を report.md に書く。
