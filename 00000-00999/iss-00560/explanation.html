## この資料で分かること

:::summary
- 読み終えたときに理解できていることを、1文ずつ書きます。
- 背景、仕組み、失敗時の動き、確認方法のうち、特に伝えたい点を選びます。
- 短い Scope なら、1〜2項目でかまいません。
:::

## 背景と目的

なぜこの Scope に取り組むのか、どの問題を解決するのかを具体的に説明します。

## 全体の構成

構成要素の役割と関係を説明します。図は、理解を大きく助ける場合だけ入れます。

```plantuml id=overview
@startuml
title 全体の構成
top to bottom direction
actor "利用者" as User
component "説明対象の仕組み" as System
database "データ" as Data
User -> System : 操作する
System -> Data : 読み書きする
System --> User : 結果を返す
@enduml
```

## 確認方法

読者が手元で確かめられる手順を書きます。

```sh
