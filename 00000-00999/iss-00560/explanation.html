## この資料で分かること

:::summary
- 今の配置で、つながりの前後の高さがずれる理由。
- 新しい配置の3つの決まり（行のそろえ、まとまりの折り返し、幅の変化での並べ直し）。
- 確かめ方。
:::

## 背景と目的

構造の図は、同じ親の子を依存の段の列に分け、列の中を活動順に上から積んでいました。列ごとに上から詰めるので、spec-dock の init-00423 では epic-00425 → 427 → 471 → 526 が上、下、上と行き来し、つながりが追いにくくなっていました。利用者は 2026-11-04 に「依存の矢印でつながっているものは左から右へ並べたい。つながっていないものは画面の幅に合わせて Epic の単位で折り返してよい」と決めました。

## 新しい配置

1. **まとまり**：同じ親の子を、依存（子の配下どうしの依存を含む）でつながったまとまりに分けます。
2. **格子**：まとまりの中は、段の列 × 行の格子です。後のものは前のものと同じ行に置きます。分かれと合流では、交差と上下の行き来が少なくなるよう行を入れ替えます。
3. **棚**：まとまりを活動順に左から置き、画面の見える幅（倍率100%）を超えるところで、まとまりの境目で次の行へ折り返します。つながりの途中では折り返しません。
4. **並べ直し**：ウィンドウの幅が変わったときだけ並べ直します。拡大・縮小では並べ直しません。

```plantuml id=layout
@startuml
title 1つの親の中の配置
rectangle "棚1" {
  rectangle "まとまりA（格子）" {
    card "425" as a1
    card "427" as a2
    card "471" as a3
    card "526" as a4
    a1 -right-> a2
    a2 -right-> a3
    a3 -right-> a4
  }
}
rectangle "棚2（幅で折り返し）" {
  card "独立した Epic X" as x
  card "独立した Epic Y" as y
}
@enduml
```
