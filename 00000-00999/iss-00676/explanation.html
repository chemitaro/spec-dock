## この資料で分かること

:::summary
- 線が出なかったのは計算の誤りではなく、「`/graph` の既定は『これから』」と「『これから』では線を引かない」の2つの決定が重なったためです。
- 直した後は、どの見方でも、指揮の線・弧・Unscoped の行・帯は同じ計算で決まり、範囲で変わるのは Scope の箱と枠の見せ方だけです。
- 『これから』だけにあった子の数の札はなくなります。
:::

## 背景と目的

ダッシュボードには、各リポジトリの構造の図（`/r/<repo>/`、既定は『いま』）と、すべてのリポジトリを1枚にした『横断の構造』（`/graph`、既定は『これから』）があります。
0.9.9 で、『これから』では指揮の線を引かず、指揮している項目に子の数を添えることにしました。そのため `/graph` を開くと、いつも線がありませんでした。
本人の決定で、『これから』でも線を引きます。

## 全体の構成

```plantuml id=overview
@startuml
title 線ができるまで（どの範囲でも同じ）
top to bottom direction
rectangle "orca-web の要約" as S
rectangle "commandPairs\n（指揮の組）" as P
rectangle "居場所\n（印・塊の縁・祖先の枠・帯）" as L
rectangle "Unscoped の行・帯" as R
rectangle "線と弧の模型" as M
S --> P
P --> L
P --> R
L --> M
R --> M
note right of L : 範囲は箱と枠（routeLayout）だけを変え、\n居場所はその結果から決まる
@enduml
```

## 確認方法

ダッシュボードの『横断の構造』を開き、既定の『これから』で黄色の点線が出ることを見ます。開発者は、ブラウザーの開発者の道具で次を評価し、`links` が 0 より多いことを確かめます。

```js
window.specdockCmdAudit()
```
