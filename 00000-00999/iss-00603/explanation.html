## この資料で分かること

:::summary
- 3つの範囲（全体・いま・これから）が、それぞれ何を出し、何を出さないか。
- 今の2つのボタン（終わったものも、片付けの候補を畳む）が、なぜ1つの切り替えになったか。
- ブラウザーに保存した選択が、どう引き継がれるか。
:::

## 背景と目的

構造の図には、「終わったものも」と「片付けの候補を畳む」の2つのボタンがありました。本人（2026-11-16）は、終わったものを完全に消して、これから進めるものだけをコンパクトに見る見え方を求め、ボタンを増やさずに1つの UI にまとめることを求めました。

## 3つの範囲

| 範囲 | 終わったもの | 片付けの候補 | 使いどころ |
|---|---|---|---|
| 全体 | すべて出す | 畳まずに出し、箱と枠に印 | 全体の中の位置づけを見る、候補を探す |
| いま（既定） | 開いている親の中だけ灰色で出す | 入れ子では畳んで1つに | 今までの既定と同じ |
| これから | 出さない | 出さない | 着手できる・作業中・止められている・不明だけを見る |

これからでは、終わったもの・候補でも、その下にまだ進めるものがあれば、その枠としてだけ出します。終わったものとの依存の線も出しません。URL で絞った Scope 自身は、これからでも出ます。

```plantuml id=overview
@startuml
title 見せる範囲の判定（これから）
start
if (URL で絞った Scope か) then (はい)
  :出す;
elseif (終わったもの・片付けの候補か) then (いいえ)
  :箱か枠として出す;
elseif (下に出すものがあるか) then (はい)
  :枠としてだけ出す;
else (いいえ)
  :出さない;
endif
stop
@enduml
```

## 保存の引き継ぎ

ブラウザーの保存は `specdock.graph.v3` になります。前の版2で「終わったものも」を入れていた人は「全体」、それ以外は「いま」で始まります。表し方、線の切り替え、凡例は引き継がれます。

## 確認方法

```sh
uv run pytest tests/unit/presentation/test_dashboard_graph_js.py
```
