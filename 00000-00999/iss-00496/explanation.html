## この資料で分かること

:::summary
- `installation update` が、どんなときに警告 `CLAUDE_SKILL_LINK_MISSING` を出すか。
- 警告が示す置き方と、SpecDock がリンクを作らない理由。
:::

## 背景と目的

SpecDock の skill の正本は `.agents/skills/<name>/` にあります。Claude Code は `.claude/skills/<name>` → `../../.agents/skills/<name>` の相対リンクで読みます。このリンクは Claude Code の側（`sync-project-skills`）が作る決まりです。

0.4.1 の `installation update` は、前の版が置いた `.claude/skills/spec-dock*` の写しを外します。リンクがまだないリポジトリでは、外した後に Claude Code から skill が見えなくなりますが、結果には何も出ませんでした。

## 全体の構成

```plantuml id=overview
@startuml
title 写しを外すときの流れ
start
if (枠 .claude/skills/<name> がリンク) then (はい)
  :枠を飛ばす（警告なし）;
elseif (外す写しがある) then (はい)
  :写しを外す（--dry-run は予定だけ）;
  :warnings に CLAUDE_SKILL_LINK_MISSING を枠ごとに1件;
else (いいえ)
  :何もしない（警告なし）;
endif
stop
@enduml
```

- 警告は結果の外枠の `warnings` に出ます。`details` に `slot`、`link_target`、`commands` があります。
- 結果の成否、`effects`、`data.result` は変わりません。
- `uninstall` では出ません（`.agents/skills` も外すため）。

## 確認方法

```sh
spec-dock installation update --dry-run --json
# warnings に CLAUDE_SKILL_LINK_MISSING があれば、更新の後に Claude Code で sync-project-skills を使うか、
# details.commands を作業ツリーの根で順に実行する
```
