title: カタログの同期が OS の不要なファイルを保存しない
lead: macOS の `.DS_Store` などを、カタログの同期が `spec-dock/canonical` に保存しなくなります。既存のカタログでも、パッケージを更新するだけで効きます。
category: 説明資料
audience: SpecDock の canonical モードを使う人と、その開発者

## この資料で分かること

:::summary
- どのファイルを「OS の不要なファイル」として保存しないか。
- なぜカタログの `.gitignore` ではなく、同期の規則で除くのか。
- すでに保存されてしまったファイルを、どう見つけて消すか。
:::

## 背景と目的

2026-11-01 の I-12（#439）で、Finder が作った `.DS_Store` を定期の同期が保存して GitHub に push しました。カタログの無視の規則はカタログ自身の `.gitignore`（`.runtime/` と `.workbench/`）だけで、リポジトリの `.gitignore` は効きません。Finder で仕様のフォルダーを開くたびに `.DS_Store` ができるので、放っておくと、どのリポジトリのカタログにも入りえます。

## 保存しないファイル

ファイル名（大文字と小文字は問わない）だけで見分けます。どの深さのフォルダーでも同じです。

| OS | 名前 |
|---|---|
| macOS | `.DS_Store`、`._*`（AppleDouble）、`Icon\r` |
| Windows | `Thumbs.db`、`ehthumbs.db`、`ehthumbs_vista.db`、`desktop.ini` |
| Linux | `.directory`（KDE） |

## 仕組み

```plantuml id=flow
@startuml
title 同期の1周期で、保存の候補を選ぶ
start
:git status で変更を一覧する;
if (まだツリーにない不要なファイル?) then (はい)
  :保存の候補から外す\n（手元には残す）;
else (いいえ)
  :30秒の規則、保留の規則;
  :保存して push する;
endif
stop
@enduml
```

- **まだツリーにない**不要なファイルだけを外します。すでにツリーにあるものの変更や削除は、今までどおり保存します（消したことを保存できるように）。
- 外したファイルは「未保存」にも数えません。`canonical status` の `changes.unsaved` に入らず、`work finish` の保存の確かめも止めません。
- 取り込みでは、手元の不要なファイルも手元のファイルとして守ります（黙って上書きしません）。
- 不要なファイルをまとめて消しても、大量の削除の保留にはなりません。

## `.gitignore` に足さない理由

- 既存の5つのカタログに効かせるには、利用者のカタログの `.gitignore` を書き換えて保存する必要があり、すべてのカタログに SpecDock の都合のコミットが入ります。
- `.gitignore` は形式1のルートのファイルで、push できなかった最初のコミットを見分ける基準でもあります。中身を変えると、前の版が作った最初のコミットを見分けられなくなります。
- 同期の規則なら、パッケージの更新だけで、すべてのカタログに同じように効きます。

## すでに保存されたファイルの扱い

```sh
spec-dock canonical status --json
```

`changes.junk_files` にパスが出て、`changes.status` が `problem` になります。示したファイルをカタログから消すと、次の同期が削除を保存し、以後は保存しません。

`canonical remove` は、保存しない不要なファイルが残っていると、`CANONICAL_IGNORED_FILES_PRESENT` でパスを示して、何も消さずに止まります。消すか移してから、もう一度実行します。
