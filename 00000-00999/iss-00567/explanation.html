## この資料で分かること

:::summary
- なぜ「仕様化と実装」を1つのセッションに書く例が問題だったか。
- 何を直し、何を直していないか。
:::

## 背景と目的

セッションのモデルと推論は起動のときに決まり、エージェント自身は変えられません。1つのセッションで仕様化と実装をすると、計画に書いた実装の値が使われません。そこで、計画で選べるのは「計画の後に起動するセッション（実装担当）」の値だとし、計画を書いたセッションの値は事実として記録する形にしました。

## 変更の内容

- `cue.md` の2つの例と、Issue の `plan.cue` 雛形のコメントの例を、`spec`（仕様化）と `impl`（実装）の2セッションにしました。
- 手順の `session` は実装（`impl`）を指す、と書きました。
- `execution` の型と検査は変えていません。

## 確認方法

```sh
spec-dock scope check iss-00567
uv run pytest tests/integration/test_issue489_cue_plan_template.py
```
