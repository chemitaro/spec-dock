## この資料で分かること

:::summary
- 帯の欄のチャットが小さく出ていたのは、欄の本文が縦の flex の規則に乗っていなかったからです。
- 直し方は、本文に `data-tab="agents"` を付けて、Scope の欄のエージェントのタブと同じ規則に乗せることです。
:::

## 背景と目的

Scope の欄のエージェントのタブでは、orca-web のチャット（iframe）が欄の残りの高さをすべて使います。
`panel.css` の規則 `.pn-body:is([data-tab="docs"], [data-tab="explanation"], [data-tab="agents"])` が本文を縦の flex にし、iframe の `flex: 1` が効くからです。

指揮の帯の欄は `command_view.js` の `renderAgentPanel` が作りますが、本文に `data-tab` がなく、この規則に乗りません。
そのため iframe は既定の高さ（約 150px）になり、欄の残りが空いていました。

## 直し方

チャットの枠を出すときだけ、本文を `<div class="pn-body" data-tab="agents">` にします。CSS は足しません。
「チャットを開けません。」の表示のときは今のままで、余白も変わりません。
構造の図と『横断の構造』は同じ関数を使うので、両方が直ります。

## 確認方法

構造の図で帯のエージェントの印を押し、チャットの枠が欄の下まで届くことを見ます。テストは次で走ります。

```sh
uv run pytest tests/unit/presentation/test_dashboard_graph_command_screen.py tests/unit/presentation/test_dashboard_allgraph_command_screen.py
```
