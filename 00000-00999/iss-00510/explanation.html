## この資料で分かること

:::summary
- `{"schema_version":99,"schema_version":4}` のような重複キーの宣言は、版4として受け付けず `PRECONDITION_FAILED`（終了コード3）で止まる。
- `workspace doctor --raw` は、これまでどおり曖昧な宣言を観測として返す。
- 観測の間に消えた版3の worktree は、AssertionError ではなく `unavailable` の行になる。
:::

## 背景と目的

#440（0.5.0）の作業で、宣言の読み取りに2つの境界の不足が見つかりました。JSON の標準の読み取りは重複キーの最後の値を採るので、見かけは 99 でも最後が 4 の宣言が版4になっていました。また、`resolve_observed_context` は版3の兄弟の宣言を2回読むため、その間に消えると `assert` で落ちていました。

## 直し方

- `project_context.read_workspace_declaration`：生のバイトを、重複キーで失敗する読み取りで読み直します。ほかの JSON の読み取りは変えません。
- `resolve_observed_context`：再読み取りで宣言が消えていたら `ValueError` を出します。呼び出し元の `workspace sync` と `work start` は `ValueError` を `unavailable` の行にします。
- `workspace doctor --raw` は宣言を解釈しない経路なので変わりません。

## 確認方法

```sh
uv run pytest tests/unit/application/test_project_context_mode.py
```
