## この資料で分かること

:::summary
- 0.9.3 に入る変更は、ダッシュボードと同じ PC の orca-web との連携です（iss-00591〜00593）。コマンドの引数と CLI の JSON の契約は変わりません。
- この Scope は版の番号と `migration.md` と `static-inventory.json` とテストだけを変え、機能のコードは変えません。
- マージ、タグ、導入、配布は、マージの後に統括が行います。
:::

## 背景と目的

0.9.2 の後に PR #596、#597、#598 が main に入りました。本人の PC に届けるには版を上げて配る必要があります。0.9.2（iss-00594、PR #595）と同じ形で、版を上げ、移行の手引きを書き、0.9.2 以前の配布資産を持つリポジトリが `installation update` で上がるようにします。

## 変えるもの

- 版：`pyproject.toml`、`uv.lock`、`system/spec-dock-version`（提供側と dogfood の写し）。
- `migration.md`（提供側と dogfood の写しはバイト一致）：「## 0.9.3 への更新」の節。設定 `config.json` の `orca_web` の節、orca-web の `ORCA_WEB_READ_ORIGINS`、orca-web がないときの動き、送信を決める `sendEnabled` を書きます。
- `static-inventory.json`：`migration.md` と版のファイルの行に今のハッシュを入れ、0.9.2 のバイトを既知の古い版に足します（`reference_cli.md` の行は #597 で済み）。
- テスト：`tests/integration/test_issue599_release_0_9_3.py` と 0.9.2 の旧資産の fixture（3つ）。

## 確認方法

```sh
uv run pytest tests/integration/test_issue599_release_0_9_3.py
make lint
```
