## この資料で分かること

:::summary
- 0.9.5 に入る変更は、ダッシュボードの直しです（iss-00611、iss-00613、iss-00620）。コマンドの引数と CLI の JSON の契約は変わらず、`GET /api/v1/repositories` に `parent`・`tier` の2項目が増えます。
- 『これから』では中に見える Scope がない親が出なくなり、構造の図の稼働の印はエージェントの行にすべて折り返して出ます。
- この Scope は版の番号と `migration.md` と `static-inventory.json` とテストだけを変え、機能のコードは変えません。マージ、タグ、導入、配布は統括が行います。
:::

## 背景と目的

0.9.4 の後に PR #618、#619、#622 が main に入りました。本人の PC に届けるには版を上げて配る必要があります。0.9.4（iss-00609、PR #610）と同じ形で、版を上げ、移行の手引きを書き、0.9.4 以前の配布資産を持つリポジトリが `installation update` で上がるようにします。

## 変えるもの

- 版：`pyproject.toml`、`uv.lock`、`system/spec-dock-version`（提供側と dogfood の写し）。
- `migration.md`（提供側と dogfood の写しはバイト一致）：「## 0.9.5 への更新」の節。
- `static-inventory.json`：`migration.md` と版のファイルの行に今のハッシュを入れ、0.9.4 のバイトを既知の古い版に足します（`reference_cli.md` の行は #619 で済み）。
- テスト：`tests/integration/test_issue623_release_0_9_5.py` と 0.9.4 の旧資産の fixture（3つ）。

## 確認方法

```sh
uv run pytest tests/integration/test_issue623_release_0_9_5.py
make lint
```
