## この資料で分かること

:::summary
- 欄に何が出るか（説明資料が最初のタブ、ほかは詳しい画面と同じタブ）。
- 欄の幅と、スマホの3段のシートの動き。
- 欄と詳しい画面が、同じ部品でタブを描く仕組みと、後でエージェントのタブを足す道。
:::

## 背景と目的

今の欄は構造の図にだけあり、状態や道筋など、わずかな情報しかありません。詳しく読むには詳しい画面へ移り、そこでタブを切り替えます。ボードでは、札を押すとすぐに詳しい画面へ移ります。

一番わかりやすい説明資料（explanation.html）は、詳しい画面の文書のタブから、新しいタブで開くだけでした。この Issue では、ページを移らずに、欄の中で説明資料と詳しいタブを読めるようにします。

## 欄に出るもの

- 見出し：状態、ID、題名、理由、親の道筋。
- タブ：説明資料、概要、依存、配下、文書、Artifact、人のタスク（この順）。説明資料が書かれていれば説明資料、雛形のままやないときは概要を最初に選びます。
- 下の帯：詳しい画面へ移る、詳しい画面を新しいタブで開く、GitHub、（構造の図では）この範囲に絞る。

説明資料は、同じサーバーの `/r/…/files/<ID>/explanation.html` を、sandbox の枠で埋め込みます。雛形のままなら「雛形のまま」、ないなら「まだない」と書き方を示します。

## 幅とスマホのシート

- PC：ダッシュボードの幅の 44% を、380px から 720px の間に収めます（1440 で約 634px）。図の上の帯とボードの列は、欄の左に収めます。
- スマホ（640px 以下）：下からのシートで、高さは3段です。

```plantuml id=sheet
@startuml
title スマホのシートの3段
[*] --> 通常 : Scope を押す
通常 --> 全体 : 上へ払う／取っ手を押す
全体 --> 通常 : 下へ払う／取っ手を押す
通常 --> 最小 : 下へ払う
最小 --> 通常 : 上へ払う
最小 --> [*] : さらに下へ（閉じる）
@enduml
```

シートを動かすのは取っ手と見出しの帯だけです。タブの中身や説明資料の枠の中のスクロールは、シートを動かしません。

## 同じ部品でタブを描く

詳しい画面のタブの中身は、共有の部品（`views/_shared/scope_tabs.js`）に移し、欄と詳しい画面が同じ関数で描きます。違いは、リンクの作り方（ページの URL を変えるか、欄の中だけで切り替えるか）だけで、それを `env` という小さな受け口で渡します。

タブは1つの並び（`SCOPE_TABS`）で決まります。後で Orca のエージェントのタブを出すときは、この並びに1つ足すだけです（今回は足しません）。

## 確認方法

```sh
uv run pytest tests/unit/infra/test_dashboard_screens_js.py
spec-dock dashboard serve --port 18588 --offline --state-root <写した状態の置き場>
```

ボードで札を押して欄が開くこと、説明資料のタブ、タブの切り替え、詳しい画面へ移れることを、1440・1000・390 の幅で確かめます。
