title: 構造の図の線が箱や別の線に重ならないようにする（iss-00627）
lead: 構造の図で、依存の線が枠の見出しをかすめたり、線どうしが重なったりしていた原因と、その直し方を説明します。
category: 説明資料
audience: 本日チームに加わった新メンバー
status: 完成

## この資料で分かること

:::summary
- 構造の図は、配置（layout.js）が決めた箱・枠の大きさに合わせて線の通り道（router.js）を計算し、画面がその座標に箱を描きます。
- 画面で描いた枠の見出しが、配置の見込みより少し高かったので、線が見出しの端をかすめていました。見出しの行の高さを、配置の値に固定して直しました。
- 題名が2行に折り返す縮めた枠は、描くまで高さが分からないので、描いた後に測って配置をやり直します（2回まで）。
- 線の通り道の計算にも、車線（8px の間隔）を重ねたまま「足りている」と判断する不具合が3つあり、それも直しました。
:::

## 背景と目的

倍率 100% の線の検査（ブラウザーで `window.specdockEdgeAudit()`）で、いくつかのリポジトリの構造の図に違反が残っていました。
たとえば housing-lifecycle の『全体』では、線が Epic の見出しに重なり（boxHits 6）、taikyohiyou_project の『いま』では、線どうしが 8px より近く重なっていました（overlaps 8）。

## 原因は2つ

1. **見出しの高さのずれ**：配置は「題名の行 22px＋間 6px＋要約の行 18px」と見込みますが、画面では題名の行が 25.6px（16px の字に行の高さ 1.6）、要約の行が 19.2px でした。Epic は上の縁 1px も余白に入っていませんでした。
2. **線の通り道の計算**：稼働の印の行で高くなった箱を入れると、DOM がなくても重なりが出ました。広い通り道の線を A* の位置に留める近道、入口に 8px おきに並ぶ動かない線の間に挟まる線、向かいの箱の出口と同じ高さに置かれる入口、の3つです。

## 直し方

| 直したところ | 内容 |
|---|---|
| graph.css | 題名の行 22px、要約の行 18px、Epic の上の余白 8px（縁の 1px を吸収）、縮めた枠の下の余白 |
| layout.js | 縮めた枠の測った高さ（`heads`）を受け取り、見込みより高ければその高さにする |
| measure.js・graph.js・allgraph.js | 描いた後に縮めた枠を測り、高さが違うときだけ配置をやり直す（稼働の印の行と同じ数えで2回まで） |
| router.js | 近い組が残る束だけ並べ直す。入口の高さを、向かいの出口とぶつかるときはそろえない |

線を描いた後に違反を隠すような直し方（検査の余白を変えるなど）はしていません。

## 確かめ方

- node のテスト：`tests/fixtures/issue627/route_inputs.json`（題名を伏せた実データの入力）で違反0、縮めた枠の高さと測り直しの判定。
- 実機：1440・1000・390 × 3つの範囲 × 明暗で、単体の構造の図2つと『横断の構造』の線の検査がすべて0。
- 240 組の node の比べで、直す前より違反の増えた組は0。木の表示の taikyohiyou『全体』の 9 は直す前から同じで、別の Issue で扱います。
