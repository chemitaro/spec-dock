title: 文書のタブを詰めて、仕様と報告を広く読む
lead: Scope の欄と詳しい画面で、「文書」と「説明資料」のタブの上の要素を1行に詰め、埋め込んだ文書の枠に残りの高さをすべて使わせます。

## この資料で分かること

:::summary
- 文書のタブで選べる文書が「仕様」と「報告」の2つになり、選ぶ部分が1行の小さな切り替えになること。
- 「検査の誤りなし」の帯と計画の進み具合が文書のタブから消え、誤りがあるときだけ1行の帯が出ること。
- 埋め込んだ文書の枠が、欄・詳しい画面・スマホの全体の段のどれでも、残りの高さを使うこと。
:::

## 背景と目的

iss-00587 で、構造の図とボードの欄に、詳しい画面と同じタブを出しました。ところが文書のタブでは、上に「検査の誤りなし」の帯、計画の進み具合、文書を選ぶ大きな札が積まれ、PC の欄（1440×900）では、最初に見える文書の枠が 178px しかありませんでした（1000×800 では 0px）。説明資料の札は新しいタブで開くだけで、説明資料は専用のタブで読めます。

## 変わること

| 場所 | 直す前 | 直した後 |
|---|---|---|
| 文書を選ぶ部分 | 大きな札（要件・設計・計画、説明資料、報告） | 1行の切り替え「仕様｜報告」と、右端の「新しいタブ」 |
| 検査の結果 | 誤りがなくても帯 | 誤りがあるときだけ1行の帯（開くと一覧） |
| 計画の進み具合 | 文書のタブにも | 概要のタブだけ |
| 枠の高さ | 固定（中身をスクロールして届く） | 残りの高さすべて |
| 説明資料のタブ | 「説明資料 / 新しいタブで開く」の帯 | 同じ形の細い1行の帯 |

## 確認方法

ダッシュボードで Scope を選び、欄の「文書」のタブを開きます。切り替えの行のすぐ下から欄の下端まで、文書の枠が広がっていれば正しく動いています。

```sh
spec-dock dashboard serve
```
