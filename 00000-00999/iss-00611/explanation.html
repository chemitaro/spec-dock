## この資料で分かること

:::summary
- 「これから」で、子を持つ Scope は、中に見える子孫があるときだけ出ること。
- 子のない開いた Scope（まだ切り分けていない Initiative・Epic、Issue）は今どおり出ること。
- 「全体」「いま」は何も変わらないこと。
:::

## 背景と目的

iss-00603 で、構造の図の見せる範囲を「全体｜いま｜これから」にしました。「これから」は、終わったものと片付けの候補を出さず、それを持つ親は、中に候補でない開いたものがあるときだけ枠として出します。

ただ、親自身が開いていて候補でなければ、中が空でも出ていました。orca-web の init-00002 は、開いた子が片付けの候補の Epic 2つだけなので、「これから」では中のない枠として1つ残ります。本人（2026-11-16）は「中が片付けの候補だけなら、これから行う仕事はないので出さないべき」と指摘しました。

## 規則

- 子を持つ Scope は、「これから」で見える子が1つ以上あるときだけ出します。自身の状態は見ません。
- 子のない Scope は、終わっておらず片付けの候補でなければ出します（今のまま）。
- 下の段から決めるので、Epic が消えれば、その Initiative も消えることがあります。
- URL の focus で絞った Scope 自身は、中が空でも出します。

## 確かめ方

合成の構造で、init-00002 の形・3段の形・子のない Initiative・候補でない子を持つ Initiative・子を持つ Issue を並べ、入れ子と木の両方で、出るものと出ないものを確かめます。「全体」「いま」は、iss-00603 で記録した配置の digest と一致することで確かめます。最後に、orca-web・spec-dock・housing-lifecycle の実データで、直す前と後の「これから」を写します。

```sh
uv run pytest tests/unit/presentation/test_dashboard_graph_range.py
```
