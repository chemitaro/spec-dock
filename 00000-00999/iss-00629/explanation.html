## この資料で分かること

:::summary
- iss-00614 の『横断の構造』が、開いて『収める』と 12% ほどの小ささになる理由。
- リポジトリの枠の中で、親の図と子の枠を1つの並びにして、見える幅で折り返す決まり。
- 開いたときの最初の表示を『幅に合わせる』にする理由と、横にはみ出す並びを採らなかった理由。
:::

## 背景と目的

『横断の構造』は、company-os → 事業 → プロダクトの入れ子のリポジトリの枠に、各リポジトリの構造の図を入れて1枚に描く画面です。
実データでは、各リポジトリの図そのものが、折り返せない Initiative の塊のために画面の幅（100% で見える幅）とほぼ同じか、それより広くなります。
そのため枠は縦に1列に積まれ、『これから』の世界は 1440 の画面で約 2400×6800 px、全体を1画面に収めると 12% 前後になって読めません。

見える幅を超えて横に並べれば『収める』の倍率は 20〜25% まで上がりますが、本人は以前、構造の図で「100% で画面から大きくはみ出す横並び」を嫌い、見える幅で折り返す決まりにしました（iss-00583）。
統括はこの決まりを守り、目標を「全体を1画面に収める」から「開いたときに幅に合わせ、読める大きさで縦に読む」へ替えました。

## 変えること

1. **枠の中の並び**：親の図を先頭に、子のリポジトリの枠をその後に、親の中身が使える幅まで左から右へ並べ、入らなければ次の行へ折り返します。親の図の右に空きがあれば、狭い子の枠（プロダクトなど）がそこに入ります。
2. **最初の表示**：PC の幅では、倍率を「画面の幅 ÷ 世界の幅」（1 まで）にし、左上に合わせます。横にはみ出さず、縦に移動して読み進めます。スマホは今どおり 74% です。
3. **変えないこと**：各リポジトリの中の図の配置（単体の構造の図と同じ）、『収める』、拡大・縮小、範囲の選びと保存、後から足す指揮の帯の高さの入力。

```plantuml id=flow
@startuml
title 親の枠の中の並び（見える幅で折り返す）
skinparam rectangleBorderColor #888
rectangle "見出し・警告・（後から足す帯）" as H
rectangle "親の図" as G
rectangle "子の枠 1" as C1
rectangle "子の枠 2" as C2
rectangle "子の枠 3（入らないので次の行）" as C3
H -[hidden]down-> G
G -[hidden]right-> C1
C1 -[hidden]right-> C2
G -[hidden]down-> C3
@enduml
```

uv run pytest tests/unit/presentation/test_dashboard_allgraph_compose.py tests/unit/presentation/test_dashboard_allgraph_screen.py
```
