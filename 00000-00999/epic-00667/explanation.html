## 背景と目的

統括が誰も指揮していないと、main のチェックアウトは図に出ません。work start せずに作業している worktree も見えません。iss-00668 で、帯を「Unscoped」の行に変え、git の worktree の一覧を土台に、両方を並べます。

## 確認方法

iss-00668 の report.md の実機の確かめを読みます。
