---
title: 構造の図の依存の線を、いつもすべて出す
lead: 構造の図の道具の帯から「待っている線｜すべての線｜線なし」の切り替えをなくし、依存の線をいつも同じ描き方で出します。
category: 説明資料
audience: 本日チームに加わった新メンバー
status: 仕様
---

## この資料で分かること

:::summary
- 依存の線の切り替えが、なぜなくなるのか。
- 線がどう描かれるか（終わった依存は薄く、待っている依存は目立つ）。
- 前に「待っている線」や「線なし」を選んでいた人の保存が、どう扱われるか。
:::

## 背景と目的

構造の図では、見せる範囲を「全体・いま・これから」で選べます（#603）。本人（2026-11-16）は、見せる範囲で十分に絞れるので、線を描く範囲の切り替えは要らないと判断し、「すべての線」を常にして3つのボタンを削除することを求めました。道具の帯が短くなり、スマホ（390px）でも詰まって収まります。

## 線の描き方

| 依存 | 描き方 |
|---|---|
| 待っている（相手がまだ終わっていない） | 目立つ線 |
| 終わった（相手が終わった） | 薄い線 |
| 見せる範囲で相手が見えない | 描かない（今どおり） |
| これからで、端が終わった Scope | 描かない（今どおり） |

箱を選んだときに直接の依存を強調する動きと、凡例の説明は変わりません。

## 保存の扱い

ブラウザーの保存の鍵は `specdock.graph.v3` のままです。残る項目（表し方、見せる範囲、凡例）の意味は変わらないので、鍵の版は上げません。前に保存した線の選択（deps）は読まずに捨て、次に何かを押したときの書き込みで消えます。

## 確認方法

```sh
uv run pytest tests/unit/presentation/test_dashboard_graph_toolbar.py tests/unit/presentation/test_dashboard_graph_js.py
```
