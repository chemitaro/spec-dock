title: native lock のテストが git の自動の maintenance と競合して揺れるのを直す
lead: 全体のテストで時々落ちていた native lock のテストの原因と、テストの側の隔離による直し方を説明します。

## この資料で分かること

:::summary
- 揺れの原因は、テストの fixture の `git commit` が切り離して起こす自動の maintenance で、製品の不具合ではないこと。
- 直し方は、テストの git の環境で `maintenance.auto=false` と `gc.auto=0` を与えること。
- テストの主張（`.git` に何も書かないこと）は緩めないこと。
:::

## 背景と目的

`tests/integration/test_issue413_native_lock.py` は、Start の lock が `.git` に何も書かないことを、`.git` の中身を前後で写して比べて確かめます。git 2.56 の `git commit` は、書いた後に `git maintenance run --auto --detach` を起こします。切り離された子は commit が返った後に `.git/objects/maintenance.lock` を作って消すので、写す途中でファイルが消えたり、前後で違って見えたりして、時々落ちていました。

## 直し方

テストが git に渡す環境に、`GIT_CONFIG_COUNT` などで `maintenance.auto=false` と `gc.auto=0` を足します。init、commit、clone、worktree add のどれにも効きます。設定が効き、commit が maintenance を起こさないことを、別のテストで見張ります。

## 確かめ方

```sh
for i in $(seq 1 50); do uv run pytest -q tests/integration/test_issue413_native_lock.py || echo FAIL $i; done
```
