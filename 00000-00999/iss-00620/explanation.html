lead: 構造の図の箱から『後に続く』の数をなくし、orca-web のエージェントの印を、上限なしに、はみ出さずに出すしくみを説明します。

## この資料で分かること

:::summary
- 構造の図の箱と枠から『後に続く』の数が消える理由（依存の線で見て分かる）と、ボードには残ること。
- エージェントの印を、ほかの印の行の残りに全部入るときだけ1行目に置き、入らなければまとめて次の行から折り返す規則。
- 印の行が増えた分だけ箱が縦に伸び、要約が来ても行の数が変わらなければ配置をやり直さないこと。
:::

## 背景と目的

iss-00592 で、構造の図の箱に orca-web の稼働の印を出しました。印の置き場は下の段の右端にあり折り返さないので、保証レベル・PR・worktree・『後に続く』の印と合わせて箱の幅を越えると、右の縁からはみ出していました。本人の要望（2026-11-17）で、構造の図では『後に続く』の数を出さず、エージェントの印はすべて箱の中に収めます。

## 全体の構成

```plantuml id=overview
@startuml
title 印の行の数と配置
top to bottom direction
component "orca-web の部品\n(印を描く)" as Part
component "graph.js\nmeasureMarks・checkRows" as Graph
component "layout.js\nmarkRows・rowsOf" as Layout
Part --> Graph : 描いた印の実寸
Graph --> Layout : 箱ごとの幅 {lead, items, gap}
Layout --> Graph : 行の数と箱の高さ
Graph --> Graph : 行の数が変わったときだけ\n配置をやり直す
@enduml
```

- 行の数の規則は layout.js の純粋な関数 `markRows` にあり、配置と画面が同じ関数を使います。
- 印の幅は、描いた部品の実寸を測ります。決まった幅にすると、早く折り返しすぎるか、はみ出すからです。

## 折り返しの規則

1. ほかの印（保証レベル・PR・worktree・人のタスク）は、今の並びのまま1行目に置きます。
2. エージェントの印は、全部が1行目の残りに入るときだけ、1行目の右寄せに置きます。
3. 1つでも入らないときは、エージェントの印をまとめて次の行に移し、その行から箱の幅で折り返します。
4. 箱の高さは、使った行の数で決まります（1行増えるごとに 20px）。

## 確認方法

構造の図を開き、エージェントの多い worktree の箱で、印が箱の中に収まっていることを見ます。ブラウザーの開発者ツールで次を実行すると、線の検査と、印のはみ出しの数（`markOverflow`）が分かります。

```js
specdockEdgeAudit()
```
