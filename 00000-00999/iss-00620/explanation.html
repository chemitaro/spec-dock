## この資料で分かること

:::summary
- エージェントが1人以上いる箱と枠では、印がいつもほかの印の下の専用の行（エージェントの行）に出ること。
- エージェントの行は左寄せで、箱の幅で折り返すこと。
- 印の行が増えた分だけ箱が縦に伸び、要約が来ても行の数が変わらなければ配置をやり直さないこと。
:::

## 背景と目的

iss-00592 で、構造の図の箱に orca-web の稼働の印を出しました。印の置き場は下の段の右端にあり折り返さないので、保証レベル・PR・worktree・『後に続く』の印と合わせて箱の幅を越えると、右の縁からはみ出していました。本人の要望（2026-11-17）で、エージェントの印は上限なしに、すべて箱の中に収めます。『後に続く』の数は今のまま残します（印が専用の行に移るので場所が空く）。

## 全体の構成

```plantuml id=overview
@startuml
title 印の行の数と配置
top to bottom direction
component "orca-web の部品\n(印を描く)" as Part
component "graph.js\nmeasureMarks・checkRows" as Graph
component "layout.js\nmarkRows・rowsOf" as Layout
Part --> Graph : 描いた印の実寸
Graph --> Layout : 箱ごとの印の幅 {items, gap}
Layout --> Graph : 行の数と箱の高さ
Graph --> Graph : 行の数が変わったときだけ\n配置をやり直す
@enduml
```

- 行の数の規則は layout.js の純粋な関数 `markRows` にあり、配置と画面が同じ関数を使います。
- 印の幅は、描いた部品の実寸を測ります。決まった幅にすると、早く折り返しすぎるか、はみ出すからです。

## エージェントの行の規則

1. ほかの印（保証レベル・PR・worktree・人のタスク・後に続く）は、今の行のまま置きます。
2. エージェントが1人以上いれば、エージェントの印をいつもその下の専用の行に置きます（ほかの印と混ぜない）。
3. エージェントの行は左寄せで、箱の幅で折り返します。1行ごとに箱が 20px 伸びます。
4. エージェントがいなければ、エージェントの行は作らず、箱の高さは今のままです。
5. 枠（Initiative・Epic の見出し）も同じで、見出しの下に専用の行を置きます。並び順は orca-web の部品の順のままです。

## 確認方法

構造の図を開き、エージェントの多い worktree の箱で、印が箱の中に収まっていることを見ます。ブラウザーの開発者ツールで次を実行すると、線の検査と、印のはみ出しの数（`markOverflow`）が分かります。

```js
specdockEdgeAudit()
```
