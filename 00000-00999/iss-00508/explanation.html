## この資料で分かること

:::summary
- `worktree remove` が、どんな時に `--discard-ignored` なしで無視されたファイルを消していたか。
- 直した後は、無視されたものの判定を、削除の直前（unlock の後）に毎回行うこと。
- 防げない残りの短い時間と、その避け方。
:::

## 背景と目的

canonical モードの worktree には、仕様のカタログへのリンク `spec-dock/initiatives` があり、Git からは「無視されたファイル」に見えます。`worktree remove` は、無視されたものがこのリンクだけなら、`--discard-ignored` なしで消せるようにしています。

ところが、この判定は unlock の前に1回だけ行われ、真なら「`--discard-ignored` が付いた」ものとして後の処理に渡していました。後の処理は、`--discard-ignored` があると無視されたものの確かめを飛ばすので、判定の後（特に unlock の後）にできた無視されたファイルも、Git の `worktree remove` が消していました（`iss-00440/report.md` の後続の候補6）。

## 直し方

- `--discard-ignored` の真偽を書き換えるのをやめ、「無視されたものが正しいリンクだけか」を確かめる判定を、後の処理に渡します。
- 後の処理は、最初の確かめ、unlock の前の確かめ、unlock の後（削除の直前）の確かめのたびに、この判定を呼びます。リンクのほかのものがあれば、今までと同じエラー（`WORKTREE_REMOVE_FAILED`）で止まります。
- 公開の契約（エラーのコード、終了コード、JSON の形）は変わりません。

```plantuml id=overview
@startuml
title worktree remove --unlock の流れ（直した後）
start
:無視されたものを判定（リンクだけ？）;
:unlock の前の確かめ（判定をもう一度）;
:git worktree unlock;
:unlock の後の確かめ（判定をもう一度）;
if (リンクのほかに無視されたものがある？) then (ある)
  :何も消さずに止まる（partial、終了コード6）;
  stop
else (ない)
  :git worktree remove;
endif
stop
@enduml
```

## 防げない残り

最後の確かめが終わってから、Git が実際に消すまでの短い間（Git の呼び出し1回分）にできたファイルは守れません。消したくないファイルがある worktree は、ロックしたままにしておけば、`--unlock` なしでは消えません。

## 確認方法

```sh
uv run pytest tests/cli_runtime/test_issue508_worktree_remove_ignored.py
spec-dock scope check iss-00508
```
