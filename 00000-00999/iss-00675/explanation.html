## この資料で分かること

:::summary
- 0.9.10 に入る変更は、`canonical status` の `tools.antigravity` と Antigravity の案内（iss-00673）、エージェントの種類の名前（iss-00674）、『これから』の指揮の線（iss-00676）です。コマンドの引数と画面の道は変わりません。
- Antigravity を作業用のworktreeで使う人は、ユーザーの設定に `read_file` と `write_file` の規則を1回だけ足します。
- この Scope は版の番号と `migration.md` と `static-inventory.json` とテストだけを変え、機能のコードは変えません。マージ、タグ、導入、配布は統括が行います。
:::

## 背景と目的

0.9.9 の後に PR #678、#677、#679 が main に入りました。本人の PC に届けるには版を上げて配る必要があります。0.9.9（iss-00670、PR #671）と同じ形で、版を上げ、移行の手引きを書き、0.9.9 以前の配布資産を持つリポジトリが `installation update` で上がるようにします。

## 変えるもの

- 版：`pyproject.toml`、`uv.lock`、`system/spec-dock-version`（提供側と dogfood の写し）。
- `migration.md`（提供側と dogfood の写しはバイト一致）：「## 0.9.10 への更新」の節と、0.9.9 の節の『これから』への注。
- `static-inventory.json`：`migration.md` と版のファイルの行に今のハッシュを入れ、0.9.9 のバイトを既知の古い版に足します（`canonical.md` と `reference_cli.md` は #677 で済んでいます）。
- テスト：`tests/integration/test_issue675_release_0_9_10.py` と 0.9.9 の旧資産の fixture（4つ）。

## 確認方法

```sh
uv run pytest tests/integration/test_issue675_release_0_9_10.py
make lint
```
