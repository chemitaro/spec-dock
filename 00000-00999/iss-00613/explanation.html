## この資料で分かること

:::summary
- `GET /api/v1/repositories` の各リポジトリに `parent` と `tier` が増えること。
- 親と札を、登録された main のチェックアウトの道からどう決めるか。
- 隠したリポジトリ、クローンが2つのリポジトリをどう扱うか。
:::

## 背景と目的

Epic epic-00612 は、表示しているすべてのリポジトリの仕事を、会社の入れ子（company-os → 事業 → プロダクト）のまま1枚の『横断の構造』に描きます。
画面（iss-00614）が入れ子を知るために、サーバーが親と段の札を決めて、一覧の API で返します。道そのものはブラウザーに渡しません。

## 決め方

- **親**：あるリポジトリの main のチェックアウトを中に持つ、出すリポジトリのうち、いちばん深いもの。なければ最上位（`parent: null`）。道の部分で比べるので、`a` と `a-b` は親子になりません。
- **段の札**：いちばん近い登録されたチェックアウトから子までの、途中のディレクトリの名前。`businesses` は「事業」、`products` は「プロダクト」、`services` は「サービス」、ほかはそのまま。
- **隠したもの**：一覧に出ず、親にもなりません。その中のものは外の出す祖先の子になり、札は隠したものから数えるので、その名前は出ません。
- **クローンが2つのもの**：チェックアウトが1つに決まらないので、最上位で、親になりません。

```plantuml id=overview
@startuml
title 入れ子の例（合成の道）
rectangle "company-os（parent: null, tier: []）" {
  rectangle "housing-lifecycle（tier: [事業]）" {
    rectangle "taikyohiyou_project（tier: [プロダクト]）"
  }
  rectangle "input-devices（tier: [事業]）" {
    rectangle "yubisaki ほか（tier: [プロダクト]）"
  }
}
rectangle "spec-dock（parent: null）"
rectangle "orca-web（parent: null）"
@enduml
```

## 確認方法

```sh
curl -s http://127.0.0.1:<番号>/api/v1/repositories | jq '.repositories[] | {repository, parent, tier}'
```
