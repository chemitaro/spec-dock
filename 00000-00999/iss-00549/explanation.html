## この資料で分かること

:::summary
- 人のタスクが、カタログのどこに、どんな形で置かれるか。
- `todo` の10のコマンドが何をし、何をしないか（GitHub に触れない、Scope の判定を変えない）。
- 記録の正しさを、書く前の Python の検査と `todo check` の `cue vet` の2段で守る仕組み。
- 件数の目安と既定の期限を、3段の設定で変える方法。
:::

## 背景と目的

人への依頼は、会話のログや端末に散らばって失われがちでした。親の Epic（epic-00547）は、人のタスクを各リポジトリのカタログ（`spec-dock/canonical` ブランチ。どの worktree からも `spec-dock/initiatives/` で見え、定期の同期が保存する）に唯一の正本として置くと決めました。この Issue はその第1波で、記録の形と、チェックアウトの中で使う CLI の中核を作ります。全リポジトリの集約は iss-00550、スキルの規則は iss-00551 です。

## 全体の構成

```plantuml id=overview
@startuml
title todo の CLI の層
top to bottom direction
actor "人・エージェント" as User
component "cli/catalog.py\n（10の葉）" as Cli
component "application/todo_*\n（順番、ロック）" as App
component "domain/todo_record・todo_model・todo_settings\n（形、移り変わり、期限、並び、設定）" as Domain
component "infra/todo_store・user_config・cue_tool" as Infra
database "カタログ todos/<YYYY-MM>/t-xxxx.json\ntodos/settings.json" as Catalog
database "~/.config/spec-dock/config.json" as User2
User --> Cli
Cli --> App
App --> Domain
App --> Infra
Infra --> Catalog
Infra --> User2
@enduml
```

- **記録**：`todos/<作った年月>/t-xxxx.json`。ID は `t-` と4文字（`i`、`l`、`o`、`u` を除く小文字の base32）。閉じても動かさず、消しません。
- **書く順番**：リンクを確かめる → 入力を確かめる → カタログのロックの中で読み直し、変えた後の記録を検査する → 通ったときだけ1つのファイルを置き換える。どこで止まっても何も書きません。
- **2段の検査**：書く前は Python の型、`todo check` は Python の検査に加えて `cue vet`（`#Todo`）で全部の記録を確かめます。同じ見本で2つの型が一致することをテストで縛ります。

## 主なコマンド

| コマンド | 働き |
|---|---|
| `todo add --title T` | 人のタスクを題名だけで登録します（既定の期限は4時間後）。エージェントは `--by agent --role R --kind K --body … --reply-to … --effort 10m` が必須です |
| `todo add --parent t-xxxx --title S` | サブタスクを足します（1段だけ） |
| `todo list [--scope ID] [--blocking] [--overdue]` | 期限切れ、期限間近、止めているもの、あとで、の順に並べます |
| `todo show`／`update`／`done`／`snooze`／`cancel`／`reopen` | 1件を見る・直す・閉じる・延期する・取り消す・開き直す |
| `todo check` | 全部の記録を検査します |
| `todo settings` | 目安の件数と既定の期限の、効いている値と出どころを示します |

## 設定の3段

初めの値 < 利用者の設定（`$XDG_CONFIG_HOME/spec-dock/config.json` の `todo`）< リポジトリの設定（カタログの `todos/settings.json`）の順に、鍵ごとに後のものが勝ちます。壊れたファイルは警告して飛ばし、コマンドは止まりません。

## 確認方法

```sh
spec-dock todo add --title "見本のタスク" --json
spec-dock todo list
spec-dock todo check
spec-dock todo settings --json
```
