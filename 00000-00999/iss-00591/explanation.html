## この資料で分かること

:::summary
- 画面がどこの orca-web を読むか（画面を開いた名前の 8791）と、その切り方。
- サーバーが返す worktree の記録と、画面が orca-web の要約と突き合わせる2つの段。
- orca-web に届かないとき、設定が壊れているときに、何も壊さず印を出さない側に倒れること。
:::

## 背景と目的

orca-web は、Orca のエージェントの稼働を外から読める別のサービスです。SpecDock のダッシュボードは、Scope の箱や札にエージェントの印を重ねたいのですが、SpecDock のサーバーは orca-web を読みません（見るだけのまま）。ブラウザーの画面が orca-web を直接読み、SpecDock の worktree の記録と突き合わせて、どの Scope のエージェントかを決めます。

## 全体の構成

```plantuml id=overview
@startuml
title 読みと対応の流れ
top to bottom direction
actor "利用者" as User
component "SpecDock のサーバー" as Server
component "画面の core/orca.js" as Orca
component "core/orca_match.js（純粋）" as Match
component "orca-web" as Web
User -> Server : 画面を開く（Host の名前）
Server --> User : CSP と server.orca_web（origin）
Orca -> Server : 構造の API（worktree の記録）
Orca -> Web : 要約を10秒ごとに読む
Orca -> Match : 記録と要約
Match --> Orca : Scope ごとの worktree
@enduml
```

- 場所：`config.json` の `orca_web`（`enabled`、`port`）。既定は有効で 8791。ホスト名は画面を開いた名前のまま。
- 対応：まずパスの一致。次に、同じリポジトリ（パスが一致した worktree と同じ `project.id`）の中だけで、ブランチ名の一致。要約の `issue` は使いません。

## 確認方法

```sh
uv run pytest tests -k orca
spec-dock scope check iss-00591
```
