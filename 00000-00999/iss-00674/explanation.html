## この資料で分かること

:::summary
- 種類の名前の正本は orca-web の `AGENT_ICONS` の1か所で、SpecDock は部品の書き出しを読むだけです。
- 名前を引く決まりは `agents_logic.js` の `agentTypeLabel` の1つに閉じ、画面の5か所がそれを通します。
- 部品がない、表がない、知らない種類のときは、今までどおりの文字が出ます。
:::

## 背景と目的

Orca に Antigravity CLI が入り、`agentType` が `antigravity` のエージェントが動くようになりました。ダッシュボードは種類を `antigravity` のような生の文字列で出していたので、orca-web の印や送信の欄と同じ名前（『Antigravity』）で出すようにします。

## 全体の構成

```plantuml id=overview
@startuml
title 種類の名前の引き方
component "orca-web の部品\n/embed/agent-marks.js\n(AGENT_ICONS, iconKey)" as Marks
component "core/orca.js\norca.marks()" as Orca
component "agentTypeLabel\n(agents_logic.js)" as Label
component "5か所の表示\nタブの選び・iframe の title・\n詳細の欄2つ・数の札" as Views
Marks --> Orca : 読み込む
Orca --> Views : 部品を渡す
Views --> Label : 部品と agentType
Label --> Views : 名前、または今の文字
@enduml
```

`iconKey(agentType)` が `other`・`none` でない鍵を返し、その項目に名前があれば名前を、そうでなければ `agentType`（なければ『種類不明』など、各所の今の文字）を返します。

## 確認方法

```sh
uv run pytest tests/unit/infra/test_dashboard_agents_logic_js.py
```
