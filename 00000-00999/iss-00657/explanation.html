---
title: 指揮の線の点を読みやすく流す
lead: 構造の図と『横断の構造』の黄色い指揮の線は、点が速く細かく動き、点滅に見えて向きが読めませんでした。点を間を広げた大小2つの組にし、ゆっくり流して、止まった絵でも親から子への向きが分かるようにします。
category: 説明資料
audience: 本日チームに加わった新メンバー
status: 仕様のレビュー前

## この資料で分かること

:::summary
- 点滅に見えた原因は、8px ごとの同じ点が 0.2秒で同じ絵に戻る速い切り替えでした。
- 点を 24px ごとの組にし、組の先に大きく明るい点、6px 後ろに小さく薄い点を置きます。止まった1枚でも向きが分かります。
- 0.1秒ごとに 2px（20px/秒）ずつ、12枚の絵の切り替えで流します。軽さを保つ仕組み（iss-00646）はそのままです。
- 波紋も 3.6秒の落ち着いた速さにそろえます。
:::

## 背景と目的

iss-00646 で、点の流れを、2px ずつずらした止めた絵4枚を 0.05秒ごとに切り替える形にし、画面を軽くしました。ところが点の間が 8px と狭く、どの点がどこへ移ったのか目で追えないため、本人には 5Hz の点滅に見え、情報がどちらへ進むのか分かりませんでした。

## 数の前と後

| | 前（iss-00646） | 後（この Issue） |
|---|---|---|
| 点（組）の間 | 8px | 24px |
| 組の形 | 同じ点 | 頭 3.5px（不透明）と 6px 後ろの尾 2px（.45） |
| 1回のずれ | 2px | 2px |
| 枚数 | 4 | 12 |
| 1枚の時間 | 0.05秒 | 0.1秒 |
| 速さ | 40px/秒 | 20px/秒 |
| 1周 | 0.2秒 | 1.2秒 |
| 波紋 | 2.4秒（2つ目 1.2秒遅れ） | 3.6秒（2つ目 1.8秒遅れ） |

## 仕組み

切り替えの絵の各々に、同じ道を2本の点の線で描きます。どちらも 24px ごとに点が1つ来る破線で、尾の線だけを 6px 後ろへずらします。12枚の絵は、各々が 0.1秒だけ見えるように、遅れをずらした不透明度のアニメーションで切り替わります。これはブラウザーの合成の仕組みだけで動き、ページの描き直しを起こしません。

動きを減らす設定では、ずらし0の1枚だけを見せます。その1枚にも大小の組があるので、向きが分かります。

## 確認方法

同じ台本（Epic の `.workbench/perf-measure.mjs`）で、横断の構造 0.11秒以下、単体の構造の図 0.07秒以下／10秒を保つことを測ります。0.1秒ごとの連続の写しで、組が子へ進むのを確かめます。

```sh
spec-dock scope check iss-00657
uv run pytest tests/unit/presentation/test_dashboard_graph_command_motion.py
```
