## この資料で分かること

:::summary
- PC で画面の本体が高さ0になる理由と、骨組みの格子での直し方。
- 構造の図の保証レベルとブランチの印に値が入る仕組みと、5秒ごとの自動の更新に耐える工夫。
- 印の部品の置き場、「見た」の 409、依存の線の重なりの扱い。
:::

## 背景と目的

ダッシュボード（Epic #427）の第3波で、骨組み（#529）、ボード・詳しい画面・概況（#531）、構造の図・時間の軸（#532）が入りました。3つの Issue は並んで作られたため、つなぎ目にいくつかの手直しが残りました。0.6.0 を出す前に、それをまとめて直します。

## 5つの手直し

| 件 | 起きていること | 直し方 |
|---|---|---|
| 骨組みの格子 | PC では画面の切り替えと知らせの帯が出ず、格子の自動の配置で `<main>` が高さ auto の行に入り、高さ0になる | 格子の4つの行を CSS で明示する。#532 の回避（`grid-row: 4`）を消す |
| 保証レベルとブランチ | 構造の API の `assurance`・`branch` が常に `null` | 全 Scope 分を読む。`git worktree list` は要求ごとに1回、保証レベルはファイルの時刻と大きさで覚え、外の処理は合わせて3秒まで |
| 印の部品の重なり | アイコンや言葉の表が `core/ui.js`、`views/_shared/`、`views/graph/marks.js` に分かれている | 値を `core/ui.js` に寄せる。HTML は変えない |
| 「見た」の 409 | スナップショットのないリポジトリでも「見た」を送り、サーバーが 409 を返してブラウザーにエラーが出る | 構造のデータがあるときだけ送る |
| 線の重なり | 線の多い構造の既定でない組み合わせで、車線の重なりが残る | 引き直しを最大10回にし、収まらないときは検査の問題が最も少ない回を描く |

## 保証レベルの読み取りと覚える仕組み

保証レベルは `requirement.cue` を `cue` で評価して読みます。1件は約10msですが、Scope が多いと要求のたびに走らせるのは重いため、ファイルの更新時刻と大きさを覚え、変わらなければ前の値を使います。3秒の上限に達したら、残りは `null` のまま返し、次の要求で続きを読みます。どの読み取りが失敗しても、画面は開き、その項目だけが空になります。

## 線の重なりで直さないもの

木の表し方では、すべての Scope が字下げの1列に並び、長い縦の線が狭い通り道を取り合います。広げられる隙間が字下げ1つしかないため、線が280本を超える構造では重なりが残ります。直すには木の線の通り道を作り直す必要があり、この Issue では扱いません。

## 確認方法

- `uv run pytest`：構造の API の値と覚える仕組み、印の HTML、線の検査（代表のデータを足した）。
- PC のヘッドレスの Chrome で、5つの画面の高さ（PC と 390px）と、スナップショットのないリポジトリでエラーが出ないこと。
