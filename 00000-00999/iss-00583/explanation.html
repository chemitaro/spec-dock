## この資料で分かること

:::summary
- なぜ大きな空白ができ、Initiative が画面からはみ出していたか。
- 新しい詰め方（塊の棚、右の列、塊の下、残りの棚）。
- 変えないもの（塊を分けない、線の向き、線の検査、広げ直しで動かないこと）。
:::

## 背景と原因

- 1つの親の子は、依存でつながったまとまり（塊）と、つながりのない1つの Scope に分かれます。今までは両方を活動順に一列に並べ、幅で折り返すだけでした。棚の高さは一番高いものに合わせるので、背の高い塊と1枚の箱が同じ棚に乗ると、箱の下が大きく空きます。
- 最上位だけは、全体を画面に収めたときの倍率が最大になる切れ目を選んでいました（iss-00575）。その候補は見える幅を超えてよいので、横長の画面では、はみ出す横並びが選ばれていました。依存のせいではありません。

## 新しい詰め方

1. 塊を活動順に左から並べ、見える幅で折り返します（塊の棚）。棚の高さは塊だけで決まります。
2. つながりのない Scope を活動順に1つずつ、最初に入る場所に置きます。試す順は、棚の右の列（縦に積む）、新しい右の列、塊の下の空き（左の塊から）です。
3. どこにも入らないものは、塊の棚の下に、今までどおりの棚で並べます。塊のない段は、今までと同じ配置です。
4. 最上位も、ほかの段と同じく見える幅で折り返します。

## 確認方法

```sh
uv run pytest tests/unit/presentation/test_dashboard_graph_js.py
```

直す前と後の実データの写しは report.md にあります。
