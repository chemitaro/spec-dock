## この資料で分かること

:::summary
- README と `docs/github-issue-integration.md`、`pyproject.toml` のどこが古かったか。
- 撤去した案内が戻らないことを、どのテストが守るか。
- `canonical check` の重複キーの扱い（唯一の契約の変更）。
:::

## 背景と目的

0.5.0 は旧い移行の道具と local backend を外しました。そのとき、文書の数字や説明、配布の設定の一部が残りました。この Issue は動きを変えずに、それらを直し、同じ漏れが再発しないテストを足します。

## 直す内容

- README のコマンドの数は、文に数字を固定せず、CLI の葉の一覧の数から確かめます。
- 配布する文書の全体を読み、外したコマンドと引数の案内が、歴史として許した箇所の外に無いことを確かめます。
- 作った `report.md` は、0.4.2 の出力とバイトで一致することを確かめます。
- `canonical check` は、同じキーが2回ある宣言を `WORKSPACE_DECLARATION_INVALID`（reason は `duplicate-member`）の1件にします。

## 入れなかったもの

入れたコンソールでの `work start`／`work finish` の e2e は足しません。本物の定期の実行に触れずに子のプロセスで動かす手段がないためです。

## 確認方法

```sh
make lint
uv run pytest
```
