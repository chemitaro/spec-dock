## この資料で分かること

:::summary
- 登録する場面と、登録しない場面の規則が分かる。
- 1回の会話で終わらない複数の項目を、束とサブタスクで扱う理由が分かる。
- 何をどこに書き、どう確かめるかが分かる。
:::

## 背景と目的

`spec-dock todo` のコマンドと集約は、iss-00549 と iss-00550 でマージ済みです。しかし、エージェントが「どんなときに登録するか」という規則が配布物にないので、使われ方がばらつきます。この Issue は規則を文で書くだけで、コードは変えません。

## 全体の構成

- `SKILL.md` に「人のタスク」の節を足す：登録しない場面、登録する場面、束、閉じ方、統括の読み方、秘密と隔離セッションの扱い。
- `docs/todo.md` を足す：使い方、記録の形、設定の3段、集約、外部の道具の読み方。
- `docs/canonical.md` と `docs/README.md` を直す。
- dogfood の写しと `static-inventory.json` の sha256 を合わせる。

## 失敗時の動きと確認

文がコマンドの契約と食い違うと、エージェントが誤った引数で止まります。そのため、テストで規則の語を確かめ、`canonical.md` のエラーコードが `reference_cli.md` にあることも確かめます。戻すときは PR を `git revert` します。
