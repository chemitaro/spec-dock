## この資料で分かること

:::summary
- 『横断の構造』（`/graph`）は、表示しているリポジトリの構造の図を、リポジトリの枠に入れて1つの世界に並べます。
- 以前は、枠の見出しの下に「構造が更新されていません」「PR の状態が分かりません」などの知らせが、リポジトリごとに繰り返し出ていました。
- 文が決まった種類の知らせは、ページの上（状態のチップの下）に種類ごとに1行でまとめ、当てはまるリポジトリの名前を並べます。
- 枠の中には、そのリポジトリにだけある知らせ（読めなかった理由など）だけが残ります。
:::

## 振り分けの規則

| 種類 | 置き場 |
|---|---|
| 構造が古い・スナップショットがない／知らない版／読めない・構造の異常・PR の状態が分からない | ページの上のまとめの行（種類ごとに1行） |
| リポジトリを読めなかった理由・二重のクローン | そのリポジトリの枠の中 |

規則は種類だけで決まり、当てはまるリポジトリの数や名前では変わりません。各リポジトリ単体の構造の図と『横断の概況』の知らせは変わりません。

## 縮めた枠の測り直し

題名が2行に折り返す縮めた枠を描いた後に測って配置をやり直す仕組み（iss-00627）は、『横断の構造』にも既に入っています。この Issue では実機で働いていることを確かめました。

## 確かめ方

- node のテスト：`tests/unit/presentation/test_dashboard_allgraph_notices.py`（振り分けの純粋な部品）と `test_dashboard_allgraph_screen.py`（画面）。
- 実機：1440・1000・390 × 3つの範囲 × 明暗で、線の検査と縮めた枠のはみ出しが0。
