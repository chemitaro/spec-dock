## この資料で分かること

:::summary
- Scope の5つの状態が、`dependency check` と同じ着手の判定から、どう決まるか。
- ボードの列、マージ待ちの分け方、推奨順、片付けの候補が、どの決まりで作られるか。
- `dashboard summary` が、ネットワークに触れずに何を読み、何を返すか。
:::

## 背景と目的

ダッシュボード（epic-00427）は、画面（#529 以降）と、エージェントや統合ダッシュボードが読む要約の JSON の、2つの出口を持ちます。両者が食い違わないように、この Issue で、スナップショットから1つのモデルを作る純粋な関数を用意します。画面のサーバーは、このモデルと要約の関数をそのまま呼びます。

## 全体の構成

```plantuml id=overview
@startuml
title モデルと要約の流れ
top to bottom direction
database "snapshot.json\n（版1・版2）" as Snap
component "dashboard_files\n（読むだけ）" as Files
component "dashboard_snapshot\n（版の見分け、PR の確かさ）" as Parse
component "evaluate_all\n（着手の判定）" as Ready
component "dashboard_model\n（状態、列、推奨順、段、変化）" as Model
component "summary_document\n（specdock.dashboard-summary/v1）" as Summary
actor "エージェント" as Agent
Snap --> Files
Files --> Parse
Parse --> Model
Ready --> Model
Model --> Summary
Summary --> Agent : dashboard summary --json
@enduml
```

- **状態**：`evaluate_all` の DONE、UNKNOWN、DOING、BLOCKED、READY を、終わった、不明、作業中、止められている、着手できる、に写します。Epic と Initiative だけ、開いた子孫に作業中の印があれば作業中にします。
- **ボードの列**：作業中の Issue で、下書きでない開いた PR があれば「マージ待ち」です。CI の失敗か衝突があれば「直す必要あり」、ほかは「マージできる」です。
- **推奨順**：それを待っている開いた Scope の数（後に続く数）が多いものを先に並べます。止められているものは、まだ終わっていない待ち先が少ないものを先にします。
- **PR の確かさ**：版1のスナップショット、まだ PR を取っていないとき、最後の取得が30分を超えて古いときは「分からない」（PR を使わない）です。取得の時刻は新しいが直近の取得が失敗したときは「古い」（前回の値を使い、印を付ける）です。

## 失敗のときの動き

| 状況 | `dashboard summary` |
|---|---|
| スナップショットがない | `DASHBOARD_SNAPSHOT_MISSING`（終了コード3） |
| 知らない版 | `DASHBOARD_SNAPSHOT_UNSUPPORTED`（終了コード3） |
| 壊れている | `DASHBOARD_SNAPSHOT_UNREADABLE`（終了コード3） |
| 30分を超えて古い | 要約を返し、`stale` が真 |

## 確認方法

```sh
spec-dock dashboard summary --json
spec-dock dashboard summary chemitaro/spec-dock --json
```
