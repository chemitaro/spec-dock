## この資料で分かること

:::summary
- 0.9.2 に入る変更は、ダッシュボードの Scope の欄（#588、iss-00587）と文書のタブ（#590、iss-00589）です。コマンドの引数と CLI の JSON の契約は変わりません。
- この Scope は版の番号と `migration.md` と `static-inventory.json` とテストだけを変え、機能のコードは変えません。
- マージ、タグ、導入、配布は、マージの後に統括が行います。
:::

## 背景と目的

0.9.1 の後に PR #588 と #590 が main に入りました。本人の PC に届けるには版を上げて配る必要があります。0.9.1（iss-00585、PR #586）と同じ形で、版を上げ、移行の手引きを書き、0.9.1 と 0.9.0 の配布資産を持つリポジトリが `installation update` で上がるようにします。

## 変えるもの

- 版：`pyproject.toml`、`uv.lock`、`system/spec-dock-version`（提供側と dogfood の写し）。
- `migration.md`（提供側と dogfood の写しはバイト一致）：「## 0.9.2 への更新」の節。
- `static-inventory.json`：`migration.md` と版のファイルの行に今のハッシュを入れ、0.9.1 のバイトを既知の古い版に足します。
- テスト：`tests/integration/test_issue594_release_0_9_2.py` と 0.9.1 の旧資産の fixture。

## 確認方法

```sh
uv run pytest tests/integration/test_issue594_release_0_9_2.py
make lint
```
