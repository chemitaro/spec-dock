title: SpecDock 0.9.6 のリリース
lead: 『横断の構造』（#628）、枠の見出しの行の高さと線の通り道の直し（#630）、横断の構造の並びと最初の表示（#631）、テストの揺れの直し（#626）を 0.9.6 としてまとめ、版・移行の手引き・配布資産の更新経路を整える作業の説明です。

## この資料で分かること

:::summary
- 0.9.6 に入る変更は、ダッシュボードの画面と構造の図の直しです（iss-00614、iss-00627、iss-00629。iss-00624 はテストだけ）。コマンドの引数と CLI・ダッシュボードの JSON の契約は変わりません。
- 横断の画面に『横断の構造』（`/graph`）が加わり、すべてのリポジトリの構造の図をチェックアウトの入れ子のまま1枚に描きます。構造の図の枠の見出しの行が少し詰まり、線が箱や見出しに重ならなくなります。
- この Scope は版の番号と `migration.md` と `static-inventory.json` とテストだけを変え、機能のコードは変えません。マージ、タグ、導入、配布は統括が行います。
:::

## 背景と目的

0.9.5 の後に PR #626、#628、#630、#631 が main に入りました。本人の PC に届けるには版を上げて配る必要があります。0.9.5（iss-00623、PR #625）と同じ形で、版を上げ、移行の手引きを書き、0.9.5 以前の配布資産を持つリポジトリが `installation update` で上がるようにします。

## 変えるもの

- 版：`pyproject.toml`、`uv.lock`、`system/spec-dock-version`（提供側と dogfood の写し）。
- `migration.md`（提供側と dogfood の写しはバイト一致）：「## 0.9.6 への更新」の節。
- `static-inventory.json`：`migration.md` と版のファイルの行に今のハッシュを入れ、0.9.5 のバイトを既知の古い版に足します（`reference_cli.md` の行は #628 で済み）。
- テスト：`tests/integration/test_issue634_release_0_9_6.py` と 0.9.5 の旧資産の fixture（3つ）。

## 確認方法

```sh
uv run pytest tests/integration/test_issue634_release_0_9_6.py
make lint
```
