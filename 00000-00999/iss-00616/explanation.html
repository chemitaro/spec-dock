## この資料で分かること

:::summary
- 線は、親のエージェントの稼働の印から、子のエージェントの稼働の印へ引きます。印の位置は、画面を測らず配置の計算から決めます。
- 箱を持たない親（main のチェックアウトの統括など）は、すべての Initiative の上の『指揮の帯』に並びます。
- 子が作業中なら点が流れ、待ちなら止まった点線、終わったら薄い線です。同じ箱の親子は、箱の外へふくらむ弧で結びます。
- 線や帯がないときは、構造の図は今のままです。
:::

## 背景と目的

Orca のオーケストレーションでは、統括がタスク担当を、タスク担当が実装担当を起動します。構造の図の箱には、その worktree にいるエージェントの印が出ますが、だれがだれを指揮しているかは見えませんでした。orca-web の要約が各エージェントの親（`parent`）を返すようになったので（orca-web iss-00043）、SpecDock の画面がそれを線にします。正本は Epic epic-00615 の要件と設計です。

## 全体の構成

```plantuml id=overview
@startuml
title 指揮の線の流れ
top to bottom direction
component "orca-web の要約\n(parent, main, startedAt)" as Sum
component "command.js\n組・居場所・帯・端と曲線" as Cmd
component "layout.js\n配置と markSpots" as Lay
component "graph.js\n指揮の層・端の層・帯" as View
Sum --> Cmd : 10秒ごとの購読
Lay --> Cmd : 箱と枠の矩形、印の位置
Cmd --> View : 線・弧・波紋・帯の寸法
@enduml
```

- **組**：要約の各エージェントの `parent.id` が、同じ要約の別のエージェントを指せば、親 → 子の1組です。推測では結びません。
- **居場所**：その worktree の Scope の箱か枠があれば、その中の印。畳んだ塊、いちばん近い見える祖先の枠、のどれもなければ帯です。
- **帯**：worktree ごとの札（「main のチェックアウト」、ブランチ名、ほかのリポジトリは「<project.name> · <branch>」）と、エージェントのボタンを1行に並べます。帯は図の世界の上の余白に重ねて置くので、帯が出入りしても箱は動きません。
- **印の行**：箱の中の稼働の印の行は、箱の下の内側の縁に寄せます（統括の了承）。印の位置が配置から決まるためです。

## 押したとき

帯のエージェントを押すと、その親子の線だけが目立ち、図の横の欄（スマホでは下からのシート）に、そのエージェントのチャットが開きます。箱の中の印を押すと、その Scope のエージェントのタブが、押したエージェントで開き、その線が目立ちます。Esc や欄を閉じると元に戻ります。線そのものは押せません。

## 確認方法

```sh
uv run pytest tests/unit/presentation/test_dashboard_graph_command.py
```

実機では、構造の図を開いてブラウザーの開発者ツールで `specdockCmdAudit()` を呼ぶと、弧の重なりと印の位置のずれを数えます。
