## この資料で分かること

:::summary
- 以前は、版4の Artifact のパスを「unsafe directory component 'initiatives'」で拒んでいた。
- 直した後は、`spec-dock/initiatives` が `spec-dock/.canonical` の実ディレクトリを指すときだけ通す。
- ほかのリンクは、今までどおり終了コード1で拒み、何も書かない。
:::

## 背景と目的

`finalize-artifact.py` は、Artifact の親ディレクトリまでの全要素を、リンクをたどらずに開く。版4では `spec-dock/initiatives` 自体がカタログへのリンクなので、正しい経路まで拒んでいた（#440 の後続の候補 7）。

## 仕組み

- `_open_parent` が、`spec-dock/initiatives` の要素だけを特別に扱う。
- リンクを読み、行き先の末尾が `spec-dock/.canonical` で、実ディレクトリ（リンクでない）のときだけ、そこを開いて進む。
- 開いた後の device と inode の再確認は、同じ関数を通るので変わらない。

## 確認方法

```sh
uv run pytest tests/integration/test_issue509_finalize_link.py
```
