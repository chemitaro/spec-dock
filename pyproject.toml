[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-dock"
version = "0.2.3"
description = "Scaffold a spec-driven planning workspace (spec-dock) for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "spec-dock contributors" }]
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "fast: default provider test lane used during development and pull requests",
    "full_regression: long-running provider regression excluded from the default lane",
]

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4
preview = true
src = ["src", "src/spec_dock/assets/spec_dock/scripts"]
exclude = [
  "build/",
  "dist/",
  "*.egg-info/",
  ".git/",
  "__pycache__/",
  ".venv/",
  "venv/",
  "spec-dock/",
]

[tool.ruff.lint]
select = ["F", "E", "I", "UP", "B", "C4", "SIM", "PTH", "TC", "ARG", "RUF", "TID"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"src/spec_dock/__init__.py" = ["RUF067"]
"src/spec_dock/**/*.py" = ["E501", "SIM108", "RUF001", "RUF002", "RUF003", "RUF010"]
"tests/**/*.py" = ["E501", "SIM108", "ARG", "RUF001", "RUF002", "RUF003", "RUF010"]

[tool.mypy]
python_version = "3.10"
allow_redefinition = false
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true
color_output = true
error_summary = true
exclude = [
    "^spec-dock/",
    "^build/",
    "^dist/",
    "^.*\\.egg-info/",
    "^\\.venv/",
    "^venv/",
    "^\\.tox/",
    "^\\.nox/",
]

[[tool.mypy.overrides]]
module = [
    "tests.cli_runtime.harness",
    "tests.cli_runtime.test_runtime_delete_s13",
    "tests.cli_runtime.test_runtime_deps_s04",
    "tests.cli_runtime.test_runtime_validate_s02",
]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = [
    "tests.cli_runtime.test_issue_lifecycle",
    "tests.cli_runtime.test_runtime_close_s12",
]
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]]
module = "tests.cli_runtime.test_deps"
disable_error_code = ["arg-type", "dict-item"]

[[tool.mypy.overrides]]
module = "tests.cli_runtime.test_delete"
disable_error_code = ["func-returns-value"]

[[tool.mypy.overrides]]
module = "tests.cli_runtime.test_new"
disable_error_code = ["override", "union-attr"]

[[tool.mypy.overrides]]
module = "tests.cli_runtime.test_runtime_active_s06"
disable_error_code = ["assignment", "var-annotated"]

[[tool.mypy.overrides]]
module = "tests.cli_runtime.test_runtime_import_s10"
disable_error_code = ["method-assign"]

[[tool.mypy.overrides]]
module = "tests.cli_runtime.test_runtime_shell_s11"
disable_error_code = ["attr-defined", "func-returns-value", "name-defined"]

[[tool.mypy.overrides]]
module = "tests.cli_runtime.test_worktree"
disable_error_code = ["index", "var-annotated"]

[[tool.mypy.overrides]]
module = "tests.unit.commands.test_runtime_new_s08"
disable_error_code = ["attr-defined", "call-overload", "var-annotated"]

[[tool.mypy.overrides]]
module = "tests.unit.infra.test_init_update"
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "func-returns-value",
    "index",
    "method-assign",
    "operator",
    "var-annotated",
]

[project.scripts]
spec-dock = "spec_dock.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spec_dock = [
  "assets/**/*",
  # `assets/**/*` does not match dotfiles like `.gitignore` in Python's glob semantics.
  "assets/**/.gitignore",
  # Hidden subtrees under install_root must be included explicitly.
  "assets/install_root/.agents/**",
  "assets/install_root/.github/**",
  "assets/spec_dock/templates/root/.workbench/README.md",
  "assets/spec_dock/templates/initiative/.workbench/README.md",
  "assets/spec_dock/templates/epic/.workbench/README.md",
  "assets/spec_dock/templates/issue/.workbench/README.md",
]

[tool.setuptools.exclude-package-data]
# Defensive exclusions:
# - Prevent legacy (v1) scaffolding artifacts from being packaged if they remain in build outputs.
# - This protects `uvx --from <local path> ...` users who may have a stale `build/` directory.
spec_dock = [
  # Generated Python caches are never distributable package data.
  "**/__pycache__/**",
  "**/*.pyc",
  "**/*.pyo",
  "assets/spec_dock/scripts/spec-dock-close*.sh",
  "assets/github/workflows/spec-dock-close.yml",
  "assets/spec_dock/templates/**/current/**",
  "assets/spec_dock/templates/**/completed/**",
  "assets/spec_dock/templates/adr.md",
  "assets/spec_dock/templates/**/discussions/rules.md",
  "assets/spec_dock/templates/issue/discussions/_template.md",
  "assets/spec_dock/templates/initiative/epics/new-epic",
  "assets/spec_dock/templates/epic/issues/new-issue",
  "assets/spec_dock/templates/design.md",
  "assets/spec_dock/templates/plan.md",
  "assets/spec_dock/templates/report.md",
  "assets/spec_dock/templates/requirement.md",
]
