name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed SpecDock workspace with fixed engine
        env:
          EXPECTED_SPEC_DOCK_SHA: ${{ github.sha }}
        run: bash .github/scripts/specdock-ci-validate.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$EXPECTED_SPEC_DOCK_SHA"
