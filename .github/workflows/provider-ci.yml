name: Provider CI

on:
  pull_request:

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider package
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Run provider static analysis
        run: make lint
      - name: Run provider pytest suite
        run: uv run pytest

  provider-distribution-parity:
    name: Provider distribution parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify PR head candidate checkout
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install provider package
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Verify current distribution and installation basics
        run: >-
          uv run pytest tests/unit/infra/test_provider_distribution.py
          tests/integration/test_cli_entrypoint_vnext.py tests/integration/test_issue413_wheel.py
          tests/integration/test_issue413_assets.py tests/integration/test_issue413_e2e.py -s

  provider-windows-native-adapters:
    name: Windows native identity, JSON read and Start lock boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify PR head candidate checkout
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $candidate = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $candidate -ne $env:CANDIDATE_SHA) {
            throw "Candidate SHA mismatch"
          }
      - name: Install provider package tooling
        run: python -m pip install uv
      - name: Verify real Windows handles, JSON readers and separate-process exclusion
        run: >-
          uv run pytest tests/integration/test_issue413_native_lock.py
          tests/unit/infra/test_directory_identity.py tests/unit/infra/test_windows_mutex.py
          tests/unit/infra/test_windows_directory.py tests/unit/infra/test_windows_json_read.py -q -s -ra
