name: Provider CI

on:
  push:
  pull_request:

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider package
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Run provider static analysis
        run: make lint
      - name: Run provider pytest suite
        run: uv run pytest
