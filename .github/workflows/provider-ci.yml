name: Provider CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Chooses the runner for the jobs below. Only a trusted same-repository pull request goes to the
  # self-hosted runner, and only while the repository variable SPEC_DOCK_CI_RUNNER is `local`.
  route:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.route.outputs.runners }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Choose runners
        id: route
        env:
          SPEC_DOCK_CI_RUNNER: ${{ vars.SPEC_DOCK_CI_RUNNER }}
        run: python3 .github/scripts/ci-runner-job-gate.py route --repository chemitaro/spec-dock

  provider-tests:
    needs: route
    # Run even when route fails: the job then falls back to the GitHub-hosted runner and fails in its first step,
    # so a routing failure fails this check instead of skipping it or leaving it unreported.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.route.outputs.runners && fromJSON(needs.route.outputs.runners)['ubuntu-latest'] || 'ubuntu-latest' }}
    steps:
      - name: Stop when route did not choose the runners
        if: needs.route.result != 'success'
        run: |
          echo "route failed, so this check fails instead of being skipped; see the route job" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider package
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Run provider static analysis
        run: make lint
      # The CUE spec type tests need the real cue and fail without it (iss-00472). The release archive is
      # pinned by version and SHA-256; tests/support/cue.py holds the same values.
      - name: Install pinned cue
        env:
          CUE_VERSION: v0.17.1
          CUE_SHA256_LINUX_AMD64: a39b0c97695069d95d276d99be0f5dbabb081d801bfdc9ba49b76efaf94e2369
          CUE_SHA256_LINUX_ARM64: 0d729be30d52c952ca38fc9dcb692caa09d8463fa0b64df5781312779183fbcd
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) platform=linux_amd64; sha256="$CUE_SHA256_LINUX_AMD64" ;;
            Linux/ARM64) platform=linux_arm64; sha256="$CUE_SHA256_LINUX_ARM64" ;;
            *) echo "no pinned cue for $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/cue_${CUE_VERSION}_${platform}.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}/cue_${CUE_VERSION}_${platform}.tar.gz"
          echo "$sha256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cue-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cue-bin" cue
          echo "$RUNNER_TEMP/cue-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cue-bin/cue" version
      - name: Run provider pytest suite
        run: uv run pytest

  provider-distribution-parity:
    name: Provider distribution parity (${{ matrix.os }})
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.route.outputs.runners && fromJSON(needs.route.outputs.runners)[matrix.os] || matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Stop when route did not choose the runners
        if: needs.route.result != 'success'
        run: |
          echo "route failed, so this check fails instead of being skipped; see the route job" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify PR head candidate checkout
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install provider package
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Verify current distribution and installation basics
        run: >-
          uv run pytest tests/unit/infra/test_provider_distribution.py
          tests/integration/test_cli_entrypoint_vnext.py tests/integration/test_issue413_wheel.py
          tests/integration/test_issue413_assets.py tests/integration/test_issue413_e2e.py -s
