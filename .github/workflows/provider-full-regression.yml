name: Provider Full Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'push' && format('provider-full-regression-{0}', github.ref) || format('provider-full-regression-manual-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  provider-full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider package
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Run provider full regression
        run: >-
          uv run python -m scripts.quality.verify_full_regression
          --shards 4
      - name: Upload full-regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-full-regression-evidence
          path: spec-dock/.workbench/full-regression
          if-no-files-found: warn
