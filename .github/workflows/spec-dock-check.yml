name: SpecDock check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  spec-dock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install wheel build and install tooling
        run: python -m pip install uv
      # spec-dock checks itself with a wheel built from this checkout, not a released version.
      - name: Check with verified source wheel
        run: bash .github/scripts/specdock-ci-check.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "${{ github.sha }}"
