name: Commit identity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test identity checker
        run: python3 .github/scripts/test_check_commit_identities.py

      - name: Check new commit identities
        shell: bash
        run: |
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
            if git show-ref --verify --quiet "${default_ref}"; then
              range="$(git merge-base "${HEAD_SHA}" "${default_ref}")..${HEAD_SHA}"
            else
              range="${HEAD_SHA}"
            fi
          else
            range="${BASE_SHA}..${HEAD_SHA}"
          fi

          git log --format='%H%x09%an%x09%ae%x09%cn%x09%ce' "${range}" \
            | python3 .github/scripts/check_commit_identities.py
