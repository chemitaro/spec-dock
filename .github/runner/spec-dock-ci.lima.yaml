# Lima instance for the SpecDock self-hosted runners (iss-00454). Create it with Lima 2.2.1:
#   limactl create --name spec-dock-ci .github/runner/spec-dock-ci.lima.yaml
# Plain mode leaves out the guest agent, mounts, port forwarding and containerd, so the guest sees no host files
# and exposes nothing to the host. nftables.conf blocks the guest from the host and private networks.
minimumLimaVersion: 2.2.0
vmType: vz
arch: aarch64
os: Linux
images:
- location: "https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"
  digest: "sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55"
cpus: 6
memory: 8GiB
disk: 40GiB
plain: true
mounts: []
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
propagateProxyEnv: false
upgradePackages: false
