#!/usr/sbin/nft -f
# SpecDock runner VM egress policy (iss-00454). Only root can change it; the runner users have no sudo.
# The guest may reach the Lima DNS server (port 53 of the gateway 192.168.5.2 in plain mode), DHCP and the public
# internet. It may not open other connections to the Mac (192.168.5.2 forwards to the host loopback), private or
# shared address space (LAN, Tailscale), link-local or multicast addresses, or anything over IPv6.
flush ruleset

table inet spec_dock_egress {
  set blocked_ipv4 {
    type ipv4_addr
    flags interval
    elements = {
      0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 169.254.0.0/16, 172.16.0.0/12,
      192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/3
    }
  }

  chain output {
    type filter hook output priority filter; policy accept;
    oifname "lo" accept
    ct state established,related accept
    # Replies of sshd, the only process that can use port 22, so reloading the rules never stalls a Lima session.
    tcp sport 22 accept
    ip daddr 192.168.5.2 meta l4proto { tcp, udp } th dport 53 accept
    udp sport 68 udp dport 67 accept
    ip daddr @blocked_ipv4 counter reject with icmpx type admin-prohibited
    meta nfproto ipv6 counter reject with icmpx type admin-prohibited
  }
}
