## この資料で分かること

:::summary この資料の要点
- 仕様の**内容**（要件・設計・計画・報告・Artifact）の正本を、コードと履歴を共有しない1本のブランチ `spec-dock/canonical` に置きます。
- 仕様の**構造**（番号・種類・親子・依存・状態・題名）の正本を GitHub Issue に置き、`.meta.json` を廃止します。
- 仕様は今と同じ `spec-dock/initiatives/` にあり、普通のファイルとして読み書きします。用意は `spec-dock canonical link` の1つのコマンドで済み、保存と同期は SpecDock が60秒ごとに自動で行います。
- GitHub の構造は、リポジトリごとに一括で取得して手元に持ち、使い回します。操作のたびに GitHub に問い合わせず、負荷と待ち時間を抑えます。
- 今までと同じ Markdown と PlantUML のダッシュボードを、GitHub の構造から、日本語の題名で作り直します。HTML のダッシュボードと、仕様の文書の CUE への移行は、次の Epic（#425）で行います。
- macOS と Linux（デスクトップ、SSH のサーバーと仮想マシン、コンテナ）で動きます。Windows には対応しません。
- この Epic の範囲は、SpecDock の更新と、spec-dock 自身での利用（dogfooding）までです。ほかのプロダクトへの導入は、各プロジェクトで進めます。
- 2026-10-25 の2回のヒアリングの回答で、要件が固まりました。利用者に決めていただくことは、今はありません。
:::

:::note この資料と正本の関係
この資料は説明用です。正本は、Epic の `requirement.md`（`spec-dock/initiatives/init-00423-canonical-spec-storage/epics/epic-00424-canonical-spec-catalog/requirement.md`）です。要件の番号（R-A1 など）と受け入れ条件の番号（AC-01 など）は、`requirement.md` と同じです。
:::

## 1回目のヒアリングで決まったこと

2026-10-25 にいただいた回答と、それを受けて要件をどう変えたかをまとめます。

| 論点 | いただいた回答 | 要件への反映 |
|---|---|---|
| 用意の入口 | `make init` に組み込まず、適切なカタログを探してリンクを作るコマンドを SpecDock に用意する。`make init` への組み込みは各プロジェクトで決める | `spec-dock canonical link` を唯一の入口にしました（R-B3、R-B4） |
| H-1 範囲 | この Epic は SpecDock の更新と dogfooding まで。ほかのプロダクトへの導入は各プロジェクトで進める | 移行するのは spec-dock だけにしました。退去費用プロダクトの受け入れ条件を外しました |
| H-2 強制 | SpecDock が壊れていないかを調べる独立のワークフローを用意し、PRのマージの条件にする。退去費用プロダクトのテストやデプロイのCIと同じ仕組みにする | 検査のコマンドとワークフローの見本を配ります。PRで動き、通過をマージの条件にする扱いは、既存のCIと同じ運用にします。GitHub の必須の検査は、spec-dock でも設定しません（R-F1〜R-F3） |
| H-3 ツール | フックに頼らず、SpecDock が定期的にコミットと push をする | ツールのフックと設定には頼らず、書き換えもしません。要る設定は、示すだけにしました（R-B6） |
| ツールの設定 | Claude Code と Codex に設定の変更が要ることは許容する。使い方の文書に記録する | 使い方の文書に、ツールごとの設定と確かめ方を書きます（R-H3） |
| H-4 題名 | 識別（ブランチ名、ディレクトリ名、slug）は英語とハイフン。題名は日本語に対応し、ダッシュボードには日本語で出す。今は英語で作る。「題名」は Scope の Issue の題名という解釈でよい | 識別と表示を分けました（R-E1〜R-E4）。今ある英語の題名は変えません |
| H-5 切り替え | 運用は任せる | 手順をエージェントが決めました（「移行」の章） |
| 移行の道具 | CLI に組み込まず、直接実行するスクリプトにする。個人のプロジェクトの移行が済んだら捨てる | パッケージに入れない、使い捨てのスクリプトにしました（R-G1） |

:::note 検査のワークフローは、既存のCIと同じ仕組みです
検査のワークフローは、退去費用プロダクトのテストやデプロイのCIと同じく、PRをきっかけに動き、結果をPRに表示します。通過したPRだけをマージする扱いも、既存のCIと同じです。

なお、退去費用プロダクトで今のCIを調べたところ、GitHub がマージのボタンを止める設定（ブランチの保護）はありませんでした。失敗中のPRも、GitHub の上では「マージできる」状態です :fact[2026-10-25 に GitHub の API で確認]。失敗したPRをマージしないことは、運用で守られています。直近にマージされた40件は、どれも検査が通ってからマージされていました。SpecDock の検査も、これと同じ扱いになります。

GitHub にマージのボタン自体を止めさせる「必須の検査」は、非公開のリポジトリでは Pro 以上のプランが要ります。そのため前提にせず、公開の spec-dock でも設定しません。どのリポジトリでも、退去費用プロダクトと同じ運用で進めます。
:::

## 背景：なぜ変えるのか

### 今の仕組みと問題

今は、仕様のツリー `spec-dock/initiatives/` を、既定のブランチとすべての作業ブランチが追跡しています。仕様もコードと同じように、ブランチごとに別々の版を持っています。そのため、次のことが起きています。

- 仕様の最新の状態が、worktreeとブランチごとに分かれます。中央で全体を把握できません。
- ほかのworktreeの書きかけや、マージ前の更新が見えません。反映するには、PRのマージを待つ必要があります。
- ブランチを消すと、そのブランチにしかない仕様が失われます。
- 構造の情報が `.meta.json` にだけあり、GitHub と食い違っています。GitHub には、親子も依存も1件も登録されていません。

### 利用の実態

このPCの記録（2026-10-25 時点）では、仕様の編集の大半が、作業用のworktreeで行われています。

:::metrics
- 286 | 仕様の編集の回数 | Claude Code と Codex の記録から集計
- 263 | 作業用のworktreeでの編集 | Orca や Codex のworktreeの通常のセッション
- 23 | mainのチェックアウトでの編集 | 計画をmainで書いた場合など
- 0 | 隔離セッションの利用 | Claude Code の `--worktree`
:::

### 変更の前と後

:::beforeafter
### 変更前
- 仕様は、すべてのブランチにコピーとして存在します。
- 最新の仕様は、どこかのworktreeの中にあります。
- 構造は `.meta.json` にあり、GitHub と食い違います。
- 反映は、PRのマージで行います。

### 変更後
- 仕様の内容は `spec-dock/canonical` の1か所だけにあります。
- どのworktreeからも、リンクで同じ実体を見ます。同じPCなら、保存の前の編集もすぐに見えます。
- 構造は GitHub Issue だけにあります。
- 反映は、定期の同期が自動で行います。
:::

## 最初に知る用語

:::glossary
- **canonical**（カノニカル）: 仕様の内容の正本を置くブランチ `spec-dock/canonical` です。コードを含まず、既定のブランチと履歴を共有しません。
- **カタログ**: 各クローンのmainのチェックアウトの `spec-dock/.canonical/` に置く、canonical のworktreeです。PCの中の仕様の実体はここだけです。
- **リンク**: 各チェックアウトの `spec-dock/initiatives` に置く、カタログを直接指すシンボリックリンクです。Git では管理しません。
- **用意のコマンド**: `spec-dock canonical link` です。カタログ、リンク、除外の設定、定期の同期の登録を用意します。何度実行しても結果は同じです。
- **定期の同期**: PCごとに常駐し、60秒ごとにカタログの変更を保存して、GitHub と取り込み・push を行う仕組みです。
- **先着優先**: 同じファイルが競合したとき、先に push された版を元の名前に残し、後から push する側の版を別名で保存する規則です。
- **別名ファイル**: 先着優先で残す、後から push した側の版です。`requirement.conflict-<PC名>-<時刻>.md` のような名前になります。
- **保留**: 大量の削除や秘密情報らしいものを、自動では保存せずに止めておくことです。
- **slug**（スラッグ）: ディレクトリ名、ブランチ名、URL に使う英語の識別名です。作成したときに固定します。
- **題名**: GitHub の Issue の題名です。日本語でよく、いつでも変えられます。
:::

## 使いやすさの5つの約束

利用者の方針は「複雑にしすぎず、簡単に使え、エージェントが迷わず、複雑な設定が要らないこと」です。これを5つの約束にし、すべての要件をこれに従わせます。

:::cards cols=1
### 1. 仕様はいつもの場所にある {icon=folder}
仕様は今と同じ `spec-dock/initiatives/` にあり、普通のファイルとして読み書きします。仕様のために Git を操作することはありません。

### 2. 用意はコマンド1つ {icon=terminal}
`spec-dock canonical link` を実行すれば使えます。何度実行しても結果は同じです。SpecDock でworktreeを作ったときは、これも要りません。

### 3. 自動で動くのは定期の同期だけ {icon=clock}
保存、取り込み、push は、PCごとの定期の同期が行います。Claude Code や Codex のフックには頼りません。

### 4. ツールの設定を書き換えない {icon=shield}
要るのは、作業用のworktreeから仕様に触れるための、ツールごとに1行の設定だけです。SpecDock は、その1行を正確に示すだけにします。

### 5. おかしいときは止まり、次の1手を示す {icon=flag}
推測で直さず、実行すべきコマンドか、足すべき設定を示します。
:::

## 使い方：人とエージェントがすること

新しい仕組みで、人とエージェントがすることは、これだけです。

:::steps
1. **最初に1回（クローンごと）** — `spec-dock canonical link` を実行します。カタログ、リンク、定期の同期が用意され、ツールに足す1行が表示されます。表示された1行を、Claude Code と Codex の設定に足します。
2. **worktreeを作ったとき** — SpecDock の `worktree create` か `work start` を使えば、何もしなくてよいです。Orca、Codex、`git worktree add` などで作ったときは、`spec-dock canonical link` を1回実行します。プロジェクトの `make init` に入れておけば、それも要りません。
3. **毎日の作業** — 仕様は `spec-dock/initiatives/` のファイルを普通に読み書きします。Scope の作成、親子、依存、状態、題名は、SpecDock のコマンドで変えます。保存と共有は、1〜2分のうちに自動で行われます。
4. **作業を終えるとき** — `spec-dock work finish` を実行します。仕様の変更が push されたことを確かめてから終わります。
5. **困ったとき** — 状態を表示するコマンドが、原因と次の1手を示します。仕様が見えなければ、`spec-dock canonical link` を実行します。
:::

:::terminal title="新しいクローンでの用意（表示の例。文言は設計で決める）"
$ spec-dock canonical link
# カタログを作り、保護しました: <mainのチェックアウト>/spec-dock/.canonical
# リンクを張りました: spec-dock/initiatives
# 定期の同期に登録しました（60秒ごと）
# 作業用のworktreeから使うには、次の1行ずつを足してください
#   Claude Code (~/.claude/settings.json): permissions.additionalDirectories に "<カタログのパス>"
#   Codex (~/.codex/config.toml): sandbox_workspace_write.writable_roots に "<カタログのパス>"
:::

## 全体像：3つの管理の系統

この仕組みでは、管理するものを3つの系統に分けます。:ref[planes] のように、GitHub で管理するもの、PCのローカルの作業環境として管理するもの、worktreeごとの実行状態です。

```plantuml id=planes
@startuml
title 3つの管理の系統
top to bottom direction
rectangle "GitHub" as GH {
  rectangle "Issue（構造の正本）\n番号・種類・親子・依存・状態・題名" as Issues
  rectangle "既定のブランチの系列\nコードと SpecDock の配布物\n仕様は置かない" as Main
  rectangle "spec-dock/canonical\n仕様の内容だけ\nコードと履歴を共有しない" as Canon
}
rectangle "PC（クローンごとのローカルの作業環境）" as PC {
  rectangle "mainのチェックアウト" as MC {
    rectangle "spec-dock/.canonical/\nカタログ" as Res
    rectangle "spec-dock/initiatives\n相対リンク" as LinkM
  }
  rectangle "作業用のworktree" as WT {
    rectangle "spec-dock/initiatives\n絶対リンク" as LinkW
  }
  rectangle "定期の同期\n60秒ごと" as Sync
  rectangle "SpecDock CLI\ncanonical link など" as CLI
}
LinkM --> Res : 直接指す
LinkW --> Res : 直接指す
Sync --> Res : 変更を保存する
Sync --> Canon : 取り込んでから push する
CLI --> Issues : 構造を読み書きする
CLI --> Res : カタログとリンクを用意する
WT --> Main : PRで送る（コードだけ）
@enduml
```

| 系統 | 管理するもの | 置き場所 | Git での扱い | 作る人 |
|---|---|---|---|---|
| GitHub | 構造（Issue）、コード（既定のブランチの系列）、仕様の内容（canonical） | GitHub のリポジトリ | 追跡する | CLI、エージェント、人 |
| ローカルの作業環境 | カタログ、リンク、除外の設定、定期の同期の登録 | 各PC、各クローン | 追跡しない | `spec-dock canonical link` |
| worktreeごとの実行状態 | 着手中の対象の記録（`spec-dock/.agent/work-target/`） | 各worktree | 追跡しない（今と同じ） | `work start` |

### ブランチどうしの関係

canonical は、既定のブランチとコードもコミットも共有しません。使い捨てのリポジトリで確かめた結果は、次のとおりです。

| 確かめたこと | 結果 |
|---|---|
| canonical の中身 | 仕様のツリーだけ。`src/`、`AGENTS.md`、`spec-dock/docs` はない :fact[確認済み] |
| 共通の祖先 | ない :fact[確認済み] |
| main を canonical にマージする | `refusing to merge unrelated histories` で拒否される :fact[確認済み] |
| ファイルの中身 | 同じ中身の仕様は、Git の中で同じオブジェクトを指す :fact[確認済み] |

このため、2つのブランチがうっかりマージされることはありません。両者の間では、同期もコピーもしません（R-A4）。SpecDock の機能は、パッケージの更新で届きます。canonical の中で CLI が動くことはないので、canonical に CLI やテンプレートの更新は要りません。

## ローカルの作業環境

### なぜ Git で管理しないのか

リンクとカタログは、Git で管理しません。理由は3つあります。

1. リンクの指す先が、場所ごとに違います。mainのチェックアウトでは相対の `.canonical`、作業用のworktreeでは、そのPCでのmainのチェックアウトの絶対パスです。
2. 既定のブランチには、`spec-dock/initiatives` の下に何も置かない規則です。リンクを追跡すると、この規則に反します。
3. カタログは、PCの中の実体です。クローンごとに1つあり、ほかのPCとは GitHub を通して同期します。

### 構成要素

| 要素 | 置き場所 | 作る人 | 消えたとき |
|---|---|---|---|
| カタログ | `<mainのチェックアウト>/spec-dock/.canonical/` | 用意のコマンド | 保存済みのコミットは `.git` に残る。用意のコマンドが作り直す |
| カタログの保護 | Git の worktree の lock | 用意のコマンド | 用意のコマンドがかけ直す |
| mainのリンク | `spec-dock/initiatives` → `.canonical` | 用意のコマンド | 用意のコマンドが張り直す |
| 作業用のworktreeのリンク | `spec-dock/initiatives` → カタログの絶対パス | 用意のコマンド、`worktree create`、`work start` | 同上 |
| 除外の1行 | `.git/info/exclude` の `/spec-dock/.canonical/` | 用意のコマンド | 用意のコマンドが足し直す |
| 無視の設定 | `spec-dock/.gitignore` など | SpecDock の配布物（Git で追跡） | 配布物の更新で戻る |
| 定期の同期の登録 | PCのユーザーごとの定期の実行（macOS は launchd、systemd の Linux はタイマー、コンテナは SpecDock の常駐のプロセス） | 用意のコマンド | 状態の表示が知らせる |
| ツールの設定 | Claude Code と Codex の設定 | 利用者（SpecDock が1行を示す） | 状態の表示が知らせる |

### 用意のコマンドの流れ

`spec-dock canonical link` の流れは :ref[link] のとおりです。同じクローンのどのチェックアウトから実行しても、そのクローンのカタログを見つけます。細かい手順は、設計書で決めます。

```plantuml id=link
@startuml
title spec-dock canonical link の流れ
start
:実行したチェックアウトから、同じクローンのmainのチェックアウトを見つける;
if (bare の構成か) then (はい)
  :理由を示して止まる;
  stop
endif
if (カタログがないか) then (はい)
  :GitHub の canonical から作り、保護する;
endif
:除外の1行を確かめる;
if (リンクの場所に実体のファイルやディレクトリがあるか) then (はい)
  :置き換えずに止まり、理由を示す;
  stop
endif
:mainと、実行したチェックアウトにリンクを張る;
:このPCの定期の同期にカタログを登録する;
:ツールの設定が足りなければ、足す1行を示す;
stop
@enduml
```

呼ばれる場所は3つだけです。

- **明示の実行** — 人、エージェント、プロジェクトの `make init` が呼びます。`make init` へ組み込むかどうかは、各プロジェクトが決めます。
- **`spec-dock worktree create`** — 作ったworktreeに、同じ処理でリンクを張ります。
- **`spec-dock work start`** — 着手のときに、同じ処理でリンクを確かめます。

ほかのコマンドは、リンクやカタログが足りなくても自分では直さず、`spec-dock canonical link` を実行するよう示して止まります。読むだけのコマンドは何も書かない、という今の CLI の約束を守るためです。

### ツールの設定（1行ずつ）

作業用のworktreeから見ると、カタログは作業ディレクトリの外にあります。そのため、ツールによっては、リンクを通した読み書きを止めます。実際に確かめた結果は、次のとおりです。

| ツールとモード | 何もしないとき | 1行を足したとき |
|---|---|---|
| Claude Code（既定の権限モード、acceptEdits） | 読み取りから拒否される。「resolves through a symlink to …, which is outside the allowed working directories」:fact[確認済み] | `permissions.additionalDirectories` にカタログを加えると、読み書きできる :fact[確認済み] |
| Claude Code（bypassPermissions） | 読み書きできる :fact[確認済み] | 不要 |
| Claude Code の隔離セッション（`--worktree`） | 書き込みは拒否される :fact[確認済み] | 設定では通らない。読むだけにする（合意済み） |
| Codex（workspace-write のサンドボックス） | 書き込みが「Operation not permitted」で拒否される :fact[確認済み] | `writable_roots` にカタログを加えると、書ける :fact[確認済み] |
| mainのチェックアウトで動くセッション | カタログが作業ディレクトリの中にあるので、そのまま使える | 不要 |

SpecDock は、この設定を書き換えません（約束4）。用意のコマンドと状態の表示が、そのクローンでの正確な1行を示します。1行はクローンごとに1回足せば、あとは変わりません。

この設定が要ることは、使い方の文書（README と、配布する `spec-dock/docs/` の導入の文書）にも、ツールごとに記録します（R-H3）。書くのは、次のことです。

- 足す設定（Claude Code は `permissions.additionalDirectories`、Codex は `writable_roots`）と、設定のファイルの場所、書き方の例。
- 足さないときに出る、拒否の文言。
- 要らない場合（mainのチェックアウトの中で動くセッション）と、書けない場合（Claude Code の隔離セッション）。
- 足りているかの確かめ方（状態の表示）。

### 起きうる出来事と戻し方

ローカルの作業環境に起きうる出来事を、網羅的に並べました。「確認済み」は、使い捨てのリポジトリで実際に確かめたものです。

:::datatable 起きうる出来事
| 出来事 | 起きること | 戻し方 | 確認 |
|---|---|---|---|
| 新しいPCでクローンする | カタログとリンクがない | `spec-dock canonical link` | 設計で確認 |
| 新しいworktreeを作る | リンクがない | SpecDock で作れば不要。ほかのツールなら `spec-dock canonical link` | 設計で確認 |
| 作業用のworktreeを消す | リンクだけが消え、カタログは残る | 不要 | 確認済み |
| mainで移行前のコミットへ移る | リンクが実体のディレクトリに置き換わり、カタログは残る | 戻ったときに `spec-dock canonical link` | 確認済み |
| `git clean -fdx` | カタログは残り、リンクは消える | `spec-dock canonical link` | 確認済み |
| `git clean -ffdx` | カタログが消える。保存済みのコミットは残る | `spec-dock canonical link` が作り直す | 確認済み |
| 保護したカタログを `git worktree remove --force` | 拒否される | 不要 | 確認済み |
| mainのチェックアウトを移動する | worktree の登録と絶対リンクが切れる | 状態の表示が示す手順と `spec-dock canonical link` | 確認済み |
| 外付けのボリュームが外れる | 定期の同期が失敗する | 何も変えずに記録だけを残す | 設計で確認 |
| macOS が外付けのボリュームを読むことを拒否する | 定期の同期が失敗する | 状態の表示が示すプログラムに、システム設定で許可を与える | 確認済み |
| 同じPCにクローンが2つある | クローンごとにカタログができる | GitHub を通して同期する | 実データで確認 |
| PCが眠る、ネットワークが切れる | コミットがローカルに積まれる | つながったときに push する | 設計で確認 |
| 移行前のブランチを main で `git add -A` | 除外の1行がないと gitlink が入る | 除外の1行で防ぐ | 確認済み |
| エージェントがカタログで `git reset --hard` | ほかのセッションの未保存の編集が消える | 規則で禁止する。失うのは最大1〜2分ぶん | 規則で対応 |
:::

## 保存と同期

### 1回の同期で行うこと

:::steps
1. **確かめる** — カタログが canonical の上にあり、マージの途中でないことを確かめます。
2. **取り込む準備** — GitHub から canonical を取得します。
3. **保存するファイルを選ぶ** — 30秒以上変わっていないファイルと、5分を超えて待っているファイルです。
4. **検査する** — 大量の削除、秘密情報らしいもの、大きすぎるファイルは保留し、残りを保存します。
5. **コミットする** — コード用のフックは動かしません。本文に、変わった Scope と PC名を書きます。
6. **統合する** — 作業ツリーに触れずに統合の結果を作り、競合があれば先着優先で解きます。
7. **push する** — 強制はしません。拒否されたら、すぐにもう一度取り込みます。
8. **記録する** — 保留、競合、最後に成功した時刻を残します。
:::

### 先着優先で競合を解く

同じファイルを2台のPCで同時に編集した場合の流れは、:ref[firstwins] のとおりです。

```plantuml id=firstwins
@startuml
title 先着優先で競合を解く
participant "PC-B（先に push）" as B
participant "GitHub の canonical" as G
participant "PC-A（後から push）" as A
B -> G : 版B を push する
A -> A : 版A を保存する
A -> G : push の前に取り込む
G --> A : 版B を返す
A -> A : 作業ツリーに触れずに競合を見つける
A -> A : 元の名前に版B、別名ファイルに版A を置く
A -> G : 統合した結果を push する
G --> B : 別名ファイルだけが増える
@enduml
```

この規則には、公開済みの版が後から別の版に置き換わらないという利点があります。先に push したPCと、すでに取り込んでいたほかのPCでは、文書は変わらず、別名ファイルが1つ増えるだけです :fact[3台で確認済み]。片方が変更し、もう片方が削除した場合は、どちらが先でも変更を残します。中身を失わないためです。

### 止めて知らせるもの

| 状況 | 動き |
|---|---|
| Scope のディレクトリごとの削除、1回で20ファイルを超える削除 | 保留して知らせる。SpecDock のコマンドが行った削除は保留しない |
| 秘密情報らしいもの | 保留して知らせる |
| 10MBを超えるファイル | 保留して知らせる |
| push していないコミットが10分を超えた | 警告する |
| GitHub の canonical が強制 push で書き換えられた | 取り込まずに止まり、知らせる |
| 移行前の版の SpecDock が書き込もうとした | 書き込む前に止まる |

### 作業の終わりの確認

`spec-dock work finish` は、その Scope の仕様の変更が push されたことを確かめてから終わります（R-C6）。エージェントが作業を終えた直後にPCを閉じても、仕様が手元だけに残ることを防ぐためです。確かめられないとき（ネットワークがないなど）は、理由を示して止まります。

### 同時に動く操作

定期の同期と、カタログに書く SpecDock のコマンド（作成、移動、リンクの書き換えなど）は、PCの中の1つの排他で順番に動きます。排他の中ではネットワークを使わないので、待たされるのはごく短い時間です。SpecDock のコマンドは自分ではコミットせず、保存は同期に任せます。サンドボックスで動くエージェントは main の `.git` に書けないので、こうすると、どこから実行しても結果が同じになります。PCどうしには排他を置かず、先着優先だけで調整します。

## 名前：識別と題名

| 役割 | 中身 | 文字 | 変更 | 使う場所 |
|---|---|---|---|---|
| 識別 | ID と slug（例：`epic-00424-canonical-spec-catalog`） | 英小文字、数字、ハイフン | 作成したときに固定 | ディレクトリ、ブランチ、URL |
| 題名 | GitHub の Issue の題名 | 日本語でよい | いつでも変えられる | GitHub の画面、CLI の表示 |

Scope を日本語の題名で作るときは、エージェントが英語の slug も指定します。題名が英数字だけのときは、今と同じく題名から slug を作ります。`scope show`、`scope list`、`workspace sync` などの CLI の表示と、ダッシュボードには、GitHub の題名を出します。

:::warning 今の CLI の制約
今の CLI は、題名に英数字と空白しか受け付けません（`^[A-Za-z0-9]+(?: [A-Za-z0-9]+)*$`）:fact[確認済み]。そのため、この Epic も英語の題名で作りました。日本語の題名に対応するまでは、英語で作ります。今ある英語の題名は、変えません。
:::

## 構造の一括取得とダッシュボード

### 構造の一括取得

SpecDock は、GitHub のリポジトリごとに、Scope の Issue の構造（番号、種類、題名、状態、ラベル、担当者、slug、親子、依存）を一括で取得し、PCのユーザーごとの置き場に1つのファイルとして持ちます（R-I1）。構造を読むコマンドとダッシュボードは、このファイルから読み、操作のたびに GitHub に問い合わせません（R-I2）。

- **新しく保つ**：定期の同期が、周期ごとに「変わったか」を確かめ、変わっていたときだけ全体を取り直します。この確かめは、GitHub のレート制限を消費しません :fact[304 の応答で確認]。親子と依存だけの変更を見落とさないよう、30分に1回は必ず取り直します（R-I3）。
- **書くときは確かめる**：着手、完了、依存の追加などで GitHub に書く前には、必ず確かめ、対象の Issue を読み直します。古いデータだけで書く判断はしません（R-I4）。
- **負荷を抑える**：要求は1つずつ送り、書き込みを続けるときは1秒以上あけます（R-I5）。
- **次の Epic の土台**：このファイルの形は、版を持つ契約として設計書に書きます。次の Epic の HTML のダッシュボードが、そのまま読みます（R-I6）。

### ダッシュボード（今までの形）

定期の同期が、構造のスナップショットから、今までと同じ5つのファイル（`spec-dock/dashboard.md`、`tree.puml`、`tree-all.puml`、`deps-issues.puml`、`deps-raw.puml`）を、mainのチェックアウトに作り直します（R-E5）。題名は GitHub の題名（日本語を含む）で、作業中は GitHub の作業中の印で示すので、どのPCで作業中のものも分かります。構造が変わったときだけ書き直します。

今の CLI は、2026-10-01 の変更でこの生成をやめていました。spec-dock のmainのチェックアウトにあるのは、2026-09-21 に作られたものです :fact[コミットとファイルの時刻で確認]。

:::note 次の Epic（#425）で作るもの
HTML の、レスポンシブなダッシュボードを作ります。Initiative、Epic、Issue の階層と、作業の順番の依存を図で示し、実装中、未着手、止められている、終わったものを色で分けます。終わったものを隠す表示も選べます。1つの Scope を選ぶと、日本語の題名、依存しているもの、依存されているもの、配下、実行の順番、要件・設計・計画の内容を示します。あわせて、要件・設計・計画を、エージェント向けの CUE と、人向けの HTML に移します。議論は、この Epic の後に行います。
:::

### 動く環境

macOS と Linux で、同じ要件を満たします（R-C7）。定期の同期は、環境に合った仕組みで動かします。

| 環境 | 定期の同期の仕組み | 利用者に残る作業 |
|---|---|---|
| macOS | launchd | なし（外付けの SSD では、macOS の許可が要ることがある） |
| systemd の Linux（デスクトップ、SSH のサーバーと仮想マシン） | systemd のユーザーのタイマー | ログアウト中も動かすなら linger を有効にする（SpecDock は1行を示すだけ） |
| systemd のない Linux（コンテナ、devcontainer） | SpecDock 自身の常駐のプロセス（`spec-dock canonical link` が起動） | コンテナを起動し直したときのための1行を、起動の設定に足す |

コンテナでは、コンテナの中でクローンしたリポジトリを、別のPCと同じに扱います。ホストのフォルダーをマウントしたチェックアウトでは、SpecDock はホストの Git の記録を書き換えずに、理由を示して止まります（R-C8）。

## 既定のブランチの検査

守らせる条件は「既定のブランチのツリーに、`spec-dock/initiatives` と `spec-dock/.canonical` の下のパスと `.meta.json` が1つもない」ことです（R-A4）。いただいた案のとおり、SpecDock が壊れていないかを調べる独立のワークフローを中心にします。

| 段 | 仕組み | 止められるもの |
|---|---|---|
| 1. 追加させない | 無視の設定と `.git/info/exclude` | `git add -A` などのうっかり |
| 2. 手元で気づく | SpecDock のコマンドと状態の表示が、同じ検査を使う | `git add -f`、移行前のブランチでのコミット |
| 3. PRで止める | 独立のワークフロー（既存のCIと同じく、通過をマージの条件にする） | 移行前のブランチ、新しい仕様を足しただけのPR |

ワークフローが調べることは、3つです。

- 仕様のパスと `.meta.json` が、ツリーにないこと。
- 無視の設定と、SpecDock の宣言（`spec-dock/workspace.json`）がそろっていること。
- SpecDock の配布物が、壊れていないこと。

ワークフローの定義は短く保ち、検査の中身は SpecDock のパッケージが持ちます。SpecDock の版を上げても、ワークフローを書き換えなくてよいようにするためです。同じワークフローは、既定のブランチへの push でも動きます。マージの後に Issue を立てる見張りは作らず、失敗の表示で足りるようにしました。

:::note リポジトリごとの違い
どのリポジトリでも、ワークフローの通過をマージの条件にします（R-F3）。GitHub はマージのボタンを止めないので、既存のテストやデプロイのCIと同じ運用で守ります。人は通過を確かめてからマージし、エージェントは通過していないPRを、マージできる状態として渡しません。GitHub の必須の検査は、spec-dock でも設定しません。ほかのプロダクトへの組み込みは、各プロジェクトで導入するときに行います。
:::

## 移行

### 使い捨てのスクリプト

`.meta.json` から GitHub への移行は、CLI に組み込まず、直接実行するスクリプトで行います（R-G1）。役目は、利用者の個人のプロジェクトの移行が終わるまでです。CLI に入れると保守を続ける必要があるため、パッケージには入れず、終わったら捨てます。

使い捨てでも、GitHub に数百回書き込むため、次の安全の仕組みは持たせます（R-G2）。

- 既定では予定を表示するだけで、何も書き込みません。
- 何度実行しても同じ結果になり、途中で止まっても続きから再開できます。
- GitHub には足すだけで消さず、取り消しの一覧を残します。
- GitHub の書き込みの制限（目安で毎分80回、毎時500回）を超えない速さで進みます。spec-dock では約620回の書き込みで、1.5時間ほどかかる見込みです :guess[見積もり]。

スクリプトの横に、ほかのプロジェクトで使う短い手順書を置きます（R-G6）。

### 予定の表示で見つけるもの

実データを調べたところ、次の異常がすでに見つかっています。

- `init-local-00002` は #39、`init-local-00003` は #31 に結び付いていて、名前から番号が分かりません :fact[確認済み]。
- #31 は、題名が別物（"Replace Wrapper Scripts With Symlink Rules"）で、完了で閉じています。その下に新しい Epic を作れなかったため、この Epic は新しい Initiative `init-00423` の下に作りました :fact[確認済み]。
- spec-dock では、`.meta.json` の題名と GitHub の題名が36件食い違っています :fact[確認済み]。

### 切り替えの手順

切り替えの運用は、エージェントが次のように決めました。全体は数十分を見込み、待ちの大半は人によるPRのマージです :guess[見積もり]。

:::steps
1. **先に登録する** — GitHub への登録と検証を、切り替えより前に済ませます。この間も、今の運用は止めません。
2. **編集を止める** — 切り替えを始めたら、終わるまで、ほかのエージェントで仕様を編集しません。
3. **canonical を作る** — 既定のブランチの仕様から canonical を作って push し、既定のブランチから仕様を外すPRを作ります。
4. **人がマージする** — PRには、検査のワークフローも入れます。検査が通ったことを確かめてから、マージします。
5. **リンクに置き換える** — 各チェックアウトで `spec-dock canonical link` を実行します。
6. **残りを取り込む** — 作業用のworktreeに残った仕様の変更を、移行前のブランチの取り込みで canonical に入れます。
:::

## エージェント向けの規則

配布するスキルと AGENTS.md に、次の短い節を置きます（R-H1）。エージェントは、設計書を読まなくても、この節だけで迷わずに作業できるようにします。

:::checklist エージェントが守る規則
- 仕様は `spec-dock/initiatives/` にあり、普通に読み書きする
- 仕様は Git で扱わない（add、commit、stash、reset をしない）。保存と共有は自動で行われる
- 仕様が見えないときは `spec-dock canonical link` を実行する
- 読み書きを拒否されたときは、状態の表示が示す1行の設定を利用者に伝える
- 検索では、パスを明示する（`rg 語 spec-dock/initiatives/`）
- 構造（作成、親子、依存、状態、題名）は、SpecDock のコマンドだけで変える
- `*.conflict-*` のファイルがあれば、中身を元のファイルに統合し、消す
- Claude Code の隔離セッションでは、仕様を読むだけにする
- 作業を終えるときは `spec-dock work finish` を使う
:::

SpecDock のエラーの文言にも、次に実行すべきコマンドか、足すべき設定を必ず含めます（R-H2）。

## 受け入れ条件

:::checklist 受け入れ条件
- AC-01：移行後の spec-dock の既定のブランチに、仕様のパスと `.meta.json` が1つもない
- AC-02：書いた仕様が、同じPCの別のworktreeから保存の前にも読め、別のクローンからはおよそ2分以内に読める
- AC-03：2つのクローンで同じファイルを同時に編集しても両方の内容が残り、競合のマーカーがどこにも残らない
- AC-04：移行の前後で、全Scopeの番号・種類・親子・依存が一致し、`.meta.json` が残っていない
- AC-05：移行前のブランチの仕様を取り込んだ後、PRが仕様を含まずにマージできる

## 合意済みの判断

これまでの議論（2026-10-24〜25）で決めたことです。

| 項目 | 決定 |
|---|---|
| この Epic の範囲 | SpecDock の更新と、spec-dock での dogfooding まで |
| カタログの置き場 | mainのチェックアウトの `spec-dock/.canonical/` の1か所 |
| 用意 | `spec-dock canonical link`。`make init` への組み込みは各プロジェクトで決める |
| ブランチ名 | `spec-dock/canonical`。関連する名前も canonical にそろえる |
| 隔離セッション | 仕様を読むだけ |
| 入れ子 | 残す。GitHub が正本で、入れ子はその写し |
| 作業中の印 | 着手で付けて完了で外すラベルと、足すだけの担当者 |
| 検索 | AGENTS.md に、明示のパスで検索する規則を書く |
| Codex のクラウドからの書き込み | 扱わない |
| 保存 | SpecDock の一定時間ごとの保存と同期に一本化する。ツールのフックは使わない |
| 競合 | 先着優先。後から push する側が解消する |
| 種類 | ラベルで持つ |
| `.meta.json` | 廃止し、GitHub Issue に一本化する |
| 同期の向き | canonical と既定のブランチの間では同期しない |
| 既定のブランチの強制 | 独立のワークフローを、既存のCIと同じ運用で、PRのマージの条件にする。GitHub の必須の検査は設定しない |
| ツールの設定 | Claude Code と Codex に1行ずつの設定が要ることを許容する。利用者が1回だけ手で足し、使い方の文書に記録する。導入や更新で自動では書かない |
| 名前 | 識別は英小文字とハイフン、題名（Scope の Issue の題名）は日本語に対応する |
| 移行の道具 | 直接実行する使い捨てのスクリプト |
| 従来モード | 移行していないリポジトリのために、今のコードを変えずに残す。個人のプロジェクトの移行が終わったら、別の Epic で消す |
| ダッシュボード | 今回は今までの Markdown と PlantUML の形を、定期の同期が作り直す。HTML のダッシュボードは次の Epic（#425） |
| 仕様の文書の形式 | CUE と HTML への移行は、次の Epic（#425） |
| 構造の取得 | リポジトリごとに一括で取得して持ち、使い回す |
| 動く環境 | macOS と Linux（デスクトップ、SSH のサーバーと仮想マシン、コンテナ）。Windows は対象外 |
| コンテナ | 中でクローンし、別のPCと同じに扱う。マウントは、安全に止まることだけを保証する |

### エージェントが決めたこと

細かい点は、任せていただいたとおり、エージェントが決めました。異議があれば変えます。

- slug を、GitHub の本文の末尾に、画面に出ない HTML コメントの印として持ちます。GitHub だけからディレクトリを作り直せるようにするためです。
- テンプレートから `タイトル:` の写しを外します。題名の正本を GitHub だけにするためです。
- 定期の実行は、`spec-dock canonical link` が登録します。SpecDock 自身の仕組みで、ツールの設定ではないためです。コンテナの常駐のプロセスも、同じコマンドが起動します。起動し直しの設定と linger は、1行を示すだけで変えません。
- 構造の「変わったか」の確かめは、種類のラベルごとの条件付きの要求で行い、変わっていたときだけ全体を取り直します。親子と依存だけの変更で更新の時刻が変わるかを確かめていないので、30分ごとにも取り直します。
- 構造のスナップショットは、リポジトリの外の状態の置き場に置きます。読むだけのコマンドも、このファイルだけは更新してよいことにします。
- ダッシュボードは、mainのチェックアウトにだけ作ります。
- 仕様を使うほかのコマンドは、足りなくても自分では直さず、次の1手を示して止まります。
- マージの後に Issue を立てる見張りは作りません。
- 移行前の版の SpecDock は、今あるワークスペースの宣言（`spec-dock/workspace.json`）の版を上げる仕組みで止めます。新しい仕組みは足しません。
- canonical には CI の定義を置きません。
- 切り替えの手順は、「移行」の章のとおりです。

## 設計で確かめたこと

要件定義の後に、設計で確かめるとしていた4つの項目は、設計書（`design.md`）で決めました。詳しくは、設計の説明資料にあります。

- Codex のサンドボックスの中での排他：ディレクトリへの `flock` が、サンドボックスの内と外で互いに効きました :fact[2026-10-25 に macOS で確認]。
- 定期の実行からの push の認証：macOS の launchd から、利用者の `gh` のログインで認証できました :fact[dry-run で確認]。Linux では、systemd のユーザーのタイマーが動くことと、ディレクトリへの排他が効くことを、Ubuntu 24.04 の仮想マシンで確かめました :fact[2026-10-25 に確認]。タイマーからの push の認証は、実装の Issue で確かめます。
- 検査のワークフローでの SpecDock の入れ方と版の固定：配布資産の版のファイルで版を決め、版のタグから入れます。
- 新しいコマンドの名前：`spec-dock canonical` のグループに集め、保存の入口を `canonical sync` にしました。

### 設計の調査で足した要件

- **R-A6、AC-15**：移行していないリポジトリ（宣言の版3）は、新しい SpecDock でも今のまま動きます。SpecDock のパッケージは、1台のPCのすべてのリポジトリが共有しているためです。
- **R-E4、AC-09**：今の CLI は `spec-dock/dashboard.md` を生成していませんでした :fact[コードで確認]。日本語の題名は、`scope show` や `workspace sync` の表示に出します。ダッシュボードは、2回目のヒアリングで、作り直すことになりました（R-E5）。
- **macOS のプライバシーの保護**：外付けのボリュームにあるリポジトリは、定期の実行が動かすプログラムに macOS の許可がないと読めません :fact[確認済み]。状態の表示が、許可を与える場所を示します。

@media (min-width: 1180px) {

/* 目次 */

/* 目次ドロワー（狭い画面） */

.ds-drawer__head { display: flex; align-items: center; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) 12px 8px 20px; border-bottom: 1px solid var(--ds-border); font-weight: 700; font-size: 14px; }

/* ---------- A：ドキュメント ---------- */

.ds-footer { max-width: var(--ds-measure); margin: 96px auto 0; padding-top: 24px; border-top: 1px solid var(--ds-border); display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; font-size: 13px; color: var(--ds-muted); }

/* ---------- B：エディトリアル ---------- */

/* ---------- C：ブループリント ---------- */

/* ============================================================
   4. 本文
   ============================================================ */
.ds-content > * + *, .ds-flow > * + * { margin-top: var(--ds-flow); }
/* 部品の前後は段落より広く空ける */
.ds-content > :not(p, ul, ol, h2, h3, h4, blockquote, hr) + *, .ds-content > * + :not(p, ul, ol, h2, h3, h4, blockquote, hr) { margin-top: var(--ds-flow-block, 1.9em); }

.ds-content { counter-reset: ds-h2 ds-fig; }
.ds-content h2, .ds-content h3, .ds-content h4 {
  position: relative; margin-bottom: 0;
  font-family: var(--ds-font-heading); color: var(--ds-text);

}

  display: inline-grid; place-items: center; width: 1.1em; height: 1.1em;

}

.ds-content a, .ds-flow a { color: var(--ds-link); text-decoration-line: underline; text-decoration-thickness: 1px; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: .22em; transition: text-decoration-color .15s; }

}

:where(.ds-content, .ds-flow) :is(ul, ol) { margin: 0; padding-left: 1.5em; }

.ds-content ul > li::marker { color: var(--ds-accent); }
.ds-content ol > li::marker { color: var(--ds-muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.ds-content blockquote { margin-inline: 0; padding: .2em 0 .2em 1.2em; border-left: 3px solid var(--ds-accent-line); color: var(--ds-text-2); }

.ds-content hr { border: 0; height: 1px; background: var(--ds-border); margin: 3em 0; }
kbd, .ds-kbd {
  display: inline-block; min-width: 1.6em; padding: .05em .45em; text-align: center;
  font-family: var(--ds-font-mono); font-size: .8em; line-height: 1.6;
  border: 1px solid var(--ds-border-2); border-bottom-width: 2px; border-radius: 5px;
  background: var(--ds-surface); color: var(--ds-text);
}
mark, .ds-mark-text { background: var(--ds-highlight); color: inherit; padding: 0 .15em; border-radius: 3px; }

/* ============================================================
   5. 横に広げる要素（図・表・コード）
   ============================================================ */
.ds-content > .ds-bleed {
  --ds-avail: min(100cqi, var(--ds-wide-max));

}

}

/* 表 */

  background:
    linear-gradient(to right, var(--ds-surface) 30%, transparent) left / 32px 100% no-repeat local,
    linear-gradient(to left, var(--ds-surface) 30%, transparent) right / 32px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgb(0 0 0 / 12%), transparent) left / 12px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgb(0 0 0 / 12%), transparent) right / 12px 100% no-repeat scroll,
    var(--ds-surface);
}
.ds-table table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .92em; line-height: 1.7; }

/* コード */

.ds-code__bar { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 6px 0 14px; border-bottom: 1px solid var(--ds-code-line); font-size: 12.5px; color: var(--ds-muted); }

.ds-code__title { font-family: var(--ds-font-mono); color: var(--ds-code-text); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-code__title .ds-icon { margin-right: 6px; vertical-align: -2px; opacity: .7; }

.hljs-addition { color: var(--ds-syn-add); }
.hljs-deletion { color: var(--ds-syn-del); }

/* ============================================================
   6. 図（PlantUML・画像・グラフ）
   ============================================================ */
.ds-figure { margin: 0; }
.ds-figure__frame {
  position: relative;
  border: 1px solid var(--ds-paper-line); border-radius: var(--ds-radius-l);
  background: var(--ds-paper); color: #1d2433;
  overflow: hidden;
}

.ds-diagram__canvas { display: grid; place-items: center; min-height: 180px; padding: clamp(14px, 2.5vw, 32px); }
.ds-diagram__canvas svg { display: block; max-width: 100%; height: auto; }

.ds-figure__tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
.ds-figure__frame:hover .ds-figure__tools, .ds-figure__frame:focus-within .ds-figure__tools { opacity: 1; }
@media (hover: none) { .ds-figure__tools { opacity: 1; } }
.ds-figure__tool {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px;
  border: 1px solid #d5dae2; border-radius: 8px; background: rgb(255 255 255 / 92%); color: #344054;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);

}

}

.ds-figure__source { margin: 10px 0 0; max-height: 360px; overflow: auto; padding: 14px 16px; border-radius: var(--ds-radius); background: var(--ds-code-bg); border: 1px solid var(--ds-code-line); color: var(--ds-code-text); font-family: var(--ds-font-mono); font-size: 12.5px; line-height: 1.65; white-space: pre; }
.ds-figure img { display: block; max-width: 100%; height: auto; margin-inline: auto; }

/* ============================================================
   7. 部品
   ============================================================ */
/* 注記 */
.ds-callout {
  --tone: var(--ds-note); --tone-bg: var(--ds-note-bg); --tone-line: var(--ds-note-line); --tone-ink: var(--ds-note-ink);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px;
  padding: 14px 18px 15px 16px;
  border: 1px solid var(--tone-line); border-radius: var(--ds-radius);
  background: var(--tone-bg);
}
.ds-callout[data-tone="tip"] { --tone: var(--ds-tip); --tone-bg: var(--ds-tip-bg); --tone-line: var(--ds-tip-line); --tone-ink: var(--ds-tip-ink); }
.ds-callout[data-tone="warning"] { --tone: var(--ds-warn); --tone-bg: var(--ds-warn-bg); --tone-line: var(--ds-warn-line); --tone-ink: var(--ds-warn-ink); }
.ds-callout[data-tone="danger"] { --tone: var(--ds-danger); --tone-bg: var(--ds-danger-bg); --tone-line: var(--ds-danger-line); --tone-ink: var(--ds-danger-ink); }
.ds-callout[data-tone="success"] { --tone: var(--ds-ok); --tone-bg: var(--ds-ok-bg); --tone-line: var(--ds-ok-line); --tone-ink: var(--ds-ok-ink); }
.ds-callout__icon { grid-row: span 2; padding-top: .28em; color: var(--tone); font-size: 19px; line-height: 1; }
.ds-callout__title { margin: 0; font-weight: 700; color: var(--tone-ink); font-size: .95em; }
.ds-callout__body { font-size: .95em; color: var(--ds-text-2); }
.ds-callout__body > * + * { margin-top: .6em; }

/* バッジ */
.ds-badge {
  --tone: var(--ds-muted); --tone-bg: var(--ds-surface-2); --tone-line: var(--ds-border); --tone-ink: var(--ds-text-2);
  display: inline-flex; align-items: center; gap: .3em; vertical-align: .08em;
  padding: .1em .6em; border-radius: 999px; border: 1px solid var(--tone-line);
  background: var(--tone-bg); color: var(--tone-ink);
  font-size: .74rem; font-weight: 650; line-height: 1.55; white-space: nowrap; letter-spacing: .01em;
}
.ds-badge .ds-icon { font-size: 1.05em; }
.ds-badge[data-tone="accent"] { --tone-bg: var(--ds-accent-soft); --tone-line: var(--ds-accent-line); --tone-ink: var(--ds-accent-strong); }
.ds-badge[data-tone="note"], .ds-badge[data-tone="info"] { --tone-bg: var(--ds-note-bg); --tone-line: var(--ds-note-line); --tone-ink: var(--ds-note-ink); }
.ds-badge[data-tone="success"], .ds-badge[data-tone="ok"] { --tone-bg: var(--ds-ok-bg); --tone-line: var(--ds-ok-line); --tone-ink: var(--ds-ok-ink); }
.ds-badge[data-tone="warning"] { --tone-bg: var(--ds-warn-bg); --tone-line: var(--ds-warn-line); --tone-ink: var(--ds-warn-ink); }
.ds-badge[data-tone="danger"] { --tone-bg: var(--ds-danger-bg); --tone-line: var(--ds-danger-line); --tone-ink: var(--ds-danger-ink); }
.ds-badge[data-tone="solid"] { --tone-bg: var(--ds-accent); --tone-line: var(--ds-accent); --tone-ink: var(--ds-on-accent); }

.ds-evidence { display: inline-flex; align-items: center; gap: .35em; padding: .05em .55em .05em .4em; border-radius: 6px; font-size: .85em; font-weight: 600; line-height: 1.6; vertical-align: .05em; }
.ds-evidence[data-kind="fact"] { background: var(--ds-ok-bg); color: var(--ds-ok-ink); box-shadow: inset 0 0 0 1px var(--ds-ok-line); }
.ds-evidence[data-kind="guess"] { background: var(--ds-warn-bg); color: var(--ds-warn-ink); box-shadow: inset 0 0 0 1px var(--ds-warn-line); outline: 1px dashed var(--ds-warn); outline-offset: -1px; box-shadow: none; }
.ds-evidence .ds-icon { font-size: 1.05em; }
.ds-inline-icon { vertical-align: -.14em; color: var(--ds-accent); }

/* 要点 */
.ds-summary { position: relative; padding: 20px 24px 22px; border-radius: var(--ds-radius-l); background: var(--ds-accent-soft); border: 1px solid var(--ds-accent-line); }
.ds-summary__title { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-weight: 750; color: var(--ds-accent-strong); font-size: .95em; }
.ds-summary__title .ds-icon { font-size: 18px; }
.ds-summary ol { list-style: none; padding: 0; margin: 0; counter-reset: ds-sum; display: grid; gap: 8px; }
.ds-summary li { counter-increment: ds-sum; display: grid; grid-template-columns: 1.7em minmax(0, 1fr); gap: 8px; margin: 0 !important; }
.ds-summary li::before { content: counter(ds-sum); display: grid; place-items: center; width: 1.6em; height: 1.6em; margin-top: .18em; border-radius: 50%; background: var(--ds-accent); color: var(--ds-on-accent); font-size: .78em; font-weight: 700; }

/* カード */
.ds-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--ds-card-min, 14.5rem)), 1fr)); gap: 14px; }
.ds-cards[data-cols="2"] { --ds-card-min: 19rem; }
.ds-cards[data-cols="4"] { --ds-card-min: 12rem; }
.ds-card {
  position: relative; display: flex; flex-direction: column; gap: 8px;
  padding: 18px 18px 18px; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l);
  background: var(--ds-surface); box-shadow: var(--ds-shadow-s); color: var(--ds-text);
  text-decoration: none !important;
  transition: border-color .15s, box-shadow .2s, transform .2s var(--ds-ease);
}
a.ds-card:hover { border-color: var(--ds-accent-line); box-shadow: var(--ds-shadow); transform: translateY(-2px); }
.ds-card__head { display: flex; align-items: flex-start; gap: 12px; }
.ds-card__icon { display: grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 10px; background: var(--ds-accent-soft); color: var(--ds-accent); font-size: 19px; }
.ds-card__title { margin: 0; font-weight: 700; font-size: 1rem; line-height: 1.5; padding-top: .3em; }
.ds-card__badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.ds-card__body { font-size: .92em; line-height: 1.8; color: var(--ds-text-2); }
.ds-card__body > * + * { margin-top: .5em; }
.ds-card__body ul { padding-left: 1.2em; margin: 0; }
.ds-card__more { margin-top: auto; padding-top: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ds-link); }

/* 比較表 */
.ds-compare { container-type: inline-size; }
.ds-compare th.is-rec, .ds-compare td.is-rec { background: color-mix(in srgb, var(--ds-accent) 6%, transparent); }
.ds-compare th.is-rec { color: var(--ds-accent-strong); box-shadow: inset 0 3px 0 var(--ds-accent); }
.ds-compare th .ds-badge { margin-left: 6px; }
.ds-compare td:first-child, .ds-compare th:first-child { font-weight: 650; color: var(--ds-text); }
.ds-compare__cards { display: none; gap: 12px; }
.ds-compare__card { border: 1px solid var(--ds-border); border-radius: var(--ds-radius); background: var(--ds-surface); overflow: hidden; }
.ds-compare__card.is-rec { border-color: var(--ds-accent); box-shadow: 0 0 0 1px var(--ds-accent); }
.ds-compare__card h4 { margin: 0; padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 15px; background: var(--ds-surface-2); border-bottom: 1px solid var(--ds-border); }
.ds-compare__card dl { margin: 0; padding: 6px 14px 10px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.ds-compare__card dt { color: var(--ds-muted); font-size: 13px; padding-top: 1px; }
.ds-compare__card dd { margin: 0; }
@container (max-width: 560px) {
  .ds-compare .ds-table__scroll { display: none; }
  .ds-compare__cards { display: grid; }
}

/* 長所と短所・変更前後 */
.ds-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 14px; }
.ds-pair__box { border: 1px solid var(--ds-border); border-radius: var(--ds-radius); background: var(--ds-surface); padding: 14px 18px 16px; }
.ds-pair__title { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-weight: 700; font-size: .95em; }
.ds-pair__title .ds-icon { font-size: 17px; }
.ds-pair__box ul { list-style: none; padding: 0 !important; display: grid; gap: 6px; }
.ds-pair__box li { display: grid; grid-template-columns: 1.2em minmax(0, 1fr); gap: 6px; margin: 0 !important; font-size: .95em; }
.ds-pair__box li::before { font-weight: 800; }
.ds-pair__box[data-kind="pros"] { border-top: 3px solid var(--ds-ok); }
.ds-pair__box[data-kind="pros"] .ds-pair__title { color: var(--ds-ok-ink); }
.ds-pair__box[data-kind="pros"] li::before { content: "＋"; color: var(--ds-ok); }
.ds-pair__box[data-kind="cons"] { border-top: 3px solid var(--ds-danger); }
.ds-pair__box[data-kind="cons"] .ds-pair__title { color: var(--ds-danger-ink); }
.ds-pair__box[data-kind="cons"] li::before { content: "－"; color: var(--ds-danger); }
.ds-ba { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 12px; }
.ds-ba__arrow { display: grid; place-items: center; color: var(--ds-accent); font-size: 22px; }
.ds-ba .ds-pair__box[data-kind="before"] { background: var(--ds-surface-2); }
.ds-ba .ds-pair__box[data-kind="before"] .ds-pair__title { color: var(--ds-muted); }
.ds-ba .ds-pair__box[data-kind="after"] { border-color: var(--ds-accent-line); box-shadow: inset 0 3px 0 var(--ds-accent); }
.ds-ba .ds-pair__box[data-kind="after"] .ds-pair__title { color: var(--ds-accent-strong); }
.ds-ba .ds-pair__box ul { list-style: disc; padding-left: 1.2em !important; display: block; }
.ds-ba .ds-pair__box li { display: list-item; }
.ds-ba .ds-pair__box li::before { content: none; }
@container ds-main (max-width: 640px) {
  .ds-ba { grid-template-columns: minmax(0, 1fr); }
  .ds-ba__arrow { transform: rotate(90deg); }
}

/* 決定記録 */
.ds-decision { border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l); background: var(--ds-surface); overflow: hidden; }
.ds-decision__head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 18px; border-bottom: 1px solid var(--ds-border); background: var(--ds-surface-2); }
.ds-decision__kicker { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--ds-muted); }
.ds-decision__title { flex: 1 1 auto; margin: 0; font-size: 1.02rem; font-weight: 750; }
.ds-decision__date { font-size: 12.5px; color: var(--ds-muted); font-variant-numeric: tabular-nums; }
.ds-decision__rows { display: grid; grid-template-columns: 11em minmax(0, 1fr); }
.ds-decision__rows > dt { padding: 12px 18px; font-size: 13px; font-weight: 700; color: var(--ds-muted); border-bottom: 1px solid var(--ds-border); }
.ds-decision__rows > dd { margin: 0; padding: 12px 18px; border-bottom: 1px solid var(--ds-border); font-size: .95em; }
.ds-decision__rows > dd > * + * { margin-top: .5em; }
.ds-decision__rows > dd ul { padding-left: 1.2em; margin: 0; }
.ds-decision__rows > :nth-last-child(-n+2) { border-bottom: 0; }
.ds-decision__rows > dt.is-key + dd { font-weight: 650; color: var(--ds-text); font-size: 1em; }
@container ds-main (max-width: 600px) {
  .ds-decision__rows { grid-template-columns: minmax(0, 1fr); }
  .ds-decision__rows > dt { border-bottom: 0; padding-bottom: 0; }
}

/* 手順 */
.ds-steps { list-style: none; margin: 0; padding: 0 !important; counter-reset: ds-step; }
.ds-step { position: relative; counter-increment: ds-step; display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); gap: 0 16px; margin: 0 !important; padding-bottom: 22px; }
.ds-step:last-child { padding-bottom: 0; }
.ds-step::before { content: counter(ds-step); position: relative; z-index: 1; display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: 50%; background: var(--ds-surface); border: 2px solid var(--ds-accent); color: var(--ds-accent-strong); font-weight: 750; font-size: .95rem; font-variant-numeric: tabular-nums; }
.ds-step:not(:last-child)::after { content: ""; position: absolute; left: calc(1.125rem - 1px); top: 2.25rem; bottom: 0; width: 2px; background: linear-gradient(var(--ds-accent-line), var(--ds-border)); }
.ds-step__title { margin: 0; padding-top: .2rem; font-weight: 700; color: var(--ds-text); line-height: 1.6; }
.ds-step__body { font-size: .95em; color: var(--ds-text-2); margin-top: 2px; }
.ds-step__body > * + * { margin-top: .55em; }
.ds-steps[data-layout="horizontal"] { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: 18px 14px; }
.ds-steps[data-layout="horizontal"] .ds-step { grid-template-columns: minmax(0, 1fr); padding: 0; gap: 10px; }
.ds-steps[data-layout="horizontal"] .ds-step:not(:last-child)::after { left: 2.75rem; right: -6px; top: calc(1.125rem - 1px); bottom: auto; width: auto; height: 2px; background: var(--ds-accent-line); }

/* 時系列 */
.ds-timeline { list-style: none; margin: 0; padding: 0 !important; }
.ds-timeline li { position: relative; display: grid; grid-template-columns: 7.5em 18px minmax(0, 1fr); gap: 0 14px; margin: 0 !important; padding-bottom: 18px; }
.ds-timeline li:last-child { padding-bottom: 0; }
.ds-timeline__date { text-align: right; font-size: 13px; font-weight: 700; color: var(--ds-muted); font-variant-numeric: tabular-nums; padding-top: .2em; }
.ds-timeline__dot { position: relative; display: flex; justify-content: center; }
.ds-timeline__dot::before { content: ""; position: relative; z-index: 1; width: 11px; height: 11px; margin-top: .55em; border-radius: 50%; background: var(--ds-surface); border: 2px solid var(--ds-border-2); }
.ds-timeline li:not(:last-child) .ds-timeline__dot::after { content: ""; position: absolute; top: 1.3em; bottom: -18px; width: 2px; background: var(--ds-border); }
.ds-timeline li.is-now .ds-timeline__dot::before { background: var(--ds-accent); border-color: var(--ds-accent); box-shadow: 0 0 0 4px var(--ds-accent-soft); }
.ds-timeline li.is-now .ds-timeline__date { color: var(--ds-accent-strong); }
.ds-timeline__body { font-size: .95em; }
.ds-timeline__body b { color: var(--ds-text); }
@container ds-main (max-width: 520px) {
  .ds-timeline li { grid-template-columns: 18px minmax(0, 1fr); }
  .ds-timeline__date { grid-column: 2; text-align: left; padding: 0; }
  .ds-timeline__dot { grid-row: 1 / span 2; grid-column: 1; }
  .ds-timeline__body { grid-column: 2; }
}

/* 流れ */
.ds-flow-chain { container-type: inline-size; }
.ds-flow-chain ol { list-style: none; margin: 0; padding: 0 !important; display: flex; align-items: stretch; gap: 0; }
.ds-flow-chain li { flex: 1 1 0; min-width: 0; display: flex; align-items: stretch; margin: 0 !important; }
.ds-flow-chain__box { flex: 1; min-width: 0; padding: 14px 14px 15px; border: 1px solid var(--ds-border); border-radius: var(--ds-radius); background: var(--ds-surface); box-shadow: var(--ds-shadow-s); }
.ds-flow-chain__icon { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--ds-accent-soft); color: var(--ds-accent); font-size: 16px; margin-bottom: 8px; }
.ds-flow-chain__title { margin: 0; font-weight: 700; font-size: .95em; line-height: 1.5; }
.ds-flow-chain__desc { margin: 4px 0 0; font-size: .84em; line-height: 1.7; color: var(--ds-text-2); }
.ds-flow-chain__arrow { flex: none; display: grid; place-items: center; width: 30px; color: var(--ds-faint); font-size: 18px; }
.ds-flow-chain li:last-child .ds-flow-chain__arrow { display: none; }
@container (max-width: 620px) {
  .ds-flow-chain ol { flex-direction: column; }
  .ds-flow-chain li { flex-direction: column; }
  .ds-flow-chain__arrow { width: auto; height: 26px; transform: rotate(90deg); }
}

/* 層構造 */
.ds-layers { display: grid; gap: 6px; }
.ds-layer { --depth: 0; display: grid; grid-template-columns: minmax(9rem, 13rem) minmax(0, 1fr); align-items: center; gap: 4px 18px; padding: 13px 18px; border: 1px solid color-mix(in srgb, var(--ds-accent) calc(14% + var(--depth) * 6%), var(--ds-border)); border-radius: var(--ds-radius); background: color-mix(in srgb, var(--ds-accent) calc(3% + var(--depth) * 3.5%), var(--ds-surface)); }
.ds-layer__name { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: .95em; color: var(--ds-text); }
.ds-layer__name .ds-icon { color: var(--ds-accent); font-size: 18px; }
.ds-layer__desc { font-size: .9em; color: var(--ds-text-2); line-height: 1.7; }
.ds-layer__desc code { font-size: .82em !important; }
@container ds-main (max-width: 560px) { .ds-layer { grid-template-columns: minmax(0, 1fr); } }

/* ファイルツリー */
.ds-tree { margin: 0; padding: 14px 16px; border: 1px solid var(--ds-border); border-radius: var(--ds-radius); background: var(--ds-surface); font-family: var(--ds-font-mono); font-size: 13.5px; line-height: 1.95; overflow-x: auto; }
.ds-tree ul { list-style: none; margin: 0; padding: 0 0 0 1.25em !important; border-left: 1px dashed var(--ds-border-2); margin-left: .45em; }
.ds-tree > ul { border-left: 0; padding-left: 0 !important; margin-left: 0; }
.ds-tree li { margin: 0 !important; white-space: nowrap; }
.ds-tree__row { display: flex; align-items: center; gap: 7px; }
.ds-tree__row .ds-icon { color: var(--ds-muted); font-size: 15px; }
.ds-tree__row[data-kind="dir"] .ds-icon { color: var(--ds-accent); }
.ds-tree__row[data-kind="dir"] .ds-tree__name { font-weight: 650; }
.ds-tree__note { margin-left: 10px; font-family: var(--ds-font-sans); font-size: 12.5px; color: var(--ds-muted); }
.ds-tree__mark { font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; line-height: 1.6; }
.ds-tree__mark[data-mark="+"] { background: var(--ds-ok-bg); color: var(--ds-ok-ink); }
.ds-tree__mark[data-mark="-"] { background: var(--ds-danger-bg); color: var(--ds-danger-ink); }
.ds-tree__mark[data-mark="~"] { background: var(--ds-warn-bg); color: var(--ds-warn-ink); }
.ds-tree__row[data-mark="-"] .ds-tree__name { text-decoration: line-through; color: var(--ds-muted); }

/* 用語集・用語の吹き出し */
.ds-glossary { margin: 0; display: grid; grid-template-columns: minmax(8rem, 12rem) minmax(0, 1fr); border-top: 1px solid var(--ds-border); }
.ds-glossary dt, .ds-glossary dd { padding: 12px 0; border-bottom: 1px solid var(--ds-border); }
.ds-glossary dt { padding-right: 18px; font-weight: 700; color: var(--ds-text); }
.ds-glossary dt small { display: block; font-size: 11.5px; font-weight: 500; color: var(--ds-muted); letter-spacing: .04em; }
.ds-glossary dd { margin: 0; font-size: .95em; color: var(--ds-text-2); }
.ds-glossary dt:target, .ds-glossary dt:target + dd { background: var(--ds-accent-soft); }
@container ds-main (max-width: 560px) {
  .ds-glossary { grid-template-columns: minmax(0, 1fr); }
  .ds-glossary dt { border-bottom: 0; padding-bottom: 0; }
}
.ds-term { padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: help; text-decoration: underline dotted; text-decoration-color: var(--ds-accent); text-decoration-thickness: 1.5px; text-underline-offset: .25em; }
.ds-term:hover { color: var(--ds-accent-strong); }
.ds-popover {
  position: absolute; z-index: 60; width: min(320px, calc(100vw - 32px));
  padding: 12px 14px 13px; border-radius: 10px;
  background: var(--ds-surface); border: 1px solid var(--ds-border-2); box-shadow: var(--ds-shadow-l);
  font-size: 13.5px; line-height: 1.75; color: var(--ds-text-2);
  animation: ds-pop .14s var(--ds-ease);
}
@keyframes ds-pop { from { opacity: 0; transform: translateY(4px); } }
.ds-popover__term { display: block; margin-bottom: 4px; font-weight: 750; color: var(--ds-text); font-size: 14px; }
.ds-popover a { display: inline-block; margin-top: 6px; font-size: 12.5px; color: var(--ds-link); }

/* 指標 */
.ds-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: 12px; }
.ds-metric { padding: 16px 18px; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l); background: var(--ds-surface); }
.ds-metric__label { font-size: 12.5px; font-weight: 650; color: var(--ds-muted); }
.ds-metric__value { margin-top: 4px; font-size: 1.95rem; line-height: 1.2; font-weight: 750; letter-spacing: -.01em; color: var(--ds-text); }
.ds-metric__unit { margin-left: 2px; font-size: .5em; font-weight: 650; color: var(--ds-muted); }
.ds-metric__delta { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 12.5px; font-weight: 600; color: var(--ds-muted); }
.ds-metric__delta[data-tone="good"] { color: var(--ds-ok-ink); }
.ds-metric__delta[data-tone="bad"] { color: var(--ds-danger-ink); }

/* タブ */
.ds-tabs__list { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--ds-border); scrollbar-width: none; }
.ds-tabs__tab { position: relative; flex: none; padding: 9px 14px 10px; border: 0; background: none; color: var(--ds-muted); font-size: 14px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.ds-tabs__tab:hover { color: var(--ds-text); }
.ds-tabs__tab[aria-selected="true"] { color: var(--ds-accent-strong); }
.ds-tabs__tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ds-accent); }
.ds-tabs__panel { padding-top: 16px; }
.ds-tabs__panel[hidden] { display: none; }

/* 折りたたみ */
.ds-details { border: 1px solid var(--ds-border); border-radius: var(--ds-radius); background: var(--ds-surface); }
.ds-details > summary { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; list-style: none; font-weight: 650; }
.ds-details > summary::-webkit-details-marker { display: none; }
.ds-details > summary .ds-icon { color: var(--ds-muted); transition: transform .2s var(--ds-ease); }
.ds-details[open] > summary .ds-icon { transform: rotate(90deg); }
.ds-details > summary:hover { color: var(--ds-accent-strong); }
.ds-details__body { padding: 0 16px 16px 42px; font-size: .95em; color: var(--ds-text-2); }
.ds-details + .ds-details { margin-top: 8px !important; }

/* 確認項目 */
.ds-checklist { border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l); background: var(--ds-surface); overflow: hidden; }
.ds-checklist__head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--ds-border); background: var(--ds-surface-2); }
.ds-checklist__title { font-weight: 700; font-size: .95em; }
.ds-checklist__meter { flex: 1; height: 6px; border-radius: 999px; background: var(--ds-surface-3); overflow: hidden; }
.ds-checklist__meter span { display: block; height: 100%; width: var(--done, 0%); background: var(--ds-ok); border-radius: inherit; transition: width .3s var(--ds-ease); }
.ds-checklist__count { font-size: 12.5px; font-weight: 700; color: var(--ds-muted); font-variant-numeric: tabular-nums; }
.ds-checklist ul { list-style: none; margin: 0; padding: 6px 0 !important; }
.ds-checklist li { margin: 0 !important; }
.ds-checklist label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding: 8px 16px; cursor: pointer; font-size: .95em; }
.ds-checklist label:hover { background: var(--ds-surface-2); }
.ds-checklist input { appearance: none; margin: .2em 0 0; width: 20px; height: 20px; border: 1.5px solid var(--ds-border-2); border-radius: 6px; background: var(--ds-surface); display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s; }
.ds-checklist input::after { content: ""; width: 10px; height: 6px; border: solid var(--ds-on-accent); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px) scale(0); transition: transform .15s var(--ds-ease); }
.ds-checklist input:checked { background: var(--ds-ok); border-color: var(--ds-ok); }
.ds-checklist input:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); border-color: #fff; }
.ds-checklist input:checked + span { color: var(--ds-muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, currentColor 50%, transparent); }
.ds-checklist__foot { padding: 8px 16px 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--ds-faint); border-top: 1px solid var(--ds-border); }

/* 理解度チェック */
.ds-quiz { padding: 18px 20px 20px; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l); background: var(--ds-surface); }
.ds-quiz__kicker { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--ds-accent-strong); letter-spacing: .04em; }
.ds-quiz__q { margin: 0 0 12px !important; font-weight: 700; color: var(--ds-text); }
.ds-quiz__options { display: grid; gap: 8px; }
.ds-quiz__opt { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: center; gap: 10px; width: 100%; padding: 10px 14px; text-align: left; border: 1px solid var(--ds-border); border-radius: 10px; background: var(--ds-surface); color: var(--ds-text-2); font-size: .95em; line-height: 1.6; cursor: pointer; transition: border-color .15s, background .15s; }
.ds-quiz__opt:hover:not(:disabled) { border-color: var(--ds-accent-line); background: var(--ds-accent-soft); }
.ds-quiz__mark { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ds-surface-2); color: var(--ds-muted); font-size: 12px; font-weight: 750; }
.ds-quiz__opt:disabled { cursor: default; }
.ds-quiz__opt.is-correct { border-color: var(--ds-ok); background: var(--ds-ok-bg); color: var(--ds-text); }
.ds-quiz__opt.is-correct .ds-quiz__mark { background: var(--ds-ok); color: #fff; }
.ds-quiz__opt.is-wrong { border-color: var(--ds-danger); background: var(--ds-danger-bg); }
.ds-quiz__opt.is-wrong .ds-quiz__mark { background: var(--ds-danger); color: #fff; }
.ds-quiz__result { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--ds-surface-2); font-size: .93em; }
.ds-quiz__result b { display: block; margin-bottom: 2px; }
.ds-quiz__result[data-ok="true"] b { color: var(--ds-ok-ink); }
.ds-quiz__result[data-ok="false"] b { color: var(--ds-danger-ink); }
.ds-quiz__retry { margin-top: 10px; }

/* 出典 */
.ds-sources { list-style: none; margin: 0; padding: 0 !important; counter-reset: ds-src; display: grid; gap: 10px; }
.ds-sources li { counter-increment: ds-src; display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 4px 10px; margin: 0 !important; font-size: .93em; }
.ds-sources li::before { content: "[" counter(ds-src) "]"; color: var(--ds-muted); font-variant-numeric: tabular-nums; font-size: .9em; padding-top: .1em; }
.ds-sources__host { display: block; font-size: 12px; color: var(--ds-muted); }
.ds-footnotes { margin-top: 4em !important; padding-top: 1.2em; border-top: 1px solid var(--ds-border); font-size: .88em; color: var(--ds-text-2); }
.ds-footnotes ol { padding-left: 1.4em; }
.ds-fnref { font-size: .72em; line-height: 0; vertical-align: super; margin-left: 1px; }
.ds-fnref a { text-decoration: none !important; padding: 0 .15em; }

/* 見本（書き方と表示） */
.ds-example { container-type: inline-size; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l); background: var(--ds-surface); overflow: hidden; }
.ds-example__head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 16px; border-bottom: 1px solid var(--ds-border); background: var(--ds-surface-2); }
.ds-example__name { font-weight: 750; font-size: 14.5px; }
.ds-example__tag { font-family: var(--ds-font-mono); font-size: 12px; color: var(--ds-accent-strong); background: var(--ds-accent-soft); border: 1px solid var(--ds-accent-line); padding: 1px 7px; border-radius: 5px; }
.ds-example__desc { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--ds-muted); line-height: 1.6; }
.ds-example__grid { display: grid; grid-template-columns: minmax(0, 1fr); }
.ds-example__preview { padding: 20px; min-width: 0; }
.ds-example__source { min-width: 0; border-top: 1px solid var(--ds-border); background: var(--ds-code-bg); }
.ds-example__source-label { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 14px; font-size: 11.5px; font-weight: 700; color: var(--ds-muted); letter-spacing: .06em; border-bottom: 1px solid var(--ds-code-line); }
.ds-example__source pre { margin: 0; padding: 12px 16px 16px; overflow: auto; max-height: 520px; font-family: var(--ds-font-mono); font-size: 12.5px; line-height: 1.7; color: var(--ds-code-text); white-space: pre; }
@container (min-width: 980px) {
  .ds-example__grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  .ds-example__source { border-top: 0; border-left: 1px solid var(--ds-border); }
}
.ds-example[data-layout="stack"] .ds-example__grid { grid-template-columns: minmax(0, 1fr); }
.ds-example[data-layout="stack"] .ds-example__source { border-left: 0; border-top: 1px solid var(--ds-border); }
.ds-example[data-layout="stack"] .ds-example__source pre { max-height: 360px; }

/* 段組み */
.ds-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 18px 28px; }
.ds-columns__title { margin: 0; font-weight: 700; color: var(--ds-text); }
.ds-columns > section { font-size: .95em; color: var(--ds-text-2); }

/* 未知の部品・エラー */
.ds-unknown--icon { display: inline-block; padding: 0 .4em; font-size: 12px; line-height: 1.6; vertical-align: middle; }
.ds-ref--missing { color: var(--ds-danger-ink) !important; text-decoration-style: wavy !important; }
.ds-columns__title + * { margin-top: .35em !important; }
.ds-unknown { padding: 12px 14px; border: 1px dashed var(--ds-danger); border-radius: 8px; color: var(--ds-danger-ink); background: var(--ds-danger-bg); font-size: 14px; }

/* グラフ */
.ds-chart { position: relative; padding: 16px 18px 12px; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l); background: var(--ds-surface); }
.ds-chart__head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 16px; margin-bottom: 8px; }
.ds-chart__titles { flex: 1 1 14rem; min-width: 0; }
.ds-chart__title { margin: 0; font-size: 15px; font-weight: 700; color: var(--ds-text); }
.ds-chart__sub { margin: 2px 0 0; font-size: 12.5px; color: var(--ds-muted); }
.ds-chart__legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--ds-text-2); }
.ds-chart__legend li { display: inline-flex; align-items: center; gap: 6px; margin: 0 !important; }
.ds-chart__legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.ds-chart__plot { position: relative; }
.ds-chart__plot > svg { display: block; width: 100%; height: auto; overflow: visible; font-family: var(--ds-font-sans); }
.ds-chart .ds-axis-label { fill: var(--ds-muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.ds-chart .ds-cat-label { fill: var(--ds-text-2); font-size: 12.5px; }
.ds-chart .ds-value-label { fill: var(--ds-text); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
.ds-chart .ds-grid { stroke: var(--ds-chart-grid); stroke-width: 1; shape-rendering: crispEdges; }
.ds-chart .ds-baseline { stroke: var(--ds-chart-axis); stroke-width: 1; shape-rendering: crispEdges; }
.ds-chart .ds-target { stroke: var(--ds-danger); stroke-width: 1.5; }
.ds-chart .ds-target-label { fill: var(--ds-danger-ink); font-size: 11.5px; font-weight: 650; }
.ds-chart .ds-crosshair { stroke: var(--ds-border-2); stroke-width: 1; }
.ds-chart__tip { position: absolute; z-index: 5; pointer-events: none; min-width: 120px; padding: 8px 10px; border-radius: 8px; background: var(--ds-surface); border: 1px solid var(--ds-border-2); box-shadow: var(--ds-shadow); font-size: 12.5px; line-height: 1.6; color: var(--ds-text-2); transform: translate(-50%, calc(-100% - 12px)); white-space: nowrap; }
.ds-chart__tip b { display: block; color: var(--ds-text); font-weight: 700; margin-bottom: 2px; }
.ds-chart__tip span { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.ds-chart__tip span i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.ds-chart__tip span em { font-style: normal; font-weight: 700; color: var(--ds-text); font-variant-numeric: tabular-nums; margin-left: 12px; }
.ds-chart__foot { display: flex; justify-content: flex-end; margin-top: 4px; }
.ds-chart__table { margin-top: 10px; }
.ds-chart__table[hidden] { display: none; }

/* ============================================================
   8. 拡大ビューア（画面全体を使い、操作バーは図の上に浮かせる）
   ============================================================ */
.ds-viewer {
  position: fixed; inset: 0; margin: 0; padding: 0; border: 0;
  width: 100vw; height: 100dvh; max-width: none; max-height: none;
  background: var(--ds-paper); color: var(--ds-text); overflow: hidden;
}
.ds-viewer::backdrop { background: rgb(6 10 18 / 60%); }
.ds-viewer[open] { animation: ds-fade .18s ease; }
@keyframes ds-fade { from { opacity: 0; } }
.ds-viewer__panel { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ds-paper); }
.ds-viewer__stage {
  position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--ds-paper);
  background-image: radial-gradient(color-mix(in srgb, #94a3b8 35%, transparent) 1px, transparent 1.2px);
  background-size: 22px 22px;
  user-select: none; -webkit-user-select: none;
}
.ds-viewer__stage.is-dragging { cursor: grabbing; }
.ds-viewer__stage:focus-visible { outline: 2px solid var(--ds-focus); outline-offset: -3px; }
.ds-viewer__canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.ds-viewer__canvas svg { display: block; max-width: none; }
.ds-viewer__bar {
  position: absolute; z-index: 3;
  top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right));
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  pointer-events: none;
}
.ds-viewer__bar > * { pointer-events: auto; }
.ds-viewer__title, .ds-viewer__tools, .ds-viewer__close-top {
  background: color-mix(in srgb, var(--ds-surface) 92%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid var(--ds-border-2); box-shadow: var(--ds-shadow);
}
.ds-viewer__title {
  min-width: 0; max-width: min(44vw, 640px); margin: 0; padding: 9px 14px; border-radius: 12px;
  font-size: 13.5px; font-weight: 700; line-height: 1.5; color: var(--ds-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ds-viewer__title span { color: var(--ds-muted); font-weight: 600; margin-right: 8px; }
.ds-viewer__tools { display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 14px; }
.ds-viewer__tools [hidden] { display: none; }
.ds-viewer__sep { width: 1px; height: 22px; margin: 0 4px; background: var(--ds-border); }
.ds-viewer__level { min-width: 64px; height: 36px; padding: 0 8px; border: 1px solid var(--ds-border); border-radius: 9px; background: var(--ds-surface); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; color: var(--ds-text); }
.ds-viewer__level:hover { border-color: var(--ds-border-2); }
.ds-viewer__modes { display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--ds-surface-2); }
.ds-viewer__mode { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ds-text-2); font-size: 12.5px; font-weight: 650; white-space: nowrap; cursor: pointer; }
.ds-viewer__mode .ds-icon { font-size: 16px; }
.ds-viewer__mode:hover { color: var(--ds-text); }
.ds-viewer__mode[aria-pressed="true"] { background: var(--ds-surface); color: var(--ds-accent-strong); box-shadow: 0 0 0 1px var(--ds-border-2), var(--ds-shadow-s); }
.ds-viewer__hint {
  position: absolute; z-index: 2; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px;
  width: max-content; max-width: calc(100% - 24px); padding: 7px 14px; border-radius: 999px;
  background: rgb(15 23 42 / 82%); color: #e2e8f0; font-size: 12px; pointer-events: none;
  transition: opacity .4s; opacity: 1;
}
.ds-viewer__hint[data-hidden="true"] { opacity: 0; }
.ds-viewer__hint kbd { background: rgb(255 255 255 / 12%); border-color: rgb(255 255 255 / 25%); color: #fff; font-size: 11px; }
.ds-viewer__minimap { position: absolute; z-index: 2; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 180px; border: 1px solid var(--ds-border-2); border-radius: 8px; background: rgb(255 255 255 / 92%); box-shadow: var(--ds-shadow); overflow: hidden; pointer-events: none; }
.ds-viewer__minimap svg { display: block; width: 100%; height: auto; opacity: .55; }
.ds-viewer__minimap i { position: absolute; border: 2px solid #4f46e5; background: rgb(79 70 229 / 10%); border-radius: 2px; }
.ds-viewer__minimap[hidden] { display: none; }
.ds-viewer__close-top { display: none !important; }
@media (max-width: 720px) {
  .ds-viewer__bar { top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; }
  .ds-viewer__title { max-width: calc(100% - 56px); padding: 8px 12px; font-size: 13px; }
  .ds-viewer__tools { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 5px; border-radius: 16px; box-shadow: var(--ds-shadow-l); }
  .ds-viewer__tools .ds-iconbtn { width: 42px; height: 42px; }
  .ds-viewer__mode { height: 40px; padding: 0 11px; }
  .ds-viewer__mode span { display: none; }
  .ds-viewer__tools [data-act="close"], .ds-viewer__tools [data-act="download"], .ds-viewer__tools [data-act="fullscreen"], .ds-viewer__tools .ds-viewer__sep:last-of-type { display: none; }
  .ds-viewer__close-top { display: inline-grid !important; width: 40px; height: 40px; border-radius: 12px; }
  .ds-viewer__hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 70px); }
  .ds-viewer__minimap { display: none; }
}

/* トースト */
.ds-toast { position: fixed; z-index: 80; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); padding: 9px 16px; border-radius: 999px; background: var(--ds-text); color: var(--ds-bg); font-size: 13px; font-weight: 600; box-shadow: var(--ds-shadow-l); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s var(--ds-ease); }
.ds-toast[data-show="true"] { opacity: 1; transform: translate(-50%, 0); }

/* ============================================================
   9. 高機能な部品
   ============================================================ */
.ds-btn--primary { background: var(--ds-accent); border-color: var(--ds-accent); color: var(--ds-on-accent); }
.ds-btn--primary:hover { background: var(--ds-accent-strong); border-color: var(--ds-accent-strong); color: var(--ds-on-accent); }
.ds-btn:disabled { opacity: .45; cursor: not-allowed; }
.ds-dots { display: inline-flex; gap: 6px; }
.ds-dots i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; }
.ds-dots i:nth-child(2) { background: #febc2e; }
.ds-dots i:nth-child(3) { background: #28c840; }

/* 上部バー：検索と文字の大きさ */
.ds-searchbtn { display: inline-flex; align-items: center; gap: 8px; height: 36px; min-width: 200px; padding: 0 8px 0 12px; border: 1px solid var(--ds-border); border-radius: 8px; background: var(--ds-surface-2); color: var(--ds-muted); font-size: 13.5px; cursor: pointer; }
.ds-searchbtn:hover { border-color: var(--ds-border-2); color: var(--ds-text); }
.ds-searchbtn .ds-icon { font-size: 16px; }
.ds-searchbtn__label { flex: 1; text-align: left; }
.ds-searchbtn kbd { font-size: 11px; }
.ds-fontsize { width: auto; padding: 0 10px; gap: 4px; display: inline-flex; align-items: center; border-color: var(--ds-border); }
.ds-fontsize__label { font-size: 12px; font-weight: 700; color: var(--ds-muted); min-width: 2em; }
@media (max-width: 960px) { .ds-searchbtn { min-width: 0; } .ds-searchbtn__label, .ds-searchbtn kbd { display: none; } .ds-searchbtn { width: 36px; padding: 0; justify-content: center; } }
@media (max-width: 720px) { .ds-fontsize__label { display: none; } .ds-fontsize { width: 36px; padding: 0; justify-content: center; } }

/* 検索 */
.ds-search { margin: 9vh auto auto; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: 78vh; border: 1px solid var(--ds-border-2); border-radius: 12px; background: var(--ds-surface); color: var(--ds-text); box-shadow: var(--ds-shadow-l); overflow: hidden; }
.ds-search[open] { display: flex; flex-direction: column; animation: ds-pop .16s var(--ds-ease); }
.ds-search::backdrop { background: rgb(6 10 18 / 45%); }
.ds-search__field { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--ds-border); }
.ds-search__field .ds-icon { font-size: 20px; color: var(--ds-muted); }
.ds-search__field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ds-text); font: inherit; font-size: 17px; }
.ds-search__meta { margin: 0; padding: 8px 16px; font-size: 12.5px; color: var(--ds-muted); border-bottom: 1px solid var(--ds-border); }
.ds-search__results { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
.ds-search__results li { display: grid; gap: 2px; padding: 9px 12px; border-radius: 8px; cursor: pointer; }
.ds-search__results li[aria-selected="true"], .ds-search__results li:hover { background: var(--ds-accent-soft); }
.ds-search__sec { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ds-accent-strong); }
.ds-search__snip { font-size: 14px; line-height: 1.7; color: var(--ds-text-2); }
.ds-search__snip mark, .ds-search__sec mark { background: var(--ds-highlight); color: var(--ds-text); padding: 0 .1em; }
.ds-search__help { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 8px 16px; border-top: 1px solid var(--ds-border); font-size: 12px; color: var(--ds-muted); }
.ds-search__help kbd { font-size: 11px; margin-right: 2px; }
.ds-flash { animation: ds-flash 2.4s ease; border-radius: 4px; }
@keyframes ds-flash { 0%, 60% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ds-accent) 35%, transparent); background-color: var(--ds-accent-soft); } 100% { box-shadow: 0 0 0 4px transparent; } }
::highlight(ds-search) { background-color: #fde68a; color: #1c2230; }

/* 用語の自動リンク・略語・参照プレビュー */
.ds-term--auto { text-decoration-color: color-mix(in srgb, var(--ds-accent) 55%, transparent); }
.ds-abbr { text-decoration-style: dotted; }
.ds-popover--figure { width: min(380px, calc(100vw - 32px)); }
.ds-popover__figure { margin-top: 6px; padding: 8px; border-radius: 6px; background: var(--ds-paper); border: 1px solid var(--ds-paper-line); display: grid; place-items: center; max-height: 240px; overflow: hidden; color: #667085; font-size: 12.5px; }
.ds-popover__figure svg { width: 100%; height: auto; max-height: 224px; }
.ds-popover__hint { display: block; margin-top: 6px; font-size: 12px; color: var(--ds-muted); }

/* 行内の部品 */
.ds-status-chip { --c: var(--ds-muted); --b: var(--ds-surface-2); display: inline-flex; align-items: center; gap: .3em; padding: .05em .55em .05em .4em; border-radius: 4px; background: var(--b); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); font-size: .85em; font-weight: 700; line-height: 1.6; vertical-align: .05em; white-space: nowrap; }
.ds-status-chip .ds-icon { font-size: 1em; }
.ds-status-chip[data-kind="done"] { --c: var(--ds-note-ink); --b: var(--ds-note-bg); }
.ds-status-chip[data-kind="doing"] { --c: var(--ds-accent-strong); --b: var(--ds-accent-soft); }
.ds-status-chip[data-kind="todo"] { --c: var(--ds-muted); --b: var(--ds-surface-2); }
.ds-status-chip[data-kind="hold"], .ds-status-chip[data-kind="check"] { --c: var(--ds-warn-ink); --b: var(--ds-warn-bg); }
.ds-status-chip[data-kind="stop"] { --c: var(--ds-danger-ink); --b: var(--ds-danger-bg); }
.ds-copyable { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; cursor: copy; vertical-align: baseline; color: inherit; font: inherit; }
.ds-copyable code { font-family: var(--ds-font-mono); font-size: .86em; padding: .12em .42em; border-radius: 5px; background: var(--ds-surface-2); border: 1px solid var(--ds-border); }
.ds-copyable .ds-icon { font-size: .85em; color: var(--ds-muted); }
.ds-copyable:hover code { border-color: var(--ds-accent); }
.ds-minibar { display: inline-block; width: 4.5em; height: .55em; margin: 0 .35em 0 .15em; border-radius: 999px; background: var(--ds-surface-3); overflow: hidden; vertical-align: .05em; }
.ds-minibar span { display: block; height: 100%; background: var(--ds-accent); border-radius: inherit; }
.ds-minibar__value { font-variant-numeric: tabular-nums; }
.ds-uibtn { display: inline-flex; align-items: center; padding: .05em .65em; border-radius: 6px; border: 1px solid var(--ds-border-2); background: var(--ds-surface); box-shadow: 0 1px 0 var(--ds-border); font-size: .88em; font-weight: 700; line-height: 1.6; color: var(--ds-text); white-space: nowrap; vertical-align: .05em; }
.ds-uibtn.is-primary { background: var(--ds-accent); border-color: var(--ds-accent); color: var(--ds-on-accent); }
.ds-uibtn.is-danger { background: var(--ds-danger-ink); border-color: var(--ds-danger-ink); color: #fff; }

/* 指標の推移グラフ */
.ds-metric__row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.ds-spark { flex: none; margin-bottom: 4px; overflow: visible; }
.ds-spark path { stroke: var(--ds-accent); }
.ds-spark circle { fill: var(--ds-accent); }

/* コード解説 */
.ds-anno { container-type: inline-size; }
.ds-anno__title { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-weight: 700; }
.ds-anno__title .ds-icon { color: var(--ds-accent); }
.ds-anno__grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@container (min-width: 900px) { .ds-anno__grid { grid-template-columns: minmax(0, 1.45fr) minmax(16rem, 1fr); align-items: start; } .ds-anno__notes { position: sticky; top: calc(var(--ds-topbar-h) + 16px); } }
.ds-anno__code .ds-bleed__inner { width: 100%; min-width: 0; }
.ds-pin { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; margin-left: 10px; padding: 0 .35em; border: 0; border-radius: 999px; background: var(--ds-accent); color: var(--ds-on-accent); font: 700 11.5px/1 var(--ds-font-sans); vertical-align: .1em; cursor: pointer; user-select: none; }
.ds-line.has-pin.is-active, .ds-line.is-active { background: var(--ds-code-hl); border-left-color: var(--ds-code-hl-edge); }
.ds-pin.is-active { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ds-accent) 35%, transparent); }
.ds-anno__notes { list-style: none; margin: 0; padding: 0 !important; display: grid; gap: 8px; }
.ds-anno__note { display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 10px; margin: 0 !important; padding: 10px 12px; border: 1px solid var(--ds-border); border-radius: var(--ds-radius); background: var(--ds-surface); font-size: .93em; transition: border-color .15s, background .15s; }
.ds-anno__note.is-active { border-color: var(--ds-accent); background: var(--ds-accent-soft); }
.ds-anno__num { display: grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 999px; background: var(--ds-accent); color: var(--ds-on-accent); font-size: .8em; font-weight: 700; }
.ds-anno__text > * + * { margin-top: .4em; }

/* ターミナル */
.ds-terminal { margin: 0; border-radius: var(--ds-radius); overflow: hidden; background: #0f1218; color: #d7dde8; border: 1px solid #262c38; box-shadow: var(--ds-shadow-s); }
.ds-terminal__bar { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 8px 0 14px; background: #191e27; border-bottom: 1px solid #262c38; font-size: 12.5px; color: #9aa4b5; }
.ds-terminal__title { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: #cdd5e2; }
.ds-terminal__copy { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid #333a48; border-radius: 6px; background: transparent; color: #cdd5e2; font-size: 12px; cursor: pointer; }
.ds-terminal__copy:hover { border-color: #7eaaff; color: #fff; }
.ds-terminal__body { padding: 12px 0; overflow-x: auto; font-family: var(--ds-font-mono); font-size: 13.5px; line-height: 1.75; }
.ds-tline { position: relative; padding: 0 16px; white-space: pre; }
.ds-tline.is-cmd { color: #f2f5fa; font-weight: 600; }
.ds-tline__prompt { margin-right: 10px; color: #7ee2a8; user-select: none; }
.ds-tline.is-out { color: #aab4c4; }
.ds-tline.is-note { color: #8fb4ff; font-style: italic; font-family: var(--ds-font-sans); }
.ds-tline.is-cmd + .ds-tline.is-note, .ds-tline.is-out + .ds-tline.is-note, .ds-tline.is-out + .ds-tline.is-cmd { margin-top: 8px; }
.ds-tline__copy { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: inline-grid; place-items: center; width: 26px; height: 26px; border: 1px solid #333a48; border-radius: 6px; background: #191e27; color: #cdd5e2; opacity: 0; cursor: pointer; }
.ds-tline:hover .ds-tline__copy, .ds-tline__copy:focus-visible { opacity: 1; }
@media (hover: none) { .ds-tline__copy { opacity: 1; } }

/* 順を追った説明 */
.ds-walk { container-type: inline-size; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-l); background: var(--ds-surface); overflow: hidden; }
.ds-walk:focus-visible { outline-offset: 2px; }
.ds-walk__head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--ds-border); background: var(--ds-surface-2); }
.ds-walk__title { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 700; flex: 1; min-width: 0; }
.ds-walk__title .ds-icon { color: var(--ds-accent); }
.ds-walk__count { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ds-muted); font-size: 14px; }
.ds-walk__dots { list-style: none; display: flex; gap: 0; margin: 0; padding: 14px 16px 0 !important; overflow-x: auto; }
.ds-walk__dots li { flex: 1 1 0; min-width: 0; margin: 0 !important; }
.ds-walk__dot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; padding: 0 4px 10px; border: 0; background: none; color: var(--ds-muted); font-size: 12.5px; line-height: 1.45; cursor: pointer; text-align: center; }
.ds-walk__dot::before { content: ""; position: absolute; top: 14px; left: calc(-50% + 18px); right: calc(50% + 18px); height: 2px; background: var(--ds-border); }
.ds-walk__dots li:first-child .ds-walk__dot::before { display: none; }
.ds-walk__dot[data-done="true"]::before, .ds-walk__dot[aria-current="step"]::before { background: var(--ds-accent); }
.ds-walk__dot-num { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ds-border-2); background: var(--ds-surface); font-weight: 700; font-variant-numeric: tabular-nums; }
.ds-walk__dot[data-done="true"] .ds-walk__dot-num { border-color: var(--ds-accent); color: var(--ds-accent-strong); }
.ds-walk__dot[aria-current="step"] { color: var(--ds-text); font-weight: 700; }
.ds-walk__dot[aria-current="step"] .ds-walk__dot-num { background: var(--ds-accent); border-color: var(--ds-accent); color: var(--ds-on-accent); }
.ds-walk__dot-label { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
@container (max-width: 640px) { .ds-walk__dot-label { display: none; } }
.ds-walk__body { padding: 18px 20px 20px; }
.ds-walk__step-title { display: flex; align-items: center; gap: 10px; margin: 0 0 .6em !important; font-size: 1.12em; font-weight: 700; color: var(--ds-text); }
.ds-walk__step-title span { display: grid; place-items: center; min-width: 1.7em; height: 1.7em; border-radius: 6px; background: var(--ds-accent); color: var(--ds-on-accent); font-size: .8em; }
.ds-walk[data-all="true"] .ds-walk__step + .ds-walk__step { margin-top: 1.6em; padding-top: 1.4em; border-top: 1px dashed var(--ds-border-2); }
.ds-walk[data-all="true"] .ds-walk__foot, .ds-walk[data-all="true"] .ds-walk__dots { display: none; }
.ds-walk__foot { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--ds-border); }
.ds-walk__bar { flex: 1; height: 6px; border-radius: 999px; background: var(--ds-surface-3); overflow: hidden; }
.ds-walk__bar span { display: block; height: 100%; background: var(--ds-accent); border-radius: inherit; transition: width .25s var(--ds-ease); }

/* 絞り込みと並べ替えができる表 */
.ds-datatable__tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px; }
.ds-datatable__title { margin: 0; font-weight: 700; flex: 1 1 auto; }
